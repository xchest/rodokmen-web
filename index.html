,1080,1730,1680]},"full":{}},"related_contexts":["dlouhe-cp47-pozemkova-kniha"]},{"id":"dlouhe-pomnik-jan-vencalek-49","title":"Jan Vencálek z čp. 49 na pomníku v Dlouhém","state":"Nápis na pomníku","date":"Na desce 1914–1918","place":"Dlouhé, čp. 49","source":"Ministerstvo obrany, Centrální evidence válečných hrobů. Pomník v obci Dlouhé, horní deska, poslední jméno.","caption":"Na horní desce je vytesáno „VENCÁLEK JAN ČÍS. 49“. Kronika v domě č. 49 vzpomíná syna Vencálka z Račic, který padl ve válce. Ve vojenských seznamech se pro Dlouhé objevují dva Janové Vencálkové, narození v letech 1882 a 1892. Pomník jejich ročník nerozlišuje. Jméno matky a příbuznost se Šebkovými z domu č. 47 zůstávají otevřené.","url":"https://evidencevh.mo.gov.cz/Evidence/People/Detail/dc11739f-3eeb-4c56-8862-e99eeb8de3bf","original_url":"https://evidencevh.mo.gov.cz/Evidence/Documents/Download/e82b9d7e-c998-4963-b99e-67519656b8c3","link_label":"Otevřít kartu Jana Vencálka v evidenci Ministerstva obrany","original_label":"Otevřít celou fotografii pomníku","photo":true,"media":{"crop":{"bbox_xyxy_px":[300,500,620,712],"display_scale":3},"full":{}},"related_contexts":["dlouhe-jan-vencalek-1882","dlouhe-jan-vencalek-1892"]},{"id":"dlouhe-jan-vencalek-1882","title":"Jan Vencálek, ročník 1882, hlášen jako zraněný","state":"Dobová zpráva o zranění","date":"Vydání seznamu 31. 3. 1915","place":"Dlouhé, okres Nové Město na Moravě","source":"Verlustliste č. 153, vydáno 31. 3. 1915, tištěná strana 46. Digitální sbírka Verlustlisten Österreich-Ungarn 1. WK, CompGen.","caption":"Jan Vencálek, narozený roku 1882, měl domovskou příslušnost v Dlouhém v okrese Nové Město na Moravě. Sloužil u 12. setniny 81. pěšího pluku. Seznam jej uvádí jako zraněného. Zápis neuvádí číslo domu ani příbuzné. Spojení s Janem z čp. 49, jehož připomíná pomník v Dlouhém, zůstává otevřené.","source_uuid":"7afea6d2-651f-11ef-b615-0242ac104001","url":"https://des.genealogy.net/search/show/13725060","link_label":"Otevřít jmenný re ná strana 110 vlevo, první zápis.","caption":"Dne 20. listopadu 1785 se Jan, jednadvacetiletý syn zemřelého Matěje Daudy, oženil s devatenáctiletou Barborou, dcerou Jana. Ženich byl svobodný, nevěsta svobodná. Příjmení jejího otce je obtížně čitelné. Křest z roku 1787 má stejné číslo domu a jména obou rodičů. V oddacím řádku stojí Žandov přímo u svědků, bydliště ženicha ani nevěsty zde písař zvlášť neurčil.","url":"https://ebadatelna.soapraha.cz/d/12627/37","link_label":"Otevřít celou stranu v eBadatelně","related_contexts":["zandov-1787-magdalena-dum-22"],"research_people":["p161","p322","p323"],"crop_alt":"Oddací řádek s domem 22, jmény ženicha, nevěsty a jejich otců","full_alt":"Celý snímek 37 matriky Sudějov 05","media":{"crop":{"bbox_xyxy_px":[140,500,1890,1000]},"full":{}}},{"id":"zandov-1787-magdalena-dum-22","title":"Magdalena, dcera Jana Daudy a Barbory v Žandově č. 22","state":"Matriční zápis · totožnost s osobami ve Lhotě se ověřuje","date":"19. 4. 1787","place":"Žandov č. 22","source":"Státní oblastní archiv v Praze, Sbírka matrik, Sudějov 04, snímek 3, pravá strana, dubnový řádek s číslem domu 22.","caption":"Dne 19. dubna 1787 je v Žandově č. 22 zapsána Magdalena. V příslušných rubrikách jsou otec Jan Dauda a matka Barbora. Také křty dětí Josefa Mejstříka ve Lhotě č. 29 jmenují rodiče jeho manželky Magdaleny jako Jana Daudu ze Žandova a Barboru. Příslušnost dívky z tohoto řádku k rodině ve Lhotě se dál ověřuje.","url":"https://ebadatelna.soapraha.cz/d/12628/3","link_label":"Otevřít celou stranu v eBadatelně","related_contexts":["zandov-1785-jan-dauda-a-barbora"],"research_people":["p161","p322","p323"],"crop_alt":"Křestní řádek Magdaleny s číslem domu 22 a jmény Jana Daudy a Barbory","full_alt":"Celý snímek 3 matriky Sudějov 04","media":{"crop":{"bbox_xyxy_px":[2050,1600,4100,2450]},"full":{}}},{"id":"dlouhe-skola-dochazka","title":"Školní výkazy z Dlouhého","state":"Archivní katalog · stopa k dohledání žáka","date":"Výkazy 1879–1953","place":"Dlouhé, obecná škola","source":"Státní okresní archiv Žďár nad Sázavou, Národní škola Dlouhé, NAD 312, inventář č. 1180 (2023).","caption":"Archiv eviduje výkazy o docházce a prospěchu z let 1879–1953 a školní kroniku z let 1889–1919. Pro Josefa Šebka, narozeného podle rodiny roku 1898, přicházejí v úvahu především školní roky 1904/05 až 1906/07. Jednotlivé ročníky ani Josefův zápis dosud nemáme ověřené.","url":"https://portal.nacr.cz/aron/apu/e4e5fe52-90b0-4997-9dd2-6b5a61ac6b43","link_label":"Otevřít popis školního fondu","original_url":"https://portal.nacr.cz/aron/apu/43eee4a7-5cfc-4e65-be98-afd7c0253fad","original_label":"Otevřít záznam inventáře školy","related_contexts":["dlouhe-1972-josef-sebek-cp47"],"research_people":["side-josef_sebek_1898_rodina","side-josef_sebek_dlouhe47"]},{"id":"dlouhe-cp47-pozemkova-kniha","title":"Pozemková kniha k chaloupce č. 47","state":"Kronika a územní evidence · převod k ověření","date":"Koupě podle kroniky roku 1899","place":"Dlouhé na Moravě, usedlost č. 3 a chaloupka č. 47","source":"Pamětní kniha obce Dlouhého, rukopisné strany 33 a 43. ČÚZK, Katastrální pracoviště Žďár nad Sázavou, k. ú. Dlouhé na Moravě (626619).","caption":"Podle obecní kroniky koupil Jos. Šebek při rozprodeji usedlosti č. 3 výměneční chaloupku, pozdější č. 47. Pro kontrolu kupce připadá v úvahu vlastnický zápis z roku 1899. Číslo historické vložky, parcely ani samotný zápis dosud neznáme.","url":"https://www.cuzk.gov.cz/Urady/Katastralni-urady/Katastralni-urady/Katastralni-urad-pro-Vysocinu/Katastralni-pracoviste/KP-Zdar-nad-Sazavou/O-uradu/Uzemni-pusobnost.aspx","link_label":"Otevřít územní působnost katastrálního pracoviště","original_url":"https://portal.gov.cz/sluzby-vs/poskytnuti-udaju-zkatastru-nemovitosti-a-drivejsich-pozemkovych-evidenci-S8190","original_label":"Otevřít popis služby pro starší pozemkové evidence","related_contexts":["dlouhe-cp3-vymenek-cp47","dlouhe-1899-cp47","dlouhe-scitani-1900-cp47"],"research_people":["side-josef_sebek_dlouhe47"]},{"id":"dlouhe-scitani-1900-cp47","title":"Šebkovi v Dlouhém čp. 47 při sčítání roku 1900","state":"Sčítací arch · čtyři doložené osoby","date":"31. prosince 1900","place":"Dlouhé čp. 47","source":"Státní okresní archiv Žďár nad Sázavou, Okresní úřad Nové Město na Moravě, NAD 41, balík 79, sčítací operát ZR0940, pořadové č. 5, snímek 117 ze 177.","caption":"Dne 31. prosince 1900 žili v Dlouhém čp. 47 Josef Šebek (* 3. 2. 1870) a jeho manželka Anastazie Šebková (* 14. 4. 1865). Za rodiště je u nich uvedena zkratkou Radešínská Svratka. Syn Josef (* 28. 10. 1891) a dcera Antonie (* 30. 3. 1897) se narodili v Dlouhém. Sloupec příbuzenského poměru vztahuje obě děti k přednostovi domácnosti. Rodné příjmení Anastazie rodina uvádí jako Horák. Josef označený na archu jako syn má jiné datum narození než Josef z obecní kroniky (* 30. 10. 1898).","media":{"crop":{"bbox_xyxy_px":[540,430,1900,755]},"full":{}},"crop_alt":"Původní čtyři řádky se jmény, příbuzenským postavením a daty narození.","full_alt":"Pohled na celý líc archu z archivního prohlížeče, Dlouhé čp. 47, snímek 117.","url":"https://www.mza.cz/scitacioperaty/digisada/detail/15426","link_label":"Otevřít operát Dlouhé 1900 · snímek 117","research_people":["side-josef_sebek_1898_rodina","side-josef_sebek_1870_rodina","side-anastazie_sebkova_horak_1865","side-jaromir_sebek_1943","side-josef_sebek_dlouhe47"],"branch_ids":["sebek"],"related_contexts":["dlouhe-1972-josef-sebek-cp47","dlouhe-1899-cp47","dlouhe-cp47-pozemkova-kniha","sebkovi-matriky-radesinska-svratka","sebkovi-matrika-dlouhe","anastazie-sebkova-prace-1900","josef-sebek-1898-jaromir-prameny"]},{"id":"zubri-dostal-adresar-1924","title":"Dostál Fr. v adresáři řemesel v Zubří","state":"Dobový adresář · jméno a řemesla","date":"1924","place":"Zubří u Nového Města na Moravě","source":"Alois Chytil, Chytilův úplný adresář Československé republiky, Morava, str. 1270, oddíl Zubří. Národní knihovna ČR, digitální knihovna Kramerius.","caption":"V oddílu Zubří stojí „Obuvník: Dostál Fr.“ a o dva řádky níže „Sedlář: Dostál Fr.“. Každá z položek přiřazuje jméno k jednomu řemeslu. Tisk neuvádí věk ani číslo domu. Zda obě řemesla vykonával týž člověk a jaký mohl být jeho vztah k rodině Petra Dostála, zůstává otevřené.","url":"https://kramerius5.nkp.cz/search/handle/uuid:3d4a69d4-03c5-48d8-80a2-b6c2f98d244d","link_label":"Otevřít stránku adresáře se zápisy v Zubří","original_url":"https://kramerius5.nkp.cz/search/handle/uuid:63f886d0-3e2e-46fb-a2a0-142c53a5d550","original_label":"Porovnat položku Studnice na str. 1268","media":{"crop":{"bbox_xyxy_px":[500,1010,1850,1440]},"full":{}},"crop_alt":"Zubří, adresář 1924, str. 1270. Dostál Fr. u obuvníků a sedlářů.","full_alt":"Chytilův adresář, celá strana 1270","branch_ids":["dostal"],"research_people":["side-josef_dostal_1960","side-petr_dostal"],"related_contexts":["zubri-scitani-1921","zubri-frant-dostal-obecni-rada-1898"]},{"id":"zubri-scitani-1921","title":"Sčítání v Zubří roku 1921","state":"Archivní katalog · domácnost k porovnání","date":"1921","place":"Zubří u Nového Města na Moravě","source":"Státní okresní archiv Žďár nad Sázavou, Okresní úřad Nové Město na Moravě, NAD 41, balík 177, operát ZR0315, poř. č. 8, 79 folií, 157 snímků.","caption":"Katalog eviduje 157 obrazů pro Zubří. Na snímku 72 a na sousedním archu lze porovnat rukopis domácnosti a záhlaví domu s dochovaným rodinným podkladem. Příbuznost s Josefem Dostálem narozeným podle rodiny v roce 1960 vyžaduje pramen, který pojmenuje jeho rodiče.","url":"https://www.mza.cz/scitacioperaty/digisada/detail/14734","link_label":"Otevřít sčítací operát Zubří 1921","branch_ids":["dostal"],"research_people":["side-josef_dostal_1960","side-petr_dostal"],"related_contexts":["zubri-dostal-adresar-1924","zubri-josef-dostal-cp20-jan-dostal-cp50","studnice-matrika-narozenych-1900-1923"]},{"id":"radesinska-svratka-hasici-1898","title":"Jan Šebek a Dostálovi v hasičském sboru Radešínské Svratky","state":"Dobový jmenný soupis","date":"Sbor založen 1892, kniha vydána 1898","place":"Radešínská Svratka","source":"Titus Krška, Hasičská kronika (1898), strana PDF 186, oddíl Sbor hasičský v Radešínské Svratce.","caption":"V seznamu členů jsou Jan Šebek, Kl. Dostál a Ant. Dostál. Kronika vysvětluje, že ležaté písmo označuje členy přítomné při založení. U Jana je takto vysazeno příjmení Šebek. Založení sboru text připisuje hostinskému Jakubu Sobotkovi. U těchto členů chybí údaje potřebné ke spojení s rodinami z Dlouhého či Zubří.","url":"https://www.sdhsuchy.org/wp-content/documents/hasicka_kronika-KRSKA.pdf#page=186","link_label":"Otevřít celou stranu v digitalizované knize","media":{"crop":{"bbox_xyxy_px":[150,520,1100,670]},"full":{}},"crop_alt":"Výčet členů s vlastním vysvětlením ležatého písma","full_alt":"Hasičská kronika, strana PDF 186","branch_ids":["sebek","dostal"],"research_people":[],"related_contexts":["dlouhe-cp49-sebek"]},{"id":"petrovice-fr-mrkvicka-1898","title":"Fr. Mrkvička mezi členy hasičského sboru v Petrovicích","state":"Dobový jmenný soupis · otevřená totožnost","date":"16. ledna 1898","place":"Petrovice u Nového Města na Moravě","source":"Titus Krška, Hasičská kronika (1898), strana PDF 192, oddíl Sbor hasičský v Petrovicích.","caption":"V seznamu stojí Fr. Mrkvička. Za výčtem je uvedeno, že vyjmenovaní byli členy od založení sboru. Jako první zakladatelé jsou výslovně jmenováni Josef Petr a Frant. Šír. V rodině známe dva Františky Mrkvičky z Petrovic, narozené v letech 1842 a 1873. Soupis u člena neuvádí věk, povolání ani dům.","url":"https://www.sdhsuchy.org/wp-content/documents/hasicka_kronika-KRSKA.pdf#page=192","link_label":"Otevřít celou stranu v digitalizované knize","media":{"crop":{"bbox_xyxy_px":[100,680,1100,860]},"full":{}},"crop_alt":"Jmenný soupis členů hasičského sboru v Petrovicích","full_alt":"Hasičská kronika, strana PDF 192","branch_ids":["mrkvicka"],"research_people":["p22","p44"],"related_contexts":[]},{"id":"dlouhe-evangelicky-hrbitov","title":"Evangelický hřbitov v Dlouhém","state":"Obecní pramen k pohřebišti","date":"Prodej pozemků 1929, dohoda 19. listopadu 2014","place":"Dlouhé","source":"Obec Dlouhé, Obecník 2014, roč. 16, článek Evangelický hřbitov v Dlouhém, strana 13.","caption":"Obec uvádí, že Josef a Antonie Dudovi v roce 1929 prodali soukromému českobratrskému hřbitovu pozemky. Dne 19. listopadu 2014 obec a novoměstský farní sbor podepsaly prohlášení k vlastnictví. Článek se věnuje pozemkům. Pro konkrétní pohřeb nebo vyznání rodiny je zapotřebí jmenná evidence.","url":"https://www.obecdlouhe.cz/admin/soubory/2CgLj394ymUbIYv.pdf#page=13","link_label":"Otevřít Obecník na straně 13","media":{"crop":{"bbox_xyxy_px":[85,111,1445,609]},"full":{}},"crop_alt":"Článek o hřbitově v Obecníku 2014","full_alt":"Celá strana 13 Obecníku obce Dlouhé","research_people":[],"related_contexts":["dlouhe-1972-josef-sebek-cp47"]},{"id":"zubri-frant-dostal-obecni-rada-1898","title":"Frant. Dostal v obecní radě v Zubří","state":"Jmenný zápis v dobové knize","date":"Kniha vyšla v roce 1898","place":"Zubří u Nového Města na Moravě","source":"Titus Krška, Hasičská kronika, Holešov 1898, tištěná s. 135, oddíl „Sbor hasičský v Zubřím“, soubor SDH Suchý, strana PDF 186.","caption":"Titus Krška uvádí v oddílu o Zubří v seznamu obecní rady jméno „Frant. Dostal“. Vyjmenované radní řadí mezi rolníky a přispívající členy hasičského sboru. Založení sboru roku 1893 připisuje obchodníkovi Ant. Honkovi. U Frant. Dostala chybí číslo domu a věk. Jeho příbuznost s Petrem Dostálem či totožnost s řemeslníkem v adresáři z roku 1924 zůstává otevřená.","media":{"crop":{"bbox_xyxy_px":[145,745,1025,935]},"full":{}},"crop_alt":"Oddíl o Zubří. Jméno Frant. Dostal je uprostřed řádku se seznamem radních. Na konci výčtu jsou radní označeni za rolníky a přispívající členy sboru.","full_alt":"Celá tištěná strana 135 se záhlavími Radešínské Svratky, Zubří a Odrance.","url":"https://www.sdhsuchy.org/wp-content/documents/hasicka_kronika-KRSKA.pdf#page=186","link_label":"Přejít na stranu 186 v souboru hasičské kroniky","original_url":"https://www.digitalniknihovna.cz/mzk/uuid/uuid:4ac2a58e-5774-11e3-ae9f-0050569d679d","original_label":"Otevřít stejnou tištěnou stranu ve druhém exempláři","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-dostal-adresar-1924","zubri-josef-dostal-cp20-jan-dostal-cp50","odranec-j-dostal-pomocnik-kovarsky","zubri-frantisek-dostal-volby-1954"]},{"id":"zubri-josef-dostal-cp20-jan-dostal-cp50","title":"Josef Dostál z čp. 20 a Jan Dostál z čp. 50 v Zubří","state":"Obecní historie · dva různé domy","date":"Po roce 1850 a rok 1880","place":"Zubří u Nového Města na Moravě","source":"Obec Zubří, Současnost, oddíly Obec po roce 1850 a Zuberští vojáci. Obec odkazuje na knihu Ivana Štarhy a Pavla Svobody z roku 1998.","caption":"Obec uvádí Josefa Dostála z domu č. 20 jako prvního starostu po zavedení obecní samosprávy. Podle jejího výkladu sčítání roku 1880 byl Jan Dostál z domu č. 50 vojákem 7. pluku dělostřelectva, tehdy na dovolené do povolání. Vazbu těchto dvou mužů k Petrově rodině ověřujeme. Pro Jana chybí původní řádek sčítání.","url":"https://www.obeczubri.cz/soucasnost/","link_label":"Číst příslušné oddíly na stránce obce Zubří","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-frant-dostal-obecni-rada-1898","zubri-scitani-1921","zubri-dostal-fr-cviceni-1954","josef-dostal-nove-mesto-vzpominky"]},{"id":"sebkovi-matriky-radesinska-svratka","title":"Kde hledat křty Josefa a Anastazie z Radešínské Svratky","state":"Archivní katalog · hledané zápisy","date":"14. 4. 1865 a 3. 2. 1870","place":"Radešínská Svratka","source":"Moravský zemský archiv v Brně, katalog matrik římskokatolické farnosti Radešínská Svratka, sign. 16102 a 16103.","caption":"Pro Josefa Šebka narozeného podle sčítání 3. února 1870 katalog uvádí knihu 16103, oddíl obce na snímcích 1–55. Pro Anastazii narozenou 14. dubna 1865 se překrývají kniha 16102 (snímky 1–50) a kniha 16103. Konkrétní řádky, jména rodičů i rodné příjmení Anastazie zbývá přečíst.","url":"https://www.mza.cz/actapublica/matrika/hledani?typ=signatura&mode=show&signatura=16103","link_label":"Otevřít katalog knihy 16103","original_url":"https://www.mza.cz/actapublica/matrika/hledani?typ=signatura&mode=show&signatura=16102","original_label":"Otevřít katalog knihy 16102","research_people":["side-josef_sebek_1870_rodina","side-anastazie_sebkova_horak_1865"],"branch_ids":["sebek"],"related_contexts":["dlouhe-scitani-1900-cp47","sebkovi-matrika-dlouhe","anastazie-sebkova-prace-1900"]},{"id":"sebkovi-matrika-dlouhe","title":"Matrika narozených pro děti Šebkových z Dlouhého","state":"Archivní katalog · hledané zápisy","date":"28. 10. 1891 a 30. 3. 1897","place":"Dlouhé, farnost Horní Bobrová","source":"Moravský zemský archiv v Brně, Horní Bobrová, kniha IV, sign. 15611, narození na snímcích 30–98.","caption":"Sčítací arch uvádí, že se Josef i Antonie narodili v Dlouhém. Pro tuto obec vede katolická matrika Horní Bobrová 15611 oddíl narozených na snímcích 30–98. Z cíleného čtení jednotlivých řádků mohou vzejít oba rodiče a číslo domu při narození.","url":"https://www.mza.cz/actapublica/matrika/hledani?typ=signatura&mode=show&signatura=15611","link_label":"Otevřít katalog matriky pro Dlouhé","research_people":["side-josef_sebek_dlouhe_1891","side-antonie_sebkova_dlouhe_1897"],"branch_ids":["sebek"],"related_contexts":["dlouhe-scitani-1900-cp47","sebkovi-matriky-radesinska-svratka"]},{"id":"studnice-matrika-narozenych-1900-1923","title":"Studnice v matrice narozených z let 1900–1923","state":"Archivní katalog · hledaný zápis","date":"1900–1923","place":"Studnice u Nového Města na Moravě","source":"Moravský zemský archiv v Brně, Nové Město na Moravě, kniha narozených 15926, katalogový detail 12652.","caption":"Oddíl pro Studnice může doložit jména rodičů a číslo domu u narození v této obci. Konkrétní stránka pro zkoumanou domácnost dosud chybí. Samostatně se ověřují rodiče Josefa Dostála, otce Petra.","url":"https://www.mza.cz/actapublica/matrika/hledani?typ=signatura&mode=show&signatura=15926","link_label":"Otevřít katalog knihy narozených 15926","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-scitani-1921"]},{"id":"anastazie-sebkova-prace-1900","title":"Co zapsal sčítací komisař u Anastazie Šebkové","state":"Sčítací arch · řádek Anastazie","date":"31. prosince 1900","place":"Dlouhé čp. 47","source":"SOkA Žďár nad Sázavou, Okresní úřad Nové Město na Moravě, NAD 41, balík 79, ZR0940, poř. č. 5, Dlouhé, snímek 117/177, dům čp. 47.","caption":"V pravé části sčítacího archu z Dlouhého čp. 47 je u Anastazie ve sloupci 14 zapsáno „dto“ a ve sloupci 15 „pomáhá“. Zápis neříká, komu pomáhala.","url":"https://www.mza.cz/scitacioperaty/digisada/detail/15426","link_label":"Otevřít archivní sadu Dlouhé 1900","research_people":["side-anastazie_sebkova_horak_1865"],"branch_ids":["sebek"],"related_contexts":["dlouhe-scitani-1900-cp47","sebkovi-matriky-radesinska-svratka"],"media":{"crop":{"bbox_xyxy_px":[650,290,1050,710]},"full":{}},"crop_alt":"Pravá část řádku Anastazie se sloupci 14 a 15.","full_alt":"Celý dochovaný pohled na pravou část archu číslo 117."},{"id":"odranec-j-dostal-pomocnik-kovarsky","title":"J. Dostál, kovářský pomocník v Odranci","state":"Dobová kniha · jméno a povolání","date":"Kniha vyšla roku 1898","place":"Odranec","source":"Titus Krška, Hasičská kronika, Holešov 1898, tištěná strana 136, oddíl o Odranci. Digitalizát SDH Suchý, strana souboru 187. Druhý exemplář má Moravská zemská knihovna.","caption":"V oddílu o založení dobrovolného hasičského sboru v Odranci uvádí Titus Krška člena jménem J. Dostál a jeho povolání pomocník kovářský. Kniha zde uvádí pouze iniciálu. Příbuzenský vztah k Petrově rodině v Zubří zatím žádný z dohledaných pramenů nepotvrzuje.","url":"https://www.sdhsuchy.org/wp-content/documents/hasicka_kronika-KRSKA.pdf#page=187","link_label":"Otevřít stranu 187 souboru kroniky","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-frant-dostal-obecni-rada-1898"],"media":{"crop":{"bbox_xyxy_px":[300,390,2050,750]},"full":{}},"crop_alt":"Výčet účastníků založení sboru v Odranci.","full_alt":"Celá tištěná strana 136 Hasičské kroniky.","original_url":"https://www.digitalniknihovna.cz/mzk/uuid/uuid:4ac2a58f-5774-11e3-ae9f-0050569d679d","original_label":"Srovnat tištěnou stranu 136 v exempláři MZK"},{"id":"zubri-dostal-fr-cviceni-1954","title":"Dostál Fr. při ukázce požární techniky v Zubří","state":"Obecní web · přepis poznámek kronikáře","date":"25. července 1954","place":"Zubří","source":"SDH Zubří, Michal Juránek, Cvičení požární techniky, 9. března 2010. Autor cituje místního kronikáře Rudolfa Vebera.","caption":"Při ukázce požární techniky v Zubří dne 25. července 1954 promluvil podle kronikáře Rudolfa Vebera zástupce okresního národního výboru. V přepisu je uveden jako „Dostál Fr. č. 59“. Význam čísla 59 autor nevysvětluje. Dům č. 27 zmiňuje při popisu zásahu. Totožnost řečníka s Františkem z volební kroniky zůstává otevřená.","url":"https://www.obeczubri.cz/hasici/2010/03/09/cviceni-pozarni-techniky/","link_label":"Číst svědectví zveřejněné sborem v Zubří","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-frantisek-dostal-volby-1954","zubri-josef-dostal-cp20-jan-dostal-cp50"]},{"id":"zubri-frantisek-dostal-volby-1954","title":"František Dostál ze Zubří ve volbách roku 1954","state":"Obecní kronika · zveřejněný přepis","date":"Květen 1954","place":"Odranec a Zubří","source":"Obec Věcov, zveřejněný digitální přepis Pamětní knihy obce Odranec 1922–1981, strany souboru 79–80.","caption":"Kronika obce Odranec jmenuje mezi kandidáty do krajského národního výboru při volbách v květnu 1954 Františka Dostála ze Zubří. Po popisu voleb uvádí, že byl zvolen. Kronika zde neuvádí jeho věk, číslo domu ani rodiče.","url":"https://www.vecov.cz/public/frontend/data/dokumenty/150/1576507104Pam%C4%9Btn%C3%AD%20kniha%20obce%20Odranec%201922%20-%201981.pdf#page=80","link_label":"Otevřít volební zápis roku 1954","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-dostal-frant-volby-1957","zubri-dostal-fr-cviceni-1954","zubri-frant-dostal-obecni-rada-1898"],"media":{"crop":{"bbox_xyxy_px":[55,45,965,345]},"full":{}},"crop_alt":"Jméno kandidáta, obec a výsledek hlasování.","full_alt":"Celá strana 80 přepisu pamětní knihy."},{"id":"zubri-dostal-frant-volby-1957","title":"Dostál Frant. ze Zubří ve volbách roku 1957","state":"Obecní kronika · zveřejněný přepis","date":"Květen 1957","place":"Odranec a Zubří","source":"Obec Věcov, zveřejněný digitální přepis Pamětní knihy obce Odranec 1922–1981, strana souboru 86.","caption":"V oddílu o volbách v roce 1957 uvádí odranecká kronika mezi kandidáty do krajského národního výboru „Dostál Frant. ze Zubří“. Údaj lze porovnat s volbami roku 1954. V zápisu z roku 1957 není číslo domu ani rodinný vztah.","url":"https://www.vecov.cz/public/frontend/data/dokumenty/150/1576507104Pam%C4%9Btn%C3%AD%20kniha%20obce%20Odranec%201922%20-%201981.pdf#page=86","link_label":"Otevřít volební zápis roku 1957","research_people":["side-josef_dostal_1960","side-petr_dostal"],"branch_ids":["dostal"],"related_contexts":["zubri-frantisek-dostal-volby-1954"],"media":{"crop":{"bbox_xyxy_px":[55,1125,965,1225]},"full":{}},"crop_alt":"Řádek o kandidátovi ze Zubří.","full_alt":"Celá strana 86 přepisu pamětní knihy."},{"id":"petrovice-katerina-vomackova-krest-1783","title":"Kateřina Vomáčková v Petrovicích čp. 12 roku 1783","state":"Pomocný přepis · možný záznam narození","date":"1783","place":"Petrovice čp. 12 u Nového Města na Moravě","source":"Pomocný přepis knihy narozených Nové Město na Moravě 15919, léta 1760–1784, psaná strana 170. Sloupce uvádějí obec, rok, stranu, dítě, otce, matku a číslo domu.","caption":"Pomocný přepis knihy narozených 15919 uvádí v Petrovicích čp. 12 roku 1783 Kateřinu Vomáčkovou, rodiče Václava a Kateřinu. Přichází v úvahu jako zdejší nevěsta z roku 1805. Věk 23 let zapsaný při svatbě odpovídá přibližně roku 1782. Totožnost čeká na ověření v matrice. V přepisu chybí den a měsíc narození i rodné příjmení matky.","url":"https://matriky.msts.cz/_mza/Nove_Mesto_na_Morave_15919_N.html","link_label":"Číst přepis knihy narozených, Petrovice 1783, str. 170","branch_ids":["mrkvicka"],"research_people":["p177","p354","p355"],"related_contexts":[]},{"id":"josef-dostal-nove-mesto-vzpominky","title":"Josef Dostál z Nového Města a jeho bratr ze Zubří","state":"Tři rodinné vzpomínky v městském tisku","date":"2010, 2015 a 2020","place":"Nové Město na Moravě a Zubří","source":"Novoměstsko, 1. listopadu 2015, č. 11, tištěná strana 10 (strana PDF 6).","caption":"Tři rodinné vzpomínky uvádějí Josefa Dostála z Nového Města na Moravě. Z 5., 10. a 15. výročí úmrtí vychází 12. listopad 2005. Z uvedeného nedožitého věku vychází narození 26. listopadu 1945. Rodina v roce 2015 uvedla jeho bratra ze Zubří. V městské rubrice Úmrtí z 25. listopadu 2005 je u téhož dne a ročníku uveden Josef Dvořák. Zda jde o dva muže nebo o chybu v tisku, z těchto zpráv nedokážeme rozhodnout. Vztah Josefa Dostála k Petrově otci, narozenému podle rodiny v roce 1960, zůstává otevřený. Jmenované osoby mají vlastní badatelské karty, jejich návaznost na dnešní rodinu se ověřuje.","url":"https://noviny.nmnm.cz/pdf/2015/nm11_15.pdf#page=6","link_label":"Číst rodinnou vzpomínku z roku 2015","original_url":"https://noviny.nmnm.cz/pdf/2005/nm20_05.pdf#page=2","original_label":"Porovnat rubriku Úmrtí z roku 2005","branch_ids":["dostal"],"research_people":["side-josef_dostal_1960","side-petr_dostal","research-josef-dostal-1945","research-bratr-josefa-dostala-zubri"],"related_contexts":["dostal-noviny-2010","dostal-noviny-2020","zubri-josef-dostal-cp20-jan-dostal-cp50","josef-dostal-podekovani-2005","josef-dostal-vzpominka-2025"],"profile_links":["research-josef-dostal-1945","research-bratr-josefa-dostala-zubri"]},{"id":"lhota-mejstrik-jiri-rejstrik-1705","title":"Jiří Mejstřík, syn Matěje a Anny ze Lhoty","state":"Jmenný řádek v archivním rejstříku narozených","date":"14. dubna 1705","place":"Lhota u Uhlířských Janovic","source":"SOA v Praze, Uhlířské Janovice 24, rejstřík narozených, snímek 97.","caption":"Rejstřík narozených uvádí ve Lhotě dne 14. dubna 1705 Jiřího Mejstříka. Jako otec je uveden Matěj a jako matka Anna. Rejstřík odkazuje do druhého svazku na psanou stranu 32. Křest dalšího syna Matěje roku 1713 známe i z matriční knihy.","url":"https://ebadatelna.soapraha.cz/d/13249/97","link_label":"Otevřít rejstřík na snímku 97","branch_ids":["mejstrik"],"research_people":["p1280","p1281","p640","side-jiri_mejstrik_lhota_1705"],"related_contexts":["lhota-krest-jiri-1705"],"media":{"crop":{"bbox_xyxy_px":[150,205,1640,263]},"full":{}},"crop_alt":"Jiřího jméno, rodiče, den a odkaz na knihu.","full_alt":"Celá strana rejstříku se sloupci rodičů a data."},{"id":"josef-sebek-1898-jaromir-prameny","title":"Které údaje spojují Jaromíra a Josefa Šebkovy","state":"Srovnání rodinného údaje, obecní kroniky a sčítání","date":"1891 až 1972","place":"Dlouhé čp. 47","source":"Pamětní kniha obce Dlouhého, psaná strana 216 (strana PDF 210). Sčítání lidu 1900, arch čp. 47.","caption":"V obecní kronice stojí u Josefa Šebka z Dlouhého čp. 47 datum narození 30. října 1898 a datum úmrtí 27. listopadu 1972. Rodina uvádí Jaromíra narozeného v roce 1943 jako syna Josefa a pro Josefa také datum 1. listopadu 1898. Kronikář u úmrtí manželku ani děti nejmenuje. Sčítací arch roku 1900 zachycuje v čp. 47 manžele Josefa a Anastazii a jejich syna Josefa s datem 28. října 1891. Otcovství k Jaromírovi a totožnost obou Josefů držíme odděleně, dokud je nespojí další písemnost.","url":"https://www.obecdlouhe.cz/documents/Pametni_kniha_obce_Dlouheho.pdf#page=210","link_label":"Otevřít kronikářův zápis o úmrtí roku 1972","original_url":"https://www.mza.cz/scitacioperaty/digisada/detail/15426","original_label":"Porovnat sčítací arch Dlouhé 1900","branch_ids":["sebek"],"research_people":["side-josef_sebek_1898_rodina","side-jaromir_sebek_1943","side-josef_sebek_dlouhe47"],"related_contexts":["dlouhe-1972-josef-sebek-cp47","dlouhe-scitani-1900-cp47"]},{"id":"dostal-noviny-2010","title":"Rodinná vzpomínka na Josefa Dostála v roce 2010","state":"Dobový zveřejněný rodinný pramen","date":"Listopad 2010","place":"Nové Město na Moravě","source":"Novoměstsko, 23. listopadu 2010, č. 18, tištěná strana 9.","caption":"Rodina připomíná pět let od úmrtí, nedožitých 65 let dne 26. listopadu a uvádí mezi pozůstalými rodinu ze Zubří.","url":"https://noviny.nmnm.cz/pdf/2010/nm18_10.pdf#page=9","link_label":"Číst oznámení v čísle z roku 2010","branch_ids":["dostal"],"research_people":["side-josef_dostal_1960","side-petr_dostal"],"related_contexts":["josef-dostal-nove-mesto-vzpominky"]},{"id":"dostal-noviny-2020","title":"Rodinná vzpomínka na Josefa Dostála v roce 2020","state":"Dobový zveřejněný rodinný pramen","date":"Listopad 2020","place":"Nové Město na Moravě","source":"Novoměstsko, 1. listopadu 2020, č. 11, tištěná strana 11.","caption":"Rodina připomíná patnáct let od úmrtí a nedožitých 75 let dne 26. listopadu. Zmíněni jsou manželka, dcera a syn s rodinou.","url":"https://noviny.nmnm.cz/pdf/2020/nm11_20.pdf#page=11","link_label":"Číst oznámení v čísle z roku 2020","branch_ids":["dostal"],"research_people":["side-josef_dostal_1960","side-petr_dostal"],"related_contexts":["josef-dostal-nove-mesto-vzpominky"]},{"id":"lhota-krest-jiri-1705","title":"Jiří Mejstřík v křestní matrice","state":"Křestní zápis a jmenný rejstřík","date":"14. 4. 1705","place":"Janovická Lhota podle rejstříku","source":"Státní oblastní archiv v Praze, Uhlířské Janovice 02, psaná strana 32, snímek 13.","caption":"V křestním zápisu je dí });

async function showPublicationTime() {
  if (location.origin !== 'https://xchest.github.io') return;
  const status = document.querySelector('#publication-time');
  const thisVersion = document.querySelector('meta[name="rodokmen-verze"]').content;
  try {
    const response = await fetch(location.pathname + location.search, {
      headers: {Range: 'bytes=0-1023'}, cache: 'no-cache', signal: AbortSignal.timeout(8000)
    });
    const stamp = response.headers.get('Last-Modified');
    const served = Date.parse(stamp || '');
    if (!response.ok || !Number.isFinite(served)) return;
    const prefix = (await response.text()).slice(0, 1024);
    const edition = prefix.match(/<meta name="rodokmen-verze" content="([0-9a-f]{64})">/);
    if (!edition) return;
    if (edition[1] !== thisVersion) {
        const reload = document.createElement('a');
        const fresh = new URL(location.href);
        fresh.searchParams.set('v', String(served));
        reload.href = fresh.href;
        reload.textContent = 'Otevřít verzi z GitHub Pages';
        status.replaceChildren(reload);
      return;
    }
    const format = new Intl.DateTimeFormat('cs-CZ', {
      timeZone: 'Europe/Prague', day: 'numeric', month: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
    });
    const time = document.createElement('time');
    time.dateTime = new Date(served).toISOString();
    time.textContent = format.format(served);
    status.replaceChildren('Verze na GitHub Pages z ', time);
  } catch {
    // Historie publikací zůstává dostupná i bez časové hlavičky.
  }
}
showPublicationTime();
