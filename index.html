. 1955","sources":[{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"26. 7. 1929","summary":"Výpis vydaný 15. 7. 1943 uvádí narození Jaroslava Mejstříka 26. 7. 1929 v Českém Brodě čp. 651, manželské zrození a bez vyznání. Otec Josef Mejstřík, výrobce cementového zboží v Českém Brodě čp. 651, narozený 24. 2. 1901 v Českém Brodě, syn Antonína Mejstříka, koláře v Českém Brodě, a Anny; její rodné příjmení v německém poli čteno nejistě jako Drož. Matka Marie rozená Majerová, narozená 12. 12. 1906 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Majerové. Matka Božena Mejstříková rozená Mrkvičková, narozená 28. 3. 1929 v Petrovicích, okres Žďár, dcera Františka Mrkvičky a doslova Matyldy rozené Tulisové. Bydliště obou rodičů Český Brod čp. 651 je odděleno od Alenina rodného domu čp. 297. Rodinný úřední doklad (fam), nikoli nový digitalizovaný prvopis matriky. Ztotožnění Matyldy Tulisové s matriční Matildou Julisovou je dosavadní silný AI závěr ze í Matildou Julisovou je dosavadní silný AI závěr ze shody rodiny, nikoli prokázaná písařská chyba."}],"provenance":"Rodinná listina","birth_date":"1929-03-28"},"p16":{"id":"p16","pid":16,"name":"Josef Procházka","display_name":"Josef Procházka","maiden_line":"","years":"* 27. 11. 1896 – před 26. 6. 1949","status":"doc","private":false,"facts":["* 27. 11. 1896 Český Brod čp. 30 — původní křestní zápis","křest 13. 12. 1896","× 16. 6. 1919 Karolina Ulrichová — přípis v křtu a oddací zápis","pekařský dělník — sňatek1919; pekař — list syna1919","zemřelý popelář, Český Brod čp. 657 — list vnuka1949","Při sňatku 16. 6. 1919 ve vojenské službě u střeleckého pluku č. 10"],"note":"Otec Jaroslava P8 podle rodinného listu1919 a listu vnuka1949. Dne5.11.2026 root osobně ověřil vlastní křest1896: přesné narození27.11.1896/ČeskýBrod30, rodičovský pár JosefProcházka/BarboraTurková a sňatkový přípis16.6.1919 sKarolinouUlrichovou. Shoda rodného domu, obou rodičů a přesného sňatkového páru/data dovoluje přijmout totožnost; narození a rodičovství nyní doc. Oddací originál1919 též osobně čten, tehdejší čp158 je bydliště, nikoli rodný dům. Různá povolání jsou datovaná tvrzení pramenů. Kmotr JosefProcházka, plynomistr zčp657 vlistu1949, není s dědem sloučen. Přesné úmrtí neznámo, před26.6.1949 jen podle rodinného listu. Nevyřešený Mochov38vs58 nedoplňuje datum narození manželky. Prameny: Matriční zápis: Křest Josefa Procházky; Matriční zápis: Sňatek Josefa Procházky a Karoliny Ulrichové; Rodinná listina: Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list; Rodinná listina: Jaroslav Procházka, narození19.6.1949 Český Brod282 — rodný a křestní list; Rodinný rodokmen: Rodinný rukopis Procházkových — data Jaroslavů a starší generace","sources":[{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Údaj o narození Josefova otce 5. 5. 1854 není ztotožněn s kandidátním křtem 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“."},{"key":"cbrod_snatek_josef_prochazka_karolina_ulrichova_1919","label":"Sňatek Josefa Procházky a Karoliny Ulrichové","url":"https://ebadatelna.soapraha.cz/d/4814/230","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 6. 1919","summary":"Josef Procházka, pekařský dělník u střeleckého pluku č. 10, a Karolina Marie Ulrichová, oba Český Brod č. 158, oddáni 16. 6. 1919 u sv. Gotharda s prominutím ohlášek, protože ženich byl povolán do vojenské služby. Oddací zápis uvádí u nevěsty rodiče Josefa Ulricha, dělníka v Českém Brodě, a Antonii rozenou Dlouhou z Českého Brodu. Pravý přípis uvádí narození nevěsty 6. 7. 1896 v Mochově podle křestního listu farního úřadu v Bříství; tento citovaný list nebyl samostatně otevřen. Rodné číslo domu v oddacím zápisu zůstává nejisté. Datum se zatím nepřenáší na profil Karly Marie z rodinného listu, který uvádí Mochov čp. 38. Svědkem byl Jiří Soukup, strojník v cukrovaru, Český Brod čp. 318. Sňatek byl oznámen farnímu úřadu v Bříství 17. června 1919 pod č. 362."},{"key":"rodinny_krestni_list_jaroslav_prochazka_1919","label":"Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"16. 12. 1919","summary":"Rodinný list vydaný 2. 9. 1 st přečten přímo. Otcem Jaroslava * 1929 podle výpisu z rodného rejstříku vydaného 1943 (rodinný doklad, čteno z fotky); datum narození se v obou shoduje. Přípis na křtu „19/8 1928 č. 417“ může souviset se sňatkem (AI hypotéza). Sňatek ani úmrtí zatím nenalezeny. Fotka2 živnostenského listu osobně přečtena rootem5.11.2026: ohlášení23.2.1927 a vydání2.5.1927. List uvádí pouze rok1901 a ČeskýBrod, sám nepotvrzuje přesný den narození ani čp651; přesná provozovna je vybledlá. Tento životní detail je rodinný dokument, nikoli nový matriční zápis. Prameny: Matriční zápis: Křest Josefa Mejstříka; Rodinná listina: JosefMejstřík — živnostenský list1927; Rodinná listina: Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943; Rodinná listina: Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","sources":[{"key":"brod_krest_josef_mejstrik_1901","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/180","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 2. 1901","summary":"Josef se narodil 24. února a byl pokřtěn 3. března 1901 v Českém Brodě čp. 47 koláři Antonínu Mejstříkovi * 16. 10. 1862 v Janovické Lhotě a Anně Drožové * 22. 8. 1863 v Hradišťku, oddaným v Kounicích 24. 7. 1893. Datum narození se shoduje s výpisem z rodného rejstříku jeho syna Jaroslava z roku 1943. Přípis: odpadl k bezvyznání, zápis okresního hejtmanství 16. 1. 1920 č. 966; další přípis s datem 19. 8. 1928 č. 417 (význam neověřen)."},{"key":"rodinny_zivnostensky_list_josef_mejstrik_1927","label":"JosefMejstřík — živnostenský list1927","url":"","kind":"J","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"2. 5. 1927","summary":"Živnostenský list vydaný 2. 5. 1927 uvádí Josefa Mejstříka, narozeného roku 1901, příslušného a bydlícího v Českém Brodě. Dne 23. 2. 1927 ohlásil výrobu cementového zboží. Přesná adresa provozovny je vybledlá; rodiče, manželka a den narození nejsou uvedeny. Jde o rodinný dokument."},{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"26. 7. 1929","summary":"Výpis vydaný 15. 7. 1943 uvádí narození Jaroslava Mejstříka 26. 7. 1929 v Českém Brodě čp. 651, manželské zrození a bez vyznání. Otec Josef Mejstřík, výrobce cementového zboží v Českém Brodě čp. 651, narozený 24. 2. 1901 v Českém Brodě, syn Antonína Mejstříka, koláře v Českém Brodě, a Anny; její rodné příjmení v německém poli čteno nejistě jako Drož. Matka Marie rozená Majerová, narozená 12. 12. 1906 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Majerové. Matka Božena Mejstříková rozená Mrkvičková, narozená 28. 3. 1929 v Petrovicích, okres Žďár, dcera Františka Mrkvičky a doslova Matyldy rozené Tulisové. Bydliště obou rodičů Český Brod čp. 651 je odděleno od Alenina rodného domu čp. 297. Rodinný úřední doklad (fam), nikoli nový digitalizovaný prvopis matriky. Ztotožnění Matyldy Tulisové s matriční Matildou Julisovou j ad, čteno z fotky) a rozhodnutí Aleše. Že jde o tohoto Františka, plyne ze shody jména, obce a manželky Matyldy (AI závěr, silný). Úmrtí nenalezeno. Prameny: Matriční zápis: Křest Františka Mrkvičky; Matriční zápis: Sňatek Františka Mrkvičky a Marie Lukšové; Matriční zápis: Křest Stanislava Františka Mrkvičky; Rodinná listina: Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","sources":[{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."},{"key":"petrovice_snatek_mrkvicka_luksova_1897","label":"Sňatek Františka Mrkvičky a Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00840.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 11. 1897","summary":"František Mrkvička * 2. 11. 1873, čtvrtník v Petrovicích č. 29, syn Františka Mrkvičky, tesaře, a Josefy roz. Starých, si vzal Marii Lukšovou * 5. 8. 1876 z Petrovic č. 28, dceru zemřelého Františka Lukše, rolníka, a Josefy roz. Šoškové. Při sňatku bydlela u své matky v Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."},{"key":"petrovice_krest_stanislav_frantisek_mrkvicka_1920","label":"Křest Stanislava Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01870.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 8. 1920","summary":"Stanislav František, Petrovice č. 28, syn Františka Mrkvičky * 2. 11. 1873, rolníka, a Matildy * 14. 6. 1894, dcery Josefa Julise, domkaře v Žubří. Rodiče oddáni v Olešné 23. 9. 1919."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Majerové. Matka Božena Mejstříková rozená Mrkvičková, narozená 28. 3. 1929 v Petrovicích, okres Žďár, dcera Františka Mrkvičky a doslova Matyldy rozené Tulisové. Bydliště obou rodičů Český Brod čp. 651 je odděleno od Alenina rodného domu čp. 297. Rodinný úřední doklad (fam), nikoli nový digitalizovaný prvopis matriky. Ztotožnění Matyldy Tulisové s matriční Matildou Julisovou je dosavadní silný AI závěr ze shody rodiny, nikoli prokázaná písařská chyba."}],"provenance":"Matriční zápis; Rodinná listina","birth_date":"1873-11-02"},"p23":{"id":"p23","pid":23,"name":"Matilda (Matylda) Julisová","display_name":"Matilda (Matylda) Julisová","maiden_line":"","years":"* 14. 6. 1894","status":"doc","private":false,"facts":["* 14. 6. 1894 Žubří čp. 33","× 23. 9. 1919 Olešná, František Mrkvička","Petrovice čp. 28","Při sňatku 1919 svobodná; u rodičů v Žubří čp. 33"],"note":"Oddací zápis z 23. 9. 1919 výslovně uvádí, že oba její rodiče tehdy žili. Druhá žena Františka, o 21 let mladší. Původní křest 1894 přímo jmenuje rodiče Josefa Julise, domkáře v Žubří, a Marii roz. Komínkovou i jejich rodiče. Matkou Boženy podle rodného listu její dcery 1955, kde stojí „Matylda roz. Tulisová“; ztotožnění s Julisovou je AI závěr ze shody jmen, místa a manžela, nikoli potvrzená písařská chyba. Děti z matrik: Stanislav František 1920, Marie Matilda 1921 († 1922), Božena Milada 1922 († 1923). Prameny: Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Druhý sňatek Františka Mrkvičky s Matildou Julisovou; Matriční zápis: Křest Stanislava Františka Mrkvičky; Matriční zápis: Křest Marie Matildy Mrkvičkové; Matriční zápis: Křest Boženy Milady Mrkvičkové; Rodinná listina: Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","sources":[{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny; její rodné příjmení nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"zubri_snatek_frantisek_mrkvicka_matilda_julisova_1919","label":"Druhý sňatek Františka Mrkvičky s Matildou Julisovou","url":"https://www.mza.cz/actapublica/matrika/detail/10726?image=216000010-000253-003380-000000-016001-000000-00-B00320-00940.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 9. 1919","summary":"František Mrkvička, rolník a vdovec z Petrovic čp. 28, nar. 2. 11. 1873, se 23. září 1919 v Olešné oženil s Matildou Julisovou ze Zubří čp. 33, nar. 14. 6. 1894, dcerou domkaře Josefa Juliše a Marie roz. Komínkové. Tím je doložen vztah vdovce a mladší nevěsty z rodinného vyprávění. Nevěsta byla při sňatku svobodná a bydlela u rodičů v Žubří čp. 33; u jejích rodičů je výslovně uvedeno, že oba žijí. Oddával je Jan Procházka, farář v Olešné."},{"key":"petrovice_krest_stanislav_frantisek_mrkvicka_1920","label":"Křest Stanislava Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01870.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 8. 1920","summary":"Stanislav František, Petrovice č. 28, syn Františka Mrkvičky * 2. 11. 1873, rolníka, a Matildy * 14. 6. 1894, dcery Josefa Julise, domkaře v Žubří. Rodiče oddáni v Olešné 23. 9. 1919."},{"key":"petrovice_krest_marie_matilda_mrkvickova_1921","label":"Křest Marie Matildy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 8. 1921","summary":"Marie Matilda, Petrovice č. 28, dcera Františka Mrkvičky a Matildy Julisové. Dítě zemřelo 4. 3. 1922."},{"key":"petrovice_krest_bozena_milada_mrkvickova_1922","label":"Křest Boženy Milady Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01910.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 12. 1922","summary":"Božena Milada, dcera Františka Mrkvičky, rolníka v Petrovicích čp. 28, a Matyldy, dcery Josefa Julise, domkaře v Žubří. Dítě zemřelo 14. 1. 1923. Rodiče oddáni v Olešné 23. 9. 1919."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Majerové. Matka Božena Mejstříková rozená Mrkvičková, narozená 28. 3. 1929 v Petrovicích, okres Žďár, dcera Františka Mrkvičky a doslova Matyldy rozené Tulisové. Bydliště obou rodičů Český Brod čp. 651 je odděleno od Alenina rodného domu čp. 297. Rodinný úřední doklad (fam), nikoli nový digitalizovaný prvopis matriky. Ztotožnění Matyldy Tulisové s matriční Matildou Julisovou je dosavadní silný AI závěr ze shody rodiny, nikoli prokázaná písařská chyba."}],"provenance":"Matriční zápis; Rodinná listina","birth_date":"1894-06-14"},"p32":{"id":"p32","pid":32,"name":"Josef Procházka","display_name":"Josef Procházka","maiden_line":"","years":"* 1854","status":"doc","private":false,"facts":["dělník v Českém Brodě — křest syna1896 a list vnuka1919","Český Brod čp. 30 — rodinný rukopis6","v křtu syna1896 uvedeno narození5.5.1854 v Samechově; vlastní datum dosud rozporné","syn Marie Procházkové — výslovně v křtu syna1896"],"note":"Rodičovství Josefa P16 přímo v jeho původním křtu1896, osobní přejímka rootem5.11.2026; shoda s rodinným listem vnuka1919 a rukopisem6. Rok1854 je údaj vmatrice syna. Přesné datum5.5.1854 pochází zpozdějšího zápisu1896; kandidátní vlastní křest označený Samechov18/9.3.1854 má jiné datum a dosud není přijat jako totožný. Matka Marie a její rodiče František/Anna jsou přijati samostatně z výslovné formulace1896, nikoli převzetím kandidátního křtu. Jan Hrdlička je pozdější Mariin manžel; není uveden jako Josefův biologický otec. Není sloučen se stejnojmenným synem ani kmotrem1949. Úmrtí neznámo. Prameny: Matriční zápis: Křest Josefa Procházky; Rodinná listina: Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list; Rodinný rodokmen: Rodinný rukopis Procházkových — data Jaroslavů a starší generace","sources":[{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Údaj o narození Josefova otce 5. 5. 1854 není ztotožněn s kandidátním křtem 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“."},{"key":"rodinny_krestni_list_jaroslav_prochazka_1919","label":"Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"16. 12. 1919","summary":"Rodinný list vydaný 2. 9. 1942 uvádí narození Jaroslava 16. 12. 1919 v Českém Brodě čp. 158, křest 25. 12. 1919, otce Josefa Procházku, pekaře narozeného v Českém Brodě čp. 30, a matku Karlu Marii Ulrichovou narozenou v Mochově čp. 38. Otcovi rodiče jsou Josef Procházka, dělník v Českém Brodě, a Barbora Turková z Kounic; matčini rodiče Josef Ulrich, dělník v Českém Brodě, a Antonie Dlouhá z Českého Brodu. Rodný dům matky čp. 38 není automaticky ztotožněn s kandidátkou z Mochova čp. 58. List dále uvádí křtitele Aloise a kmotry Karla a Anastazii, oba s údajem Český Brod. Jejich příjmení a další část těchto polí nejsou bezpečně přečteny."},{"key":"rodinny_rukopis_prochazkovi_fotka6","label":"Rodinný rukopis Procházkových — data Jaroslavů a starší generace","url":"","kind":"J","source_kind":"family_tree","provenance":"Rodinný rodokmen","date":"Datum sestavení neuvedeno jstříka","url":"https://ebadatelna.soapraha.cz/d/4810/81","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"4. 9. 1897","summary":"František Serafín se narodil 4. a byl pokřtěn 12. září 1897 v Českém Brodě čp. 145/146 kolářskému dělníkovi Antonínu Mejstříkovi a Anně Drožové. Že jde o Františka Mejstříka ze sňatku 1941, plyne ze shody data narození. Otcovství vůči Miroslavu Mejstříkovi doloženo není (AI hypotéza, neověřeno)."},{"key":"brod_krest_josef_mejstrik_1901","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/180","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 2. 1901","summary":"Josef se narodil 24. února a byl pokřtěn 3. března 1901 v Českém Brodě čp. 47 koláři Antonínu Mejstříkovi * 16. 10. 1862 v Janovické Lhotě a Anně Drožové * 22. 8. 1863 v Hradišťku, oddaným v Kounicích 24. 7. 1893. Datum narození se shoduje s výpisem z rodného rejstříku jeho syna Jaroslava z roku 1943. Přípis: odpadl k bezvyznání, zápis okresního hejtmanství 16. 1. 1920 č. 966; další přípis s datem 19. 8. 1928 č. 417 (význam neověřen)."},{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"26. 7. 1929","summary":"Výpis vydaný 15. 7. 1943 uvádí narození Jaroslava Mejstříka 26. 7. 1929 v Českém Brodě čp. 651, manželské zrození a bez vyznání. Otec Josef Mejstřík, výrobce cementového zboží v Českém Brodě čp. 651, narozený 24. 2. 1901 v Českém Brodě, syn Antonína Mejstříka, koláře v Českém Brodě, a Anny; její rodné příjmení v německém poli čteno nejistě jako Drož. Matka Marie rozená Majerová, narozená 12. 12. 1906 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."}],"provenance":"Matriční zápis; Rodinná listina"},"p41":{"id":"p41","pid":41,"name":"Anna Drožová","display_name":"Anna Drožová","maiden_line":"","years":"* 1863","status":"doc","private":false,"facts":["* 22. 8. 1863 Hradišťko čp. 21","× 24. 7. 1893 Kounice, Antonín Mejstřík"],"note":"Ve výpisu z roku 1943 je vedle Antonína uvedena Anna, rodné příjmení čteno nejistě jako „Drož“; přesná podoba z tohoto listu není uzavřena. Kanonické příjmení Drožová vychází z ostatních připojených matričních pramenů. Ztotožnění křtu z roku 1863 a nevěsty z roku 1893 plyne ze shody data narození, obce a rodičů. Dcera Františka Drože, šafáře v Chrášťanech, a Anny roz. Pokorné z Hradišťka čp. 21. Prameny: Matriční zápis: Narození Anny Drožové v Hradišťku; Matriční zápis: Sňatek Antonína Mejstříka a Anny Drožové; Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Křest Františka Serafína Mejstříka; Matriční zápis: Křest Josefa Mejstříka; Rodinná listina: Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","sources":[{"key":"sadska_krest_anna_drozova_1863","label":"Narození Anny Drožové v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/11503/83","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 8. 1863","summary":"Anna Drožová se narodila 22. srpna 1863 v Hradišťku čp. 21 a byla pokřtěna 23. srpna. Rodiči jsou František Drož a Anna rozená Pokorná. Zápis dále jmenuje rodiče Františka: Františka Drože, gruntovníka v Břežanech čp. 56, a Barboru rozenou Štěpánek z Vlkovce čp. 6; rodiče Anny: Josefa Pokorného, výminkáře v Hradišťku čp. 21, a zemřelou Barboru. Rodné příjmení druhé Barbory není bezpečně přečteno. Stejné datum, rodiče a obec jsou uvedeny u nevěsty Anny Drožové při sňatku s Antonínem Mejstříkem roku 1893." ý 15. 7. 1943","sources":[{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."},{"key":"prestice_krest_marie_majerova_1906","label":"Křest Marie Filomeny Majerové","url":"https://www.portafontium.eu/iipimage/30072985/prestice-57_0220-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 12. 1906","summary":"Marie Filomena se narodila 12. prosince a byla pokřtěna 16. prosince 1906 v Přešticích čp. 33. Otec Josef Majer, panský pasák, narozený v Horní Lukavici čp. 1. Matka Markéta z Dlouhé Louky čp. 9. Datum a rodiče se shodují s výpisem z rodného rejstříku jejího syna Jaroslava z roku 1943. Přípisy: bez vyznání, český úřad v Českém Brodě 10. 10. 1931; tužkou „provdaná Mejstříková“."},{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"26. 7. 1929","summary":"Výpis vydaný 15. 7. 1943 uvádí narození Jaroslava Mejstříka 26. 7. 1929 v Českém Brodě čp. 651, manželské zrození a bez vyznání. Otec Josef Mejstřík, výrobce cementového zboží v Českém Brodě čp. 651, narozený 24. 2. 1901 v Českém Brodě, syn Antonína Mejstříka, koláře v Českém Brodě, a Anny; její rodné příjmení v německém poli čteno nejistě jako Drož. Matka Marie rozená Majerová, narozená 12. 12. 1906 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."}],"provenance":"Matriční zápis; Rodinná listina"},"p44":{"id":"p44","pid":44,"name":"František Mrkvička (starší)","display_name":"František Mrkvička (starší)","maiden_line":"","years":"* 1842","status":"doc","private":false,"facts":["* 6. 11. 1842 Petrovice","× 8. 8. 1870 Josefa Starých","domkář a tesař, Petrovice","roku 1870 uveden věk 27 let"],"note":"Narození 6. 11. 1842 čteno z MZA 15923, sn. 107. Jména rodičů Vincenc a Terezie se shodují s jeho sňatkem 1870, kde je mu 27 let; tím je ztotožnění silně podpořeno. Otec Františka * 1873 doložen vlastním sňatkem a křtem syna. Vlastní úmrtí nenalezeno; podle zápisu vdovy (AI ztotožnění) zemřel před 31. 7. 1912. Prameny: Matriční zápis: Narození a křest Františka Mrkvičky staršího; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky; Matriční zápis: Sňatek Františka Mrkvičky a Marie Lukšové","sources":[{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích se 6. 11. 1842 narodil Franz (František) Mrkvička, syn Vincence Mrkvičky a Terezie. Příjmení matky Sedláková potvrzuje až jeho sňatek v roce 1870. Stejná jména rodičů a věk ženicha 27 let v roce 1870 podporují ztotožnění dítěte s otcem Františka narozeného roku 1873; další rodinné údaje v křestním řádku zatím nejsou bezpečně přečteny."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."},{"key":"petrovice_snatek_mrkvicka_luksova_1897","label":"Sňatek Františka Mrkvičky a Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00840.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 11. 1897","summary":"František Mrkvička * 2. 11. 1873, čtvrtník v Petrovicích č. 29, syn Františka Mrkvičky, tesaře, a Josefy roz. Starých, si vzal Marii Lukšovou * 5. 8. 1876 z Petrovic č. 28, dceru zemřelého Františka Lukše, rolníka, a Josefy roz. Šoškové. Při sňatku bydlela u své matky v Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."}],"provenance":"Matriční zápis"},"p45":{"id":"p45","pid":45,"name":"Josefa Starých","display_name":"Josefa Starých","maiden_line":"","years":"1846–1912","status":"doc","private":false,"facts":["* 10. 7. 1846 Petrovice čp. 3 (ztotožnění AI)","× 8. 8. 1870 František Mrkvička","roku 1870 uveden věk 24 let","† 31. 7. 1912 Petrovice čp. 29, vdova, 65 let, srdeční vada (ztotožnění AI)"],"note":"Matka Františka * 1873 doložena jeho křtem a vlastním sňatkem. Rodné příjmení v dobových tvarech Starý/Starých; zápis vnučky Josefy z roku 1904 uvádí Břežek. Rozpor zaznamenán; křest 1846 a sňatek rodičů 1841 podporují Starý. Křest z 10. 7. 1846 (MZA 15923, sn. 111) čten v prohlížeči; ztotožnění je AI hypotéza opřená o jméno, otce, obec a věk 24 let při sňatku. Úmrtí 1912 (MZA 15943, sn. 142, nízké rozlišení) uvádí vdovu po domkáři Františku Mrkvičkovi z čp. 29 bez rodného příjmení; ztotožnění je AI hypotéza. Rok narození tam 1847, výpočtem z věku kolem 8. 4. 1847 (AI odvození), o rok později než křest. Prameny: Matriční zápis: Křest Josefy Staré; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky; Matriční zápis: Sňatek Františka Mrkvičky a Marie Lukšové; Matriční zápis: Křest Josefy Mrkvičkové; Matriční zápis: Úmrtí Josefy Mrkvičkové","sources":[{"key":"petrovice_krest_josefa_stara_1846","label":"Křest Josefy Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01110.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 7. 1846","summary":"10. 7. 1846 byla v Petrovicích čp. 3 pokřtěna Josefa, dcera Josefa Starého. Sloupec matky je přepisovaný a jméno v něm není bezpečně čitelné; v popisu je Stary a vepsané Franz. Ztotožnění s Josefou, která se roku 1870 vdala za Františka Mrkvičku, je AI hypotéza opřená o jméno, otce, obec a věk 24 let."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."},{"key":"petrovice_snatek_mrkvicka_luksova_1897","label":"Sňatek Františka Mrkvičky a Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00840.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 11. 1897","summary":"František Mrkvička * 2. 11. 1873, čtvrtník v Petrovicích č. 29, syn Františka Mrkvičky, tesaře, a Josefy roz. Starých, si vzal Marii Lukšovou * 5. 8. 1876 z Petrovic č. 28, dceru zemřelého Františka Lukše, rolníka, a Josefy roz. Šoškové. Při sňatku bydlela u své matky v Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."},{"key":"petrovice_krest_josefa_mrkvickova_1904","label":"Křest Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01640.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 5. 1904","summary":"Josefa, Petrovice č. 29, dcera Františka Mrkvičky * 2. 11. 1873, krejčího, a Marie Lukšové * 5. 8. 1876. U babičky z otcovy strany je zde rozená Břežek, jinde Starý nebo Starých. Přípis o sňatku 5. 2. 1929 s Františkem Lukšem."},{"key":"petrovice_umrti_josefa_mrkvickova_1912","label":"Úmrtí Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/11617?image=216000010-000253-003380-000000-015943-000000-00-B11572-01420.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 7. 1912","summary":"Josefa Mrkvičková, vdova po domkáři Františku Mrkvičkovi z Petrovic čp. 29, zemřela 31. července 1912 na srdeční vadu a byla pohřbena 2. srpna. Uveden věk 65 let, 3 měsíce a asi 23 dní a rok narození 1847. Rodné příjmení zápis neuvádí; ztotožnění s Josefou Starých je AI hypotéza (jméno, manžel, povolání, dům)."}],"provenance":"Matriční zápis"},"p46":{"id":"p46","pid":46,"name":"Josef Julis","display_name":"Josef Julis","maiden_line":"","years":"* 1842","status":"doc","private":false,"facts":["* 9. 2. 1842 Branišov; pokřtěn 10. 2.","× 13. 11. 1893 Žubří, Marie roz. Komínková","při sňatku 1893 vdovec, 51 let","domkář v Žubří čp. 33 (1894)"],"note":"Otec Matyldy Julisové * 1894. Ztotožnění křtu 1842 s ženichem 1893 je AI závěr ze shody obou rodičů (Martin Julis a Terezie rozená Brhel) a přesného věku 51 let při sňatku; žádný výslovný zpětný odkaz mezi zápisy zatím nemáme. Předchozí manželství plyne z označení vdovec; první manželka neurčena. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Druhý sňatek Františka Mrkvičky s Matildou Julisovou","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Pravá strana, rok 1842, zápis č. 4: Joseph (Josef) se narodil 9. února a byl pokřtěn 10. února. Otec Martin Julis, domkář v Branišově; matka Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Číslo domu a další části rodičovských sloupců nejsou z tohoto čtení bezpečně určeny. Ztotožnění s Josefem Julisem, který se roku 1893 ženil v Žubří, je AI závěr ze shody obou rodičů a věku 51 let u sňatku (únor 1842 až listopad 1893)."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta (normalizovaně Augustová). Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny; její rodné příjmení nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"zubri_snatek_frantisek_mrkvicka_matilda_julisova_1919","label":"Druhý sňatek Františka Mrkvičky s Matildou Julisovou","url":"https://www.mza.cz/actapublica/matrika/detail/10726?image=216000010-000253-003380-000000-016001-000000-00-B00320-00940.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 9. 1919","summary":"František Mrkvička, rolník a vdovec z Petrovic čp. 28, nar. 2. 11. 1873, se 23. září 1919 v Olešné oženil s Matildou Julisovou ze Zubří čp. 33, nar. 14. 6. 1894, dcerou domkaře Josefa Juliše a Marie roz. Komínkové. Tím je doložen vztah vdovce a mladší nevěsty z rodinného vyprávění. Nevěsta byla při sňatku svobodná a bydlela u rodičů v Žubří čp. 33; u jejích rodičů je výslovně uvedeno, že oba žijí. Oddával je Jan Procházka, farář v Olešné."}],"provenance":"Matriční zápis"},"p47":{"id":"p47","pid":47,"name":"Marie Komínková","display_name":"Marie Komínková","maiden_line":"","years":"","status":"doc","private":false,"facts":["× 14. 2. 1881 Žubří, Antonín Hemza","× 13. 11. 1893 Žubří, Josef Julis","při sňatku 1893 zapsána jako Marie Hemzová, vdova, 39 let","první manžel † Antonín Hemza, domkář v Žubří (zemřel před 13. 11. 1893)","Žubří čp. 33 (1893–1894)"],"note":"Matka Matyldy Julisové * 1894. Původní sňatek s Antonem Hemzou 1881, další sňatek s Josefem Julisem 1893 a Matyldin křest 1894 shodně jmenují Mariiny rodiče Františka Komínka, domkáře v Jiříkovicích, a Kateřinu rozenou Augusta (normalizovaně Augustovou). Ztotožnění nevěsty ze sňatků 1881 a 1893 je silný AI závěr ze shody jejího jména, rodičů a příjmení Hemzová po prvním manželovi. Antonín zemřel před 13. 11. 1893, datum jeho úmrtí zůstává neznámé. Marie narozená 16. 10. 1853 v Jiříkovicích čp. 21 je kandidátka v HYPOTEZY kvůli rozporu jednoho roku s věkem uvedeným při sňatku 1893, nikoli bezpečně určený vlastní křest této osoby. Prameny: Matriční zápis: Sňatek Antonína Hemzy a Marie Komínkové v Žubří; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Druhý sňatek Františka Mrkvičky s Matildou Julisovou","sources":[{"key":"zubri_snatek_anton_hemza_marie_kominkova_1881","label":"Sňatek Antonína Hemzy a Marie Komínkové v Žubří","url":"https://matriky.online/brno/00016000/89/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 2. 1881","summary":"Pravá strana, oddíl Žubří. Dne 14. února 1881 se žení Anton Hemza, domkář v Žubří, s Marií Komínkovou, služkou v Žubří. Nevěsta je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta. Tato dvojice rodičů se shoduje s údaji o Marii Hemzové, rozené Komínkové, při jejím dalším sňatku s Josefem Julisem roku 1893. Ztotožnění obou oddacích zápisů je silný AI závěr ze shody obou jmen, prvního manžela a rodičů nevěsty. Ženichův sloupec uvádí otce Jana Hemzu a matku Františku; další drobné údaje a věky nejsou bezpečně přepsány. Sňatek sám neurčuje Mariino datum narození ani datum Antonínova úmrtí."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta (normalizovaně Augustová). Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny; její rodné příjmení nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"zubri_snatek_frantisek_mrkvicka_matilda_julisova_1919","label":"Druhý sňatek Františka Mrkvičky s Matildou Julisovou","url":"https://www.mza.cz/actapublica/matrika/detail/10726?image=216000010-000253-003380-000000-016001-000000-00-B00320-00940.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 9. 1919","summary":"František Mrkvička, rolník a vdovec z Petrovic čp. 28, nar. 2. 11. 1873, se 23. září 1919 v Olešné oženil s Matildou Julisovou ze Zubří čp. 33, nar. 14. 6. 1894, dcerou domkaře Josefa Juliše a Marie roz. Komínkové. Tím je doložen vztah vdovce a mladší nevěsty z rodinného vyprávění. Nevěsta byla při sňatku svobodná a bydlela u rodičů v Žubří čp. 33; u jejích rodičů je výslovně uvedeno, že oba žijí. Oddával je Jan Procházka, farář v Olešné."}],"provenance":"Matriční zápis"},"p65":{"id":"p65","pid":65,"name":"Marie Procházková","display_name":"Marie Procházková","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka Josefa Procházky ze Samechova — křest vnuka1896","dcera Františka Procházky a Anny Kollmannové","později provdaná za Jana Hrdličku"],"note":"Výslovná mateřská návaznost v otcovském sloupci křtu vnuka Josefa z27.11.1896, osobně přečtena rootem a kontrolním agentem5.11.2026. Původní zápis rozlišuje jejího syna Josefa a pozdějšího manžela Jana Hrdličku; biologický otec Josefa zde není uveden. Nejisté číslo Hrdličkova domu230/250 se nepřijímá. Přesná životní data neznáma, kandidátní křest1854 není podkladem této vazby. Prameny: Matriční zápis: Křest Josefa Procházky","sources":[{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Údaj o narození Josefova otce 5. 5. 1854 není ztotožněn s kandidátním křtem 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“."}],"provenance":"Matriční zápis"},"p67":{"id":"p67","pid":67,"name":"Rosalie Turková","display_name":"Rosalie Turková","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka Barbory Turkové z Kounic — křest vnuka1896","dcera Matěje Turka"],"note":"Přímo uvedena jako matka nemanželské Barbory v mateřském sloupci křtu vnuka Josefa27.11.1896, osobně přečteno rootem a kontrolním agentem5.11.2026. Zápis jmenuje také jejího otce Matěje Turka. Její vlastní narození, matka, sňatek a úmrtí nejsou známy. Prameny: Matriční zápis: Křest Josefa Procházky","sources":[{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Údaj o narození Josefova otce 5. 5. 1854 není ztotožněn s kandidátním křtem 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“."}],"provenance":"Matriční zápis"},"p80":{"id":"p80","pid":80,"name":"Josef Mejstřík","display_name":"Josef Mejstřík","maiden_line":"","years":"* 1815","status":"doc","private":false,"facts":["* 14. 8. 1815 Janovická Lhota čp. 29","× 25. 2. 1840 Kateřina Brožková","zahradník, později rolník, Janovická Lhota čp. 29"],"note":"Otec Antonína podle křtu 1862 a křtů vnuků 1896, 1897, 1901. Totožnost křtu 1815 se ženichem 1840 plyne ze jména, domu a věku 25 let (AI závěr). Prameny: Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Sňatek Josefa Mejstříka a Kateřiny Brožkové; Matriční zápis: Křest Antonína Mejstříka","sources":[{"key":"lhota_krest_josef_mejstrik_1815","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13234/12","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 8. 1815","summary":"Josef se narodil 14. a byl pokřtěn 15. srpna 1815 ve Lhotě čp. 29 jako syn půlsedláka Josefa Mejstříka a Magdaleny Doudové ze Žandova. Rok potvrzuje rejstřík Uhlířské Janovice 24, sn. 101 (Lhotta 29, Tom VI, fol. 18)."},{"key":"lhota_snatek_josef_mejstrik_katerina_brozkova_1840","label":"Sňatek Josefa Mejstříka a Kateřiny Brožkové","url":"https://ebadatelna.soapraha.cz/d/13240/20","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 2. 1840","summary":"Josef Mejstřík, zahradník, 25 let, syn zahradníka Josefa Mejstříka ze Lhoty čp. 29 a Magdaleny rozené Doudové ze Žandova, se 25. února 1840 oženil s osmnáctiletou Kateřinou, dcerou chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z Vrání čp. 21. Otec nevěsty dal souhlas k sňatku nezletilé (AI čtení)."},{"key":"lhota_krest_antonin_mejstrik_1862","label":"Křest Antonína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13237/111","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 10. 1862","summary":"Antonín se narodil 16. a byl pokřtěn 17. října 1862 ve Lhotě čp. 29 u Uhlířských Janovic. Otec Josef Mejstřík, rolník, syn Josefa Mejstříka a Magdaleny Doudové ze Žandova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."}],"provenance":"Matriční zápis"},"p81":{"id":"p81","pid":81,"name":"Kateřina Brožková","display_name":"Kateřina Brožková","maiden_line":"","years":"asi 1822","status":"doc","private":false,"facts":["× 25. 2. 1840 Josef Mejstřík","roku 1840 uveden věk 18 let","z Kochánova"],"note":"Dcera chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z Vrání čp. 21. Prameny: Matriční zápis: Sňatek Josefa Mejstříka a Kateřiny Brožkové; Matriční zápis: Křest Antonína Mejstříka","sources":[{"key":"lhota_snatek_josef_mejstrik_katerina_brozkova_1840","label":"Sňatek Josefa Mejstříka a Kateřiny Brožkové","url":"https://ebadatelna.soapraha.cz/d/13240/20","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 2. 1840","summary":"Josef Mejstřík, zahradník, 25 let, syn zahradníka Josefa Mejstříka ze Lhoty čp. 29 a Magdaleny rozené Doudové ze Žandova, se 25. února 1840 oženil s osmnáctiletou Kateřinou, dcerou chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z Vrání čp. 21. Otec nevěsty dal souhlas k sňatku nezletilé (AI čtení)."},{"key":"lhota_krest_antonin_mejstrik_1862","label":"Křest Antonína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13237/111","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 10. 1862","summary":"Antonín se narodil 16. a byl pokřtěn 17. října 1862 ve Lhotě čp. 29 u Uhlířských Janovic. Otec Josef Mejstřík, rolník, syn Josefa Mejstříka a Magdaleny Doudové ze Žandova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."}],"provenance":"Matriční zápis"},"p82":{"id":"p82","pid":82,"name":"František Drož","display_name":"František Drož","maiden_line":"","years":"asi 1838","status":"doc","private":false,"facts":["× 17. 11. 1857 Hradišťko, Anna Pokorná","při sňatku 19 let; domovem Břežany čp. 56","hospodský, Hradišťko čp. 21 (1863)","šafář, Chrášťany (1893)"],"note":"Otec Anny Drožové * 1863. Vlastní sňatek 1857 výslovně jmenuje rodiče Františka Drože a Barboru; shoda s dceřiným křtem 1863 v rodičích, obcích a domech potvrzuje ztotožnění. Ročník narození je pouze odvozený z uvedeného věku 19 let, vlastní křest zatím nenalezen. Prameny: Matriční zápis: Sňatek Františka Drože a Anny Pokorné v Hradišťku; Matriční zápis: Narození Anny Drožové v Hradišťku; Matriční zápis: Sňatek Antonína Mejstříka a Anny Drožové","sources":[{"key":"sadska_snatek_frantisek_droz_anna_pokorna_1857","label":"Sňatek Františka Drože a Anny Pokorné v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/13781/15","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 11. 1857","summary":"Dne 17. listopadu 1857 se vzali František Drož, domovem v Břežanech čp. 56, syn Františka Drože a Barbory rozené Štěpánek z Vlkovce čp. 6, a Anna Pokorná, domovem v Hradišťku čp. 21, dcera Josefa Pokorného a Barbory. Ženich je zapsán jako devatenáctiletý a nevěsta jako šestnáctiletá. Shoda jmen rodičů, obcí a domů s křtem jejich dcery Anny Drožové z roku 1863 dokládá ztotožnění manželů. Rodné příjmení Barbory Pokorné zůstává neuzavřené."},{"key":"sadska_krest_anna_drozova_1863","label":"Narození Anny Drožové v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/11503/83","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 8. 1863","summary":"Anna Drožová se narodila 22. srpna 1863 v Hradišťku čp. 21 a byla pokřtěna 23. srpna. Rodiči jsou František Drož a Anna rozená Pokorná. Zápis dále jmenuje rodiče Františka: Františka Drože, gruntovníka v Břežanech čp. 56, a Barboru rozenou Štěpánek z Vlkovce čp. 6; rodiče Anny: Josefa Pokorného, výminkáře v Hradišťku čp. 21, a zemřelou Barboru. Rodné příjmení druhé Barbory není bezpečně přečteno. Stejné datum, rodiče a obec jsou uvedeny u nevěsty Anny Drožové při sňatku s Antonínem Mejstříkem roku 1893."},{"key":"kounice_snatek_antonin_mejstrik_anna_drozova_1893","label":"Sňatek Antonína Mejstříka a Anny Drožové","url":"https://ebadatelna.soapraha.cz/d/14350/63","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 7. 1893","summary":"V Kounicích se 24. července 1893 vzali Antonín Mejstřík, kolářský dělník z čp. 52, syn Josefa Mejstříka z Janovické Lhoty čp. 29 a Kateřiny rozené Brožkové, a Anna Drožová, dcera Františka Drože, šafáře v Chrášťanech, a Anny rozené Pokorné z Hradišťka čp. 21. U snoubenců jsou dopsána data narození 16. 10. 1862 a 22. 8. 1863. Totožnost s rodiči Josefa Mejstříka narozeného 1901 podporuje shoda jmen, sňatku a rodičů v jeho křtu."}],"provenance":"Matriční zápis"},"p83":{"id":"p83","pid":83,"name":"Anna Pokorná","display_name":"Anna Pokorná","maiden_line":"","years":"asi 1841","status":"doc","private":false,"facts":["× 17. 11. 1857 Hradišťko, František Drož","při sňatku 16 let; domovem Hradišťko čp. 21","Hradišťko čp. 21 (1863)"],"note":"Matka Anny Drožové * 1863. Vlastní sňatek 1857 výslovně jmenuje její rodiče Josefa Pokorného a Barboru; dceřin křest 1863 je potvrzuje a označuje Barboru již za zemřelou. Ročník narození je pouze odvozený z uvedeného věku 16 let, vlastní křest zatím nenalezen. Prameny: Matriční zápis: Sňatek Františka Drože a Anny Pokorné v Hradišťku; Matriční zápis: Narození Anny Drožové v Hradišťku; Matriční zápis: Sňatek Antonína Mejstříka a Anny Drožové","sources":[{"key":"sadska_snatek_frantisek_droz_anna_pokorna_1857","label":"Sňatek Františka Drože a Anny Pokorné v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/13781/15","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 11. 1857","summary":"Dne 17. listopadu 1857 se vzali František Drož, domovem v Břežanech čp. 56, syn Františka Drože a Barbory rozené Štěpánek z Vlkovce čp. 6, a Anna Pokorná, domovem v Hradišťku čp. 21, dcera Josefa Pokorného a Barbory. Ženich je zapsán jako devatenáctiletý a nevěsta jako šestnáctiletá. Shoda jmen rodičů, obcí a domů s křtem jejich dcery Anny Drožové z roku 1863 dokl
