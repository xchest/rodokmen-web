sh_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"cbrod_snatek_josef_prochazka_karolina_ulrichova_1919","label":"Sňatek Josefa Procházky a Karoliny Ulrichové","url":"https://ebadatelna.soapraha.cz/d/4814/230","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 6. 1919","summary":"Josef Procházka, pekařský dělník u střeleckého pluku č. 10, a Karolina Marie Ulrichová, oba Český Brod č. 158, oddáni 16. 6. 1919 u sv. Gotharda s prominutím ohlášek, protože ženich byl povolán do vojenské služby. Oddací zápis uvádí u nevěsty rodiče Josefa Ulricha, dělníka v Českém Brodě, a Antonii rozenou Dlouhou z Českého Brodu. Pravý přípis uvádí narození nevěsty 6. 7. 1896 v Mochově podle křestního listu farního úřadu v Bříství; tento citovaný list nebyl samostatně otevřen. Rodné číslo domu v oddacím zápisu zůstává nejisté. Datum se zatím nepřenáší na profil Karly Marie z rodinného listu, který uvádí Mochov čp. 38. Svědkem byl Jiří Soukup, strojník v cukrovaru, Český Brod čp. 318. Sňatek byl oznámen farnímu úřadu v Bříství 17. června 1919 pod č. 362."},{"key":"rodinny_krestni_list_jaroslav_prochazka_1919","label":"J line":"","years":"* 24. 2. 1901","status":"doc","private":false,"facts":["* 24. 2. 1901 Český Brod čp. 47","1920 odpadl k bezvyznání","výrobce cementového zboží, Český Brod čp. 651","× Marie Majerová","23. 2. 1927 ohlásil živnost výroby cementového zboží — rodinný živnostenský list","2. 5. 1927 vydán živnostenský list okresní správou politickou v Českém Brodě"],"note":"Křest přečten přímo. Otcem Jaroslava * 1929 podle výpisu z rodného rejstříku vydaného 1943 (rodinný doklad, čteno z fotky); datum narození se v obou shoduje. Přípis na křtu „19/8 1928 č. 417“ může souviset se sňatkem (AI hypotéza). Sňatek ani úmrtí zatím nenalezeny. Fotka2 živnostenského listu osobně přečtena rootem5.11.2026: ohlášení23.2.1927 a vydání2.5.1927. List uvádí pouze rok1901 a ČeskýBrod, sám nepotvrzuje přesný den narození ani čp651; přesná provozovna je vybledlá. Tento životní detail je rodinný dokument, nikoli nový matriční zápis. Prameny: Matriční zápis: Křest Josefa Mejstříka; Rodinná listina: JosefMejstřík — živnostenský list1927; Rodinná listina: Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943; Rodinná listina: Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","sources":[{"key":"brod_krest_josef_mejstrik_1901","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/180","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 2. 1901","summary":"Josef se narodil 24. února a byl pokřtěn 3. března 1901 v Českém Brodě čp. 47 koláři Antonínu Mejstříkovi * 16. 10. 1862 v Janovické Lhotě a Anně Drožové * 22. 8. 1863 v Hradišťku, oddaným v Kounicích 24. 7. 1893. Datum narození se shoduje s výpisem z rodného rejstříku jeho syna Jaroslava z roku 1943. Přípis: odpadl k bezvyznání, zápis okresního hejtmanství 16. 1. 1920 č. 966; další přípis s datem 19. 8. 1928 č. 417 (význam neověřen)."},{"key":"rodinny_zivnostensky_list_josef_mejstrik_1927","label":"JosefMejstřík — živnostenský list1927","url":"","kind":"J","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"2. 5. 1927","summary":"Živnostenský list vydaný 2. 5. 1927 uvádí Josefa Mejstříka, narozeného roku 1901, příslušného a bydlícího v Českém Brodě. Dne 23. 2. 1927 ohlásil výrobu cementového zboží. Přesná adresa provozovny je vybledlá; rodiče, manželka a den narození nejsou uvedeny. Jde o rodinný dokument."},{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"26. 7. 1929","summary":"Výpis vydaný 15. 7. 1943 uvádí narození Jaroslava Mejstříka 26. 7. 1929 v Českém Brodě čp. 651, manželské zrození a bez vyznání. Otec Josef Mejstřík, výrobce cementového zboží v Českém Brodě čp. 651, narozený 24. 2. 1901 v Českém Brodě, syn Antonína Mejstříka, koláře v Českém Brodě, a Anny; její rodné příjmení v německém poli čteno nejistě jako Drož. Matka Marie rozená Majerová, narozená 12. 12. 1906 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Maje Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."},{"key":"petrovice_krest_stanislav_frantisek_mrkvicka_1920","label":"Křest Stanislava Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01870.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 8. 1920","summary":"Stanislav František, Petrovice č. 28, syn Františka Mrkvičky * 2. 11. 1873, rolníka, a Matildy * 14. 6. 1894, dcery Josefa Julise, domkaře v Žubří. Rodiče oddáni v Olešné 23. 9. 1919."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Majerové. Matka Božena Mejstříková rozená Mrkvičková, narozená 28. 3. 1929 v Petrovicích, okres Žďár, dcera Františka Mrkvičky a doslova Matyldy rozené Tulisové. Bydliště obou rodičů Český Brod čp. 651 je odděleno od Alenina rodného domu čp. 297. Rodinný úřední doklad (fam), nikoli nový digitalizovaný prvopis matriky. Ztotožnění Matyldy Tulisové s matriční Matildou Julisovou je dosavadní silný AI závěr ze shody rodiny, nikoli prokázaná písařská chyba."}],"provenance":"Matriční zápis; Rodinná listina","birth_date":"1873-11-02"},"p23":{"id":"p23","pid":23,"name":"Matilda (Matylda) Julisová","display_name":"Matilda (Matylda) Julisová","maiden_line":"","years":"* 14. 6. 1894","status":"doc","private":false,"facts":["* 14. 6. 1894 Žubří čp. 33","× 23. 9. 1919 Olešná, František Mrkvička","Petrovice čp. 28","Při sňatku 1919 svobodná; u rodičů v Žubří čp. 33"],"note":"Oddací zápis z 23. 9. 1919 výslovně uvádí, že oba její rodiče tehdy žili. Druhá žena Františka, o 21 let mladší. Původní křest 1894 přímo jmenuje rodiče Josefa Julise, domkáře v Žubří, a Marii roz. Komínkovou i jejich rodiče. Matkou Boženy podle rodného listu její dcery 1955, kde stojí „Matylda roz. Tulisová“; ztotožnění s Julisovou je AI závěr ze shody jmen, místa a manžela, nikoli potvrzená písařská chyba. Děti z matrik: Stanislav František 1920, Marie Matilda 1921 († 1922), Božena Milada 1922 († 1923). Prameny: Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Druhý sňatek Františka Mrkvičky s Matildou Julisovou; Matriční zápis: Křest Stanislava Františka Mrkvičky; Matriční zápis: Křest Marie Matildy Mrkvičkové; Matriční zápis: Křest Boženy Milady Mrkvičkové; Rodinná listina: Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","sources":[{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny, v matčině rubrice zapsané „roz. Kubasta“. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"zubri_snatek_frantisek_mrkvicka_matilda_julisova_1919","label":"Druhý sňatek Františka Mrkvičky s Matildou Julisovou","url":"https://www.mza.cz/actapublica/matrika/detail/10726?image=216000010-000253-003380-000000-016001-000000-00-B00320-00940.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 9. 1919","summary":"František Mrkvička, rolník a vdovec z Petrovic čp. 28, nar. 2. 11. 1873, se 23. září 1919 v Olešné oženil s Matildou Julisovou ze Zubří čp. 33, nar. 14. 6. 1894, dcerou domkaře Josefa Juliše a Marie roz. Komínkové. Tím je doložen vztah vdovce a mladší nevěsty z rodinného vyprávění. Nevěsta byla při sňatku svobodná a bydlela u rodičů v Žubří čp. 33; u jejích rodičů je výslovně uvedeno, že oba žijí. Oddával je Jan Procházka, farář v Olešné."},{"key":"petrovice_krest_stanislav_frantisek_mrkvicka_1920","label":"Křest Stanislava Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01870.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 8. 1920","summary":"Stanislav František, Petrovice č. 28, syn Františka Mrkvičky * 2. 11. 1873, rolníka, a Matildy * 14. 6. 1894, dcery Josefa Julise, domkaře v Žubří. Rodiče oddáni v Olešné 23. 9. 1919."},{"key":"petrovice_krest_marie_matilda_mrkvickova_1921","label":"Křest Marie Matildy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 8. 1921","summary":"Marie Matilda, Petrovice č. 28, dcera Františka Mrkvičky a Matildy Julisové. Dítě zemřelo 4. 3. 1922."},{"key":"petrovice_krest_bozena_milada_mrkvickova_1922","label":"Křest Boženy Milady Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01910.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 12. 1922","summary":"Božena Milada, dcera Františka Mrkvičky, rolníka v Petrovicích čp. 28, a Matyldy, dcery Josefa Julise, domkaře v Žubří. Dítě zemřelo 14. 1. 1923. Rodiče oddáni v Olešné 23. 9. 1919."},{"key":"rodinny_rodny_list_alena_mejstrikova_1955","label":"Alena Mejstříková, narození 20. 1. 1955 Český Brod čp. 297 — rodný list vydán 8. 2. 1955","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"20. 1. 1955","summary":"Rodný list vydaný 8. 2. 1955 v Českém Brodě uvádí Alenu Mejstříkovou narozenou 20. 1. 1955 v Českém Brodě čp. 297. Otec Jaroslav Mejstřík, narozený 26. 7. 1929 v Českém Brodě, řidič ČSAD, syn Josefa Mejstříka a Marie rozené Majerové. Matka Božena Mejstříková rozená Mrkvičková, narozená 28. 3. 1929 v Petrovicích, okres Žďár, dcera Františka Mrkvičky a doslova Matyldy rozené Tulisové. Bydliště obou rodičů Český Brod čp. 651 je odděleno od Alenina rodného domu čp. 297. Rodinný úřední doklad (fam), nikoli nový digitalizovaný prvopis matriky. Ztotožnění Matyldy Tulisové s matriční Matildou Julisovou je dosavadní silný AI závěr ze shody rodiny, nikoli prokázaná písařská chyba."}],"provenance":"Matriční zápis; Rodinná listina","birth_date":"1894-06-14"},"p32":{"id":"p32","pid":32,"name":"Josef Procházka","display_name":"Josef Procházka","maiden_line":"","years":"* 9. 3. 1854","status":"doc","private":false,"facts":["Před Marií byl ženat s Kateřinou Procházkovou, která zemřela 13. 9. 1884 v Českém Brodě čp. 90.","dělník v Českém Brodě — křest syna1896 a list vnuka1919","Český Brod čp. 30 — rodinný rukopis6","* a křest 9. 3. 1854 Samechov čp. 18 — vlastní křest","v pozdějším sňatku1893 uvedeno narození 5. 5. 1854; tento údaj zůstává doslovně u pramene","syn Marie Procházkové — vlastní křest a oba oddací zápisy","× 16. 11. 1885 Marie Bláhovcová — v zápisu vdovec","× 9. 1. 1893 Barbora Turková — matrika tuklatské farnosti pro Břežany","při sňatku1893 bydlel v Českém Brodě čp. 250 a byl vdovcem po Marii Slavíkové z Lojovic","v červenci 1892 dělník v Českém Brodě čp. 115 — úmrtí manželky Marie a desetidenní dcery Marie","otec Marie * 15. 7. 1892, křest 18. 7. 1892, Český Brod čp. 115"],"note":"Vlastní křest v Samechově čp.18 dokládá narození i křest 9.3.1854, nemanželský původ a matku Marii Procházkovou; datum potvrzuje také oddací zápis1885. Tentýž sázavský křestní list č.143, vydaný 5.5.1881, je jmenován ve sňatcích1885 i1893 a podpírá totožnost osoby. Oddací zápis1893 však doslovně uvádí narození5.5.1854; shoda dne a měsíce s datem vydání listiny je pouze stopa možné přenosové chyby, nikoli prokázané vysvětlení. Oba oddací zápisy uvádějí Josefa jako syna Marie a vnuka Františka Procházky a Anny Kolmanové. Jan Hrdlička je pozdější Mariin manžel; není biologickým otcem. Sňatek1885 výslovně označuje Josefa za vdovce a odkazuje na úmrtí manželky Kateřiny na fol.135. Křest dcery Marie1892 vynechává jednu generaci v Josefově filiaci; rozpor zůstává v přepisu. Není sloučen se stejnojmenným synem ani kmotrem1949. Úmrtí neznámo. Prameny: Matriční zápis: Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18; Matriční zápis: Křest Josefa Procházky; Rodinná listina: Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list; Rodinný rodokmen: Rodinný rukopis Procházkových — data Jaroslavů a starší generace; Matriční zápis: Sňatek Josefa Procházky a Barbory Turkové; Matriční zápis: Úmrtí Marie Procházkové, rozené Slavíkové; Matriční zápis: Úmrtí desetidenní Marie Procházkové; Matriční zápis: Narození a křest Marie Procházkové; Matriční zápis: Sňatek Josefa Procházky a Marie Bláhovcové; Matriční zápis: Úmrtí Kateřiny Procházkové, manželky Josefa","sources":[{"key":"samechov_krest_josef_prochazka_1854","label":"Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18","url":"https://ebadatelna.soapraha.cz/d/11553/392","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 3. 1854","summary":"Josef, narozený a pokřtěný 9. března 1854 v Samechově čp.18, dítě nemanželské, otec v zápisu chybí. Matka Marie Procházková, dcera Františka Procházky, půlsedláka ze Samechova čp.18, a Anny roz. Kollmannové z Pyskočel. Shodný den 9.3.1854 čte i oddací zápis1885; oba sňatky1885 a1893 jmenují tentýž sázavský křestní list č.143 vydaný 5.5.1881. Sňatek1893 doslovně uvádí narození 5.5.1854; rozpor zůstává citován podle pramenů, profilové datum se opírá o vlastní křest."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"rodinny_krestni_list_jaroslav_prochazka_1919","label":"Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"16. 12. 1919","summary":"Rodinný list vydaný 2. 9. 1942 uvádí narození Jaroslava 16. 12. 1919 v Českém Brodě čp. 158, křest 25. 12. 1919, otce Josefa Procházku, pekaře narozeného v Českém Brodě čp. 30, a matku Karlu Marii Ulrichovou narozenou v Mochově čp. 38. Otcovi rodiče jsou Josef Procházka, dělník v Českém Brodě, a Barbora Turková z Kounic; matčini rodiče Josef Ulrich, dělník v Českém Brodě, a Antonie Dlouhá z Českého Brodu. Rodný dům matky čp. 38 není automaticky ztotožněn s kandidátkou z Mochova čp. 58. List dále uvádí křtitele Aloise a kmotry Karla a Anastazii, oba s údajem Český Brod. Jejich příjmení a další část těchto polí nejsou bezpečně přečteny."},{"key":"rodinny_rukopis_prochazkovi_fotka6","label":"Rodinný rukopis Procházkových — data Jaroslavů a starší generace","url":"","kind":"J","source_kind":"family_tree","provenance":"Rodinný rodokmen","date":"Datum sestavení neuvedeno","summary":"Rodinný rukopis uvádí mladšího Jaroslava narozeného 19. 6. 1949 a staršího Jaroslava narozeného 16. 12. 1919, zemřelého 17. 9. 1976. Dále Josefa Procházku, pekaře z Českého Brodu čp. 30, a Karlu Marii rozenou Ulrichovou z Mochova; ve starší generaci Josefa Procházku, dělníka z Českého Brodu čp. 30, a Barboru rozenou Turkovou z Kounic. Jde o rodinný údaj. Rukopisný rok 19119 je přepisován jako 1919 ve shodě s rodinným křestním listem. Ve vedlejší odbočce „BRATR ZDENĚK“ jsou zapsány značky * 19. 12. 1929 a † 1964. Příjmení ani rodiče nejsou v odbočce rozepsáni; přesné přiřazení osoby zůstává otevřené."},{"key":"tuklaty_snatek_josef_prochazka_barbora_turkova_1893","label":"Sňatek Josefa Procházky a Barbory Turkové","url":"https://ebadatelna.soapraha.cz/d/11314/45","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 1. 1893","summary":"Zápis v matrice tuklatské farnosti pro Břežany dokládá sňatek Josefa Procházky a Barbory Turkové dne 9. 1. 1893. Josef je uveden jako vdovec po Marii Slavíkové z Lojovic a jako bydlící v Českém Brodě čp. 250; Barbora jako svobodná služebná v Břežanech čp. 1. Josef je synem Marie Procházkové, provdané za Jana Hrdličku; zápis Jana neoznačuje za Josefova biologického otce. Barbora je dcerou Rosalie Turkové, dcery zemřelého Matěje Turka, dělníka z Kounic. Poznámka podle předloženého úmrtního listu uvádí, že Josef byl vdovcem od 18. 7. 1892; místo úmrtí Marie ani její vlastní úmrtní originál tento pramen nedokládá. Svědci jsou Josef Pávek z Břežan a František Ehrenwirth z Tuklat; rozporně čtená povolání a přesný konec druhého příjmení nejsou přijaty jako jistota."},{"key":"cbrod_umrti_marie_prochazkova_slavikova_1892","label":"Úmrtí Marie Procházkové, rozené Slavíkové","url":"https://ebadatelna.soapraha.cz/d/4813/34","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"18. 7. 1892","summary":"Zápis 62 dokládá, že Marie Procházková, rozená Slavíková z Lojovic, manželka dělníka Josefa Procházky, zemřela 18. 7. 1892 v Českém Brodě čp. 115 ve věku 31 let a byla pohřbena 20. 7. v Českém Brodě. Příčinou bylo vysílení následkem vykrvácení po porodu. Zápis ji uvádí také jako vdovu po zemřelém Františku Bláhovi, dělníku v Českém Brodě, a obsahuje údaj „vdaná 6 let“; z tohoto údaje se bez oddacího originálu nedopočítává datum sňatku."},{"key":"cbrod_umrti_marie_prochazkova_dcera_1892","label":"Úmrtí desetidenní Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4813/34","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 7. 1892","summary":"Zápis 64 dokládá, že Marie Procházková zemřela 25. 7. 1892 v Českém Brodě čp. 115 ve věku 10 dnů a byla pohřbena 27. 7. v Českém Brodě. Byla dcerou dělníka Josefa Procházky a zemřelé Marie rozené Slavíkové z Lojovic. Přesný den narození se z věku nedopočítává bez vlastního křestního nebo rodného zápisu."},{"key":"cbrod_krest_marie_prochazkova_1892","label":"Narození a křest Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4809/263","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 7. 1892","summary":"Vlastní zápis dokládá narození Marie Procházkové 15. 7. a křest 18. 7. 1892, katolické vyznání, ženské pohlaví, manželský původ a Český Brod čp. 115; přípis uvádí úmrtí 25. 7. 1892. Rodiči jsou Josef Procházka a Marie, narozená v Lojovicích, dcera Jana Slavíka a Doroty rozené Brabcové z Řepčic. Matčina rubrika používá pro jejího dřívějšího manžela tvary Bláhovcová / po Františku Bláhovci, zatímco úmrtní zápis 1892 čte Bláha; varianty zůstávají spojeny s jedním doloženým dřívějším manželem do nalezení jejich sňatku. Otcovská rubrika označuje Josefa za syna Františka a Anny, ale jeho vlastní oddací zápis 1893 jej označuje za syna Marie a vnuka Františka a Anny. Obě pramenná znění jsou zachována; tento zápis nemění Josefovu filiaci."},{"key":"cbrod_snatek_josef_prochazka_marie_blahovcova_1885","label":"Sňatek Josefa Procházky a Marie Bláhovcové","url":"https://ebadatelna.soapraha.cz/d/4811/116","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 11. 1885","summary":"První zápis na foliu116 přímo dokládá sňatek vdovce Josefa Procházky a vdovy Marie Bláhovcové 16.11.1885. Josef byl dělník v Českém Brodě čp.173, syn Marie, dcery Františka Procházky a Anny Kolmanové, narozený 9.3.1854. Předložil sázavský křestní list č.143 vydaný 5.5.1881; datum vydání není datem křtu. Odkaz na úmrtní folio135 vede ke Kateřině, Josefově předchozí manželce. Marie byla vdova po Františku Bláhovcovi, bydlela v Českém Brodě čp.110 a byla dcerou Jana Slavíka a Doroty Brabcové; odkaz na folio150 vede k Františkovu úmrtí. Datum 29.10.1885 je datum vydání Mariina křestního listu, nikoli datum křtu."},{"key":"cbrod_umrti_katerina_prochazkova_1884","label":"Úmrtí Kateřiny Procházkové, manželky Josefa","url":"https://ebadatelna.soapraha.cz/d/4812/136","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 9. 1884","summary":"Zápis81 na foliu135 dokládá, že Kateřina Procházková, manželka Josefa Procházky v Českém Brodě čp.90, zemřela 13.9. a byla pohřbena 15.9.1884 ve věku27 let. Rodné příjmení a místo původu nejsou přijaty. Josefův oddací zápis1885 odkazuje právě na toto folio a označuje jej za vdovce."}],"provenance":"Matriční zápis; Rodinná listina; Rodinný rodokmen","birth_date":"1854-03-09"},"p33":{"id":"p33","pid":33,"name":"Barbora Turková","display_name":"Barbora Turková","maiden_line":"","years":"* 6. 5. 1862","status":"doc","private":false,"facts":["Narodila se 6. května 1862 v Kounicích.","Pokřtěna byla 7. května 1862.","Matkou byla Rosalie Turková z Kounic.","× 9. 1. 1893 Josef Procházka — matrika tuklatské farnosti pro Břežany","při sňatku svobodná služebná v Břežanech čp. 1"],"note":"Vlastní křestní zápis Barbory uvádí jméno matky Rosalie. Sloupec pro otce je prázdný. Křestní zápis syna Josefa z roku 1896 potvrzuje Barbořino datum a místo narození a jmenuje její matku Rosalii i děda Matěje Turka. Oddací zápis1893 potvrzuje sňatek s Josefem Procházkou a tehdejší službu i bydliště v Břežanech čp.1. Prameny: Matriční zápis: Barbora Turková, narození 6. a křest 7. května 1862 v Kounicích; Matriční zápis: Křest Josefa Procházky; Rodinná listina: Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list; Rodinný rodokmen: Rodinný rukopis Procházkových — data Jaroslavů a starší generace; Matriční zápis: Sňatek Josefa Procházky a Barbory Turkové","sources":[{"key":"kounice_krest_barbora_turkova_1862","label":"Barbora Turková, narození 6. a křest 7. května 1862 v Kounicích","url":"https://ebadatelna.soapraha.cz/d/7070/185","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 5. 1862","summary":"V posledním řádku strany 183 je zapsána Barbora, narozená 6. května a pokřtěná 7. května 1862. Její matkou byla Rosalie Turková. Matrika jmenuje také Rosaliiny rodiče, zemřelého nádeníka Matěje Turka z Kounic a zemřelou Annu. Rodné příjmení Anny zůstává otevřené."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"rodinny_krestni_list_jaroslav_prochazka_1919","label":"Jaroslav Procházka, narození16.12.1919 Český Brod158 — křestní a rodný list","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"16. 12. 1919","summary":"Rodinný list vydaný 2. 9. 1942 uvádí narození Jaroslava 16. 12. 1919 v Českém Brodě čp. 158, křest 25. 12. 1919, otce Josefa Procházku, pekaře narozeného v Českém Brodě čp. 30, a matku Karlu Marii Ulrichovou narozenou v Mochově čp. 38. Otcovi rodiče jsou Josef Procházka, dělník v Českém Brodě, a Barbora Turková z Kounic; matčini rodiče Josef Ulrich, dělník v Českém Brodě, a Antonie Dlouhá z Českého Brodu. Rodný dům matky čp. 38 není automaticky ztotožněn s kandidátkou z Mochova čp. 58. List dále uvádí křtitele Aloise a kmotry Karla a Anastazii, oba s údajem Český Brod. Jejich příjmení a další část těchto polí nejsou bezpečně přečteny."},{"key":"rodinny_rukopis_prochazkovi_fotka6","label":"Rodinný rukopis Procházkových — data Jaroslavů a starší generace","url":"","kind":"J","source_kind":"family_tree","provenance":"Rodinný rodokmen","date":"Datum sestavení neuvedeno","summary":"Rodinný rukopis uvádí mladšího Jaroslava narozeného 19. 6. 1949 a staršího Jaroslava narozeného 16. 12. 1919, zemřelého 17. 9. 1976. Dále Josefa Procházku, pekaře z Českého Brodu čp. 30, a Karlu Marii rozenou Ulrichovou z Mochova; ve starší generaci Josefa Procházku, dělníka z Českého Brodu čp. 30, a Barboru rozenou Turkovou z Kounic. Jde o rodinný údaj. Rukopisný rok 19119 je přepisován jako 1919 ve shodě s rodinným křestním listem. Ve vedlejší odbočce „BRATR ZDENĚK“ jsou zapsány značky * 19. 12. 1929 a † 1964. Příjmení ani rodiče nejsou v odbočce rozepsáni; přesné přiřazení osoby zůstává otevřené."},{"key":"tuklaty_snatek_josef_prochazka_barbora_turkova_1893","label":"Sňatek Josefa Procházky a Barbory Turkové","url":"https://ebadatelna.soapraha.cz/d/11314/45","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 1. 1893","summary":"Zápis v matrice tuklatské farnosti pro Břežany dokládá sňatek Josefa Procházky a Barbory Turkové dne 9. 1. 1893. Josef je uveden jako vdovec po Marii Slavíkové z Lojovic a jako bydlící v Českém Brodě čp. 250; Barbora jako svobodná služebná v Břežanech čp. 1. Josef je synem Marie Procházkové, provdané za Jana Hrdličku; zápis Jana neoznačuje za Josefova biologického otce. Barbora je dcerou Rosalie Turkové, dcery zemřelého Matěje Turka, dělníka z Kounic. Poznámka podle předloženého úmrtního listu uvádí, že Josef byl vdovcem od 18. 7. 1892; místo úmrtí Marie ani její vlastní úmrtní originál tento pramen nedokládá. Svědci jsou Josef Pávek z Břežan a František Ehrenwirth z Tuklat; rozporně čtená povolání a přesný konec druhého příjmení nejsou přijaty jako jistota."}],"provenance":"Matriční zápis; Rodinná listina; Rodinný rodokmen","birth_date":"1862-05-06"},"p34":{"id":"p34","pid":34,"name":"Josef Ulrich","display_name":"Josef Ulrich","maiden_line":"","years":"","status":"fam","private":false,"facts":["dělník v Českém Brodě — list vnuka1919"],"note":"Otec Karly Marie P17 výslovně jmenovaný v rodinném křestním listu Jaroslava1919. Při opětovném osobním čtení plného snímku8 dne5.11.2026 ve22:50 opraveno povolání na dělník v Českém Brodě; původní sedlák bylo chybné čtení. Přesná životní data, vlastní rodiče a sňatek neznámy; fam. Samotná shoda andova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."},{"key":"kounice_snatek_antonin_mejstrik_anna_drozova_1893","label":"Sňatek Antonína Mejstříka a Anny Drožové","url":"https://ebadatelna.soapraha.cz/d/14350/63","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 7. 1893","summary":"V Kounicích se 24. července 1893 vzali Antonín Mejstřík, kolářský dělník z čp. 52, syn Josefa Mejstříka z Janovické Lhoty čp. 29 a Kateřiny rozené Brožkové, a Anna Drožová, dcera Františka Drože, šafáře v Chrášťanech, a Anny rozené Pokorné z Hradišťka čp. 21. U snoubenců jsou dopsána data narození 16. 10. 1862 a 22. 8. 1863. Totožnost s rodiči Josefa Mejstříka narozeného 1901 podporuje shoda jmen, sňatku a rodičů v jeho křtu."},{"key":"brod_krest_josef_mejstrik_1896","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/6","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 2. 1896","summary":"Josef se narodil 3. a byl pokřtěn 9. února 1896 v Českém Brodě čp. 145/146 kolářskému dělníkovi Antonínu Mejstříkovi * 16. 10. 1862 a Anně Drožové * 22. 8. 1863 z Hradiška, oddaným v Kounicích 24. 7. 1893. U jména je přípis o úmrtí 18. 11. 1896, Tom XXIV, fol. 110 (AI čtení)."},{"key":"brod_krest_frantisek_mejstrik_1897","label":"Křest Františka Serafína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/81","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"4. 9. 1897","summary":"František Serafín se narodil 4. a byl pokřtěn 12. září 1897 v Českém Brodě čp. 145/146 kolářskému dělníkovi Antonínu Mejstříkovi a Anně Drožové. Že jde o Františka Mejstříka ze sňatku 1941, plyne ze shody data narození. Otcovství vůči Miroslavu Mejstříkovi doloženo není (AI hypotéza, neověřeno)."},{"key":"brod_krest_josef_mejstrik_1901","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/180","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 2. 1901","summary":"Josef se narodil 24. února a byl pokřtěn 3. března 1901 v Českém Brodě čp. 47 koláři Antonínu Mejstříkovi * 16. 10. 1862 v Janovické Lhotě a Anně Drožové * 22. 8. 1863 v Hradišťku, oddaným v Kounicích 24. 7. 1893. Datum narození se shoduje s výpisem z rodného rejstříku jeho syna Jaroslava z roku 1943. Přípis: odpadl k bezvyznání, zápis okresního hejtmanství 16. 1. 1920 č. 966; další přípis s datem 19. 8. 1928 č. 417 (význam neověřen)."},{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_document_extract","provenance":"Rodinná listina","date":"26. 7. 1929","summary":"Výpis vydaný 15. 7. 1943 uvádí narození Jaroslava Mejstříka 26. 7. 1929 v Českém Brodě čp. 651, manželské zrození a bez vyznání. Otec Josef Mejstřík, výrobce cementového zboží v Českém Brodě čp. 651, narozený 24. 2. 1901 v Českém Brodě, syn Antonína Mejstříka, koláře v Českém Brodě, a Anny; její rodné příjmení v německém poli čteno nejistě jako Drož. Matka Marie rozená Majerová, narozená 12. 12. 1906 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."}],"provenance":"Matriční zápis; Rodinná listina","birth_date":"1862-10-16"},"p41":{"id":"p41","pid":41,"name":"Anna Drožová","display_name":"Anna Drožová","maiden_line":"","years":"* 22. 8. 1863","status":"doc","private":false,"facts":["* 22. 8. 1863 Hradišťko čp. 21","× 24. 7. 1893 Kounice, Antonín Mejstřík"],"note":"Ve výpisu z roku 1943 je vedle Antonína uvedena Anna, rodné příjmení čteno nejistě jako „Drož“; přesná podoba z tohoto listu není uzavřena. Kanonické příjmení Drožová vychází z ostatních připojených matričních pramenů. Ztotožnění křtu z roku 1863 a nevěsty z roku 1893 plyne ze shody data narození, obce a rodičů. Dcera Františka Drože, šafáře v Chrášťanech, a Anny roz. Pokorné z Hradišťka čp. 21. Prameny: Matriční zápis: Narození Anny Drožové v Hradišťku; Matriční zápis: Sňatek Antonína Mejstříka a Anny Drožové; Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Křest Františka Serafína Mejstříka; Matriční zápis: Křest Josefa Mejstříka; Rodinná listina: Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","sources":[{"key":"sadska_krest_anna_drozova_1863","label":"Narození Anny Drožové v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/11503/83","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 8. 1863","summary":"Anna Drožová se narodila 22. srpna 1863 v Hradišťku čp. 21 a byla pokřtěna 23. srpna. Rodiči jsou František Drož a Anna rozená Pokorná. Zápis dále jmenuje rodiče Františka: Františka Drože, gruntovníka v Břežanech čp. 56, a Barboru rozenou Štěpánek z Vlkovce čp. 6; rodiče Anny: Josefa Pokorného, výminkáře v Hradišťku čp. 21, a zemřelou Barboru. Rodné příjmení druhé Barbory není bezpečně přečteno. Stejné datum, rodiče a obec jsou uvedeny u nevěsty Anny Drožové při sňatku s Antonínem Mejstříkem roku 1893."},{"key":"kounice_snatek_antonin_mejstrik_anna_drozova_1893","label":"Sňatek Antonína Mejstříka a Anny Drožové","url":"https://ebadatelna.soapraha.cz/d/14350/63","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 7. 1893","summary":"V Kounicích se 24. července 1893 vzali Antonín Mejstřík, kolářský dělník z čp. 52, syn Josefa Mejstříka z Janovické Lhoty čp. 29 a Kateřiny rozené Brožkové, a Anna Drožová, dcera Františka Drože, šafáře v Chrášťanech, a Anny rozené Pokorné z Hradišťka čp. 21. U snoubenců jsou dopsána data narození 16. 10. 1862 a 22. 8. 1863. Totožnost s rodiči Josefa Mejstříka narozeného 1901 podporuje shoda jmen, sňatku a rodičů v jeho křtu."},{"key":"brod_krest_josef_mejstrik_1896","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/6","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 2. 1896","summary":"Josef se narodil 3. a byl pokřtěn 9. února 1896 v Českém Brodě čp. 145/146 kolářskému dělníkovi Antonínu Mejstříkovi * 16. 10. 1862 a Anně Drožové * 22. 8. 1863 z Hradiška, oddaným v Kounicích 24. 7. 1893. U jména je přípis o úmrtí 18. 11. 1896, Tom XXIV, fol. 110 (AI čtení)."},{"key":"brod_krest_frantisek_mejstrik_1897","label":"Křest Františka Serafína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/81","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"4. 9. 1897","summary":"František Serafín se narodil 4. a byl pokřtěn 12. září 1897 v Českém Brodě čp. 145/146 kolářskému dělníkovi Antonínu Mejstříkovi a Anně Drožové. Že jde o Františka Mejstříka ze sňatku 1941, plyne ze shody data narození. Otcovství vůči Miroslavu Mejstříkovi doloženo není (AI hypotéza, neověřeno)."},{"key":"brod_krest_josef_mejstrik_1901","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/180","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 2. 1901","summary":"Josef se narodil 24. února a byl pokřtěn 3. března 1901 v Českém Brodě čp. 47 koláři Antonínu Mejstříkovi * 16. 10. 1862 v Janovické Lhotě a Anně Drožové * 22. 8. 1863 v Hradišťku, oddaným v Kounicích 24. 7. 1893. Datum narození se shoduje s výpisem z rodného rejstříku jeho syna Jaroslava z roku 1943. Přípis: odpadl k bezvyznání, zápis okresního hejtmanství 16. 1. 1920 č. 966; další přípis s datem 19. 8. 1928 č. 417 (význam neověřen)."},{"key":"rodinny_vypis_jaroslav_mejstrik_1929","label":"Jaroslav Mejstřík, narození 26. 7. 1929 Český Brod 651 — výpis vydaný 15. 7. 1943","url":"","kind":"N","source_kind":"family_documen 6 v Přešticích, dcera Josefa Majera, šafáře v Přešticích, a Markéty rozené Kriegrové. Svědci Josef Majer, šafář v Přešticích čp. 212, a Jaroslav Picek, instalatér v Českém Brodě čp. 653. Porodní bába Anna Hroudová z Českého Brodu. Rodinná fotografie úředního výpisu, nikoli digitalizovaný prvopis. Svazek R VI/R VII a číslo jednací 2741(?)/29 zůstávají nejisté; svědecká role sama nezakládá příbuzenskou vazbu."}],"provenance":"Matriční zápis; Rodinná listina"},"p44":{"id":"p44","pid":44,"name":"František Mrkvička (starší)","display_name":"František Mrkvička (starší)","maiden_line":"","years":"* 1842","status":"doc","private":false,"facts":["* 6. 11. 1842 Petrovice","× 8. 8. 1870 Josefa Starých","domkář a tesař, Petrovice","roku 1870 uveden věk 27 let","legitimován následným sňatkem rodičů podle přípisu v knize narozených"],"note":"Narození 6. 11. 1842 čteno z MZA 15923, sn. 107. Jména rodičů Vincenc a Terezie se shodují s jeho sňatkem 1870, kde je mu 27 let; tím je ztotožnění silně podpořeno. Otec Františka * 1873 doložen vlastním sňatkem a křtem syna. Vlastní úmrtí nenalezeno; podle zápisu vdovy (AI ztotožnění) zemřel před 31. 7. 1912. Přípis pod jeho zápisem výslovně odkazuje na str. 11 oddací knihy, kde je sňatek rodičů z 27. 2. 1843. Prameny: Matriční zápis: Narození a křest Františka Mrkvičky staršího; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky; Matriční zápis: Sňatek Františka Mrkvičky a Marie Lukšové; Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové","sources":[{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích čp. 9 se 6. 11. 1842 narodil Franz (František), syn Vincence Mrkvičky a Terezie, dcery Johanna Sedláka, nádeníka v Diwischau. Pozdější přípis výslovně uvádí legitimaci sňatkem rodičů a odkazuje na stranu 11 oddací knihy. Jména rodičů a věk 27 let při Františkově sňatku v roce 1870 podporují jeho ztotožnění s tímto dítětem."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."},{"key":"petrovice_snatek_mrkvicka_luksova_1897","label":"Sňatek Františka Mrkvičky a Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00840.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 11. 1897","summary":"František Mrkvička * 2. 11. 1873, čtvrtník v Petrovicích č. 29, syn Františka Mrkvičky, tesaře, a Josefy roz. Starých, si vzal Marii Lukšovou * 5. 8. 1876 z Petrovic č. 28, dceru zemřelého Františka Lukše, rolníka, a Josefy roz. Šoškové. Při sňatku bydlela u své matky v Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."},{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého Johanna Sedláka, sedláka z Diwischau, a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842). Na tuto stranu 11 odkazuje přípis o legitimaci v synově zápisu narození."}],"provenance":"Matriční zápis"},"p45":{"id":"p45","pid":45,"name":"Josefa Starých","display_name":"Josefa Starých","maiden_line":"","years":"1846–1912","status":"doc","private":false,"facts":["* 10. 7. 1846 Petrovice čp. 3 (ztotožnění AI)","× 8. 8. 1870 František Mrkvička","roku 1870 uveden věk 24 let","† 31. 7. 1912 Petrovice čp. 29, vdova, 65 let, srdeční vada (ztotožnění AI)"],"note":"Matka Františka * 1873 doložena jeho křtem a vlastním sňatkem. Rodné příjmení v dobových tvarech Starý/Starých; zápis vnučky Josefy z roku 1904 uvádí Břežek. Rozpor zaznamenán; křest 1846 a sňatek rodičů 1841 podporují Starý. Křest z 10. 7. 1846 (MZA 15923, sn. 111) čten v prohlížeči; ztotožnění je AI hypotéza opřená o jméno, otce, obec a věk 24 let při sňatku. Úmrtí 1912 (MZA 15943, sn. 142, nízké rozlišení) uvádí vdovu po domkáři Františku Mrkvičkovi z čp. 29 bez rodného příjmení; ztotožnění je AI hypotéza. Rok narození tam 1847, výpočtem z věku kolem 8. 4. 1847 (AI odvození), o rok později než křest. Prameny: Matriční zápis: Křest Josefy Staré; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky; Matriční zápis: Sňatek Františka Mrkvičky a Marie Lukšové; Matriční zápis: Křest Josefy Mrkvičkové; Matriční zápis: Úmrtí Josefy Mrkvičkové","sources":[{"key":"petrovice_krest_josefa_stara_1846","label":"Křest Josefy Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01110.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 7. 1846","summary":"10. 7. 1846 byla v Petrovicích čp. 3 pokřtěna Josefa, dcera Josefa Starého. Sloupec matky je přepisovaný a jméno v něm není bezpečně čitelné; v popisu je Stary a vepsané Franz. Ztotožnění s Josefou, která se roku 1870 vdala za Františka Mrkvičku, je AI hypotéza opřená o jméno, otce, obec a věk 24 let."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."},{"key":"petrovice_snatek_mrkvicka_luksova_1897","label":"Sňatek Františka Mrkvičky a Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00840.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 11. 1897","summary":"František Mrkvička * 2. 11. 1873, čtvrtník v Petrovicích č. 29, syn Františka Mrkvičky, tesaře, a Josefy roz. Starých, si vzal Marii Lukšovou * 5. 8. 1876 z Petrovic č. 28, dceru zemřelého Františka Lukše, rolníka, a Josefy roz. Šoškové. Při sňatku bydlela u své matky v Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."},{"key":"petrovice_krest_josefa_mrkvickova_1904","label":"Křest Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01640.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 5. 1904","summary":"Josefa, Petrovice č. 29, dcera Františka Mrkvičky * 2. 11. 1873, krejčího, a Marie Lukšové * 5. 8. 1876. U babičky z otcovy strany je zde rozená Břežek, jinde Starý nebo Starých. Přípis o sňatku 5. 2. 1929 s Františkem Lukšem."},{"key":"petrovice_umrti_josefa_mrkvickova_1912","label":"Úmrtí Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/11617?image=216000010-000253-003380-000000-015943-000000-00-B11572-01420.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 7. 1912","summary":"Josefa Mrkvičková, vdova po domkáři Františku Mrkvičkovi z Petrovic čp. 29, zemřela 31. července 1912 na srdeční vadu a byla pohřbena 2. srpna. Uveden věk 65 let, 3 měsíce a asi 23 dní a rok narození 1847. Rodné příjmení zápis neuvádí; ztotožnění s Josefou Starých je AI hypotéza (jméno, manžel, povolání, dům)."}],"provenance":"Matriční zápis"},"p46":{"id":"p46","pid":46,"name":"Josef Julis","display_name":"Josef Julis","maiden_line":"","years":"* 1842","status":"doc","private":false,"facts":["* 9. 2. 1842 Branišov čp. 4, pokřtěn 10. 2.","× 13. 11. 1893 Žubří, Marie roz. Komínková","při sňatku 1893 vdovec, 51 let","domkář v Žubří čp. 33 (1894)"],"note":"Otec Matyldy Julisové * 1894. Ztotožnění křtu 1842 s ženichem 1893 je AI závěr ze shody obou rodičů (Martin Julis a Terezie rozená Brhel) a přesného věku 51 let při sňatku; žádný výslovný zpětný odkaz mezi zápisy zatím nemáme. Předchozí manželství plyne z označení vdovec; první manželka neurčena. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Druhý sňatek Františka Mrkvičky s Matildou Julisovou","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Na pravé straně 76 v oddílu roku 1842 je u Josepha (Josefa) uvedeno narození 9. února, křest 10. února a v rubrice „Haus Nro“ číslo 4. Otcem byl Martin Julis, domkář v Branišově, matkou Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Ztotožnění s Josefem Julisem, ženichem v Žubří roku 1893, je odvozené ze shody obou rodičů a věku 51 let při sňatku."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny, v matčině rubrice zapsané „roz. Kubasta“. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"zubri_snatek_frantisek_mrkvicka_matilda_julisova_1919","label":"Druhý sňatek Františka Mrkvičky s Matildou Julisovou","url":"https://www.mza.cz/actapublica/matrika/detail/10726?image=216000010-000253-003380-000000-016001-000000-00-B00320-00940.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 9. 1919","summary":"František Mrkvička, rolník a vdovec z Petrovic čp. 28, nar. 2. 11. 1873, se 23. září 1919 v Olešné oženil s Matildou Julisovou ze Zubří čp. 33, nar. 14. 6. 1894, dcerou domkaře Josefa Juliše a Marie roz. Komínkové. Tím je doložen vztah vdovce a mladší nevěsty z rodinného vyprávění. Nevěsta byla při sňatku svobodná a bydlela u rodičů v Žubří čp. 33; u jejích rodičů je výslovně uvedeno, že oba žijí. Oddával je Jan Procházka, farář v Olešné."}],"provenance":"Matriční zápis"},"p47":{"id":"p47","pid":47,"name":"Marie Komínková","display_name":"Marie Komínková","maiden_line":"","years":"","status":"doc","private":false,"facts":["× 14. 2. 1881 Žubří, Antonín Hemza","× 13. 11. 1893 Žubří, Josef Julis","při sňatku 1893 zapsána jako Marie Hemzová, vdova, 39 let","první manžel † Antonín Hemza, domkář v Žubří (zemřel před 13. 11. 1893)","Žubří čp. 33 (1893–1894)","Při sňatku 14. 2. 1881 uvedena jako svobodná, 26 let."],"note":"Matka Matyldy Julisové * 1894. Původní sňatek s Antonem Hemzou 1881, další sňatek s Josefem Julisem 1893 a Matyldin křest 1894 shodně jmenují Mariiny rodiče Františka Komínka, domkáře v Jiříkovicích, a Kateřinu, zapsanou „roz. Kubasta“. Ztotožnění nevěsty ze sňatků 1881 a 1893 je silný AI závěr ze shody jejího jména, rodičů a příjmení Hemzová po prvním manželovi. Antonín zemřel před 13. 11. 1893, datum jeho úmrtí zůstává neznámé. Marie pokřtěná v říjnu 1853 v Jiříkovicích čp. 21 zůstává kandidátkou. Při sňatku v roce 1881 je nevěstě 26 let a v roce 1893 jí je 39 let. Marii narozené v říjnu 1853 by tehdy bylo 27 a 40 let. V oddacím zápisu z roku 1881 je v samostatných rubrikách uvedena jako svobodná a ve věku 26 let; z údaje se neodvozuje datum narození ani rodný dům. Prameny: Matriční zápis: Sňatek Antonína Hemzy a Marie Komínkové v Žubří; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Druhý sňatek Františka Mrkvičky s Matildou Julisovou","sources":[{"key":"zubri_snatek_anton_hemza_marie_kominkova_1881","label":"Sňatek Antonína Hemzy a Marie Komínkové v Žubří","url":"https://matriky.online/brno/00016000/89/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 2. 1881","summary":"Pravá strana, oddíl Žubří. Dne 14. února 1881 se žení Anton Hemza, domkář v Žubří, s Marií Komínkovou, služkou v Žubří. Nevěsta je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Tato dvojice rodičů se shoduje s údaji o Marii Hemzové, rozené Komínkové, při jejím dalším sňatku s Josefem Julisem roku 1893. Ztotožnění obou oddacích zápisů je silný AI závěr ze shody obou jmen, prvního manžela a rodičů nevěsty. Ženichův sloupec uvádí otce Jana Hemzu a matku Františku. V samostatných oddacích rubrikách je Marie označena jako svobodná a její věk je 26 let. U sňatku je ženich zapsán s čp. 15 a nevěsta s čp. 51; tato čísla se nepřenášejí na rodiče, rodné domy ani jiné události. Věk ženicha se kvůli rozpornému čtení nepřebírá. Sňatek sám neurčuje Mariino datum narození ani datum Antonínova úmrtí."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny, v matčině rubrice zapsané „roz. Kubasta“. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"zubri_snatek_frantisek_mrkvicka_matilda_julisova_1919","label":"Druhý sňatek Františka Mrkvičky s Matildou Julisovou","url":"https://www.mza.cz/actapublica/matrika/detail/10726?image=216000010-000253-003380-000000-016001-000000-00-B00320-00940.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 9. 1919","summary":"František Mrkvička, rolník a vdovec z Petrovic čp. 28, nar. 2. 11. 1873, se 23. září 1919 v Olešné oženil s Matildou Julisovou ze Zubří čp. 33, nar. 14. 6. 1894, dcerou domkaře Josefa Juliše a Marie roz. Komínkové. Tím je doložen vztah vdovce a mladší nevěsty z rodinného vyprávění. Nevěsta byla při sňatku svobodná a bydlela u rodičů v Žubří čp. 33; u jejích rodičů je výslovně uvedeno, že oba žijí. Oddával je Jan Procházka, farář v Olešné."}],"provenance":"Matriční zápis"},"p65":{"id":"p65","pid":65,"name":"Marie Procházková","display_name":"Marie Procházková","maiden_line":"","years":"* 5. 10. 1835","status":"doc","private":false,"facts":["Křest 6. října 1835.","Rodiče František Procházka a Anna Kolmanová."],"note":"Marie se narodila 5. října 1835 v Samechově č. 9. Její syn Josef se narodil 9. března 1854 v domě č. 18. Později se provdala za Jana Hrdličku. Prameny: Matriční zápis: Křest Marie Procházkové ze Samechova čp. 9; Matriční zápis: Křest Josefa Procházky; Matriční zápis: Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18","sources":[{"key":"samechov_krest_marie_prochazkova_1835","label":"Křest Marie Procházkové ze Samechova čp. 9","url":"https://ebadatelna.soapraha.cz/d/11552/268","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"5.–6. 10. 1835","summary":"Primární křest: Marie se narodila 5. a byla pokřtěna 6. října 1835 v Samechově čp. 9. Otec František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Matka Anna je dcera Josefa Kolmana, šafáře z Fišbilu čp. 6, a Rozálie. Nejasná rodná příjmení Barbory a Rozálie ani Rozáliin původ se nepřijímají."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"samechov_krest_josef_prochazka_1854","label":"Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18","url":"https://ebadatelna.soapraha.cz/d/11553/392","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 3. 1854","summary":"Josef, narozený a pokřtěný 9. března 1854 v Samechově čp.18, dítě nemanželské, otec v zápisu chybí. Matka Marie Procházková, dcera Františka Procházky, půlsedláka ze Samechova čp.18, a Anny roz. Kollmannové z Pyskočel. Shodný den 9.3.1854 čte i oddací zápis1885; oba sňatky1885 a1893 jmenují tentýž sázavský křestní list č.143 vydaný 5.5.1881. Sňatek1893 doslovně uvádí narození 5.5.1854; rozpor zůstává citován podle pramenů, profilové datum se opírá o vlastní křest."}],"provenance":"Matriční zápis","birth_date":"1835-10-05"},"p67":{"id":"p67","pid":67,"name":"Rosalie Turková","display_name":"Rosalie Turková","maiden_line":"","years":"* 28. 2. 1835","status":"doc","private":false,"facts":["Matka Barbory Turkové z Kounic.","V Barbořině křestním zápisu jsou jako rodiče Rosalie uvedeni Matěj Turek a Anna.","Ve společné kolonce pro den narození a křtu je uveden 28. únor 1835."],"note":"Barbořin křestní zápis z roku 1862 jmenuje oba rodiče Rosalie. U obou je křížek označující úmrtí. Příjmení Rosaliiny matky Anny za svobodna se dosud nepodařilo bezpečně přečíst. Prameny: Matriční zápis: Barbora Turková, narození 6. a křest 7. května 1862 v Kounicích; Matriční zápis: Křest Josefa Procházky; Matriční zápis: Rosalie Turková, křestní zápis z Kounic, 28. února 1835","sources":[{"key":"kounice_krest_barbora_turkova_1862","label":"Barbora Turková, narození 6. a křest 7. května 1862 v Kounicích","url":"https://ebadatelna.soapraha.cz/d/7070/185","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 5. 1862","summary":"V posledním řádku strany 183 je zapsána Barbora, narozená 6. května a pokřtěná 7. května 1862. Její matkou byla Rosalie Turková. Matrika jmenuje také Rosaliiny rodiče, zemřelého nádeníka Matěje Turka z Kounic a zemřelou Annu. Rodné příjmení Anny zůstává otevřené."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"kounice_krest_rosalie_turkova_1835","label":"Rosalie Turková, křestní zápis z Kounic, 28. února 1835","url":"https://ebadatelna.soapraha.cz/d/7068/132","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 2. 1835","summary":"Ve společné kolonce pro den narození a křtu je uveden 28. únor 1835. Otcem byl Matěj Turek, nádeník z Kounic, syn Václava Turka a Alžběty. Matkou byla Anna, dcera Jana a Ludmily. Jména obou rodičů, místo a otcovo povolání odpovídají také zápisu o narození Rosaliiny dcery Barbory z roku 1862. V rubrice původu Alžběty je její otec uveden pouze křestním jménem Matěj. V rubrice původu Ludmily je její otec uveden pouze křestním jménem Tomáš."}],"provenance":"Matriční zápis","birth_date":"1835-02-28"},"p80":{"id":"p80","pid":80,"name":"Josef Mejstřík","display_name":"Josef Mejstřík","maiden_line":"","years":"* 1815","status":"doc","private":false,"facts":["* 14. 8. 1815 Janovická Lhota čp. 29","× 25. 2. 1840 Kateřina Brožková","zahradník, později rolník, Janovická Lhota čp. 29"],"note":"Otec Antonína podle křtu 1862 a křtů vnuků 1896, 1897, 1901. Totožnost křtu 1815 se ženichem 1840 plyne ze jména, domu a věku 25 let (AI závěr). Prameny: Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Sňatek Josefa Mejstříka a Kateřiny Brožkové; Matriční zápis: Křest Antonína Mejstříka","sources":[{"key":"lhota_krest_josef_mejstrik_1815","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13234/12","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 8. 1815","summary":"Josef se narodil 14. a byl pokřtěn 15. srpna 1815 ve Lhotě čp. 29 jako syn půlsedláka Josefa Mejstříka a Magdaleny Doudové ze Žandova. Rok potvrzuje rejstřík Uhlířské Janovice 24, sn. 101 (Lhotta 29, Tom VI, fol. 18)."},{"key":"lhota_snatek_josef_mejstrik_katerina_brozkova_1840","label":"Sňatek Josefa Mejstříka a Kateřiny Brožkové","url":"https://ebadatelna.soapraha.cz/d/13240/20","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 2. 1840","summary":"Josef Mejstřík, zahradník, 25 let, syn zahradníka Josefa Mejstříka ze Lhoty čp. 29 a Magdaleny rozené Doudové ze Žandova, se 25. února 1840 oženil s osmnáctiletou Kateřinou, dcerou chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z obce čtené jako Vranice(?) čp. 21. Otec nevěsty dal souhlas k sňatku nezletilé (AI čtení)."},{"key":"lhota_krest_antonin_mejstrik_1862","label":"Křest Antonína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13237/111","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 10. 1862","summary":"Antonín se narodil 16. a byl pokřtěn 17. října 1862 ve Lhotě čp. 29 u Uhlířských Janovic. Otec Josef Mejstřík, rolník, syn Josefa Mejstříka a Magdaleny Doudové ze Žandova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."}],"provenance":"Matriční zápis"},"p81":{"id":"p81","pid":81,"name":"Kateřina Brožková","display_name":"Kateřina Brožková","maiden_line":"","years":"* 1822","status":"doc","private":false,"facts":["Narozena roku 1822 v Kochánově č. 9. V zápisu je u narození 21. den a u křtu 22. den. Čtení měsíce zůstává otevřené.","× 25. 2. 1840 Josef Mejstřík","roku 1840 uveden věk 18 let","z Kochánova"],"note":"Dcera chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné. Původ Anny uvádí křest jejího vnuka roku 1862 jako „z Vranic“. Ve sňatku dcery roku 1840 je název rozdělen mezi dva řádky a následuje čp. 21. Vlastní křest uvádí oba rodiče. V dokladech z let 1840 a 1862 se shodují rodina a Kochánov č. 9. Prameny: Matriční zápis: Sňatek Josefa Mejstříka a Kateřiny Brožkové; Matriční zápis: Křest Antonína Mejstříka; Matriční zápis: Křest Kateřiny Brožkové v Kochánově roku 1822","sources":[{"key":"lhota_snatek_josef_mejstrik_katerina_brozkova_1840","label":"Sňatek Josefa Mejstříka a Kateřiny Brožkové","url":"https://ebadatelna.soapraha.cz/d/13240/20","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 2. 1840","summary":"Josef Mejstřík, zahradník, 25 let, syn zahradníka Josefa Mejstříka ze Lhoty čp. 29 a Magdaleny rozené Doudové ze Žandova, se 25. února 1840 oženil s osmnáctiletou Kateřinou, dcerou chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z obce čtené jako Vranice(?) čp. 21. Otec nevěsty dal souhlas k sňatku nezletilé (AI čtení)."},{"key":"lhota_krest_antonin_mejstrik_1862","label":"Křest Antonína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13237/111","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 10. 1862","summary":"Antonín se narodil 16. a byl pokřtěn 17. října 1862 ve Lhotě čp. 29 u Uhlířských Janovic. Otec Josef Mejstřík, rolník, syn Josefa Mejstříka a Magdaleny Doudové ze Žandova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."},{"key":"kochanov_krest_katerina_brozkova_1822","label":"Křest Kateřiny Brožkové v Kochánově roku 1822","url":"https://ebadatelna.soapraha.cz/d/13045/131","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1822","summary":"Kateřina se narodila roku 1822 v Kochánově č. 9. V rubrice je u narození 21. den a u křtu 22. den, čtení měsíce zůstává otevřené. Otec František Brožek, chalupník. Matka Anna byla dcerou Jana Pokorného, sedláka z Vranic, a Kateřiny."}],"provenance":"Matriční zápis"},"p82":{"id":"p82","pid":82,"name":"František Drož","display_name":"František Drož","maiden_line":"","years":"asi 1838","status":"doc","private":false,"facts":["× 17. 2. 1857 Hradišťko, Anna Pokorná","při sňatku 19 let a 1 měsíc, domovem Břežany čp. 56","hospodský, Hradišťko čp. 21 (1863)","šafář, Chrášťany (1893)"],"note":"Otec Anny Drožové * 1863. Vlastní sňatek 1857 výslovně jmenuje rodiče Františka Drože a Barboru; shoda s dceřiným křtem 1863 v rodičích, obcích a domech potvrzuje ztotožnění. Věk ve sňatku odpovídá narození přibližně v lednu 1838. Jde o odhad do vyhledání vlastního rodného zápisu. Prameny: Matriční zápis: Sňatek Františka Drože a Anny Pokorné v Hradišťku; Matriční zápis: Narození Anny Drožové v Hradišťku; Matriční zápis: Sňatek Antonína Mejstříka a Anny Drožové","sources":[{"key":"sadska_snatek_frantisek_droz_anna_pokorna_1857","label":"Sňatek Františka Drože a Anny Pokorné v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/13781/15","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 2. 1857","summary":"Dne 17. února 1857 se vzali František Drož, domovem v Břežanech čp. 56, syn Františka Drože a Barbory rozené Štěpánek z Vlkovce čp. 6, a Anna Pokorná, domovem v Hradišťku čp. 21, dcera Josefa Pokorného a Barbory. Ženichovi bylo 19 let a 1 měsíc, nevěstě 16 let a 4 měsíce. Shoda jmen rodičů, obcí a domů s křtem jejich dcery Anny Drožové z roku 1863 dokládá ztotožnění manželů. Rodné příjmení Barbory Pokorné zůstává neuzavřené."},{"key":"sadska_krest_anna_drozova_1863","label":"Narození Anny Drožové v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/11503/83","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 8. 1863","summary":"Anna Drožová se narodila 22. srpna 1863 v Hradišťku čp. 21 a byla pokřtěna 23. srpna. Rodiči jsou František Drož a Anna rozená Pokorná. Zápis dále jmenuje rodiče Františka: Františka Drože, gruntovníka v Břežanech čp. 56, a Barboru rozenou Štěpánek z Vlkovce čp. 6; rodiče Anny: Josefa Pokorného, výminkáře v Hradišťku čp. 21, a zemřelou Barboru. Rodné příjmení druhé Barbory není bezpečně přečteno. Stejné datum, rodiče a obec jsou uvedeny u nevěsty Anny Drožové při sňatku s Antonínem Mejstříkem roku 1893."},{"key":"kounice_snatek_antonin_mejstrik_anna_drozova_1893","label":"Sňatek Antonína Mejstříka a Anny Drožové","url":"https://ebadatelna.soapraha.cz/d/14350/63","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"24. 7. 1893","summary":"V Kounicích se 24. července 1893 vzali Antonín Mejstřík, kolářský dělník z čp. 52, syn Josefa Mejstříka z Janovické Lhoty čp. 29 a Kateřiny rozené Brožkové, a Anna Drožová, dcera Františka Drože, šafáře v Chrášťanech, a Anny rozené Pokorné z Hradišťka čp. 21. U snoubenců jsou dopsána data narození 16. 10. 1862 a 22. 8. 1863. Totožnost s rodiči Josefa Mejstříka narozeného 1901 podporuje shoda jmen, sňatku a rodičů v jeho křtu."}],"provenance":"Matriční zápis"},"p83":{"id":"p83","pid":83,"name":"Anna Pokorná","display_name":"Anna Pokorná","maiden_line":"","years":"asi 1840","status":"doc","private":false,"facts":["× 17. 2. 1857 Hradišťko, František Drož","při sňatku 16 let a 4 měsíce, domovem Hradišťko čp. 21","Hradišťko čp. 21 (1863)"],"note":"Matka Anny Drožové * 1863. Vlastní sňatek 1857 výslovně jmenuje její rodiče Josefa Pokorného a Barboru; dceřin křest 1863 je potvrzuje a označuje Barboru již za zemřelou. Věk ve sňatku odpovídá narození přibližně v říjnu 1840. Jde o odhad do vyhledání vlastního rodného zápisu. Prameny: Matriční zápis: Sňatek Františka Drože a Anny Pokorné v Hradišťku; Matriční zápis: Narození Anny Drožové v Hradišťku; Matriční zápis: Sňatek Antonína Mejstříka a Anny Dro
