ě přečteno. Ztotožnění dítěte s nevěstou Janova Kriegera 22. 10. 1867 a matkou Markéty 1878 je silný AI závěr ze shody obou rodičů, Martinova řemesla, domů 2/64 a věku 30 let ve sňatku. Není zde výslovný pozdější oddací odkaz. Rodná příjmení obou babiček zůstávají otevřená."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."}],"provenance":"Matriční zápis"},"p175":{"id":"p175","pid":175,"name":"Marie Tichotová","display_name":"Marie Tichotová","maiden_line":"","years":"","status":"doc","private":false,"facts":["dcera Josefa Tichoty z Elhovic čp. 64 a Anny z Dolan (křest dcery 1837)","z Elhovic čp. 64 podle sňatku 1867; v křtu 1878 starší čtení Alhovice (?)"],"note":"Její matka Anna je podle nového osobního čtení původního obrazu 1837 z Dolan; rodné příjmení zůstává nedočtené. Elhovice jsou ponechány podle původních zápisů 1837 a 1867, geografické sjednocení se starším Alhovice(?) není provedeno. Totožnost rodiny je silný AI závěr podle rodičů, řemesla, domů a věku dcery. Prameny: Matriční zápis: Narození a křest Marie Lautnerové ze Skočic; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových","sources":[{"key":"skocice_krest_marie_lautnerova_1837","label":"Narození a křest Marie Lautnerové ze Skočic","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_0340-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 7. 1837","summary":"Přeštice 31 sn. 34, pravá strana pag. 33, rok 1837, poslední řádek v červenci. Marie Lautnerová se narodila 17. 7. 1837 ve Skočicích čp. 2 a byla pokřtěna 18. 7. Otec Martin Lautner, domkář a tkadlec, syn Jana Lautnera, domkáře a tkalce z Poříčí č. 2, a Anny ze Skočic č. 60; její rodné příjmení není bezpečně přečteno. Matka Marie, dcera Josefa Tichoty, mistra kovářského z Elhovic č. 64, a Anny z Dolan; její rodné příjmení není bezpečně přečteno. Ztotožnění dítěte s nevěstou Janova Kriegera 22. 10. 1867 a matkou Markéty 1878 je silný AI závěr ze shody obou rodičů, Martinova řemesla, domů 2/64 a věku 30 let ve sňatku. Není zde výslovný pozdější oddací odkaz. Rodná příjmení obou babiček zůstávají otevřená."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."}],"provenance":"Matriční zápis"},"p176":{"id":"p176","pid":176,"name":"Johann Mrkvička","display_name":"Johann Mrkvička","maiden_line":"","years":"asi 1778","status":"doc","private":false,"facts":["pokřtěn 12. 3. 1778 Petrovice čp. 4","× 28. 5. 1805 Petrovice, Katharina Womačka","roku 1805 uveden věk 27 let","čtvrtláník, Petrovice čp. 4"],"note":"Otec Vincence, jmenovaný v jeho křtu 1812 a sňatku 1843. Sňatek čten přímo z MZA 15933, sn. 38 (AI čtení). Křest čten z MZA 15919, sn. 104: Joannes Nep., rodiče Josephus Mrkvička a Catharina, Petrovice čp. 4. Ztotožnění se ženichem 1805 je AI závěr silně podpořený shodou jména, otce, vsi, domu a věku. Napojení na babičku Boženu vede přes Františka * 1873; ztotožnění křtu 1778 se ženichem 1805 zůstává AI závěrem. Prameny: Matriční zápis: Křest Joannese (Johanna) Mrkvičky; Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Křest Franze Mrkvičky; Matriční zápis: Narození a křest Vincence Mrkvičky; Matriční zápis: Narození a křest Josepha Mrkvičky; Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové","sources":[{"key":"petrovice_krest_johann_mrkvicka_1778","label":"Křest Joannese (Johanna) Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01040.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 3. 1778","summary":"V březnovém oddílu je 12. března 1778 pokřtěn Joannes Nep. z Petrovic čp. 4. Otec Josephus Mrkvička (dobové čtení příjmení nejisté), matka Catharina uxor, její rodné příjmení zápis neuvádí. Ztotožnění s Johannem, ženichem 28. 5. 1805, je silně podpořeno shodou jména, otce, vsi, domu a věku 27 let při sňatku; jde o AI závěr z obou zápisů. Není to přímý doklad vztahu k Boženě Mrkvičkové narozené přibližně 1929."},{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_krest_franz_mrkvicka_1805","label":"Křest Franze Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00810.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 10. 1805","summary":"Franz, syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery Wenzla Womačky, se narodil v Petrovicích čp. 4. První doložené dítě páru, pět měsíců po sňatku. Měsíc a rok plynou z pořadí zápisů (předchozí 20. října, po něm Anno 1806). Čteno ze snímku AI."},{"key":"petrovice_krest_vincenc_mrkvicka_1812","label":"Narození a křest Vincence Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 9. 1812","summary":"Vincenc se narodil 16. a pokřtěn byl 17. září 1812 v Petrovicích čp. 4 jako syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky (Vomáčky). Rok je určen ze sousedních záhlaví knihy (1812, 1813). Příjmení matky je čteno ve srovnání se sňatkem 1805 a křty 1805 a 1823 (AI čtení)."},{"key":"petrovice_krest_joseph_mrkvicka_1823","label":"Narození a křest Josepha Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00970.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 3. 1823","summary":"Joseph, manželský syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky z Petrovic, se narodil 3. a pokřtěn byl 4. března 1823 v Petrovicích čp. 4. Kmotrem byl sedlák Georg Mraz. Čteno ze snímku AI."},{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého Johanna Sedláka, sedláka z Diwischau, a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842). Na tuto stranu 11 odkazuje přípis o legitimaci v synově zápisu narození."}],"provenance":"Matriční zápis"},"p177":{"id":"p177","pid":177,"name":"Katharina Womačka (Vomáčka)","display_name":"Katharina Womačka (Vomáčka)","maiden_line":"","years":"asi 1782","status":"doc","private":false,"facts":["× 28. 5. 1805 Petrovice, Johann Mrkvička","roku 1805 uveden věk 23 let","z Petrovic čp. 12; později čp. 4","Pomocný přepis knihy narozených 15919 uvádí v Petrovicích čp. 12 roku 1783 Kateřinu Vomáčkovou, rodiče Václava a Kateřinu. Přichází v úvahu jako zdejší nevěsta z roku 1805. Věk 23 let zapsaný při svatbě odpovídá přibližně roku 1782. Totožnost čeká na ověření v matrice."],"note":"Matka Vincence. Příjmení dříve pracovně čteno Wemička; srovnání pěti výskytů (sňatek 1805, křty 1805 a 1823, sňatek sestry 1809) vede ke čtení Womačka, česky Vomáčka (AI čtení). Ročník odvozen z uvedeného věku. Vlastní křest zatím neurčen. Prameny: Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Křest Franze Mrkvičky; Matriční zápis: Narození a křest Vincence Mrkvičky; Matriční zápis: Narození a křest Josepha Mrkvičky","sources":[{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_krest_franz_mrkvicka_1805","label":"Křest Franze Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00810.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 10. 1805","summary":"Franz, syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery Wenzla Womačky, se narodil v Petrovicích čp. 4. První doložené dítě páru, pět měsíců po sňatku. Měsíc a rok plynou z pořadí zápisů (předchozí 20. října, po něm Anno 1806). Čteno ze snímku AI."},{"key":"petrovice_krest_vincenc_mrkvicka_1812","label":"Narození a křest Vincence Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 9. 1812","summary":"Vincenc se narodil 16. a pokřtěn byl 17. září 1812 v Petrovicích čp. 4 jako syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky (Vomáčky). Rok je určen ze sousedních záhlaví knihy (1812, 1813). Příjmení matky je čteno ve srovnání se sňatkem 1805 a křty 1805 a 1823 (AI čtení)."},{"key":"petrovice_krest_joseph_mrkvicka_1823","label":"Narození a křest Josepha Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00970.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 3. 1823","summary":"Joseph, manželský syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky z Petrovic, se narodil 3. a pokřtěn byl 4. března 1823 v Petrovicích čp. 4. Kmotrem byl sedlák Georg Mraz. Čteno ze snímku AI."}],"provenance":"Matriční zápis"},"p178":{"id":"p178","pid":178,"name":"Johann Sedlák","display_name":"Johann Sedlák","maiden_line":"","years":"","status":"doc","private":false,"facts":["v zápisu narození vnuka roku 1842 označen jako nádeník v Diwischau","v oddacím zápisu dcery roku 1843 označen jako sedlák z Diwischau","† před 27. 2. 1843"],"note":"Otec Terezie Sedlákové. V obou zápisech stojí místní jméno Diwischau u jejího otce. Při sňatku dcery v roce 1843 je u něho křížek. Prameny: Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové; Matriční zápis: Narození a křest Františka Mrkvičky staršího","sources":[{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého Johanna Sedláka, sedláka z Diwischau, a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842). Na tuto stranu 11 odkazuje přípis o legitimaci v synově zápisu narození."},{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích čp. 9 se 6. 11. 1842 narodil Franz (František), syn Vincence Mrkvičky a Terezie, dcery Johanna Sedláka, nádeníka v Diwischau. Pozdější přípis výslovně uvádí legitimaci sňatkem rodičů a odkazuje na stranu 11 oddací knihy. Jména rodičů a věk 27 let při Františkově sňatku v roce 1870 podporují jeho ztotožnění s tímto dítětem."}],"provenance":"Matriční zápis"},"p179":{"id":"p179","pid":179,"name":"Barbara (rodné příjmení neuvedeno)","display_name":"Barbara (rodné příjmení neuvedeno)","maiden_line":"","years":"","status":"doc","private":false,"facts":[],"note":"Matka Terezie; oddací zápis 1843 rodné příjmení neuvádí. Prameny: Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové","sources":[{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého Johanna Sedláka, sedláka z Diwischau, a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842). Na tuto stranu 11 odkazuje přípis o legitimaci v synově zápisu narození."}],"provenance":"Matriční zápis"},"p180":{"id":"p180","pid":180,"name":"Thomas Starý","display_name":"Thomas Starý","maiden_line":"","years":"asi 1775","status":"doc","private":false,"facts":["× 3. 10. 1801 (?) Petrovice, Marianna Sabliková","roku 1801 uveden věk 26 let (?)","sedlák, Petrovice čp. 3"],"note":"Otec Josefa Starého podle křtu 1815 a sňatku 1841. Sňatek 1801 ho uvádí jako syna Georga Starého, ale Georg se oženil až 11. 11. 1777. Věku 26 let odpovídá křest Thomase 6. 11. 1774, syna Joannese Starého a Anny z čp. 17, Georgova bratra (AI hypotéza, neověřeno; viz Co hledáme). Ztotožnění ženicha 1801 s otcem Josefa je AI závěr. Sňatkem se dostal na statek rodiny nevěsty čp. 3 (AI výklad). Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové; Matriční zápis: Křest Josefa Starého; Matriční zápis: Sňatek Josefa Starého a Anny Staré","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."},{"key":"petrovice_krest_josef_stary_1815","label":"Křest Josefa Starého","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00900.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 2. 1815","summary":"V Petrovicích čp. 3 byl 20. 2. 1815 pokřtěn Josef, syn sedláka Thomase Starého a Marianny, dcery sedláka Sabliha. Rok je převzat z nadpisu oddílu Anno 1815; měsíc je čten nejistě, protože na levé straně zápisy dojdou k dubnu. Ztotožnění se ženichem 1841 je AI závěr opřený o jméno, otce, jméno matky a čp. 3; věk 25 při sňatku je o rok nižší, než dává křest."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. U matky nevěsty se čte Anna geb. Su[…]. Srovnání s křtem 1817 podporuje čtení Suk. Rodné příjmení matky ženicha je čteno nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."}],"provenance":"Matriční zápis"},"p181":{"id":"p181","pid":181,"name":"Marianna Sabliková","display_name":"Marianna Sabliková","maiden_line":"","years":"asi 1781","status":"doc","private":false,"facts":["× 3. 10. 1801 (?) Petrovice, Thomas Starý","roku 1801 uvedeno 20 let","dcera sedláka Thomase Sablika z čp. 3"],"note":"Matka Josefa Starého. Sňatek 1801 i křest 1815 čtu Sablik; v zápisu 1841 je příjmení čitelné hůře. Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové; Matriční zápis: Křest Josefa Starého; Matriční zápis: Sňatek Josefa Starého a Anny Staré","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."},{"key":"petrovice_krest_josef_stary_1815","label":"Křest Josefa Starého","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00900.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 2. 1815","summary":"V Petrovicích čp. 3 byl 20. 2. 1815 pokřtěn Josef, syn sedláka Thomase Starého a Marianny, dcery sedláka Sabliha. Rok je převzat z nadpisu oddílu Anno 1815; měsíc je čten nejistě, protože na levé straně zápisy dojdou k dubnu. Ztotožnění se ženichem 1841 je AI závěr opřený o jméno, otce, jméno matky a čp. 3; věk 25 při sňatku je o rok nižší, než dává křest."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. U matky nevěsty se čte Anna geb. Su[…]. Srovnání s křtem 1817 podporuje čtení Suk. Rodné příjmení matky ženicha je čteno nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."}],"provenance":"Matriční zápis"},"p182":{"id":"p182","pid":182,"name":"Franz Starý","display_name":"Franz Starý","maiden_line":"","years":"","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 17"],"note":"Otec Anny Staré podle křtu 1817 a sňatku 1841. Křest vnučky 1846 má u matky vepsané Franz a kmotrou Josefu, dceru Franze Starého. Prameny: Matriční zápis: Křest Anny Staré; Matriční zápis: Sňatek Josefa Starého a Anny Staré","sources":[{"key":"petrovice_krest_anna_stara_1817","label":"Křest Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00920.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 12. 1817","summary":"31. 12. 1817, Petrovice čp. 17. Anna, dcera sedláka Franze Starého a Anny, dcery mlynáře Franze Suka. Při sňatku Anny roku 1841 souhlasí číslo domu i jména rodičů. Povolání mlynářky a místní údaj na konci křestního řádku patří kmotře."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. U matky nevěsty se čte Anna geb. Su[…]. Srovnání s křtem 1817 podporuje čtení Suk. Rodné příjmení matky ženicha je čteno nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."}],"provenance":"Matriční zápis"},"p183":{"id":"p183","pid":183,"name":"Anna (roz. Suk)","display_name":"Anna (roz. Suk)","maiden_line":"","years":"","status":"doc","private":false,"facts":["dcera mlynáře Franze Suka"],"note":"Matka Anny Staré. Křest dcery v Petrovicích čp. 17 v roce 1817 uvádí v mateřské rubrice Franze Suka a povolání mlynáře. Při sňatku dcery 1841 se u matky čte Anna geb. Su[…]. Srovnání s křtem dává přednost čtení Suk. Zakončení v oddací rubrice je hůře rozlišitelné. Dřívější pracovní čtení byla Šupek a Supa. Prameny: Matriční zápis: Křest Anny Staré; Matriční zápis: Sňatek Josefa Starého a Anny Staré","sources":[{"key":"petrovice_krest_anna_stara_1817","label":"Křest Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00920.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 12. 1817","summary":"31. 12. 1817, Petrovice čp. 17. Anna, dcera sedláka Franze Starého a Anny, dcery mlynáře Franze Suka. Při sňatku Anny roku 1841 souhlasí číslo domu i jména rodičů. Povolání mlynářky a místní údaj na konci křestního řádku patří kmotře."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. U matky nevěsty se čte Anna geb. Su[…]. Srovnání s křtem 1817 podporuje čtení Suk. Rodné příjmení matky ženicha je čteno nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."}],"provenance":"Matriční zápis"},"p184":{"id":"p184","pid":184,"name":"Josef Julis","display_name":"Josef Julis","maiden_line":"","years":"","status":"doc","private":false,"facts":["otec ženicha Martina (1834)"],"note":"Přímo jmenován jako Joseph Julis, otec Martina ve sňatku 21. 6. 1834. Připojení tohoto ženicha k Martinovi, otci Josefa 1842, je silný AI závěr podle jmen páru, Branišova a Tereziina otce; nikoli výslovný údaj o budoucím dítěti. Vlastní křest, sňatek a úmrtí nenalezeny. Prameny: Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p185":{"id":"p185","pid":185,"name":"Terezie, matka Martina Julise","display_name":"Terezie, matka Martina Julise","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka ženicha Martina (1834)"],"note":"Přímo jmenována jako Theresia, manželka Josefa Julise a matka Martina ve sňatku 21. 6. 1834. Rodné příjmení a původ nejsou bezpečně přečteny, předběžná rozporná čtení nejsou rodinným údajem. Připojení k přímé linii závisí na silném AI ztotožnění ženicha s otcem Josefa 1842. Prameny: Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p186":{"id":"p186","pid":186,"name":"Jiří Brhel","display_name":"Jiří Brhel","maiden_line":"","years":"","status":"doc","private":false,"facts":["† před 10. 2. 1842"],"note":"Otec Terezie Brhelové; při křtu jejího syna Josefa roku 1842 uveden jako zemřelý Georg Brhel. Ve sňatku stejnojmenného páru 1834 jmenován s manželkou Annou; ztotožnění tohoto páru je silný AI závěr. České jméno Jiří je normalizace. Jeho vlastní křest a úmrtí zatím neurčeny. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Na pravé straně 76 v oddílu roku 1842 je u Josepha (Josefa) uvedeno narození 9. února, křest 10. února a v rubrice „Haus Nro“ číslo 4. Otcem byl Martin Julis, domkář v Branišově, matkou Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Ztotožnění s Josefem Julisem, ženichem v Žubří roku 1893, je odvozené ze shody obou rodičů a věku 51 let při sňatku."},{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p187":{"id":"p187","pid":187,"name":"Anna, matka Terezie Brhelové","display_name":"Anna, matka Terezie Brhelové","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka nevěsty Terezie (1834)"],"note":"Přímo jmenována jako Anna, manželka Jiřího Brhela a matka nevěsty Terezie ve sňatku 21. 6. 1834. Na správném úplném výřezu je dále sled Paul= / Lang(?)in, podobný mateřskému textu kandidátního křtu 1808. Přesný význam slov, normalizované rodné příjmení a původ nejsou určeny; PaulLangin není přijato jako příjmení. Kandidát 1808 má nadále rozdíl věku 26/25. Připojení této matky k přímé linii závisí na silném AI ztotožnění novomanželů 1834 s rodiči Josefa Julise 1842. Prameny: Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p260":{"id":"p260","pid":260,"name":"Josef Procházka","display_name":"Josef Procházka","maiden_line":"","years":"* 31. 3. 1776","status":"doc","private":false,"facts":["Narozen a pokřtěn 31. března 1776 v Samechově č. 9.","Rodiče byli sedlák Josef Procházka a Veronika.","S Barborou Bartákovou se oženil 15. listopadu 1801 v Kalištích.","Otec Františka Procházky ze Samechova."],"note":"Křest a sňatek spojuje jméno Josefa i jeho otce, otcovo povolání sedláka, Samechov a číslo domu 9. Josefovi bylo při sňatku 25 let, 7 měsíců a 15 dnů. Farář uvedl 26 let. V rejstříku z let 1773–1778 jsou další dva Josefové Procházkové z Bud a ze Sázavy. Jde o silně podložené přiřazení dvou zápisů. Prameny: Matriční zápis: Sňatek Františka Procházky a Anny Kolmanové; Matriční zápis: Křest Marie Procházkové ze Samechova čp. 9; Matriční zápis: Sňatek Josefa Procházky ze Samechova a Barbory z Kališť; Matriční zápis: Narození a křest Josefa Procházky ze Samechova","sources":[{"key":"samechov_snatek_frantisek_prochazka_anna_kolmanova_1833","label":"Sňatek Františka Procházky a Anny Kolmanové","url":"https://ebadatelna.soapraha.cz/d/11560/133","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 11. 1833","summary":"Primární sňatek 12. listopadu 1833, fol. 10. František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Anna je dcera Josefa Kolmana z Fišbilu čp. 6 a Rozálie. Nejasná rodná příjmení žen a Rozáliin původ se nepřijímají."},{"key":"samechov_krest_marie_prochazkova_1835","label":"Křest Marie Procházkové ze Samechova čp. 9","url":"https://ebadatelna.soapraha.cz/d/11552/268","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"5.–6. 10. 1835","summary":"Primární křest: Marie se narodila 5. a byla pokřtěna 6. října 1835 v Samechově čp. 9. Otec František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Matka Anna je dcera Josefa Kolmana, šafáře z Fišbilu čp. 6, a Rozálie. Nejasná rodná příjmení Barbory a Rozálie ani Rozáliin původ se nepřijímají."},{"key":"samechov_snatek_josef_prochazka_barbora_bartakova_1801","label":"Sňatek Josefa Procházky ze Samechova a Barbory z Kališť","url":"https://ebadatelna.soapraha.cz/d/10532/65","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 11. 1801","summary":"V Kalištích se 15. listopadu 1801 oženil Josef, syn sedláka Josefa Procházky ze Samechova č. 9, s Barborou, dcerou chalupníka Jana z Kališť. V zápisu je věk 26 a 20 let."},{"key":"samechov_krest_josef_prochazka_1776","label":"Narození a křest Josefa Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/97","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 3. 1776","summary":"Josef se narodil a byl pokřtěn 31. března 1776 v Samechově č. 9. Matrika jmenuje jeho otce, sedláka Josefa Procházku, a matku Veroniku. Rejstřík odkazuje na stranu 184."}],"provenance":"Matriční zápis","birth_date":"1776-03-31"},"p261":{"id":"p261","pid":261,"name":"Barbora Bartáková","display_name":"Barbora Bartáková","maiden_line":"","years":"* 6. 11. 1779","status":"doc","private":false,"facts":["Rodiče byli Jan Barták a Kateřina.","S Josefem Procházkou se vzali 15. listopadu 1801. Oddací zápis uvádí 20 let. Od narození do svatby uplynulo 22 let a 9 dní."],"note":"Barbora Bartáková se narodila 6. listopadu 1779 v Kalištích č. 3. Pokřtěna byla druhý den. K nevěstě Josefa Procházky ji přiřazujeme podle jména otce a podle domu č. 3, který jako její rodiště uvádí i pozdější zápis u vnučky Marie. Prameny: Matriční zápis: Narození a křest Barbory Bartákové; Matriční zápis: Sňatek Josefa Procházky ze Samechova a Barbory z Kališť; Matriční zápis: Sňatek Františka Procházky a Anny Kolmanové; Matriční zápis: Křest Marie Procházkové ze Samechova čp. 9","sources":[{"key":"kaliste_narozeni_barbora_bartakova_1779","label":"Narození a křest Barbory Bartákové","url":"https://ebadatelna.soapraha.cz/d/10526/8","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1779","summary":"Barbora se narodila 6. listopadu 1779 v Kalištích č. 3 a byla pokřtěna 7. listopadu. V rubrice rodičů jsou Jan Barták a Kateřina. Stejné číslo domu se při popisu Barbořina původu objevuje o generaci později. Oddací zápis z roku 1801 jí připisuje věk 20 let, podle křtu jí bylo 22."},{"key":"samechov_snatek_josef_prochazka_barbora_bartakova_1801","label":"Sňatek Josefa Procházky ze Samechova a Barbory z Kališť","url":"https://ebadatelna.soapraha.cz/d/10532/65","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 11. 1801","summary":"V Kalištích se 15. listopadu 1801 oženil Josef, syn sedláka Josefa Procházky ze Samechova č. 9, s Barborou, dcerou chalupníka Jana z Kališť. V zápisu je věk 26 a 20 let."},{"key":"samechov_snatek_frantisek_prochazka_anna_kolmanova_1833","label":"Sňatek Františka Procházky a Anny Kolmanové","url":"https://ebadatelna.soapraha.cz/d/11560/133","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 11. 1833","summary":"Primární sňatek  zápis"},"p320":{"id":"p320","pid":320,"name":"Jan Mejstřík","display_name":"Jan Mejstřík","maiden_line":"","years":"1741","status":"prob","private":false,"facts":["* 11. 5. 1741 Lhota, syn Matěje a Anny","× Kateřina Dohalová(?), Lhota čp. 4","chalupník, Lhota Janovská (1810)"],"note":"Otec ženicha Josefa ve sňatku 6. 11. 1810 a pravděpodobně otec Josefa * 1791 z Lhoty čp. 4. Křest 1741 je jediný přečtený Jan, syn Matěje, z Lhoty do 1767; přímý zápis, že jde o téhož muže, chybí (AI závěr, neověřeno). Prameny: Matriční zápis: Sňatek Josefa, syna Jana Mejstříka(?) z Lhoty; Matriční zápis: Křest Josefa, syna Jana Mejstříka z Lhoty čp. 4; Matriční zápis: Křest Jana, syna Matěje Mejstříka z Lhoty","sources":[{"key":"sudejov_snatek_josef_mejstrik_1810","label":"Sňatek Josefa, syna Jana Mejstříka(?) z Lhoty","url":"https://ebadatelna.soapraha.cz/d/12627/40","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1810","summary":"Sudějov, str. 116, dům 21(?). Ženich Josef, vlastní syn Jana Mejstříka(?), chalupníka z Lhoty Janovské, věk 2x. Nevěsta Marjana(?), vlastní dcera Jana […], věk 2x. Svědek Josef Hauptman(?). Příjmení otce nevěsty přečíst nejde. Rejstřík 12625 sn. 64 má „Mejstřík(?) Josef, 810, fol. 116“. Že jde o Josefa × Magdalenu Doudovou, je jen pravděpodobné: křest syna 1811 uvádí matku Magdalenu, zde stojí Marjana(?)."},{"key":"janovice_krest_josef_mejstrik_1791","label":"Křest Josefa, syna Jana Mejstříka z Lhoty čp. 4","url":"https://ebadatelna.soapraha.cz/d/13044/79","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16./17. 4. 1791","summary":"Fol. 150, Lhota čp. 4. Josef, narozený 16. a pokřtěný 17. dubna 1791, katolík, manželský. Otec Jan Mejstřík, stav zkrácen(?), matka Kateřina Dohalová(?). Kmotři Jan Major a Magdalena Drsínová(?). Rejstřík 13249 sn. 100 má tento řádek bez čitelného křestního jména. Se ženichem Josefem z roku 1810 jde o pravděpodobnou, ne jistou totožnost: otec Jan sedí, věk 19 proti zapsaným 2x a věk při úmrtí 72 proti zapsaným 80 nesedí."},{"key":"janovice_krest_jan_mejstrik_1741","label":"Křest Jana, syna Matěje Mejstříka z Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/146","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 5. 1741","summary":"Lhota, str. 294. Jan, narozený a pokřtěný 11. května, otec Matěj Mejstřík, matka Anna, poddaní panství Šternberk. Kmotři Václav Červinka(?) a Václav Čech z Janovic, Barbara Malinová z Lhoty. Rok 1741 potvrzuje rejstřík 13249 sn. 98 (tom II, fol. 294). Že je to pozdější otec dětí v Lhotě čp. 4, není doloženo přímo."}],"provenance":"Matriční zápis"},"p322":{"id":"p322","pid":322,"name":"Jan Dauda","display_name":"Jan Dauda","maiden_line":"","years":"","status":"doc","private":false,"facts":["Otec Magdaleny Doudové.","V matrice psán Dauda."],"note":"Křestní zápisy jeho vnoučat ve Lhotě uvádějí Jana Daudu ze Žandova jako otce Magdaleny. Zápis z roku 1824 ho označuje za sedláka. Prameny: Matriční zápis: Křest Jana, syna Josefa Mejstříka z Lhoty čp. 29; Matriční zápis: Křest Anny Mejstříkové a filiace její matky Magdaleny; Matriční zápis: Křest Františka Mejstříka a filiace jeho matky Magdaleny; Matriční zápis: Křest Václava Mejstříka a filiace jeho matky Magdaleny","sources":[{"key":"lhota_krest_jan_mejstrik_1811","label":"Křest Jana, syna Josefa Mejstříka z Lhoty čp. 29","url":"https://ebadatelna.soapraha.cz/d/13234/10","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 12. 1811","summary":"Jan, narozený 9. prosince 1811, pokřtěný 10. prosince, Lhota čp. 29. Otec Josef Mejstřík, půlsedlák z Lhoty, matka Magdalena, dcera Jana Daudy ze Žandova. Kmotr Josef Malina z Lhoty. Zápis dokládá otce Magdaleny; rodiče Josefa v něm uvedeni nejsou."},{"key":"lhota_krest_anna_mejstrikova_1818","label":"Křest Anny Mejstříkové a filiace její matky Magdaleny","url":"https://ebadatelna.soapraha.cz/d/13234/13","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 5. 1818","summary":"Lhota čp. 29. Anna, dcera Josefa Mejstříka a Magdaleny. Mateřská rubrika uvádí Magdalenu jako dceru Jana Daudy ze Žandova a Barbory. Datum narození 7. 5. 1818 podporuje samostatný rejstřík; tento původní řádek je přijímán pro filiaci. Rodné příjmení Barbory zůstává nečitelné."},{"key":"lhota_krest_frantisek_mejstrik_1821","label":"Křest Františka Mejstříka a filiace jeho matky Magdaleny","url":"https://ebadatelna.soapraha.cz/d/13234/16","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 2. 1821","summary":"František se narodil 13. a byl pokřtěn 14. února 1821 ve Lhotě čp. 29. Otec Josef Mejstřík, podsedník; matka Magdalena, dcera Jana Daudy ze Žandova a Barbory. Rodné příjmení Barbory zde uvedeno není."},{"key":"lhota_krest_vaclav_mejstrik_1824","label":"Křest Václava Mejstříka a filiace jeho matky Magdaleny","url":"https://ebadatelna.soapraha.cz/d/13234/18","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 8. 1824","summary":"Václav se narodil 19. a byl pokřtěn 20. srpna 1824 ve Lhotě čp. 29. Matka Magdalena je uvedena jako dcera Jana Daudy, sedláka ze Žandova, a Barbory. Rodné příjmení Barbory není bezpečně rozlišeno."}],"provenance":"Matriční zápis"},"p323":{"id":"p323","pid":323,"name":"Barbora","display_name":"Barbora","maiden_line":"","years":"","status":"doc","private":false,"facts":["Matka Magdaleny Doudové.","Babička Anny, Františka a Václava."],"note":"Křty tří vnoučat ve Lhotě č. 29 zaznamenávají její křestní jméno. Její rodné příjmení se dál ověřuje. Prameny: Matriční zápis: Křest Anny Mejstříkové a filiace její matky Magdaleny; Matriční zápis: Křest Františka Mejstříka a filiace jeho matky Magdaleny; Matriční zápis: Křest Václava Mejstříka a filiace jeho matky Magdaleny","sources":[{"key":"lhota_krest_anna_mejstrikova_1818","label":"Křest Anny Mejstříkové a filiace její matky Magdaleny","url":"https://ebadatelna.soapra ],"provenance":"Matriční zápis"},"p352":{"id":"p352","pid":352,"name":"Joseph Mrkvička","display_name":"Joseph Mrkvička","maiden_line":"","years":"asi 1743 – 1783","status":"doc","private":false,"facts":["čtvrtláník (quadrantarius), Petrovice čp. 4","† 17. 8. 1783 Petrovice čp. 4, 40 let"],"note":"Otec Johanna. Oddací zápis 1805 ho uvádí formulí „nach dem Joseph“, tedy jako zemřelého (AI výklad). Křest syna Joannese 12. 3. 1778 v MZA 15919, sn. 104, uvádí Josepha a jeho ženu Catharinu. Nejstarší zatím doložený Mrkvička této větve. Úmrtí 1783 přečteno přímo (MZA 15939, sn. 78); že jde o téhož Josefa, je AI závěr opřený o jméno, ves a dům. Ročník je jen z věku; křest v MZA 15918 od dubna 1740 do prosince 1744 nenalezen (jeden průchod). Sňatek Josefa Mrkvičky z Maršovic s Kateřinou Pospíchalovou z Petrovic dne 29. 1. 1765 (MZA 15931, sn. 7) je kandidát, nikoli prokázané ztotožnění. Prameny: Matriční zápis: Křest Joannese (Johanna) Mrkvičky; Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Úmrtí Josefa Mrkvičky, čtvrtláníka z Petrovic čp. 4","sources":[{"key":"petrovice_krest_johann_mrkvicka_1778","label":"Křest Joannese (Johanna) Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01040.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 3. 1778","summary":"V březnovém oddílu je 12. března 1778 pokřtěn Joannes Nep. z Petrovic čp. 4. Otec Josephus Mrkvička (dobové čtení příjmení nejisté), matka Catharina uxor, její rodné příjmení zápis neuvádí. Ztotožnění s Johannem, ženichem 28. 5. 1805, je silně podpořeno shodou jména, otce, vsi, domu a věku 27 let při sňatku; jde o AI závěr z obou zápisů. Není to přímý doklad vztahu k Boženě Mrkvičkové narozené přibližně 1929."},{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_umrti_joseph_mrkvicka_1783","label":"Úmrtí Josefa Mrkvičky, čtvrtláníka z Petrovic čp. 4","url":"https://www.mza.cz/actapublica/matrika/detail/6801?image=216000010-000253-003380-000000-015939-000000-00-B07659-00780.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 8. 1783","summary":"Zápis ze srpna uvádí Josefa Mrkvičku (Mrgwiczka), čtvrtláníka (quadrantarius), Petrovice čp. 4, 40 let. Měsíc je podle nadpisu strany, rok podle dřívějšího čtení knihy (deník #95). Že jde o sedláka z čp. 4, otce Joannese * 1778, je AI závěr opřený o jméno, ves a číslo domu."}],"provenance":"Matriční zápis"},"p353":{"id":"p353","pid":353,"name":"Catharina (manželka Josepha Mrkvičky)","display_name":"Catharina (manželka Josepha Mrkvičky)","maiden_line":"","years":"","status":"doc","private":false,"facts":["Petrovice čp. 4"],"note":"Matka Joannese, uvedená jako Catharina uxor v křtu 12. 3. 1778 (MZA 15919, sn. 104). Rodné příjmení ani vlastní křest zápis neuvádí. Dne 17. 11. 1783 se v Petrovicích čp. 4 vdova Catharina po zemřelém Josephu Mrkvičkovi, čtvrtláníku, provdala za Josefa Němce, syna zemřelého Jáchyma z Jiříkovic (MZA 15931, sn. 54; přímo přečteno). Ztotožnění této vdovy s matkou z roku 1778 je AI hypotéza podle jména, manžela, vsi a domu; sňatek její rodné příjmení ani děti neuvádí. Kateřina Pospíchalová, provdaná za Josefa Mrkvičku roku 1765 (MZA 15931, sn. 7), je možná tatáž žena, ale přímý ztotožňující údaj chybí. Její místo v přímé linii je podmíněno ztotožněním Joannese se ženichem 1805; totožnost Joannese při křtu 1778 a sňatku 1805 zůstává AI závěrem. Prameny: Matriční zápis: Křest Joannese (Johanna) Mrkvičky; Matriční zápis: Sňatek Josefa Němce a Kateřiny, vdovy po Josefu Mrkvičkovi","sources":[{"key":"petrovice_krest_johann_mrkvicka_1778","label":"Křest Joannese (Johanna) Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01040.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 3. 1778","summary":"V březnovém oddílu je 12. března 1778 pokřtěn Joannes Nep. z Petrovic čp. 4. Otec Josephus Mrkvička (dobové čtení příjmení nejisté), matka Catharina uxor, její rodné příjmení zápis neuvádí. Ztotožnění s Johannem, ženichem 28. 5. 1805, je silně podpořeno shodou jména, otce, vsi, domu a věku 27 let při sňatku; jde o AI závěr z obou zápisů. Není to přímý doklad vztahu k Boženě Mrkvičkové narozené přibližně 1929."},{"key":"petrovice_snatek_josef_nemec_katerina_mrkvickova_1783","label":"Sňatek Josefa Němce a Kateřiny, vdovy po Josefu Mrkvičkovi","url":"https://matriky.online/brno/00015931/54/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 11. 1783","summary":"Levá strana, fol. 106, první zápis pod nadpisem In 9bri. Dne 17. listopadu se žení Josephus Niemetz, quadrantarius (čtvrtláník), syn zemřelého Joachima Němce z Jiříkovic, s Catharinou, vdovou po zemřelém Josephu Mrkvičkovi, čtvrtláníku v Petrovicích; čp. 4. Den 17 a měsíc listopad přečteny přímo, rok 1783 podle posloupnosti před lednem 1784 na téže dvojstraně a shody s pomocným rejstříkem. Nevěstino rodné příjmení, rodiče, věk ani syn Jan uvedeni nejsou. Ztotožnění s Catharinou, matkou Joannese pokřtěného 12. 3. 1778, je AI hypotéza opřená o jméno, zemřelého manžela, Petrovice a dům 4; samo o sobě nepotvrzuje kandidátní sňatek Josefa Mrkvičky a Kateřiny Pospíchalové z roku 1765."}],"provenance":"Matriční zápis"},"p354":{"id":"p354","pid":354,"name":"Wenzl Womačka (Vomáčka)","display_name":"Wenzl Womačka (Vomáčka)","maiden_line":"","years":"asi 1750","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 12","× 22. 11. 1772 Kateřina Vávrová z Pohledce","× 17. 6. 1800 Petrovice, vdovec, 50 let, Marianna Peter (?)"],"note":"Otec Kathariny, doložen jejím sňatkem 1805 a křtem vnuka 1823. Syn Niklase podle sňatku 1772. Ročník z věku 50 let při druhém sňatku 1800. Kandidát na křest: Wenceslaus, syn Nicolause Vomáčky a Marianny, Petrovice, po 26. 9. 1743 (MZA 15918, sn. 189, zápis petrovice_krest_wenzl_womacka_1743); rozdíl 7 let proti věku, proto zatím AI hypotéza. Ztotožnění ženicha 1800 s otcem Kathariny je AI závěr opřený o jméno, povolání a čp. 12. Prameny: Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Narození a křest Josepha Mrkvičky; Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Druhý sňatek Wenzla Womačky","sources":[{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_krest_joseph_mrkvicka_1823","label":"Narození a křest Josepha Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00970.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 3. 1823","summary":"Joseph, manželský syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky z Petrovic, se narodil 3. a pokřtěn byl 4. března 1823 v Petrovicích čp. 4. Kmotrem byl sedlák Georg Mraz. Čteno ze snímku AI."},{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"petrovice_snatek_wenzl_womacka_1800","label":"Druhý sňatek Wenzla Womačky","url":"https://www.mza.cz/actapublica/matrika/detail/6796?image=216000010-000253-003380-000000-015932-000000-00-B07852-00260.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 6. 1800","summary":"17. 6. 1800 se v Petrovicích oženil Wenzl Womačka, sedlák z čp. 12, vdovec, 50 let, s Mariannou, dcerou po Karlu Peterovi (?), domkáři z čp. 19, 30 let. Ztotožnění s otcem Kathariny Womačkové je AI závěr."}],"provenance":"Matriční zápis"},"p355":{"id":"p355","pid":355,"name":"Kateřina Vávrová","display_name":"Kateřina Vávrová","maiden_line":"","years":"asi 1753–1799","status":"prob","private":false,"facts":["× 22. 11. 1772 Václav Vomáčka","† únor 1799 Petrovice čp. 12, 46 let"],"note":"Žena Václava Vomáčky, doložená sňatkem 1772 a úmrtím 1799; tatáž žena je AI závěr. Že je matkou Kathariny * asi 1782, zatím doložují jen křty dalších dětí téhož páru z let 1776 a 1777, vlastní křest Kathariny není přečten. Prameny: Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Úmrtí Kateřiny, ženy Václava Vomáčky","sources":[{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"petrovice_umrti_katharina_womackova_1799","label":"Úmrtí Kateřiny, ženy Václava Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6802?image=216000010-000253-003380-000000-015940-000000-00-B07660-00600.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1799","summary":"V únoru 1799 (den čten 26 nebo 6) zemřela Kateřina, žena Václava Vomáčky, sedláka, Petrovice čp. 12, 46 let, tedy narozena asi 1753. Ztotožnění s nevěstou Kateřinou Vávrovou z roku 1772 je AI závěr."}],"provenance":"Matriční zápis"},"p360":{"id":"p360","pid":360,"name":"Georg Starý","display_name":"Georg Starý","maiden_line":"","years":"","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 17","× 11. 11. 1777 Petrovice, Marina Lukešová"],"note":"Otec Thomase Starého a Kathariny Staré podle dvojitého sňatku 1801, kde je číslice domu čtena nejistě. Sňatek 1777 je o tři roky mladší než křest Thomase 1774, takže Georg mohl být strýc a hospodář, ne vlastní otec (AI hypotéza, neověřeno). Syn zemřelého Thomase Starého podle sňatku 1777. Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."}],"provenance":"Matriční zápis"},"p362":{"id":"p362","pid":362,"name":"Thomas Sablik","display_name":"Thomas Sablik","maiden_line":"","years":"","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 3"],"note":"Otec Marianny a Antona podle dvojitého sňatku 1801. Kandidát na křest: Thomas, syn Joannese Sablíka a Anny, Slavkovice (?), 13. 12. 1742 (MZA 15918, sn. 180, zápis slavkovice_krest_thomas_sablik_1742); AI hypotéza. Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."}],"provenance":"Matriční zápis"},"p364":{"id":"p364","pid":364,"name":"Georg Starý","display_name":"Georg Starý","maiden_line":"","years":"","status":"prob","private":false,"facts":["sedlák, Petrovice čp. 17","× 11. 11. 1777 Petrovice, Marina Lukešová"],"note":"Pravděpodobný otec Franze Starého: František Serafínský, pokřtěný 21. 10. 1778, je syn Georga a Mariny. Tatáž osoba jako č. 360, proto se Josef a Anna Starých brali jako příbuzní (AI hypotéza). Zápis, který by přímo spojil křest 1778 se sedlákem Franzem z čp. 17, zatím chybí. Prameny: Matriční zápis: Křest Františka, syna Georga Starého a Mariny; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové","sources":[{"key":"petrovice_krest_franz_stary_1778","label":"Křest Františka, syna Georga Starého a Mariny","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 10. 1778","summary":"21. 10. 1778 (měsíc z přehledu stránky) pokřtěn František Serafínský, syn Georga Starého, sedláka, a Mariny, Petrovice čp. 14 nebo 17. Kmotři Wenceslaus Plachetka, řezník, a Catharina, žena Thomase Šknosky (?), sedláka v Petrovicích. Ztotožnění s Franzem Starým z čp. 17, otcem Anny * 1817, je AI hypotéza."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."}],"provenance":"Matriční zápis"},"p365":{"id":"p365","pid":365,"name":"Marina Lukešová","display_name":"Marina Lukešová","maiden_line":"","years":"","status":"prob","private":false,"facts":["× 11. 11. 1777 Petrovice, Georg Starý"],"note":"Dcera Georga Lukeše. Oddací zápis uvádí dispens pro pokrevenství ve 3. stupni s ženichem. Pravděpodobná matka Franze Starého. Prameny: Matriční zápis: Křest Františka, syna Georga Starého a Mariny; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové","sources":[{"key":"petrovice_krest_franz_stary_1778","label":"Křest Františka, syna Georga Starého a Mariny","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 10. 1778","summary":"21. 10. 1778 (měsíc z přehledu stránky) pokřtěn František Serafínský, syn Georga Starého, sedláka, a Mariny, Petrovice čp. 14 nebo 17. Kmotři Wenceslaus Plachetka, řezník, a Catharina, žena Thomase Šknosky (?), sedláka v Petrovicích. Ztotožnění s Franzem Starým z čp. 17, otcem Anny * 1817, je AI hypotéza."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."}],"provenance":"Matriční zápis"},"p366":{"id":"p366","pid":366,"name":"Franz Suk","display_name":"Franz Suk","maiden_line":"","years":"","status":"doc","private":false,"facts":["mlynář"],"note":"Otec Anny rozené Suk. V křtu její dcery Anny roku 1817 jej uvádí mateřská rubrika. Sňatek vnučky v roce 1841 podporuje čtení matčina rodného příjmení Suk. Zakončení v oddací rubrice je hůře rozlišitelné. Prameny: Matriční zápis: Křest Anny Staré","sources":[{"key":"petrovice_krest_anna_stara_1817","label":"Křest Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00920.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 12. 1817","summary":"31. 12. 1817, Petrovice čp. 17. Anna, dcera sedláka Franze Starého a Anny, dcery mlynáře Franze Suka. Při sňatku Anny roku 1841 souhlasí číslo domu i jména rodičů. Povolání mlynářky a místní údaj na konci křestního řádku patří kmotře."}],"provenance":"Matriční zápis"},"p520":{"id":"p520","pid":520,"name":"Josef Procházka","display_name":"Josef Procházka","maiden_line":"","years":"","status":"doc","private":false,"facts":["Sedlák ze Samechova č. 9.","Ženich ze sňatku 18. října 1767; jeho otcem byl Josef Procházka.","Manžel Veroniky a otec Josefa narozeného 31. března 1776."],"note":"Oddavky z roku 1767 a křest Kateřiny Barbory z roku 1781 spojují Josefovo příjmení a Samechov, jméno Veronika a údaj, že jejím otcem byl zemřelý Jan. Podoba jeho příjmení je v obou zápisech podobná. Rodinu v čp. 9 zachycují rovněž křty v letech 1776 a 1783. V roce 1797 zemřel v tomto domě stejnojmenný sedlák ve věku 54 let. Ztotožnění je velmi pravděpodobné. Prameny: Matriční zápis: Sňatek Josefa Procházky ze Samechova a Barbory z Kališť; Matriční zápis: Narození a křest Josefa Procházky ze Samechova; Matriční zápis: Úmrtí Josefa Procházky, sedláka ze Samechova čp. 9; Matriční zápis: Sňatek Josefa Procházky ze Samechova a Veroniky z Levína; Matriční zápis: Křest Václava Procházky ze Samechova; Matriční zápis: Křest Kateřiny Barbory Procházkové ze Samechova; Matriční zápis: Narození a křest Vojtěcha Procházky ze Samechova; Matriční zápis: Narození a křest Františka Procházky ze Samechova; Matriční zápis: Křest Matěje Procházky ze Samechova č. 9; Matriční zápis: Křest Martina Antonína Procházky ze Samechova č. 9; Matriční zápis: Křest Marie Magdaleny Procházkové ze Samechova č. 9; Matriční zápis: Křest Jana Nepomuka Procházky ze Samechova č. 9","sources":[{"key":"samechov_snatek_josef_prochazka_barbora_bartakova_1801","label":"Sňatek Josefa Procházky ze Samechova a Barbory z Kališť","url":"https://ebadatelna.soapraha.cz/d/10532/65","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 11. 1801","summary":"V Kalištích se 15. listopadu 1801 oženil Josef, syn sedláka Josefa Procházky ze Samechova č. 9, s Barborou, dcerou chalupníka Jana z Kališť. V zápisu je věk 26 a 20 let."},{"key":"samechov_krest_josef_prochazka_1776","label":"Narození a křest Josefa Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/97","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 3. 1776","summary":"Josef se narodil a byl pokřtěn 31. března 1776 v Samechově č. 9. Matrika jmenuje jeho otce, sedláka Josefa Procházku, a matku Veroniku. Rejstřík odkazuje na stranu 184."},{"key":"samechov_umrti_josef_prochazka_1797","label":"Úmrtí Josefa Procházky, sedláka ze Samechova čp. 9","url":"https://ebadatelna.soapraha.cz/d/11562/184","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 3. 1797","summary":"Fol. 8, levá strana. Dne 19. března 1797 zemřel v Samechově čp. 9 Josef Procházka, sedlák, 54 let; pohřben byl u sv. Martina 21. března. Příčina je zapsána jako „Na abzehrung“, tedy na úbytě. Zápis bezpečně dokládá tuto událost dospělého sedláka. Přiřazení zemřelého konkrétně k P520 je velmi pravděpodobný nepřímý závěr podle jména, povolání, vsi, domu a návazných rodinných zápisů; pramen nejmenuje manželku ani syna, proto se P520 nepřidává strukturované datum úmrtí."},{"key":"samechov_snatek_josef_prochazka_veronika_1767","label":"Sňatek Josefa Procházky ze Samechova a Veroniky z Levína","url":"https://ebadatelna.soapraha.cz/d/5915/80","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"18. 10. 1767","summary":"Folio 152, nahoře vlevo. Josef, manželský syn Josefa Procházky ze Samechova, a Veronika, dcera po zemřelém Janu, se vzali 18. října 1767. U nevěsty je uveden Levín. Janovo příjmení má počátek Schneibe…. Přesná koncovka zůstává otevřená. Rejstřík Chocerady 12, sn. 17, odkazuje na stejné folio a rok. Totožnost manželů s rodiči v Samechově čp. 9 podporuje křest Kateřiny Barbory v roce 1781."},{"key":"samechov_krest_vaclav_prochazka_1769","label":"Křest Václava Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/57","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 9. 1769","summary":"Folio 104. Zápis ze Samechova výslovně jmenuje Václava, manželského syna Josefa Procházky a jeho manželky Veroniky. Farář dítě pokřtil dne 8. a uvedl, že se narodilo předchozího dne. Měsíc září byl ověřen z návazného nadpisu. Václavův zápis byl porovnán s oddavkami tohoto páru v roce 1767. Jeho pozdější život dosud není přiřazen."},{"key":"samechov_krest_katerina_prochazkova_1781","label":"Křest Kateřiny Barbory Procházkové ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/122","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 3. 1781","summary":"Folio 235, dole vpravo. Kateřina dostala dvě jména, Catharina Barbara. Otcem byl Josef Procházka. Matka Veronika je výslovně označena za dceru zemřelého Jana. Za Janovým jménem následuje příjmení s čitelným začátkem Snei…. V témže řádku stojí Samechov č. 9. Ve sloupci narození je 8, ve sloupci křtu Dito, tedy téhož dne. Měsíc březen vyplývá z pořadí dnů po 26. únoru."},{"key":"samechov_krest_vojtech_prochazka_1782","label":"Narození a křest Vojtěcha Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/128","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 4. 1782","summary":"Folio 246, vlevo. Poslední zápis před květnovým nadpisem. Vojtěch se narodil 21. dubna a křest následoval téhož dne. Rodiče byli sedlák Josef Procházka a Veronika ze Samechova č. 9. Za jménem matky lze číst filia a příjmení začínající Schneiberg…."},{"key":"samechov_krest_frantisek_prochazka_1783","label":"Narození a křest Františka Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/136","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28./29. 8. 1783","summary":"Folio 262, vlevo pod srpnovým nadpisem. František se narodil 28. srpna a byl pokřtěn 29. srpna 1783. Rodiče byli sedlák Josef Procházka a Veronika ze Samechova č. 9. Za Veroničiným jménem následuje křížek a příjmení začínající Schneiberg…."},{"key":"samechov_krest_matej_prochazka_1771","label":"Křest Matěje Procházky ze Samechova č. 9","url":"https://ebadatelna.soapraha.cz/d/11550/69","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. a 29. 9. 1771","summary":"V září 1771 uvádí matrika u Matěje otce Josefa Procházku a jeho manželku Veroniku ze Samechova č. 9. Ve sloupci pro den jsou pod sebou čísla 28 a 29. Pravděpodobně označují narození a křest v tomto pořadí."},{"key":"samechov_krest_martin_prochazka_1773","label":"Křest Martina Antonína Procházky ze Samechova č. 9","url":"https://ebadatelna.soapraha.cz/d/11550/78","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 6. 1773","summary":"Dne 13. června 1773 byl pokřtěn Martin Antonín. Matrika jmenuje rodiče Josefa Procházku, sedláka, a jeho manželku Veroniku. V témže řádku je zapsán Samechov č. 9."},{"key":"samechov_krest_magdalena_prochazkova_1778","label":"Křest Marie Magdaleny Procházkové ze Samechova č. 9","url":"https://ebadatelna.soapraha.cz/d/11550/108","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1778, pravděpodobně 25. 2.","summary":"U křtu Marie Magdaleny v únoru 1778 uvádí matrika otce Josefa Procházku, sedláka, a matku Veroniku, dceru zemřelého Jana. Rodina bydlela v Samechově č. 9. Den se čte nejspíše jako 25."},{"key":"samechov_krest_jan_nepomuk_prochazka_1779","label":"Křest Jana Nepomuka Procházky ze Samechova č. 9","url":"https://ebadatelna.soapraha.cz/d/11550/113","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 5. 1779","summary":"Dne 9. května 1779 byl pokřtěn Jan Nepomuk. Matrika uvádí otce Josefa Procházku, sedláka, a matku Veroniku, dceru Jana. Na konci řádku je Samechov č. 9."}],"provenance":"Matriční zápis"},"p521":{"id":"p521","pid":521,"name":"Veronika","display_name":"Veronika","maiden_line":"","years":"","status":"doc","private":false,"facts":["Dcera Jana z Levína, který zemřel před její svatbou.","S Josefem Procházkou se vzali 18. října 1767.","Matka Josefa narozeného 31. března 1776 v Samechově č. 9."],"note":"Oddavky z roku 1767 a křest Kateřiny Barbory z roku 1781 spojují Josefovo příjmení a Samechov, jméno Veronika a údaj, že jejím otcem byl zemřelý Jan. Podoba jeho příjmení je v obou zápisech podobná. Rodinu v čp. 9 zachycují rovněž křty v letech 1776 a 1783. Přesný tvar příjmení jejího otce zůstává otevřený. Prameny: Matriční zápis: Narození a křest Josefa Procházky ze Samechova; Matriční zápis: Sňatek Josefa Procházky ze Samechova a Veroniky z Levína; Matriční zápis: Křest Václava Procházky ze Samechova; Matriční zápis: Křest Kateřiny Barbory Procházkové ze Samechova; Matriční zápis: Narození a křest Vojtěcha Procházky ze Samechova; Matriční zápis: Narození a křest Františka Procházky ze Samechova; Matriční zápis: Křest Matěje Procházky ze Samechova č. 9; Matriční zápis: Křest Martina Antonína Procházky ze Samechova č. 9; Matriční zápis: Křest Marie Magdaleny Procházkové ze Samechova č. 9; Matriční zápis: Křest Jana Nepomuka Procházky ze Samechova č. 9","sources":[{"key":"samechov_krest_josef_prochazka_1776","label":"Narození a křest Josefa Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/97","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 3. 1776","summary":"Josef se narodil a byl pokřtěn 31. března 1776 v Samechově č. 9. Matrika jmenuje jeho otce, sedláka Josefa Procházku, a matku Veroniku. Rejstřík odkazuje na stranu 184."},{"key":"samechov_snatek_josef_prochazka_veronika_1767","label":"Sňatek Josefa Procházky ze Samechova a Veroniky z Levína","url":"https://ebadatelna.soapraha.cz/d/5915/80","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"18. 10. 1767","summary":"Folio 152, nahoře vlevo. Josef, manželský syn Josefa Procházky ze Samechova, a Veronika, dcera po zemřelém Janu, se vzali 18. října 1767. U nevěsty je uveden Levín. Janovo příjmení má počátek Schneibe…. Přesná koncovka zůstává otevřená. Rejstřík Chocerady 12, sn. 17, odkazuje na stejné folio a rok. Totožnost manželů s rodiči v Samechově čp. 9 podporuje křest Kateřiny Barbory v roce 1781."},{"key":"samechov_krest_vaclav_prochazka_1769","label":"Křest Václava Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/57","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 9. 1769","summary":"Folio 104. Zápis ze Samechova výslovně jmenuje Václava, manželského syna Josefa Procházky a jeho manželky Veroniky. Farář dítě pokřtil dne 8. a uvedl, že se narodilo předchozího dne. Měsíc září byl ověřen z návazného nadpisu. Václavův zápis byl porovnán s oddavkami tohoto páru v roce 1767. Jeho pozdější život dosud není přiřazen."},{"key":"samechov_krest_katerina_prochazkova_1781","label":"Křest Kateřiny Barbory Procházkové ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/122","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 3. 1781","summary":"Folio 235, dole vpravo. Kateřina dostala dvě jména, Catharina Barbara. Otcem byl Josef Procházka. Matka Veronika je výslovně označena za dceru zemřelého Jana. Za Janovým jménem následuje příjmení s čitelným začátkem Snei…. V témže řádku stojí Samechov č. 9. Ve sloupci narození je 8, ve sloupci křtu Dito, tedy téhož dne. Měsíc březen vyplývá z pořadí dnů po 26. únoru."},{"key":"samechov_krest_vojtech_prochazka_1782","label":"Narození a křest Vojtěcha Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/128","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 4. 1782","summary":"Folio 246, vlevo. Poslední zápis před květnovým nadpisem. Vojtěch se narodil 21. dubna a křest následoval téhož dne. Rodiče byli sedlák Josef Procházka a Veronika ze Samechova č. 9. Za jménem matky lze číst filia a příjmení začínající Schneiberg…."},{"key":"samechov_krest_frantisek_prochazka_1783","label":"Narození a křest Františka Procházky ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/136","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28./29. 8. 1783","summary":"Folio 262, vlevo pod srpnovým nadpisem. František se narodil 28. srpna a byl pokřtěn 29. srpna 1783. Rodiče b
