te":"17. 7. 1837","summary":"Přeštice 31 sn. 34, pravá strana pag. 33, rok 1837, poslední řádek v červenci. Marie Lautnerová se narodila 17. 7. 1837 ve Skočicích čp. 2 a byla pokřtěna 18. 7. Otec Martin Lautner, domkář a tkadlec, syn Jana Lautnera, domkáře a tkalce z Poříčí č. 2, a Anny ze Skočic č. 60; její rodné příjmení není bezpečně přečteno. Matka Marie, dcera Josefa Tichoty, mistra kovářského z Elhovic č. 64, a Anny z Dolan; její rodné příjmení není bezpečně přečteno. Ztotožnění dítěte s nevěstou Janova Kriegera 22. 10. 1867 a matkou Markéty 1878 je silný AI závěr ze shody obou rodičů, Martinova řemesla, domů 2/64 a věku 30 let ve sňatku. Není zde výslovný pozdější oddací odkaz. Rodná příjmení obou babiček zůstávají otevřená."}],"provenance":"Matriční zápis"},"p352":{"id":"p352","pid":352,"name":"Joseph Mrkvička","display_name":"Joseph Mrkvička","maiden_line":"","years":"asi 1743 – 1783","status":"doc","private":false,"facts":["čtvrtláník (quadrantarius), Petrovice čp. 4","† 17. 8. 1783 Petrovice čp. 4, 40 let"],"note":"Otec Johanna. Oddací zápis 1805 ho uvádí formulí „nach dem Joseph“, tedy jako zemřelého (AI výklad). Křest syna Joannese 12. 3. 1778 v MZA 15919, sn. 104, uvádí Josepha a jeho ženu Catharinu. Nejstarší zatím doložený Mrkvička této větve. Úmrtí 1783 přečteno přímo (MZA 15939, sn. 78); že jde o téhož Josefa, je AI závěr opřený o jméno, ves a dům. Ročník je jen z věku; křest v MZA 15918 od dubna 1740 do prosince 1744 nenalezen (jeden průchod). Sňatek Josefa Mrkvičky z Maršovic s Kateřinou Pospíchalovou z Petrovic dne 29. 1. 1765 (MZA 15931, sn. 7) je kandidát, nikoli prokázané ztotožnění. Prameny: Matriční zápis: Křest Joannese (Johanna) Mrkvičky; Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Úmrtí Josefa Mrkvičky, čtvrtláníka z Petrovic čp. 4","sources":[{"key":"petrovice_krest_johann_mrkvicka_1778","label":"Křest Joannese (Johanna) Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01040.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 3. 1778","summary":"V březnovém oddílu je 12. března 1778 pokřtěn Joannes Nep. z Petrovic čp. 4. Otec Josephus Mrkvička (dobové čtení příjmení nejisté), matka Catharina uxor, její rodné příjmení zápis neuvádí. Ztotožnění s Johannem, ženichem 28. 5. 1805, je silně podpořeno shodou jména, otce, vsi, domu a věku 27 let při sňatku; jde o AI závěr z obou zápisů. Není to přímý doklad vztahu k Boženě Mrkvičkové narozené přibližně 1929."},{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_umrti_joseph_mrkvicka_1783","label":"Úmrtí Josefa Mrkvičky, čtvrtláníka z Petrovic čp. 4","url":"https://www.mza.cz/actapublica/matrika/detail/6801?image=216000010-000253-003380-000000-015939-000000-00-B07659-00780.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 8. 1783","summary":"Zápis ze srpna uvádí Josefa Mrkvičku (Mrgwiczka), čtvrtláníka (quadrantarius), Petrovice čp. 4, 40 let. Měsíc je podle nadpisu strany, rok podle dřívějšího čtení knihy (deník #95). Že jde o sedláka z čp. 4, otce Joannese * 1778, je AI závěr opřený o jméno, ves a číslo domu."}],"provenance":"Matriční zápis"},"p353":{"id":"p353","pid":353,"name":"Catharina (manželka Josepha Mrkvičky)","display_name":"Catharina (manželka Josepha Mrkvičky)","maiden_line":"","years":"","status":"doc","private":false,"facts":["Petrovice čp. 4"],"note":"Matka Joannese, uvedená jako Catharina uxor v křtu 12. 3. 1778 (MZA 15919, sn. 104). Rodné příjmení ani vlastní křest zápis neuvádí. Dne 17. 11. 1783 se v Petrovicích čp. 4 vdova Catharina po zemřelém Josephu Mrkvičkovi, čtvrtláníku, provdala za Josefa Němce, syna zemřelého Jáchyma z Jiříkovic (MZA 15931, sn. 54; přímo přečteno). Ztotožnění této vdovy s matkou z roku 1778 je AI hypotéza podle jména, manžela, vsi a domu; sňatek její rodné příjmení ani děti neuvádí. Kateřina Pospíchalová, provdaná za Josefa Mrkvičku roku 1765 (MZA 15931, sn. 7), je možná tatáž žena, ale přímý ztotožňující údaj chybí. Její místo v přímé linii je podmíněno ztotožněním Joannese se ženichem 1805; totožnost Joannese při křtu 1778 a sňatku 1805 zůstává AI závěrem. Prameny: Matriční zápis: Křest Joannese (Johanna) Mrkvičky; Matriční zápis: Sňatek Josefa Němce a Kateřiny, vdovy po Josefu Mrkvičkovi","sources":[{"key":"petrovice_krest_johann_mrkvicka_1778","label":"Křest Joannese (Johanna) Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01040.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 3. 1778","summary":"V březnovém oddílu je 12. března 1778 pokřtěn Joannes Nep. z Petrovic čp. 4. Otec Josephus Mrkvička (dobové čtení příjmení nejisté), matka Catharina uxor, její rodné příjmení zápis neuvádí. Ztotožnění s Johannem, ženichem 28. 5. 1805, je silně podpořeno shodou jména, otce, vsi, domu a věku 27 let při sňatku; jde o AI závěr z obou zápisů. Není to přímý doklad vztahu k Boženě Mrkvičkové narozené přibližně 1929."},{"key":"petrovice_snatek_josef_nemec_katerina_mrkvickova_1783","label":"Sňatek Josefa Němce a Kateřiny, vdovy po Josefu Mrkvičkovi","url":"https://matriky.online/brno/00015931/54/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 11. 1783","summary":"Levá strana, fol. 106, první zápis pod nadpisem In 9bri. Dne 17. listopadu se žení Josephus Niemetz, quadrantarius (čtvrtláník), syn zemřelého Joachima Němce z Jiříkovic, s Catharinou, vdovou po zemřelém Josephu Mrkvičkovi, čtvrtláníku v Petrovicích; čp. 4. Den 17 a měsíc listopad přečteny přímo, rok 1783 podle posloupnosti před lednem 1784 na téže dvojstraně a shody s pomocným rejstříkem. Nevěstino rodné příjmení, rodiče, věk ani syn Jan uvedeni nejsou. Ztotožnění s Catharinou, matkou Joannese pokřtěného 12. 3. 1778, je AI hypotéza opřená o jméno, zemřelého manžela, Petrovice a dům 4; samo o sobě nepotvrzuje kandidátní sňatek Josefa Mrkvičky a Kateřiny Pospíchalové z roku 1765."}],"provenance":"Matriční zápis"},"p354":{"id":"p354","pid":354,"name":"Wenzl Womačka (Vomáčka)","display_name":"Wenzl Womačka (Vomáčka)","maiden_line":"","years":"asi 1750","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 12","× 22. 11. 1772 Kateřina Vávrová z Pohledce","× 17. 6. 1800 Petrovice, vdovec, 50 let, Marianna Peter (?)"],"note":"Otec Kathariny, doložen jejím sňatkem 1805 a křtem vnuka 1823. Syn Niklase podle sňatku 1772. Ročník z věku 50 let při druhém sňatku 1800. Kandidát na křest: Wenceslaus, syn Nicolause Vomáčky a Marianny, Petrovice, po 26. 9. 1743 (MZA 15918, sn. 189, zápis petrovice_krest_wenzl_womacka_1743); rozdíl 7 let proti věku, proto zatím AI hypotéza. Ztotožnění ženicha 1800 s otcem Kathariny je AI závěr opřený o jméno, povolání a čp. 12. Prameny: Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Narození a křest Josepha Mrkvičky; Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Druhý sňatek Wenzla Womačky","sources":[{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_krest_joseph_mrkvicka_1823","label":"Narození a křest Josepha Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00970.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 3. 1823","summary":"Joseph, manželský syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky z Petrovic, se narodil 3. a pokřtěn byl 4. března 1823 v Petrovicích čp. 4. Kmotrem byl sedlák Georg Mraz. Čteno ze snímku AI."},{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"petrovice_snatek_wenzl_womacka_1800","label":"Druhý sňatek Wenzla Womačky","url":"https://www.mza.cz/actapublica/matrika/detail/6796?image=216000010-000253-003380-000000-015932-000000-00-B07852-00260.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 6. 1800","summary":"17. 6. 1800 se v Petrovicích oženil Wenzl Womačka, sedlák z čp. 12, vdovec, 50 let, s Mariannou, dcerou po Karlu Peterovi (?), domkáři z čp. 19, 30 let. Ztotožnění s otcem Kathariny Womačkové je AI závěr."}],"provenance":"Matriční zápis"},"p355":{"id":"p355","pid":355,"name":"Kateřina Vávrová","display_name":"Kateřina Vávrová","maiden_line":"","years":"asi 1753–1799","status":"prob","private":false,"facts":["× 22. 11. 1772 Václav Vomáčka","† únor 1799 Petrovice čp. 12, 46 let"],"note":"Žena Václava Vomáčky, doložená sňatkem 1772 a úmrtím 1799; tatáž žena je AI závěr. Že je matkou Kathariny * asi 1782, zatím doložují jen křty dalších dětí téhož páru z let 1776 a 1777, vlastní křest Kathariny není přečten. Prameny: Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Úmrtí Kateřiny, ženy Václava Vomáčky","sources":[{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"petrovice_umrti_katharina_womackova_1799","label":"Úmrtí Kateřiny, ženy Václava Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6802?image=216000010-000253-003380-000000-015940-000000-00-B07660-00600.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1799","summary":"V únoru 1799 (den čten 26 nebo 6) zemřela Kateřina, žena Václava Vomáčky, sedláka, Petrovice čp. 12, 46 let, tedy narozena asi 1753. Ztotožnění s nevěstou Kateřinou Vávrovou z roku 1772 je AI závěr."}],"provenance":"Matriční zápis"},"p360":{"id":"p360","pid":360,"name":"Georg Starý","display_name":"Georg Starý","maiden_line":"","years":"","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 17","× 11. 11. 1777 Petrovice, Marina Lukešová"],"note":"Otec Thomase Starého a Kathariny Staré podle dvojitého sňatku 1801, kde je číslice domu čtena nejistě. Sňatek 1777 je o tři roky mladší než křest Thomase 1774, takže Georg mohl být strýc a hospodář, ne vlastní otec (AI hypotéza, neověřeno). Syn zemřelého Thomase Starého podle sňatku 1777. Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."}],"provenance":"Matriční zápis"},"p362":{"id":"p362","pid":362,"name":"Thomas Sablik","display_name":"Thomas Sablik","maiden_line":"","years":"","status":"doc","private":false,"facts":["sedlák, Petrovice čp. 3"],"note":"Otec Marianny a Antona podle dvojitého sňatku 1801. Kandidát na křest: Thomas, syn Joannese Sablíka a Anny, Slavkovice (?), 13. 12. 1742 (MZA 15918, sn. 180, zápis slavkovice_krest_thomas_sablik_1742); AI hypotéza. Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."}],"provenance":"Matriční zápis"},"p364":{"id":"p364","pid":364,"name":"Georg Starý","display_name":"Georg Starý","maiden_line":"","years":"","status":"prob","private":false,"facts":["sedlák, Petrovice čp. 17","× 11. 11. 1777 Petrovice, Marina Lukešová"],"note":"Pravděpodobný otec Franze Starého: František Serafínský, pokřtěný 21. 10. 1778, je syn Georga a Mariny. Tatáž osoba jako č. 360, proto se Josef a Anna Starých brali jako příbuzní (AI hypotéza). Zápis, který by přímo spojil křest 1778 se sedlákem Franzem z čp. 17, zatím chybí. Prameny: Matriční zápis: Křest Františka, syna Georga Starého a Mariny; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové","sources":[{"key":"petrovice_krest_franz_stary_1778","label":"Křest Františka, syna Georga Starého a Mariny","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 10. 1778","summary":"21. 10. 1778 (měsíc z přehledu stránky) pokřtěn František Serafínský, syn Georga Starého, sedláka, a Mariny, Petrovice čp. 14 nebo 17. Kmotři Wenceslaus Plachetka, řezník, a Catharina, žena Thomase Šknosky (?), sedláka v Petrovicích. Ztotožnění s Franzem Starým z čp. 17, otcem Anny * 1817, je AI hypotéza."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."}],"provenance":"Matriční zápis"},"p365":{"id":"p365","pid":365,"name":"Marina Lukešová","display_name":"Marina Lukešová","maiden_line":"","years":"","status":"prob","private":false,"facts":["× 11. 11. 1777 Petrovice, Georg Starý"],"note":"Dcera Georga Lukeše. Oddací zápis uvádí dispens pro pokrevenství ve 3. stupni s ženichem. Pravděpodobná matka Franze Starého. Prameny: Matriční zápis: Křest Františka, syna Georga Starého a Mariny; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové","sources":[{"key":"petrovice_krest_franz_stary_1778","label":"Křest Františka, syna Georga Starého a Mariny","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 10. 1778","summary":"21. 10. 1778 (měsíc z přehledu stránky) pokřtěn František Serafínský, syn Georga Starého, sedláka, a Mariny, Petrovice čp. 14 nebo 17. Kmotři Wenceslaus Plachetka, řezník, a Catharina, žena Thomase Šknosky (?), sedláka v Petrovicích. Ztotožnění s Franzem Starým z čp. 17, otcem Anny * 1817, je AI hypotéza."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."}],"provenance":"Matriční zápis"},"p640":{"id":"p640","pid":640,"name":"Matěj Mejstřík","display_name":"Matěj Mejstřík","maiden_line":"","years":"1713","status":"prob","private":false,"facts":["* 23. 2. 1713 Janovská Lhota, syn Matěje a Anny","× 12. 7. 1735 Uhlířské Janovice Anna Dobíhalová","Lhota, poddaný panství Šternberk","děti v rejstříku 1736–1759"],"note":"Křest, sňatek i křest syna Jana jsou přečteny přímo. Křest 1713 je jediný Matěj Mejstřík z Lhoty zapsaný v rejstříku jako dítě 1683–1730, proto se ztotožňuje se ženichem (AI závěr). Pravděpodobný je i vztah Jana * 1741 k Janovi z čp. 4. Prameny: Matriční zápis: Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty; Matriční zápis: Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové; Matriční zápis: Křest Jana, syna Matěje Mejstříka z Lhoty","sources":[{"key":"janovice_krest_matej_mejstrik_1713","label":"Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/48","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 2. 1713","summary":"Str. 103. Dítě jménem Matěj, otec Matěj Mejstřík, matka Anna. Kmotr Jan Dobíhal, svědek Josef Kula, kmotra Kateřina Šulgová, všichni z Janovic. Rok je z nadpisu na levé straně, den a měsíc z okraje a rejstříku 13249 sn. 97. V rejstříku 1683–1730 je to jediný Matěj Mejstřík z Lhoty zapsaný jako dítě, proto se ztotožňuje se ženichem z roku 1735."},{"key":"janovice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."},{"key":"janovice_krest_jan_mejstrik_1741","label":"Křest Jana, syna Matěje Mejstříka z Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/146","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 5. 1741","summary":"Lhota, str. 294. Jan, narozený a pokřtěný 11. května, otec Matěj Mejstřík, matka Anna, poddaní panství Šternberk. Kmotři Václav Červinka(?) a Václav Čech z Janovic, Barbara Malinová z Lhoty. Rok 1741 potvrzuje rejstřík 13249 sn. 98 (tom II, fol. 294). Že je to pozdější otec dětí v Lhotě čp. 4, není doloženo přímo."}],"provenance":"Matriční zápis"},"p641":{"id":"p641","pid":641,"name":"Anna Dobíhalová","display_name":"Anna Dobíhalová","maiden_line":"","years":"","status":"prob","private":false,"facts":["dcera Františka Dobíhala z Janovic","× 12. 7. 1735 Matěj Mejstřík"],"note":"Prameny: Matriční zápis: Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","sources":[{"key":"janovice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."}],"provenance":"Matriční zápis"},"p708":{"id":"p708","pid":708,"name":"Niklas Womačka (Vomáčka)","display_name":"Niklas Womačka (Vomáčka)","maiden_line":"","years":"asi 1695–1785","status":"doc","private":false,"facts":["* asi 1695","× 9. 1. 1734 Petrovice, Catharina Hadenka (?)","× 22. 11. 1739 Petrovice, vdovec, Marina Slámová (?)","sedlák, Petrovice čp. 12","† 5. 10. 1785 Petrovice čp. 12, 90 let"],"note":"Otec Václava podle sňatku 1772. Ztotožnění se zemřelým 1785 z čp. 12 je AI závěr opřený o jméno, stav a dům. Ztotožnění se ženichem 1734 a 1739 je AI závěr opřený o jméno a ves; roku 1734 by mu bylo asi 39 let. Prameny: Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Úmrtí Niklase Vomáčky, sedláka v Petrovicích čp. 12; Matriční zápis: První sňatek Niklase Vomáčky; Matriční zápis: Druhý sňatek Niklase Vomáčky; Matriční zápis: Křest Thomase, syna Niklase Vomáčky","sources":[{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"petrovice_umrti_niklas_womacka_1785","label":"Úmrtí Niklase Vomáčky, sedláka v Petrovicích čp. 12","url":"https://www.mza.cz/actapublica/matrika/detail/6802?image=216000010-000253-003380-000000-015940-000000-00-B07660-00560.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"5. 10. 1785","summary":"5. 10. 1785 zemřel Niklas Vomáčka, sedlák, Petrovice čp. 12, 90 let, tedy narozen asi 1695. Ztotožnění s otcem Václava je AI závěr opřený o jméno, stav a dům."},{"key":"petrovice_snatek_niklas_womacka_catharina_hadenka_1734","label":"První sňatek Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 1. 1734","summary":"9. 1. 1734 se v Petrovicích oženil mládenec Nicolaus Womaczka s Catharinou, dcerou Jakuba Hadenky (?). Příjmení nevěsty je čteno nejistě. Ztotožnění se sedlákem Niklasem z čp. 12 je AI závěr opřený o jméno, ves a následující sňatek téhož jména."},{"key":"petrovice_snatek_niklas_womacka_marina_slama_1739","label":"Druhý sňatek Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1739 (rok z pořadí zápisů)","summary":"22. 11. 1739 se v Petrovicích oženil vdovec Nicolaus Womaczka label":"Druhý sňatek Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1739 (rok z pořadí zápisů)","summary":"22. 11. 1739 se v Petrovicích oženil vdovec Nicolaus Womaczka s pannou Marinou Slámovou (?). Svědci Joa. Womaczka a Joannes Raubal. Příjmení nevěsty je čteno nejistě; dlouhé s ve tvaru Flama odpovídá Sláma (AI čtení)."},{"key":"petrovice_krest_thomas_vomacka_1745","label":"Křest Thomase, syna Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02210.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 12. 1745 (měsíc z pořadí zápisů)","summary":"17. 12. 1745 v Petrovicích pokřtěn Thomas, syn Nicolause Vomáčky a Marianny. Kmotři Christian Humlíček z Petrovic a Marianna Cínová (?) z Nového Města."}],"provenance":"Matriční zápis"},"p710":{"id":"p710","pid":710,"name":"Václav Vávra","display_name":"Václav Vávra","maiden_line":"","years":"† před 1772","status":"doc","private":false,"facts":["sedlák, Pohledec","† před 22. 11. 1772"],"note":"Otec Kateřiny, při jejím sňatku 1772 uveden jako zemřelý. V Pohledci křtí s manželkou Annou 1742 a 1743 (MZA 15918). Že jde o téhož muže, je AI závěr opřený o jméno a ves; Kateřinin vlastní křest asi 1753 ještě není přečten. Prameny: Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Křest Václava, syna Václava Vávry z Pohledce; Matriční zápis: Křest Marianny, dcery Václava Vávry z Pohledce","sources":[{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"pohledec_krest_wenzl_vavra_1743","label":"Křest Václava, syna Václava Vávry z Pohledce","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-01890.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 9. 1743","summary":"V Pohledci pokřtěn Wenceslaus, rodiče Wenceslaus Vavra a Anna; kmotři Joannes Fiala a Mariana Cotoviciana z Nového Města. Doklad manželky Václava Vávry."},{"key":"pohledec_krest_marianna_vavrova_1742","label":"Křest Marianny, dcery Václava Vávry z Pohledce","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-01800.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 12. 1742","summary":"V Pohledci pokřtěna Marianna, u jména křížek; rodiče Wenceslaus Vavrous a Anna; kmotři Joannes Fiala a Mariana Cotovicz z Nového Města. Stejní kmotři jako v roce 1743, proto jde o týž pár (AI závěr)."}],"provenance":"Matriční zápis"},"p720":{"id":"p720","pid":720,"name":"Thomas Starý","display_name":"Thomas Starý","maiden_line":"","years":"asi 1704–1772","status":"doc","private":false,"facts":["* asi 1704","× 19. 1. 1740 Petrovice, Marina Mrázová (ztotožnění nejisté)","sedlák, Petrovice čp. 17","† 27. 7. 1772 Petrovice čp. 17, 68 let"],"note":"Nejstarší zatím doložený Starý této větve. Oddací zápisy 1774 a 1777 uvádějí syny Joannese a Georga a dceru Juditu jako děti zemřelého Thomase Starého, sedláka. Ztotožnění se zemřelým 1772 z čp. 17 je AI závěr opřený o jméno, stav a dům; příjmení je v zápisu úmrtí psáno Staržik (?). Prameny: Matriční zápis: Úmrtí Thomase Starého, sedláka v Petrovicích čp. 17; Matriční zápis: Sňatek Thomase Starého (?) a Mariny Mrázové; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové; Matriční zápis: Sňatek Joannese Starého a Anny Penias; Matriční zápis: Sňatek Jakoba Lukeše a Judity Staré","sources":[{"key":"petrovice_umrti_thomas_stary_1772","label":"Úmrtí Thomase Starého, sedláka v Petrovicích čp. 17","url":"https://www.mza.cz/actapublica/matrika/detail/6801?image=216000010-000253-003380-000000-015939-000000-00-B07659-00320.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 7. 1772","summary":"27. 7. 1772 zemřel Thomas Staržik (Starý), sedlák, Petrovice čp. 17, 68 let, tedy narozen asi 1704. Rok plyne z nadpisu následujícího snímku. Ztotožnění s otcem Joannese, Georga a Judity Starých je AI závěr opřený o jméno, sedláctví, dům 17 a jejich oddací zápisy z let 1774 a 1777, které ho uvádějí jako zemřelého."},{"key":"petrovice_snatek_thomas_stary_marina_mrazova_1740","label":"Sňatek Thomase Starého (?) a Mariny Mrázové","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 1. 1740 (měsíc a rok z pořadí zápisů)","summary":"19. 1. 1740 se v Petrovicích oženil mládenec Thomas St?ri?ý s pannou Marinou Mrázovou (Mrazin). Svědci Georgius Ušilík (?), Georgius Jedlík. Příjmení ženicha je v zápisu čteno nejistě, shoda se Starým ze zápisu o úmrtí 1772 je AI hypotéza."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."},{"key":"petrovice_snatek_joannes_stary_anna_penias_1774","label":"Sňatek Joannese Starého a Anny Penias","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00200.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1774","summary":"V únoru 1774 (den čten 6 nebo 9) se v Petrovicích čp. 17 oženil Joannes, syn zemřelého Thomase Starého, sedláka, s Annou, dcerou zemřelého Christiana Peniase, sedláka ze Žďáru (Zubří), s konzistorním dispenzem."},{"key":"petrovice_snatek_jakob_lukes_juditha_stara_1774","label":"Sňatek Jakoba Lukeše a Judity Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00200.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1774","summary":"V únoru 1774 (den čten 6 nebo 9) se oženil Jakob, syn Georga Lukeše, sedláka, s Juditou, dcerou zemřelého Thomase Starého, sedláka, oba z Petrovic, čp. 28, s konzistorním dispenzem."}],"provenance":"Matriční zápis"},"p721":{"id":"p721","pid":721,"name":"Marina Mrázová","display_name":"Marina Mrázová","maiden_line":"","years":"","status":"prob","private":false,"facts":["× 19. 1. 1740 Petrovice, Thomas St?ri?ý (Starý?)"],"note":"Pravděpodobná žena Thomase Starého a matka Georga. Příjmení ženicha je v oddacím zápisu 1740 čteno nejistě a křest Georga zatím není přečten, takže ztotožnění je AI hypotéza. Prameny: Matriční zápis: Sňatek Thomase Starého (?) a Mariny Mrázové","sources":[{"key":"petrovice_snatek_thomas_stary_marina_mrazova_1740","label":"Sňatek Thomase Starého (?) 1774","label":"Sňatek Jakoba Lukeše a Judity Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00200.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1774","summary":"V únoru 1774 (den čten 6 nebo 9) se oženil Jakob, syn Georga Lukeše, sedláka, s Juditou, dcerou zemřelého Thomase Starého, sedláka, oba z Petrovic, čp. 28, s konzistorním dispenzem."},{"key":"petrovice_snatek_georg_lukes_mariana_stara_1742","label":"Sňatek Georga Lukeše a Mariany Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01500.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 10. 1742 (rok z pořadí zápisů)","summary":"14. 10. 1742 se v Petrovicích oženil mládenec Georgius Lucas s pannou Marianou, dcerou zemřelého Jakuba Starého. Svědci Martinus Srnský z Vlachovic a Josephus Janíček. Nadpis roku 1743 je až na následujícím snímku."},{"key":"petrovice_krest_jacobus_lukes_1746","label":"Křest Jakuba, syna Georga Lukeše","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02270.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"duben 1746","summary":"V dubnu 1746 v Petrovicích pokřtěn Jacobus, syn Georga Lucase a Marianny. Kmotři Wenceslaus Clapač a Marianna Jelínková, oba z Nového Města. Tentýž Jakub je pravděpodobně ženich sňatku 1774 (AI hypotéza)."}],"provenance":"Matriční zápis"},"p731":{"id":"p731","pid":731,"name":"Mariana Stará","display_name":"Mariana Stará","maiden_line":"","years":"","status":"prob","private":false,"facts":["dcera † Jakuba Starého, Petrovice","× 14. 10. 1742 Petrovice, Georg Lukeš"],"note":"Pravděpodobná matka Mariny Lukešové. Rodina Starých vysvětluje dispens pro pokrevenství ve 3. stupni při sňatku 1777 (AI hypotéza, neověřeno). Prameny: Matriční zápis: Sňatek Georga Lukeše a Mariany Staré; Matriční zápis: Křest Jakuba, syna Georga Lukeše","sources":[{"key":"petrovice_snatek_georg_lukes_mariana_stara_1742","label":"Sňatek Georga Lukeše a Mariany Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01500.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 10. 1742 (rok z pořadí zápisů)","summary":"14. 10. 1742 se v Petrovicích oženil mládenec Georgius Lucas s pannou Marianou, dcerou zemřelého Jakuba Starého. Svědci Martinus Srnský z Vlachovic a Josephus Janíček. Nadpis roku 1743 je až na následujícím snímku."},{"key":"petrovice_krest_jacobus_lukes_1746","label":"Křest Jakuba, syna Georga Lukeše","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02270.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"duben 1746","summary":"V dubnu 1746 v Petrovicích pokřtěn Jacobus, syn Georga Lucase a Marianny. Kmotři Wenceslaus Clapač a Marianna Jelínková, oba z Nového Města. Tentýž Jakub je pravděpodobně ženich sňatku 1774 (AI hypotéza)."}],"provenance":"Matriční zápis"},"p1280":{"id":"p1280","pid":1280,"name":"Matěj Mejstřík","display_name":"Matěj Mejstřík","maiden_line":"","years":"asi 1681","status":"prob","private":false,"facts":["* asi 1681 (výpočet z věku)","× Anna, děti v rejstříku 1705–1724","† 3. 5. 1735 Lhota, věk 54(?)"],"note":"Sňatek syna ho uvádí jako zemřelého: „filius post defunctum Mathiam Meystrzik ex pago Lhota“. Úmrtí dva měsíce před touto svatbou a křest syna 1713 tomu odpovídají. Jeho rodiče nejsou doloženi; rejstřík oddaných 1697–1703 má mezeru a kniha začíná rokem 1682. Prameny: Matriční zápis: Úmrtí Matěje Mejstříka z Lhoty; Matriční zápis: Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty; Matriční zápis: Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","sources":[{"key":"janovice_umrti_matej_mejstrik_1735","label":"Úmrtí Matěje Mejstříka z Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/269","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 5. 1735","summary":"Str. 543. Zemřel Matěj Mejstřík, věku 54(?) let, zaopatřen všemi svátostmi. Dům neuveden. Rok potvrzuje rejstřík 13254 sn. 46. Dva měsíce nato se 12. 7. 1735 ženil syn Matěj jako syn po zemřelém Matějovi."},{"key":"janovice_krest_matej_mejstrik_1713","label":"Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/48","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 2. 1713","summary":"Str. 103. Dítě jménem Matěj, otec Matěj Mejstřík, matka Anna. Kmotr Jan Dobíhal, svědek Josef Kula, kmotra Kateřina Šulgová, všichni z Janovic. Rok je z nadpisu na levé straně, den a měsíc z okraje a rejstříku 13249 sn. 97. V rejstříku 1683–1730 je to jediný Matěj Mejstřík z Lhoty zapsaný jako dítě, proto se ztotožňuje se ženichem z roku 1735."},{"key":"janovice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."}],"provenance":"Matriční zápis"},"p1281":{"id":"p1281","pid":1281,"name":"Anna","display_name":"Anna","maiden_line":"","years":"","status":"prob","private":false,"facts":["× Matěj Mejstřík","matka dětí 1705–1724, Lhota"],"note":"Rodné příjmení zatím neznámé. Kmotr Jan Dobíhal z roku 1713 sdílí příjmení s pozdější snachou Annou, příbuzenství nedoloženo. Prameny: Matriční zápis: Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty","sources":[{"key":"janovice_krest_matej_mejstrik_1713","label":"Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/48","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 2. 1713","summary":"Str. 103. Dítě jménem Matěj, otec Matěj Mejstřík, matka Anna. Kmotr Jan Dobíhal, svědek Josef Kula, kmotra Kateřina Šulgová, všichni z Janovic. Rok je z nadpisu na levé straně, den a měsíc z okraje a rejstříku 13249 sn. 97. V rejstříku 1683–1730 je to jediný Matěj Mejstřík z Lhoty zapsaný jako dítě, proto se ztotožňuje se ženichem z roku 1735."}],"provenance":"Matriční zápis"},"p1282":{"id":"p1282","pid":1282,"name":"František Dobíhal","display_name":"František Dobíhal","maiden_line":"","years":"","status":"doc","private":false,"facts":["otec Anny Dobíhalové (sňatek 1735)","z městečka Janovic podle sňatku dcery 1735"],"note":"Ve sňatku Matěje Mejstříka a Anny z 12. 7. 1735 přímo jmenován jako otec nevěsty: Francisci Dobihal ex oppido Janovitz. Vlastní narození, úmrtí, povolání, manželka ani rodiče neurčeni. Ztotožnění oddaného páru s přímou starší linií zůstává pravděpodobné; tato nová osoba je sama nezesiluje. Prameny: Matriční zápis: Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","sources":[{"key":"janovice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."}],"provenance":"Matriční zápis"},"p1462":{"id":"p1462","pid":1462,"name":"Jakub Starý","display_name":"Jakub Starý","maiden_line":"","years":"† před 1742","status":"prob","private":false,"facts":["Petrovice","† před 14. 10. 1742"],"note":"Otec Mariany, při jejím sňatku 1742 uveden jako zemřelý. V místní větvi Starých je to zatím nejstarší jmenovaný předek. V oddacích zápisech 1743 je zemřelý Jakub Starý také otcem Josepha, Anny a Jakuba (AI čtení, přehled). Prameny: Matriční zápis: Sňatek Georga Lukeše a Mariany Staré","sources":[{"key":"petrovice_snatek_georg_lukes_mariana_stara_1742","label":"Sňatek Georga Lukeše a Mariany Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01500.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 10. 1742 (rok z pořadí zápisů)","summary":"14. 10. 1742 se v Petrovicích oženil mládenec Georgius Lucas s pannou Marianou, dcerou zemřelého Jakuba Starého. Svědci Martinus Srnský z Vlachovic a Josephus Janíček. Nadpis roku 1743 je až na následujícím snímku."}],"provenance":"Matriční zápis"},"anna_prochazkova_2024":{"id":"anna_prochazkova_2024","pid":null,"name":"Anna Procházková","display_name":"Anna Procházková (* 2024)","maiden_line":"","years":"* 1. 6. 2024","status":"fam","private":false,"facts":["* 1. 6. 2024"],"note":"Sestra výchozí osoby Aleše2022; dcera Aleše Procházky1985 a Pavlíny Procházkové rozené Švancarové1989. Přímá oprava Aleše Procházky 5. 11. 2026; starší2025 nahrazeno. Úplné datum jen v udaje_od_rodiny.md.","sources":[],"provenance":"Údaj od rodiny"},"side-01-sourozenci-josefa-mejstrika-1815":{"id":"side-01-sourozenci-josefa-mejstrika-1815","source_id":"","anchor":80,"name":"Sourozenci Josefa Mejstříka (* 1815)","year":"","status":"doc","private":false,"facts":[],"note":"Podle rejstříku narozených Uhlířských Janovic, Lhota čp. 29: Jan 9. 12. 1811, Marie 20. 6. 1813, Anna 7. 5. 1818, František 13. 2. 1821, Václav 19. 8. 1824.","sources":[{"key":"lhota_rejstrik_deti_josef_mejstrik_1815_1818","label":"Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/101","kind":"N","date":"1811–1818","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Rejstřík narozených Uhlířské Janovice, pravá strana. Ve Lhotě čp. 29, otec Josef, matka Magdalena: Josef 14. 8. 1815 (tom VI, fol. 18) a Anna 7. 5. 1818 (tom VI, fol. 21). Podle stejné strany patří do řady i Jan 9. 12. 1811 (fol. 15) a Marie 20. 6. 1813 (fol. 16). Rejstřík je pozdější pomůcka, samotné křty nejsou v tomto zápisu."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1821_1824","label":"Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/102","kind":"N","date":"1821–1824","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Rejstřík narozených Uhlířské Janovice, levá strana. Ve Lhotě čp. 29, rodiče Josef a Magdalena: František 13. 2. 1821 (tom VI, fol. 27) a Václav 19. 8. 1824 (tom VI, fol. 31). Řádky se v rejstříku svažují, data jsou čtena po sklonu řádku."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":"","role":"","name_flags":[]},"side-03-bozena-milada-mrkvickova-19-12-1922-14-1-1":{"id":"side-03-bozena-milada-mrkvickova-19-12-1922-14-1-1","source_id":"","anchor":11,"name":"Božena Milada Mrkvičková (19. 12. 1922 – 14. 1. 1923)","year":"","status":"doc","private":false,"facts":[],"note":"Dítě z domu Petrovice čp. 28, dcera Františka Mrkvičky * 1873 a Matyldy (Matildy) Julisové * 1894 ze Žubří, oddaných 23. 9. 1919 v Olešné. Zemřela necelý měsíc stará, není to tedy pozdější paní Mejstříková. Podle rodného listu dcery babičky Boženy z roku 1955 jde pravděpodobně o její starší sestru; rodné příjmení matky má v listu odlišný zápis Tulisová.","sources":[{"key":"petrovice_krest_bozena_milada_mrkvickova_1922","label":"Křest Boženy Milady Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01910.jp2","  const sourceKinds={N:'Narození a křest',O:'Sňatek',Z:'Úmrtí',J:'Jiný doklad'};const sources=(p.sources||[]).filter(s=>s&&[s.label,s.date,s.kind,s.provenance,s.summary,s.url].some(v=>String(v??'').trim()));if(sources.length)h+='<h3>Připojené záznamy</h3>'+sources.map(s=>{const label=String(s.label||'Připojený záznam'),kind=String(s.kind||''),kindLabel=sourceKinds[kind]||kind,prov=String(s.provenance||''),date=String(s.date||''),url=String(s.url||'');const safeUrl=/^https?:\/\//i.test(url)?url:'';let body='<dl class="source-meta">';if(date)body+=`<dt>Datování pramene</dt><dd>${esc(date)}</dd>`;if(kind)body+=`<dt>Druh záznamu</dt><dd>${esc(kindLabel)}</dd>`;if(prov)body+=`<dt>Provenience</dt><dd>${esc(prov)}</dd>`;body+='</dl>';if(s.summary)body+=`<p><strong>Shrnutí</strong></p><p>${esc(s.summary)}</p>`;if(safeUrl)body+=`<p><a href="${esc(safeUrl)}" target="_blank" rel="noopener">Otevřít pramen</a></p>`;return `<details class="source-record"><summary>${esc(label)}</summary><div class="source-record-body">${body}</div></details>`}).join('');document.querySelector('#detail').innerHTML=h;document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));if(!dialog.open)dialog.showModal();dialog.scrollTop=0;
}
Object.entries(D.branches).forEach(([id,b])=>{const x=document.createElement('button');x.dataset.id=id;x.textContent=b.title;x.onclick=()=>choose(id);tabs.append(x)});document.querySelector('#updated').textContent=D.updated+' · '+Object.keys(D.people).length+' osob v přehledu';
document.querySelector('#close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()}};
q.oninput=()=>{const s=q.value.trim().toLocaleLowerCase('cs');const hits=s?Object.entries(D.people).filter(([id,p])=>(pname(p)+' '+years(p)).toLocaleLowerCase('cs').includes(s)).slice(0,10):[];results.innerHTML=hits.map(([id,p])=>`<li><button data-person="${esc(id)}">${esc(pname(p))}<small>${esc(years(p))}</small></button></li>`).join('');results.querySelectorAll('button').forEach(b=>b.onclick=()=>{const id=b.dataset.person;results.innerHTML='';focusPerson(id);openPerson(id)})};q.onkeydown=e=>{if(e.key==='Escape')results.innerHTML='';if(e.key==='Enter')results.querySelector('button')?.click()};
document.querySelector('#zin').onclick=()=>zoomAt(scale*1.25);document.querySelector('#zout').onclick=()=>zoomAt(scale/1.25);document.querySelector('#fit').onclick=fit;document.querySelector('#readable').onclick=readable;
vp.addEventListener('pointerdown',e=>{if(e.button!==0)return;vp.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){tap={id:e.target.closest('.card')?.dataset.id,x:e.clientX,y:e.clientY};dragged=false}else{tap=null;dragged=true}vp.classList.add('dragging')});
vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=[...pointers.values()],prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>7)dragged=true;if(pointers.size===1){tx+=e.clientX-prev.x;ty+=e.clientY-prev.y;apply()}else if(pointers.size===2){const next=[...pointers.values()],mid=a=>({x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}),dist=a=>Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),a=mid(old),b=mid(next),rect=vp.getBoundingClientRect(),d=dist(old);if(d>0)zoomAt(scale*dist(next)/d,a.x-rect.left,a.y-rect.top);tx+=b.x-a.x;ty+=b.y-a.y;apply()}});
function up(e){const open=pointers.size===1&&tap&&!dragged?tap.id:null;pointers.delete(e.pointerId);tap=null;if(!pointers.size)vp.classList.remove('dragging');if(open&&e.type!=='pointercancel')openPerson(open)}vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);vp.addEventListener('lostpointercapture',e=>{pointers.delete(e.pointerId);if(!pointers.size)vp.classList.remove('dragging')});
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(scale*(e.deltaY<0?1.12:1/1.12),e.clientX-r.left,e.clientY-r.top)},{passive:false});
window.addEventListener('resize',()=>{if(vp.clientWidth!==layoutWidth){render();readable();return}tx=Math.min(vp.clientWidth-40,tx);ty=Math.min(vp.clientHeight-40,ty);apply()});window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(D.branches[k]&&k!==branch)choose(k)});render();readable();
