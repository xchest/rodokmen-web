ish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis"},"p86":{"id":"p86","pid":86,"name":"Jan Krieger","display_name":"Jan Krieger","maiden_line":"","years":"* 22. 9. 1837","status":"doc","private":false,"facts":["* 22. 9. 1837 Dlouhá Louka čp. 9; pokřtěn téhož dne jako Jan Nepomuk","× 22. 10. 1867 Marie Lautnerová; ženich 30 let","domkář, Dlouhá Louka čp. 9"],"note":"Křest Jana Nepomuka 22. 9. 1837 osobně znovu přečten v originálu i detailu. Totožnost s ženichem 1867 a otcem Markéty 1878 je přijatý silný AI závěr ze shody obou rodičů Josefa Kriegera a Kateřiny Sedláčkové, domu 9, původu matky z čp. 5 a věku 30 let. Zápis nemá přečtený pozdější oddací přípis; tato totožnost není doslovnou větou pramene. Noví prarodiče jsou výslovně jmenováni v křtu 1837. Kandidátní sňatek rodičů 1829 a censusové identity zůstávají samostatně neuzavřené. Roku 1899 svolil k sňatku dcery třemi křížky. Prameny: Matriční zápis: Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových; Matriční zápis: Sňatek Josefa Majera a Markéty Kriegrové","sources":[{"key":"dlouha_louka_krest_jan_krieger_1837","label":"Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","url":"https://www.portafontium.eu/iipimage/30067683/prestice-33_0160-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1837","summary":"Jan Nepomuk (dobový pravopis Krygr, normalizováno Krieger) se narodil a téhož dne byl pokřtěn 22. září 1837 v Dlouhé Louce čp. 9. Otec Josef Krieger, domkář, syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny; matka Kateřina, dcera Antonína Sedláčka, domkáře z Dlouhé Louky čp. 5, a Kateřiny. Rodná příjmení obou babiček a jejich místa původu nejsou bezpečně určena. Silná AI hypotéza (neověřeno): jde o Jana Kriegera ze sňatku 22. října 1867 a otce Markéty z roku 1878, podle shody obou rodičů, domů 9 a 5 a věku 30 let ve sňatku. Přímý spojovací přípis není uveden. Kandidátní sňatek rodičů z roku 1829 zůstává samostatnou hypotézou kvůli nevysvětlenému rozdílu čp. 13 a 5."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis","birth_date":"1837-09-22"},"p87":{"id":"p87","pid":87,"name":"Marie Lautnerová","display_name":"Marie Lautnerová","maiden_line":"","years":"* 1837","status":"doc","private":false,"facts":["* 17. 7. 1837 Skočice čp. 2; pokřtěna 18. 7.","× 22. 10. 1867 Jan Krieger, ve sňatku 30 let"],"note":"Křest 1837 přímo jmenuje Martina Lautnera, domkáře a tkalce ze Skočic č. 2, a Marii, dceru Josefa Tichoty z Elhovic č. 64. Totožnost s nevěstou 1867 je silný AI závěr ze shody obou rodičů, řemesla, domů 2/64 a věku 30 let; výslovný pozdější oddací odkaz zde není. Ztotožnění s matkou Markéty 1878 podporuje stejný pár, všichni čtyři rodiče a domy. Datum 17./18. července bylo ověřeno na samostatném zvětšení; předběžné 11. července se ruší. Prameny: Matriční zápis: Narození a křest Marie Lautnerové ze Skočic; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových; Matriční zápis: Sňatek Josefa Majera a Markéty Kriegrové","sources":[{"key":"skocice_krest_marie_lautnerova_1837","label":"Narození a křest Marie Lautnerové ze Skočic","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_0340-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 7. 1837","summary":"Přeštice 31 sn. 34, pravá strana pag. 33, rok 1837, poslední řádek v červenci. Marie Lautnerová se narodila 17. 7. 1837 ve Skočicích čp. 2 a byla pokřtěna 18. 7. Otec Martin Lautner, domkář a tkadlec, syn Jana Lautnera, domkáře a tkalce z Poříčí č. 2, a Anny ze Skočic č. 60; její rodné příjmení není bezpečně přečteno. Matka Marie, dcera Josefa Tichoty, mistra kovářského z Elhovic č. 64, a Anny z Dolan; její rodné příjmení není bezpečně přečteno. Ztotožnění dítěte s nevěstou Janova Kriegera 22. 10. 1867 a matkou Markéty 1878 je silný AI závěr ze shody obou rodičů, Martinova řemesla, domů 2/64 a věku 30 let ve sňatku. Není zde výslovný pozdější oddací odkaz. Rodná příjmení obou babiček zůstávají otevřená."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis"},"p88":{"id":"p88","pid":88,"name":"Vincenc Mrkvička","display_name":"Vincenc Mrkvička","maiden_line":"","years":"* 1812","status":"doc","private":false,"facts":["* 16. 9. 1812 Petrovice čp. 4","× 27. 2. 1843 Terezie Sedláková","podruh, Petrovice"],"note":"Otec staršího Františka Mrkvičky. Vlastní křest (MZA 15921, sn. 88) a sňatek (MZA 15934, sn. 99) čteny přímo; sňatek proběhl až po narození syna 6. 11. 1842. Ztotožnění křtu 1812 se ženichem 1843 je opřené o stejné jméno, otce Johanna a čp. 4 (AI čtení). Úmrtí nenalezeno. Prameny: Matriční zápis: Narození a křest Vincence Mrkvičky; Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové; Matriční zápis: Narození a křest Františka Mrkvičky staršího; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_krest_vincenc_mrkvicka_1812","label":"Narození a křest Vincence Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 9. 1812","summary":"Vincenc se narodil 16. a pokřtěn byl 17. září 1812 v Petrovicích čp. 4 jako syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky (Vomáčky). Rok je určen ze sousedních záhlaví knihy (1812, 1813). Příjmení matky je čteno ve srovnání se sňatkem 1805 a křty 1805 a 1823 (AI čtení)."},{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého sedláka Johanna Sedláka a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842)."},{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích se 6. 11. 1842 narodil Franz (František) Mrkvička, syn Vincence Mrkvičky a Terezie. Příjmení matky Sedláková potvrzuje až jeho sňatek v roce 1870. Stejná jména rodičů a věk ženicha 27 let v roce 1870 podporují ztotožnění dítěte s otcem Františka narozeného roku 1873; další rodinné údaje v křestním řádku zatím nejsou bezpečně přečteny."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p89":{"id":"p89","pid":89,"name":"Terezie Sedláková","display_name":"Terezie Sedláková","maiden_line":"","years":"asi 1816","status":"doc","private":false,"facts":["× 27. 2. 1843 Vincenc Mrkvička","roku 1843 uveden věk 27 let","Petrovice"],"note":"Matka staršího Františka Mrkvičky. Dcera zemřelého sedláka Johanna Sedláka podle sňatku 1843 (MZA 15934, sn. 99); ročník odvozen z uvedeného věku. Vlastní křest neurčen, místo původu otce čteno jen nejistě (Diwischau?). Prameny: Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové; Matriční zápis: Narození a křest Františka Mrkvičky staršího; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého sedláka Johanna Sedláka a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842)."},{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích se 6. 11. 1842 narodil Franz (František) Mrkvička, syn Vincence Mrkvičky a Terezie. Příjmení matky Sedláková potvrzuje až jeho sňatek v roce 1870. Stejná jména rodičů a věk ženicha 27 let v roce 1870 podporují ztotožnění dítěte s otcem Františka narozeného roku 1873; další rodinné údaje v křestním řádku zatím nejsou bezpečně přečteny."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p90":{"id":"p90","pid":90,"name":"Josef Starý","display_name":"Josef Starý","maiden_line":"","years":"* 1815","status":"doc","private":false,"facts":["* 20. 2. 1815 (?) Petrovice čp. 3","× 26. 10. 1841 Petrovice, Anna Stará","roku 1841 uveden věk 25 let","rolník v Petrovicích čp. 3","† před 8. 8. 1870"],"note":"Otec Josefy Starých; při jejím sňatku 1870 uveden jako zemřelý. Sňatek 1841 (MZA 15934, sn. 98) čten v prohlížeči; shoda jména, obce, čp. 3 s křtem dcery 1846 a rodného příjmení manželky. Připojen je křest Josefa z 20. 2. 1815 (?) v Petrovicích čp. 3 (MZA 15921, sn. 90); měsíc je čten nejistě. Ztotožnění pokřtěného s ženichem roku 1841 je AI hypotéza (neověřeno) podle jména, rodičů a domu; věk 25 let při sňatku je přibližně o rok nižší, než odpovídá křtu. Prameny: Matriční zápis: Křest Josefa Starého; Matriční zápis: Sňatek Josefa Starého a Anny Staré; Matriční zápis: Křest Josefy Staré; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_krest_josef_stary_1815","label":"Křest Josefa Starého","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00900.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 2. 1815","summary":"V Petrovicích čp. 3 byl 20. 2. 1815 pokřtěn Josef, syn sedláka Thomase Starého a Marianny, dcery sedláka Sabliha. Rok je převzat z nadpisu oddílu Anno 1815; měsíc je čten nejistě, protože na levé straně zápisy dojdou k dubnu. Ztotožnění se ženichem 1841 je AI závěr opřený o jméno, otce, jméno matky a čp. 3; věk 25 při sňatku je o rok nižší, než dává křest."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. Rodná příjmení matek jsou čtena nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."},{"key":"petrovice_krest_josefa_stara_1846","label":"Křest Josefy Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01110.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 7. 1846","summary":"10. 7. 1846 byla v Petrovicích čp. 3 pokřtěna Josefa, dcera Josefa Starého. Sloupec matky je přepisovaný a jméno v něm není bezpečně čitelné; v popisu je Stary a vepsané Franz. Ztotožnění s Josefou, která se roku 1870 vdala za Františka Mrkvičku, je AI hypotéza opřená o jméno, otce, obec a věk 24 let."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p91":{"id":"p91","pid":91,"name":"Anna Stará","display_name":"Anna Stará","maiden_line":"","years":"* 1817","status":"doc","private":false,"facts":["* 31. 12. 1817 Petrovice čp. 17","× 26. 10. 1841 Petrovice, Josef Starý","roku 1841 uveden věk 24 let"],"note":"Matka Josefy Starých; rodné příjmení Stará potvrzuje její vlastní sňatek 1841, kde je dcerou Franze Starého. Dřívější kandidát na úmrtí, Anna Stará, výměnice, † 22. 11. 1906 Petrovice, 80 let (MZA 15943, sn. 141), by byl o devět let mladší, než dává věk při sňatku; ztotožnění je slabá AI hypotéza. Připojen je křest Anny z 31. 12. 1817 v Petrovicích čp. 17 (MZA 15921, sn. 92); ztotožnění s nevěstou roku 1841 je AI hypotéza (neověřeno) podle jména, otce a domu. Příjmení matky v přepisu křtu zůstává nejisté. Prameny: Matriční zápis: Křest Anny Staré; Matriční zápis: Sňatek Josefa Starého a Anny Staré; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_krest_anna_stara_1817","label":"Křest Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00920.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 12. 1817","summary":"V Petrovicích čp. 17 byla 31. 12. 1817 pokřtěna Anna, dcera sedláka Franze Starého a Anny, dcery Franze Suka (?), mlynáře. Ztotožnění s nevěstou 1841 je AI závěr opřený o jméno, otce a čp. 17. Čtení příjmení matky je nejisté."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. Rodná příjmení matek jsou čtena nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p92":{"id":"p92","pid":92,"name":"Martin Julis","display_name":"Martin Julis","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář v Branišově (1842)","ženich 21. 6. 1834, 27 let"],"note":"Otec Josefa Julise, jmenovaný v jeho křtu 1842 i sňatku 1893 a v křtu vnučky Matyldy 1894. Sňatek 1834 přímo jmenuje ženicha Martina a jeho rodiče Josefa Julise a Terezii; její rodné příjmení není bezpečně přečteno. Ztotožnění tohoto páru s rodiči Josefa 1842 je silný AI závěr podle jmen, Branišova a Tereziina otce Jiřího Brhela. Vlastní křest nenalezen; věk není přesné datum narození. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Pravá strana, rok 1842, zápis č. 4: Joseph (Josef) se narodil 9. února a byl pokřtěn 10. února. Otec Martin Julis, domkář v Branišově; matka Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Číslo domu a další části rodičovských sloupců nejsou z tohoto čtení bezpečně určeny. Ztotožnění s Josefem Julisem, který se roku 1893 ženil v Žubří, je AI závěr ze shody obou rodičů a věku 51 let u sňatku (únor 1842 až listopad 1893)."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta (normalizovaně Augustová). Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny; její rodné příjmení nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p93":{"id":"p93","pid":93,"name":"Terezie Brhelová","display_name":"Terezie Brhelová","maiden_line":"","years":"","status":"doc","private":false,"facts":["dcera zemřelého Jiřího Brhela (1842)","nevěsta 21. 6. 1834, 25 let"],"note":"Matka Josefa Julise; v jeho křtu 1842 uvedena jako dcera již zemřelého Georga (Jiřího) Brhela. Sňatek 1893 a křest vnučky Matyldy 1894 opakují Terezii rozenou Brhel. Sňatek 1834 přímo jmenuje nevěstiny rodiče Jiřího Brhela a Annu; rodné příjmení matky není bezpečně přečteno. Ztotožnění nevěsty s touto osobou je silný AI závěr podle páru, obce a otce; ženská podoba Brhelová je normalizace. Nový kandidátní křest 31. 1. 1808, č. 7, má rodiče Jiřího Brhela a Annu; totožnost není uzavřena kvůli rozdílu věku 26 proti 25 letům ve sňatku 1834. Kandidát je popsán v HYPOTEZY, přesné narození není připojeno. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Pravá strana, rok 1842, zápis č. 4: Joseph (Josef) se narodil 9. února a byl pokřtěn 10. února. Otec Martin Julis, domkář v Branišově; matka Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Číslo domu a další části rodičovských sloupců nejsou z tohoto čtení bezpečně určeny. Ztotožnění s Josefem Julisem, který se roku 1893 ženil v Žubří, je AI závěr ze shody obou rodičů a věku 51 let u sňatku (únor 1842 až listopad 1893)."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta (normalizovaně Augustová). Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny; její rodné příjmení nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p94":{"id":"p94","pid":94,"name":"František Komínek","display_name":"František Komínek","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář v Jiříkovicích (1881–1894)"],"note":"Otec Marie Komínkové, přímo jmenovaný v jejích sňatcích 1881 a 1893 a v křtu vnučky Matyldy 1894. Vlastní křest a sňatek zatím nenalezeny. Prameny: Matriční zápis: Sňatek Antonína Hemzy a Marie Komínkové v Žubří; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří","sources":[{"key":"zubri_snatek_anton_hemza_marie_kominkova_1881","label":"Sňatek Antonína Hemzy a Marie Komínkové v Žubří","url":"https://matriky.online/brno/00016000/89/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 2. 1881","summary":"Pravá strana, oddíl Žubří. Dne 14. února 1881 se žení Anton Hemza, domkář v Žubří, s Marií Komínkovou, služkou v Žubří. Nevěsta je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta. Tato dvojice rodičů se shoduje s údaji o Marii Hemzové, rozené Komínkové, při jejím dalším sňatku s Josefem Julisem roku 1893. Ztotožnění obou oddacích zápisů je silný AI závěr ze shody obou jmen, prvního manžela a rodičů nevěsty. Ženichův sloupec uvádí otce Jana Hemzu a matku Františku; další drobné údaje a věky nejsou bezpečně přepsány. Sňatek sám neurčuje Mariino datum narození ani datum Antonínova úmrtí."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta (normalizovaně Augustová). Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny; její rodné příjmení nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."}],"provenance":"Matriční zápis"},"p95":{"id":"p95","pid":95,"name":"Kateřina Augustová","display_name":"Kateřina Augustová","maiden_line":"","years":"","status":"doc","private":false,"facts":["rodné příjmení v oddacích zápisech dcery 1881 a 1893: Augusta"],"note":"Matka Marie Komínkové podle jejích sňatků 1881 a 1893 a křtu vnučky Matyldy 1894. V původních oddacích zápisech čteno „Kateřiny roz. Augusta“; Augustová je normalizovaná ženská podoba. Vlastní křest a sňatek zatím nenalezeny. Marie z Jiříkovic čp. 21 narozená roku 1853 se stejnými jmény rodičů zůstává kandidátkou, nikoli prokázaně totožnou dcerou. Prameny: Matriční zápis: Sňatek Antonína Hemzy a Marie Komínkové v Žubří; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří","sources":[{"key":"zubri_snatek_anton_hemza_marie_kominkova_1881","label":"Sňatek Antonína Hemzy a Marie Komínkové v Žubří","url":"https://matriky.online/brno/00016000/89/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 2. 1881","summary":"Pravá strana, oddíl Žubří. Dne 14. února 1881 se žení Anton Hemza, domkář v Žubří, s Marií Komínkovou, služkou v Žubří. Nevěsta je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny rozené Augusta. Tato dvoji ní nelze z tohoto snímku bezpečně přečíst. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."}],"provenance":"Matriční zápis"},"p130":{"id":"p130","pid":130,"name":"František Procházka","display_name":"František Procházka","maiden_line":"","years":"","status":"doc","private":false,"facts":["půlsedlák ze Samechova čp. 18 — křest pravnuka1896","otec Marie Procházkové"],"note":"Jmenován spolu s Annou jako rodič Marie v otcovském sloupci křtu pravnuka Josefa27.11.1896. Osobní přejímka rootem a kontrolním agentem5.11.2026. Údaj se nepřebírá z dosud neztotožněného kandidátního křtu1854. Přesná životní data neznáma. Prameny: Matriční zápis: Křest Josefa Procházky","sources":[{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Údaj o narození Josefova otce 5. 5. 1854 není ztotožněn s kandidátním křtem 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“."}],"provenance":"Matriční zápis"},"p131":{"id":"p131","pid":131,"name":"Anna Kollmannová","display_name":"Anna Kollmannová","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka Marie Procházkové — křest pravnuka1896","původ z Piskočel/Pyskočel; čtení názvu zky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Údaj o narození Josefova otce 5. 5. 1854 není ztotožněn s kandidátním křtem 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“."}],"provenance":"Matriční zápis"},"p160":{"id":"p160","pid":160,"name":"Josef Mejstřík","display_name":"Josef Mejstřík","maiden_line":"","years":"asi 1783 – 1863","status":"doc","private":false,"facts":["půlsedlák, Janovická Lhota čp. 29","děti v rejstříku 1811–1824","† 4. 5. 1863 Lhota čp. 29, výminkář, vdovec, 80 let"],"note":"Otec Josefa * 1815 podle jeho křtu. V rejstříku narozených šest dětí s manželkou Magdalenou, Lhota čp. 29, 1811–1824. Pravděpodobný sňatek 6. 11. 1810 v Sudějově: Josef, syn Jana Mejstříka(?), chalupníka z Lhoty Janovské; nevěsta tam ale čtena Marjana(?), ne Magdalena (AI závěr, neověřeno). Pravděpodobný křest: Josef * 16./17. 4. 1791, Lhota čp. 4, syn Jana Mejstříka a Kateřiny; otec sedí se sňatkem, věk ne (1810 zapsáno 21(?) let, 1863 zapsáno 80 let, z křtu by vycházelo 19 a 72). Prameny: Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29; Matriční zápis: Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29; Matriční zápis: Úmrtí Josefa Mejstříka, výminkáře z Janovické Lhoty čp. 29","sources":[{"key":"lhota_krest_josef_mejstrik_1815","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13234/12","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 8. 1815","summary":"Josef se narodil 14. a byl pokřtěn 15. srpna 1815 ve Lhotě čp. 29 jako syn půlsedláka Josefa Mejstříka a Magdaleny Doudové ze Žandova. Rok potvrzuje rejstřík Uhlířské Janovice 24, sn. 101 (Lhotta 29, Tom VI, fol. 18)."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1815_1818","label":"Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/101","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1811–1818","summary":"Rejstřík narozených Uhlířské Janovice, pravá strana. Ve Lhotě čp. 29, otec Josef, matka Magdalena: Josef 14. 8. 1815 (tom VI, fol. 18) a Anna 7. 5. 1818 (tom VI, fol. 21). Podle stejné strany patří do řady i Jan 9. 12. 1811 (fol. 15) a Marie 20. 6. 1813 (fol. 16). Rejstřík je pozdější pomůcka, samotné křty nejsou v tomto zápisu."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1821_1824","label":"Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/102","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1821–1824","summary":"Rejstřík narozených Uhlířské Janovice, levá strana. Ve Lhotě čp. 29, rodiče Josef a Magdalena: František 13. 2. 1821 (tom VI, fol. 27) a Václav 19. 8. 1824 (tom VI, fol. 31). Řádky se v rejstříku svažují, data jsou čtena po sklonu řádku."},{"key":"lhota_umrti_josef_mejstrik_1863","label":"Úmrtí Josefa Mejstříka, výminkáře z Janovické Lhoty čp. 29","url":"https://ebadatelna.soapraha.cz/d/13248/65","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"4. 5. 1863","summary":"Josef Mejstřík, soused výminkář ze Lhoty čp. 29, zemřel 4. května 1863 a byl pochován 6. května v Uhlířských Janovicích. Vdovec, 80 let, příčina stáří podle lístku č. 32. Rodiče zápis neuvádí. Narození vychází asi na rok 1783, věk může být zaokrouhlený."}],"provenance":"Matriční zápis"},"p161":{"id":"p161","pid":161,"name":"Magdalena Doudová","display_name":"Magdalena Doudová","maiden_line":"","years":"","status":"doc","private":false,"facts":["ze Žandova","dcera Jana Daudy ze Žandova (křest syna Jana 1811)"],"note":"Matka Josefa * 1815 podle jeho křtu; v rejstříku narozených uvedena u šesti dětí 1811–1824. Pravděpodobně Magdalena * 19. 4. 1787 v Žandově čp. 22, dcera Jana Daudy a Barbory: sedí jméno, otec i obec, sňatek zatím doložený není (AI hypotéza). Prameny: Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Křest Jana, syna Josefa Mejstříka z Lhoty čp. 29; Matriční zápis: Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29; Matriční zápis: Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","sources":[{"key":"lhota_krest_josef_mejstrik_1815","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13234/12","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 8. 1815","summary":"Josef se narodil 14. a byl pokřtěn 15. srpna 1815 ve Lhotě čp. 29 jako syn půlsedláka Josefa Mejstříka a Magdaleny Doudové ze Žandova. Rok potvrzuje rejstřík Uhlířské Janovice 24, sn. 101 (Lhotta 29, Tom VI, fol. 18)."},{"key":"lhota_krest_jan_mejstrik_1811","label":"Křest Jana, syna Josefa Mejstříka z Lhoty čp. 29","url":"https://ebadatelna.soapraha.cz/d/13234/10","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 12. 1811","summary":"Jan, narozený 9. prosince 1811, pokřtěný 10. prosince, Lhota čp. 29. Otec Josef Mejstřík, půlsedlák z Lhoty, matka Magdalena, dcera Jana Daudy ze Žandova. Kmotr Josef Malina z Lhoty. Zápis dokládá otce Magdaleny; rodiče Josefa v něm uvedeni nejsou."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1815_1818","label":"Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/101","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1811–1818","summary":"Rejstřík narozených Uhlířské Janovice, pravá strana. Ve Lhotě čp. 29, otec Josef, matka Magdalena: Josef 14. 8. 1815 (tom VI, fol. 18) a Anna 7. 5. 1818 (tom VI, fol. 21). Podle stejné strany patří do řady i Jan 9. 12. 1811 (fol. 15) a Marie 20. 6. 1813 (fol. 16). Rejstřík je pozdější pomůcka, samotné křty nejsou v tomto zápisu."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1821_1824","label":"Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/102","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1821–1824","summary":"Rejstřík narozených Uhlířské Janovice, levá strana. Ve Lhotě čp. 29, rodiče Josef a Magdalena: František 13. 2. 1821 (tom VI, fol. 27) a Václav 19. 8. 1824 (tom VI, fol. 31). Řádky se v rejstříku svažují, data jsou čtena po sklonu řádku."}],"provenance":"Matriční zápis"},"p164":{"id":"p164","pid":164,"name":"František Drož","display_name":"František Drož","maiden_line":"","years":"","status":"doc","private":false,"facts":["rolník, Břežany čp. 56 (sňatek syna 1857)","gruntovník, Břežany čp. 56 (křest vnučky 1863)"],"note":"Otec Františka Drože z Hradišťka, výslovně jmenovaný ve sňatku syna 1857 i v křtu vnučky 1863. Vlastní narození ani sňatek neurčeny. Prameny: Matriční zápis: Sňatek Františka Drože a Anny Pokorné v Hradišťku; Matriční zápis: Narození Anny Drožové v Hradišťku","sources":[{"key":"sadska_snatek_frantisek_droz_anna_pokorna_1857","label":"Sňatek Františka Drože a Anny Pokorné v Hradišťku","url":"https://ebadatelna.soapraha.cz/d/13781/15","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 11. 1857","summary":"Dne 17. listopadu 1857 se vzali František Drož, domovem v Břežanech čp. 56, syn Františka Drože a Barbory rozené Štěpánek z Vlkovce čp. 6, a Anna Pokorná, domovem v Hradišťku čp. 21, dcera Josefa Pokorného ka_krest_jan_krieger_1837","label":"Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","url":"https://www.portafontium.eu/iipimage/30067683/prestice-33_0160-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1837","summary":"Jan Nepomuk (dobový pravopis Krygr, normalizováno Krieger) se narodil a téhož dne byl pokřtěn 22. září 1837 v Dlouhé Louce čp. 9. Otec Josef Krieger, domkář, syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny; matka Kateřina, dcera Antonína Sedláčka, domkáře z Dlouhé Louky čp. 5, a Kateřiny. Rodná příjmení obou babiček a jejich místa původu nejsou bezpečně určena. Silná AI hypotéza (neověřeno): jde o Jana Kriegera ze sňatku 22. října 1867 a otce Markéty z roku 1878, podle shody obou rodičů, domů 9 a 5 a věku 30 let ve sňatku. Přímý spojovací přípis není uveden. Kandidátní sňatek rodičů z roku 1829 zůstává samostatnou hypotézou kvůli nevysvětlenému rozdílu čp. 13 a 5."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."}],"provenance":"Matriční zápis"},"p173":{"id":"p173","pid":173,"name":"Kateřina Sedláčková","display_name":"Kateřina Sedláčková","maiden_line":"","years":"","status":"doc","private":false,"facts":["z Dlouhé Louky čp. 5","dcera Antonína Sedláčka a Kateřiny podle křtu syna 1837"],"note":"Rodiče jsou výslovně jmenováni v křtu Jana Nepomuka 1837; rodné příjmení její matky není bezpečně přečteno. Kandidátní nevěsta 1829 z čp. 13 není automaticky ztotožněna. Prameny: Matriční zápis: Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových","sources":[{"key":"dlouha_louka_krest_jan_krieger_1837","label":"Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","url":"https://www.portafontium.eu/iipimage/30067683/prestice-33_0160-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1837","summary":"Jan Nepomuk (dobový pravopis Krygr, normalizováno Krieger) se narodil a téhož dne byl pokřtěn 22. září 1837 v Dlouhé Louce čp. 9. Otec Josef Krieger, domkář, syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny; matka Kateřina, dcera Antonína Sedláčka, domkáře z Dlouhé Louky čp. 5, a Kateřiny. Rodná příjmení obou babiček a jejich místa původu nejsou bezpečně určena. Silná AI hypotéza (neověřeno): jde o Jana Kriegera /64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."}],"provenance":"Matriční zápis"},"p176":{"id":"p176","pid":176,"name":"Johann Mrkvička","display_name":"Johann Mrkvička","maiden_line":"","years":"asi 1778","status":"doc","private":false,"facts":["pokřtěn 12. 3. 1778 Petrovice čp. 4","× 28. 5. 1805 Petrovice, Katharina Womačka","roku 1805 uveden věk 27 let","čtvrtláník, Petrovice čp. 4"],"note":"Otec Vincence, jmenovaný v jeho křtu 1812 a sňatku 1843. Sňatek čten přímo z MZA 15933, sn. 38 (AI čtení). Křest čten z MZA 15919, sn. 104: Joannes Nep., rodiče Josephus Mrkvička a Catharina, Petrovice čp. 4. Ztotožnění se ženichem 1805 je AI závěr silně podpořený shodou jména, otce, vsi, domu a věku. Napojení na babičku Boženu vede přes Františka * 1873; ztotožnění křtu 1778 se ženichem 1805 zůstává AI závěrem. Prameny: Matriční zápis: Křest Joannese (Johanna) Mrkvičky; Matriční zápis: Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové); Matriční zápis: Křest Franze Mrkvičky; Matriční zápis: Narození a křest Vincence Mrkvičky; Matriční zápis: Narození a křest Josepha Mrkvičky; Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové","sources":[{"key":"petrovice_krest_johann_mrkvicka_1778","label":"Křest Joannese (Johanna) Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6787?image=216000010-000253-003380-000000-015919-000000-00-B07652-01040.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 3. 1778","summary":"V březnovém oddílu je 12. března 1778 pokřtěn Joannes Nep. z Petrovic čp. 4. Otec Josephus Mrkvička (dobové čtení příjmení nejisté), matka Catharina uxor, její rodné příjmení zápis neuvádí. Ztotožnění s Johannem, ženichem 28. 5. 1805, je silně podpořeno shodou jména, otce, vsi, domu a věku 27 let při sňatku; jde o AI závěr z obou zápisů. Není to přímý doklad vztahu k Boženě Mrkvičkové narozené přibližně 1929."},{"key":"petrovice_snatek_johann_mrkvicka_katharina_womacka_1805","label":"Sňatek Johanna Mrkvičky a Kathariny Womačkové (Vomáčkové)","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00380.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 5. 1805","summary":"Johann Mrkvička, 27 let, syn zemřelého sedláka Josepha Mrkvičky z Petrovic čp. 4, se 28. května 1805 oženil s Katharinou, 23 let, dcerou sedláka Wenzla Womačky z čp. 12. Rok 1805 plyne z nadpisu na předchozí straně téže knihy a z nadpisu Anno 1806 dále. Čteno ze snímku AI, příjmení nevěsty porovnáno se čtyřmi dalšími výskyty."},{"key":"petrovice_krest_franz_mrkvicka_1805","label":"Křest Franze Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00810.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 10. 1805","summary":"Franz, syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery Wenzla Womačky, se narodil v Petrovicích čp. 4. První doložené dítě páru, pět měsíců po sňatku. Měsíc a rok plynou z pořadí zápisů (předchozí 20. října, po něm Anno 1806). Čteno ze snímku AI."},{"key":"petrovice_krest_vincenc_mrkvicka_1812","label":"Narození a křest Vincence Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 9. 1812","summary":"Vincenc se narodil 16. a pokřtěn byl 17. září 1812 v Petrovicích čp. 4 jako syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky (Vomáčky). Rok je určen ze sousedních záhlaví knihy (1812, 1813). Příjmení matky je čteno ve srovnání se sňatkem 1805 a křty 1805 a 1823 (AI čtení)."},{"key":"petrovice_krest_joseph_mrkvicka_1823","label":"Narození a křest Josepha Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00970.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 3. 1823","summary":"Joseph, manželský syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky z Petrovic, se narodil 3. a pokřtěn byl 4. března 1823 v Petrovicích čp. 4. Kmotrem byl sedlák Georg Mraz. Čteno ze snímku AI."},{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého sedláka Johanna Sedláka a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842)."}],"provenance":"Matriční zápis"},"p177":{"id":"p177","pid":177,"name":"Katharina Womačka (Vomáčka)","display_name":"Katharina Womačka (Vomáčka)","maiden_line":"","years":"asi 1782","status":"doc","private":false,"facts":["× 28. 5. 1  Sedláka a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842)."}],"provenance":"Matriční zápis"},"p179":{"id":"p179","pid":179,"name":"Barbara (rodné příjmení neuvedeno)","display_name":"Barbara (rodné příjmení neuvedeno)","maiden_line":"","years":"","status":"doc","private":false,"facts":[],"note":"Matka Terezie; oddací zápis 1843 rodné příjmení neuvádí. Prameny: Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové","sources":[{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého sedláka Johanna Sedláka a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842)."}],"provenance":"Matriční zápis"},"p180":{"id":"p180","pid":180,"name":"Thomas Starý","display_name":"Thomas Starý","maiden_line":"","years":"asi 1775","status":"doc","private":false,"facts":["× 3. 10. 1801 (?) Petrovice, Marianna Sabliková","roku 1801 uveden věk 26 let (?)","sedlák, Petrovice čp. 3"],"note":"Otec Josefa Starého podle křtu 1815 a sňatku 1841. Sňatek 1801 ho uvádí jako syna Georga Starého, ale Georg se oženil až 11. 11. 1777. Věku 26 let odpovídá křest Thomase 6. 11. 1774, syna Joannese Starého a Anny z čp. 17, Georgova bratra (AI hypotéza, neověřeno; viz Co hledáme). Ztotožnění ženicha 1801 s otcem Josefa je AI závěr. Sňatkem se dostal na statek rodiny nevěsty čp. 3 (AI výklad). Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové; Matriční zápis: Křest Josefa Starého; Matriční zápis: Sňatek Josefa Starého a Anny Staré","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."},{"key":"petrovice_krest_josef_stary_1815","label":"Křest Josefa Starého","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00900.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 2. 1815","summary":"V Petrovicích čp. 3 byl 20. 2. 1815 pokřtěn Josef, syn sedláka Thomase Starého a Marianny, dcery sedláka Sabliha. Rok je převzat z nadpisu oddílu Anno 1815; měsíc je čten nejistě, protože na levé straně zápisy dojdou k dubnu. Ztotožnění se ženichem 1841 je AI závěr opřený o jméno, otce, jméno matky a čp. 3; věk 25 při sňatku je o rok nižší, než dává křest."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. Rodná příjmení matek jsou čtena nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."}],"provenance":"Matriční zápis"},"p181":{"id":"p181","pid":181,"name":"Marianna Sabliková","display_name":"Marianna Sabliková","maiden_line":"","years":"asi 1781","status":"doc","private":false,"facts":["× 3. 10. 1801 (?) Petrovice, Thomas Starý","roku 1801 uvedeno 20 let","dcera sedláka Thomase Sablika z čp. 3"],"note":"Matka Josefa Starého. Sňatek 1801 i křest 1815 čtu Sablik; v zápisu 1841 je příjmení čitelné hůře. Prameny: Matriční zápis: Sňatek Thomase Starého a Marianny Sablikové; Matriční zápis: Křest Josefa Starého; Matriční zápis: Sňatek Josefa Starého a Anny Staré","sources":[{"key":"petrovice_snatek_thomas_stary_marianna_sablik_1801","label":"Sňatek Thomase Starého a Marianny Sablikové","url":"https://www.mza.cz/actapublica/matrika/detail/6797?image=216000010-000253-003380-000000-015933-000000-00-B07658-00360.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 10. 1801 (?)","summary":"Pod nadpisem Petrowitz, Anno 1801 je zápis z 3. dne měsíce čteného Obris (říjen?). Ženich Thomas, syn sedláka Georga Starého, asi 26 let; nevěsta Marianna, dcera sedláka Thomase Sablika z čp. 3, 20 let. Hned pod ním se bere bratr nevěsty Anton Sablik a sestra ženicha Katharina Stará. Ztotožnění s rodiči Josefa Starého (* 1815, čp. 3) je AI závěr opřený o jména obou snoubenců a jméno i dům otce nevěsty."},{"key":"petrovice_krest_josef_stary_1815","label":"Křest Josefa Starého","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00900.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 2. 1815","summary":"V Petrovicích čp. 3 byl 20. 2. 1815 pokřtěn Josef, syn sedláka Thomase Starého a Marianny, dcery sedláka Sabliha. Rok je převzat z nadpisu oddílu Anno 1815; měsíc je čten nejistě, protože na levé straně zápisy dojdou k dubnu. Ztotožnění se ženichem 1841 je AI závěr opřený o jméno, otce, venance":"Matriční zápis"},"p184":{"id":"p184","pid":184,"name":"Josef Julis","display_name":"Josef Julis","maiden_line":"","years":"","status":"doc","private":false,"facts":["otec ženicha Martina (1834)"],"note":"Přímo jmenován jako Joseph Julis, otec Martina ve sňatku 21. 6. 1834. Připojení tohoto ženicha k Martinovi, otci Josefa 1842, je silný AI závěr podle jmen páru, Branišova a Tereziina otce; nikoli výslovný údaj o budoucím dítěti. Vlastní křest, sňatek a úmrtí nenalezeny. Prameny: Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p185":{"id":"p185","pid":185,"name":"Terezie, matka Martina Julise","display_name":"Terezie, matka Martina Julise","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka ženicha Martina (1834)"],"note":"Přímo jmenována jako Theresia, manželka Josefa Julise a matka Martina ve sňatku 21. 6. 1834. Rodné příjmení a původ nejsou bezpečně přečteny, předběžná rozporná čtení nejsou rodinným údajem. Připojení k přímé linii závisí na silném AI ztotožnění ženicha s otcem Josefa 1842. Prameny: Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p186":{"id":"p186","pid":186,"name":"Jiří Brhel","display_name":"Jiří Brhel","maiden_line":"","years":"","status":"doc","private":false,"facts":["† před 10. 2. 1842"],"note":"Otec Terezie Brhelové; při křtu jejího syna Josefa roku 1842 uveden jako zemřelý Georg Brhel. Ve sňatku stejnojmenného páru 1834 jmenován s manželkou Annou; ztotožnění tohoto páru je silný AI závěr. České jméno Jiří je normalizace. Jeho vlastní křest a úmrtí zatím neurčeny. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Pravá strana, rok 1842, zápis č. 4: Joseph (Josef) se narodil 9. února a byl pokřtěn 10. února. Otec Martin Julis, domkář v Branišově; matka Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Číslo domu a další části rodičovských sloupců nejsou z tohoto čtení bezpečně určeny. Ztotožnění s Josefem Julisem, který se roku 1893 ženil v Žubří, je AI závěr ze shody obou rodičů a věku 51 let u sňatku (únor 1842 až listopad 1893)."},{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p187":{"id":"p187","pid":187,"name":"Anna, matka Terezie Brhelové","display_name":"Anna, matka Terezie Brhelové","maiden_line":"","years":"","status":"doc","private":false,"facts":["matka nevěsty Terezie (1834)"],"note":"Přímo jmenována jako Anna, manželka Jiřího Brhela a matka nevěsty Terezie ve sňatku 21. 6. 1834. Na správném úplném výřezu je dále sled Paul= / Lang(?)in, podobný mateřskému textu kandidátního křtu 1808. Přesný význam slov, normalizované rodné příjmení a původ nejsou určeny; PaulLangin není přijato jako příjmení. Kandidát 1808 má nadále rozdíl věku 26/25. Připojení této matky k přímé linii závisí na silném AI ztotožnění novomanželů 1834 s rodiči Josefa Julise 1842. Prameny: Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p320":{"id":"p320","pid":320,"name":"Jan Mejstřík","display_name":"Jan Mejstřík","maiden_line":"","years":"1741","status":"prob","private":false,"facts":["* 11. 5. 1741 Lhota, syn Matěje a Anny","× Kateřina Dohalová(?), Lhota čp. 4","chalupník, Lhota Janovská (1810)"],"note":"Otec ženicha Josefa ve sňatku 6. 11. 1810 a pravděpodobně otec Josefa * 1791 z Lhoty čp. 4. Křest 1741 je jediný přečtený Jan, syn Matěje, z Lhoty do 1767; přímý zápis, že jde o téhož muže, chybí (AI závěr, neověřeno). Prameny: Matriční zápis: Sňatek Josefa, syna Jana Mejstříka(?) z Lhoty; Matriční zápis: Křest Josefa, syna Jana Mejstříka z Lhoty čp. 4; Matriční zápis: Křest Jana, syna Matěje Mejstříka z Lhoty","sources":[{"key":"sudejov_snatek_josef_mejstrik_1810","label":"Sňatek Josefa, syna Jana Mejstříka(?) z Lhoty","url":"https://ebadatelna.soapraha.cz/d/12627/40","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1810","summary":"Sudějov, str. 116, dům 21(?). Ženich Josef, vlastní syn Jana Mejstříka(?), chalupníka z Lhoty Janovské, věk 2x. Nevěsta Marjana(?), vlastní dcera Jana […], věk 2x. Svědek Josef Hauptman(?). Příjmení otce nevěsty přečíst nejde. Rejstřík 12625 sn. 64 má „Mejstřík(?) Josef, 810, fol. 116“. Že jde o Josefa × Magdalenu Doudovou, je jen pravděpodobné: křest syna 1811 uvádí matku Magdalenu, zde stojí Marjana(?)."},{"key":"janovice_krest_josef_mejstrik_1791","label":"Křest Josefa, syna Jana Mejstříka z Lhoty čp. 4","url":"https://ebadatelna.soapraha.cz/d/13044/79","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16./17. 4. 1791","summary":"Fol. 150, Lhota čp. 4. Josef, narozený 16. a pokřtěný 17. dubna 1791, katolík, manželský. Otec Jan Mejstřík, stav zkrácen(?), matka Kateřina Dohalová(?). Kmotři Jan Major a Magdalena Drsínová(?). Rejstřík 13249 sn. 100 má tento řádek bez čitelného křestního jména. Se ženichem Josefem z roku 1810 jde o pravděpodobnou, ne jistou totožnost: otec Jan sedí, věk 19 proti zapsaným 2x a věk při úmrtí 72 proti zapsaným 80 nesedí."},{"key":"janovice_krest_jan_mejstrik_1741","label":"Křest Jana, syna Matěje Mejstříka z Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/146","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 5. 1741","summary":"Lhota, str. 294. Jan, narozený a pokřtěný 11. května, otec Matěj Mejstřík, matka Anna, poddaní panství Šternberk. Kmotři Václav Červinka(?) a Václav Čech z Janovic, Barbara Malinová z Lhoty. Rok 1741 potvrzuje rejstřík 13249 sn. 98 (tom II, fol. 294). Že je to pozdější otec dětí v Lhotě čp. 4, není doloženo přímo."}],"provenance":"Matriční zápis"},"p342":{"id":"p342","pid":342,"name":"Václav Vyskoč","display_name":"Václav Vyskoč","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář, Kbelnice čp. 21"],"note":"Prameny: Matriční zápis: Křest Josefa Vavřince Majera","sources":[{"key":"lukavice_krest_josef_majer_1874","label":"Křest Josefa Vavřince Majera","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0720-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."}],"provenance":"Matriční zápis"},"p343":{"id":"p343","pid":343,"name":"Anna Špelinová","display_name":"Anna Špelinová","maiden_line":"","years":"","status":"doc","private":false,"facts":["z Letin (?)"],"note":"Prameny: Matriční zápis: Křest Josefa Vavřince Majera","sources":[{"key":"lukavice_krest_josef_majer_1874","label":"Křest Josefa Vavřince Majera","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0720-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."}],"provenance":"Matriční zápis"},"p344":{"id":"p344","pid":344,"name":"Jan Krieger","display_name":"Jan Krieger","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář, Dlouhá Louka čp. 2 (1837)"],"note":"Výslovně otec Josefa Kriegera a manžel Anny v křtu vnuka Jana Nepomuka 1837. Vlastní životní data neurčena; nejde o přijetí kandidátního sňatku syna 1829. Prameny: Matriční zápis: Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","sources":[{"key":"dlouha_louka_krest_jan_krieger_1837","label":"Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","url":"https://www.portafontium.eu/iipimage/30067683/prestice-33_0160-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1837","summary":"Jan Nepomuk (dobový pravopis Krygr, normalizováno Krieger) se narodil a téhož dne byl pokřtěn 22. září 1837 v Dlouhé Louce čp. 9. Otec Josef Krieger, domkář, syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny; matka Kateřina, dcera Antonína Sedláčka, domkáře z Dlouhé Louky čp. 5, a Kateřiny. Rodná příjmení obou babiček a jejich místa původu nejsou bezpečně určena. Silná AI hypotéza (neověřeno): jde o Jana Kriegera ze sňatku 22. října 1867 a o
