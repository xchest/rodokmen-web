benců jsou dopsána data narození 16. 10. 1862 a 22. 8. 1863. Totožnost s rodiči Josefa Mejstříka narozeného 1901 podporuje shoda jmen, sňatku a rodičů v jeho křtu."}],"provenance":"Matriční zápis"},"p84":{"id":"p84","pid":84,"name":"Tomáš Majer","display_name":"Tomáš Majer","maiden_line":"","years":"","status":"doc","private":false,"facts":["panský pasák, Horní Lukavice čp. 1"],"note":"Syn Marie Majerové, otec v zápisu 1874 neuveden. Křest nehledán. Prameny: Matriční zápis: Křest Josefa Vavřince Majera; Matriční zápis: Sňatek Josefa Majera a Markéty Kriegrové","sources":[{"key":"lukavice_krest_josef_majer_1874","label":"Křest Josefa Vavřince Majera","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0720-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis"},"p85":{"id":"p85","pid":85,"name":"Marie Vyskočová","display_name":"Marie Vyskočová","maiden_line":"","years":"","status":"doc","private":false,"facts":["ze Kbelnice čp. 21"],"note":"Podle křtu 1874 dcera Kateřiny Vyskočové, provdané Brožové; jméno Josefa Haizmana je škrtnuto. Křest zatím neurčen; dílčí průchody Kbelnice v Letiny 04 a rejstříky viz badatelský deník #174, #182, #356 a #399. Negativ platí jen pro tam uvedené rozsahy, nikoli pro celou matriku. Prameny: Matriční zápis: Křest Josefa Vavřince Majera; Matriční zápis: Sňatek Josefa Majera a Markéty Kriegrové","sources":[{"key":"lukavice_krest_josef_majer_1874","label":"Křest Josefa Vavřince Majera","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0720-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis"},"p86":{"id":"p86","pid":86,"name":"Jan Krieger","display_name":"Jan Krieger","maiden_line":"","years":"* 22. 9. 1837","status":"doc","private":false,"facts":["* 22. 9. 1837 Dlouhá Louka čp. 9; pokřtěn téhož dne jako Jan Nepomuk","× 22. 10. 1867 Marie Lautnerová; ženich 30 let","domkář, Dlouhá Louka čp. 9"],"note":"Křest Jana Nepomuka 22. 9. 1837 osobně znovu přečten v originálu i detailu. Totožnost s ženichem 1867 a otcem Markéty 1878 je přijatý silný AI závěr ze shody obou rodičů Josefa Kriegera a Kateřiny Sedláčkové, domu 9, původu matky z čp. 5 a věku 30 let. Zápis nemá přečtený pozdější oddací přípis; tato totožnost není doslovnou větou pramene. Noví prarodiče jsou výslovně jmenováni v křtu 1837. Kandidátní sňatek rodičů 1829 a censusové identity zůstávají samostatně neuzavřené. Roku 1899 svolil k sňatku dcery třemi křížky. Prameny: Matriční zápis: Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových; Matriční zápis: Sňatek Josefa Majera a Markéty Kriegrové","sources":[{"key":"dlouha_louka_krest_jan_krieger_1837","label":"Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","url":"https://www.portafontium.eu/iipimage/30067683/prestice-33_0160-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1837","summary":"Jan Nepomuk (dobový pravopis Krygr, normalizováno Krieger) se narodil a téhož dne byl pokřtěn 22. září 1837 v Dlouhé Louce čp. 9. Otec Josef Krieger, domkář, syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny; matka Kateřina, dcera Antonína Sedláčka, domkáře z Dlouhé Louky čp. 5, a Kateřiny. Rodná příjmení obou babiček a jejich místa původu nejsou bezpečně určena. Silná AI hypotéza (neověřeno): jde o Jana Kriegera ze sňatku 22. října 1867 a otce Markéty z roku 1878, podle shody obou rodičů, domů 9 a 5 a věku 30 let ve sňatku. Přímý spojovací přípis není uveden. Kandidátní sňatek rodičů z roku 1829 zůstává samostatnou hypotézou kvůli nevysvětlenému rozdílu čp. 13 a 5."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis","birth_date":"1837-09-22"},"p87":{"id":"p87","pid":87,"name":"Marie Lautnerová","display_name":"Marie Lautnerová","maiden_line":"","years":"* 17. 7. 1837","status":"doc","private":false,"facts":["* 17. 7. 1837 Skočice čp. 2; pokřtěna 18. 7.","× 22. 10. 1867 Jan Krieger, ve sňatku 30 let"],"note":"Křest 1837 přímo jmenuje Martina Lautnera, domkáře a tkalce ze Skočic č. 2, a Marii, dceru Josefa Tichoty z Elhovic č. 64. Totožnost s nevěstou 1867 je silný AI závěr ze shody obou rodičů, řemesla, domů 2/64 a věku 30 let; výslovný pozdější oddací odkaz zde není. Ztotožnění s matkou Markéty 1878 podporuje stejný pár, všichni čtyři rodiče a domy. Datum 17./18. července bylo ověřeno na samostatném zvětšení; předběžné 11. července se ruší. Prameny: Matriční zápis: Narození a křest Marie Lautnerové ze Skočic; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových; Matriční zápis: Sňatek Josefa Majera a Markéty Kriegrové","sources":[{"key":"skocice_krest_marie_lautnerova_1837","label":"Narození a křest Marie Lautnerové ze Skočic","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_0340-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 7. 1837","summary":"Přeštice 31 sn. 34, pravá strana pag. 33, rok 1837, poslední řádek v červenci. Marie Lautnerová se narodila 17. 7. 1837 ve Skočicích čp. 2 a byla pokřtěna 18. 7. Otec Martin Lautner, domkář a tkadlec, syn Jana Lautnera, domkáře a tkalce z Poříčí č. 2, a Anny ze Skočic č. 60; její rodné příjmení není bezpečně přečteno. Matka Marie, dcera Josefa Tichoty, mistra kovářského z Elhovic č. 64, a Anny z Dolan; její rodné příjmení není bezpečně přečteno. Ztotožnění dítěte s nevěstou Janova Kriegera 22. 10. 1867 a matkou Markéty 1878 je silný AI závěr ze shody obou rodičů, Martinova řemesla, domů 2/64 a věku 30 let ve sňatku. Není zde výslovný pozdější oddací odkaz. Rodná příjmení obou babiček zůstávají otevřená."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera, nádenníka z téhož domu, a Kateřiny rozené Sedláčkové z Dlouhé Louky č. 5. Marie (Maria) Lautnerová, 30 let, dcera Martina Lautnera, tkalce ze Skočic č. 2, a Marie rozené Tichotové z Elhovic č. 64. Oba katolíci; nevěsta je čtena jako svobodná. Osobní stav ženicha zůstává k ověření kvůli nejednoznačnému přiřazení značky ve sloupcích. Ztotožnění s rodiči Markéty 1878 je silný AI závěr ze shody obou manželů, všech čtyř rodičů a domů 9/5/2/64. Věk podporuje kandidátní Janův křest 22. 9. 1837, přesné datum narození se však ze sňatku samotného nevyčítá. Název Elhovice ponechán podle tohoto zápisu; starší čtení Alhovice není automaticky geograficky sjednoceno."},{"key":"dlouha_louka_krest_marketa_kriegrova_1878","label":"Křest dvojčat Josefiny a Markéty Kriegerových","url":"https://www.portafontium.eu/iipimage/30067694/prestice-44_0280-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 9. 1878","summary":"Dvojčata Josefina a Markéta se narodila 15. září a byla pokřtěna 16. září v Dlouhé Louce čp. 9; rok 1878 potvrzuje přípis 15/9 1878 v zápisech z let 1899 a 1906. Otec Jan Krieger, domkář, syn Josefa Kriegera a Kateřiny Sedláčkové z čp. 5. Matka Marie, dcera Martina Lautnera, tkadlce ze Skočic čp. 2, a Marie Tichotové z Alhovic čp. 64."},{"key":"lukavice_snatek_josef_majer_marketa_kriegrova_1899","label":"Sňatek Josefa Majera a Markéty Kriegrové","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0340-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"1. 5. 1899","summary":"Oddáni 1. května 1899 v Dolní Lukavici. Ženich Josef Majer, 24 let, a nevěsta Markéta Kriegrová, 20 let, oba z Horní Lukavice čp. 1. Zápis jmenuje rodiče obou. Otec nevěsty Jan Krieger svolil třemi křížky, podepsal za něj Josef Majer, chalupník z Horní Lukavice 43, který byl i svědkem."}],"provenance":"Matriční zápis","birth_date":"1837-07-17"},"p88":{"id":"p88","pid":88,"name":"Vincenc Mrkvička","display_name":"Vincenc Mrkvička","maiden_line":"","years":"* 1812","status":"doc","private":false,"facts":["* 16. 9. 1812 Petrovice čp. 4","× 27. 2. 1843 Terezie Sedláková","podruh, Petrovice"],"note":"Otec staršího Františka Mrkvičky. Vlastní křest (MZA 15921, sn. 88) a sňatek (MZA 15934, sn. 99) čteny přímo; sňatek proběhl až po narození syna 6. 11. 1842. Ztotožnění křtu 1812 se ženichem 1843 je opřené o stejné jméno, otce Johanna a čp. 4 (AI čtení). Úmrtí nenalezeno. Prameny: Matriční zápis: Narození a křest Vincence Mrkvičky; Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové; Matriční zápis: Narození a křest Františka Mrkvičky staršího; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_krest_vincenc_mrkvicka_1812","label":"Narození a křest Vincence Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00880.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 9. 1812","summary":"Vincenc se narodil 16. a pokřtěn byl 17. září 1812 v Petrovicích čp. 4 jako syn čtvrtláníka Johanna Mrkvičky a Kathariny, dcery sedláka Wenzla Womačky (Vomáčky). Rok je určen ze sousedních záhlaví knihy (1812, 1813). Příjmení matky je čteno ve srovnání se sňatkem 1805 a křty 1805 a 1823 (AI čtení)."},{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého Johanna Sedláka, sedláka z Diwischau, a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842). Na tuto stranu 11 odkazuje přípis o legitimaci v synově zápisu narození."},{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích čp. 9 se 6. 11. 1842 narodil Franz (František), syn Vincence Mrkvičky a Terezie, dcery Johanna Sedláka, nádeníka v Diwischau. Pozdější přípis výslovně uvádí legitimaci sňatkem rodičů a odkazuje na stranu 11 oddací knihy. Jména rodičů a věk 27 let při Františkově sňatku v roce 1870 podporují jeho ztotožnění s tímto dítětem."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p89":{"id":"p89","pid":89,"name":"Terezie Sedláková","display_name":"Terezie Sedláková","maiden_line":"","years":"asi 1816","status":"doc","private":false,"facts":["× 27. 2. 1843 Vincenc Mrkvička","roku 1843 uveden věk 27 let","Petrovice"],"note":"Matka staršího Františka Mrkvičky. U jeho narození v roce 1842 je uvedena jako dcera Johanna Sedláka, nádeníka v Diwischau. Při jejím sňatku v roce 1843 je otec uveden jako zemřelý sedlák z Diwischau a matka jako Barbara. Odhad ročníku vychází z věku nevěsty. Její vlastní křest a rodiště zůstávají otevřené. Prameny: Matriční zápis: Sňatek Vincence Mrkvičky a Terezie Sedlákové; Matriční zápis: Narození a křest Františka Mrkvičky staršího; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_snatek_vincenc_mrkvicka_terezie_sedlakova_1843","label":"Sňatek Vincence Mrkvičky a Terezie Sedlákové","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00990.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 2. 1843","summary":"Vincenc Mrkvička, podruh v Petrovicích, 30 let, syn Johanna Mrkvičky, čtvrtláníka v Petrovicích, a Kathariny, se 27. února 1843 oženil s Terezií, 27 let, dcerou zemřelého Johanna Sedláka, sedláka z Diwischau, a Barbary. Sňatek následoval až po narození syna Františka (6. 11. 1842). Na tuto stranu 11 odkazuje přípis o legitimaci v synově zápisu narození."},{"key":"petrovice_krest_frantisek_mrkvicka_starsi_1842","label":"Narození a křest Františka Mrkvičky staršího","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01070.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1842","summary":"V Petrovicích čp. 9 se 6. 11. 1842 narodil Franz (František), syn Vincence Mrkvičky a Terezie, dcery Johanna Sedláka, nádeníka v Diwischau. Pozdější přípis výslovně uvádí legitimaci sňatkem rodičů a odkazuje na stranu 11 oddací knihy. Jména rodičů a věk 27 let při Františkově sňatku v roce 1870 podporují jeho ztotožnění s tímto dítětem."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p90":{"id":"p90","pid":90,"name":"Josef Starý","display_name":"Josef Starý","maiden_line":"","years":"* 1815","status":"doc","private":false,"facts":["* 20. 2. 1815 (?) Petrovice čp. 3","× 26. 10. 1841 Petrovice, Anna Stará","roku 1841 uveden věk 25 let","rolník v Petrovicích čp. 3","† před 8. 8. 1870"],"note":"Otec Josefy Starých; při jejím sňatku 1870 uveden jako zemřelý. Sňatek 1841 (MZA 15934, sn. 98) čten v prohlížeči; shoda jména, obce, čp. 3 s křtem dcery 1846 a rodného příjmení manželky. Připojen je křest Josefa z 20. 2. 1815 (?) v Petrovicích čp. 3 (MZA 15921, sn. 90); měsíc je čten nejistě. Ztotožnění pokřtěného s ženichem roku 1841 je AI hypotéza (neověřeno) podle jména, rodičů a domu; věk 25 let při sňatku je přibližně o rok nižší, než odpovídá křtu. Prameny: Matriční zápis: Křest Josefa Starého; Matriční zápis: Sňatek Josefa Starého a Anny Staré; Matriční zápis: Křest Josefy Staré; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_krest_josef_stary_1815","label":"Křest Josefa Starého","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00900.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 2. 1815","summary":"V Petrovicích čp. 3 byl 20. 2. 1815 pokřtěn Josef, syn sedláka Thomase Starého a Marianny, dcery sedláka Sabliha. Rok je převzat z nadpisu oddílu Anno 1815; měsíc je čten nejistě, protože na levé straně zápisy dojdou k dubnu. Ztotožnění se ženichem 1841 je AI závěr opřený o jméno, otce, jméno matky a čp. 3; věk 25 při sňatku je o rok nižší, než dává křest."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. U matky nevěsty se čte Anna geb. Su[…]. Srovnání s křtem 1817 podporuje čtení Suk. Rodné příjmení matky ženicha je čteno nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."},{"key":"petrovice_krest_josefa_stara_1846","label":"Křest Josefy Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6791?image=216000010-000253-003380-000000-015923-000000-00-B07851-01110.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 7. 1846","summary":"10. 7. 1846 byla v Petrovicích čp. 3 pokřtěna Josefa, dcera Josefa Starého. Sloupec matky je přepisovaný a jméno v něm není bezpečně čitelné; v popisu je Stary a vepsané Franz. Ztotožnění s Josefou, která se roku 1870 vdala za Františka Mrkvičku, je AI hypotéza opřená o jméno, otce, obec a věk 24 let."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p91":{"id":"p91","pid":91,"name":"Anna Stará","display_name":"Anna Stará","maiden_line":"","years":"* 1817","status":"doc","private":false,"facts":["* 31. 12. 1817 Petrovice čp. 17","× 26. 10. 1841 Petrovice, Josef Starý","roku 1841 uveden věk 24 let"],"note":"Matka Josefy Starých; rodné příjmení Stará potvrzuje její vlastní sňatek 1841, kde je dcerou Franze Starého. Dřívější kandidát na úmrtí, Anna Stará, výměnice, † 22. 11. 1906 Petrovice, 80 let (MZA 15943, sn. 141), by byl o devět let mladší, než dává věk při sňatku; ztotožnění je slabá AI hypotéza. V křtu 1817 i ve sňatku 1841 se shodují jméno Anny, rodiče Franz Starý a Anna rozená Suk i čp. 17. U matky nevěsty ve sňatku dává porovnání s křtem přednost čtení Suk. Zakončení příjmení v oddací rubrice je hůře čitelné. Josepha narozená 12. a pokřtěná 13. září 1816 v Petrovicích čp. 10 má shodně uvedené rodiče. Sourozenectví s Annou z čp. 17 zůstává otevřené. Prameny: Matriční zápis: Křest Anny Staré; Matriční zápis: Sňatek Josefa Starého a Anny Staré; Matriční zápis: Sňatek Františka Mrkvičky a Josefy Starých; Matriční zápis: Křest Františka Mrkvičky","sources":[{"key":"petrovice_krest_anna_stara_1817","label":"Křest Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6789?image=216000010-000253-003380-000000-015921-000000-00-B07653-00920.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"31. 12. 1817","summary":"31. 12. 1817, Petrovice čp. 17. Anna, dcera sedláka Franze Starého a Anny, dcery mlynáře Franze Suka. Při sňatku Anny roku 1841 souhlasí číslo domu i jména rodičů. Povolání mlynářky a místní údaj na konci křestního řádku patří kmotře."},{"key":"petrovice_snatek_josef_stary_anna_stara_1841","label":"Sňatek Josefa Starého a Anny Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6798?image=216000010-000253-003380-000000-015934-000000-00-B07853-00980.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"26. 10. 1841","summary":"26. 10. 1841 se v Petrovicích vzali Josef Starý, 25 let, syn Thomase Starého a Marianny, a Anna, 24 let, dcera Franze Starého a Anny. Ženich bydlel v čp. 3, nevěsta v čp. 17. U matky nevěsty se čte Anna geb. Su[…]. Srovnání s křtem 1817 podporuje čtení Suk. Rodné příjmení matky ženicha je čteno nejistě. Rok je odvozen z pořadí zápisů: další ročník na téže straně je 1842, předchozí strana odkazuje na rok 1841."},{"key":"petrovice_snatek_frantisek_mrkvicka_josefa_starych_1870","label":"Sňatek Františka Mrkvičky a Josefy Starých","url":"https://www.mza.cz/actapublica/matrika/detail/6799?image=216000010-000253-003380-000000-015935-000000-00-B07854-00690.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 8. 1870","summary":"8. 8. 1870 se vzali František Mrkvička, 27 let, syn Vincence Mrkvičky a Terezie rozené Sedlákové, a Josefa Starých, 24 let, dcera Josefa Starého a Anny rozené Staré. Rodové údaje odpovídají křtu jejich syna Františka v roce 1873. Věk snoubenců dává jen přibližné roky narození 1842/43 a 1845/46."},{"key":"petrovice_krest_frantisek_mrkvicka_1873","label":"Křest Františka Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01680.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"2. 11. 1873","summary":"František se narodil 2. 11. a byl pokřtěn 4. 11. 1873 v Petrovicích. Otec František Mrkvička, syn Vincence Mrkvičky a Terezie rozené Sedlákové. Matka Josefa, dcera Josefa Starého a Anny rozené Staré. Zápis sám nedokládá, že František byl později otcem babičky Boženy."}],"provenance":"Matriční zápis"},"p92":{"id":"p92","pid":92,"name":"Martin Julis","display_name":"Martin Julis","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář v Branišově (1842)","ženich 21. 6. 1834, 27 let"],"note":"Otec Josefa Julise, jmenovaný v jeho křtu 1842 i sňatku 1893 a v křtu vnučky Matyldy 1894. Sňatek 1834 přímo jmenuje ženicha Martina a jeho rodiče Josefa Julise a Terezii; její rodné příjmení není bezpečně přečteno. Ztotožnění tohoto páru s rodiči Josefa 1842 je silný AI závěr podle jmen, Branišova a Tereziina otce Jiřího Brhela. Vlastní křest nenalezen; věk není přesné datum narození. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Na pravé straně 76 v oddílu roku 1842 je u Josepha (Josefa) uvedeno narození 9. února, křest 10. února a v rubrice „Haus Nro“ číslo 4. Otcem byl Martin Julis, domkář v Branišově, matkou Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Ztotožnění s Josefem Julisem, ženichem v Žubří roku 1893, je odvozené ze shody obou rodičů a věku 51 let při sňatku."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny, v matčině rubrice zapsané „roz. Kubasta“. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p93":{"id":"p93","pid":93,"name":"Terezie Brhelová","display_name":"Terezie Brhelová","maiden_line":"","years":"","status":"doc","private":false,"facts":["dcera zemřelého Jiřího Brhela (1842)","nevěsta 21. 6. 1834, 25 let"],"note":"Matka Josefa Julise; v jeho křtu 1842 uvedena jako dcera již zemřelého Georga (Jiřího) Brhela. Sňatek 1893 a křest vnučky Matyldy 1894 opakují Terezii rozenou Brhel. Sňatek 1834 přímo jmenuje nevěstiny rodiče Jiřího Brhela a Annu; rodné příjmení matky není bezpečně přečteno. Ztotožnění nevěsty s touto osobou je silný AI závěr podle páru, obce a otce; ženská podoba Brhelová je normalizace. Nový kandidátní křest 31. 1. 1808, č. 7, má rodiče Jiřího Brhela a Annu; totožnost není uzavřena kvůli rozdílu věku 26 proti 25 letům ve sňatku 1834. Kandidát je popsán v HYPOTEZY, přesné narození není připojeno. Prameny: Matriční zápis: Narození a křest Josefa Julise v Branišově; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří; Matriční zápis: Sňatek Martina Julise a Terezie Brhelové v Branišově","sources":[{"key":"branisov_krest_josef_julis_1842","label":"Narození a křest Josefa Julise v Branišově","url":"https://matriky.online/brno/00016561/38/","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9./10. 2. 1842","summary":"Na pravé straně 76 v oddílu roku 1842 je u Josepha (Josefa) uvedeno narození 9. února, křest 10. února a v rubrice „Haus Nro“ číslo 4. Otcem byl Martin Julis, domkář v Branišově, matkou Terezie, dcera již zemřelého Jiřího (Georga) Brhela. Ztotožnění s Josefem Julisem, ženichem v Žubří roku 1893, je odvozené ze shody obou rodičů a věku 51 let při sňatku."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny, v matčině rubrice zapsané „roz. Kubasta“. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."},{"key":"branisov_snatek_martin_julis_terezie_brhelova_1834","label":"Sňatek Martina Julise a Terezie Brhelové v Branišově","url":"https://matriky.online/brno/00016561/52/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"21. 6. 1834","summary":"Pravá strana, pag. 22, poslední sňatek pod rokem 1834: Martin Julis, 27 let, syn Josefa Julise a Terezie, a Terezie, 25 let, dcera Jiřího (Georga) Brhela a Anny. Oba katolíci a svobodní. Rodná příjmení matek a některé obce nejsou bezpečně přečteny. Ve sloupci domů je 14/4 bez uzavřeného přiřazení. Totožnost s rodiči Josefa Julise z jeho křtu 1842 je silný AI závěr ze shody páru, Branišova a jména Tereziina otce. Věk není přesné datum narození."}],"provenance":"Matriční zápis"},"p94":{"id":"p94","pid":94,"name":"František Komínek","display_name":"František Komínek","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář v Jiříkovicích (1881–1894)"],"note":"Otec Marie Komínkové, přímo jmenovaný v jejích sňatcích 1881 a 1893 a v křtu vnučky Matyldy 1894. Vlastní křest a sňatek zatím nenalezeny. Prameny: Matriční zápis: Sňatek Antonína Hemzy a Marie Komínkové v Žubří; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří","sources":[{"key":"zubri_snatek_anton_hemza_marie_kominkova_1881","label":"Sňatek Antonína Hemzy a Marie Komínkové v Žubří","url":"https://matriky.online/brno/00016000/89/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 2. 1881","summary":"Pravá strana, oddíl Žubří. Dne 14. února 1881 se žení Anton Hemza, domkář v Žubří, s Marií Komínkovou, služkou v Žubří. Nevěsta je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Tato dvojice rodičů se shoduje s údaji o Marii Hemzové, rozené Komínkové, při jejím dalším sňatku s Josefem Julisem roku 1893. Ztotožnění obou oddacích zápisů je silný AI závěr ze shody obou jmen, prvního manžela a rodičů nevěsty. Ženichův sloupec uvádí otce Jana Hemzu a matku Františku. V samostatných oddacích rubrikách je Marie označena jako svobodná a její věk je 26 let. U sňatku je ženich zapsán s čp. 15 a nevěsta s čp. 51; tato čísla se nepřenášejí na rodiče, rodné domy ani jiné události. Věk ženicha se kvůli rozpornému čtení nepřebírá. Sňatek sám neurčuje Mariino datum narození ani datum Antonínova úmrtí."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matriky.online/brno/00016001/77/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"13. 11. 1893","summary":"Zápis č. 5, levá strana, Žubří čp. 33. Ženich Josef Julis, 51 let, vdovec a výměnkář, je uveden jako syn Martina Julise a Terezie rozené Brhel. Nevěsta je zapsána jako Hemzová Marie, 39 let, vdova; přípis u jejího jména ji označuje za vdovu po zemřelém Antonínu Hemzovi, domkáři v Žubří. Je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Shoda jmen rodičů a domu s křtem Matyldy Julisové v roce 1894 spojuje tento pár s jejími rodiči. Oba snoubenci měli před tímto sňatkem předchozí manželství; zápis neříká, kdy jejich dřívější partneři zemřeli ani kdy se dříve brali. Kandidátní křest Marie v Jiříkovicích roku 1853 tím není potvrzen."},{"key":"zubri_krest_matilda_julisova_1894","label":"Narození a křest Matyldy Julisové v Žubří","url":"https://www.mza.cz/actapublica/matrika/detail/9999?image=216000010-000253-003380-000000-015997-000000-00-B01851-02100.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 6. 1894","summary":"Zápis č. 3 uvádí narození Matyldy dne 14. 6. 1894 v Žubří čp. 33 a křest 16. 6. Otec Josef Julis, domkář v Žubří, je výslovně manželským synem Martina Julise a Terezie rozené Brhel. Matka Marie je manželskou dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny, v matčině rubrice zapsané „roz. Kubasta“. Pozdější přípis uvádí Matyldin sňatek s Františkem Mrkvičkou z Petrovic dne 23. 9. 1919 v Olešné. Jména prarodičů jsou doložena tímto zápisem, jejich vlastní narození ani sňatky zde nejsou uvedeny."}],"provenance":"Matriční zápis"},"p95":{"id":"p95","pid":95,"name":"Kateřina (roz. Kubasta)","display_name":"Kateřina (roz. Kubasta)","maiden_line":"","years":"","status":"doc","private":false,"facts":["V oddacích zápisech dcery z let 1881 a 1893 i při křtu vnučky v roce 1894 stojí „roz. Kubasta“."],"note":"Matka Marie Komínkové podle jejích sňatků 1881 a 1893 a křtu vnučky Matyldy 1894. Všechny tři rodičovské rubriky zachovávají příjmení ve tvaru Kubasta. Vlastní křest a sňatek Kateřiny zůstávají otevřené. Příbuznost s rodinou Antonie z Jiříkovic čp. 21, jejíž křest roku 1872 uvádí Jana Augustu, se dosud nepodařilo doložit. Prameny: Matriční zápis: Sňatek Antonína Hemzy a Marie Komínkové v Žubří; Matriční zápis: Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří; Matriční zápis: Narození a křest Matyldy Julisové v Žubří","sources":[{"key":"zubri_snatek_anton_hemza_marie_kominkova_1881","label":"Sňatek Antonína Hemzy a Marie Komínkové v Žubří","url":"https://matriky.online/brno/00016000/89/","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 2. 1881","summary":"Pravá strana, oddíl Žubří. Dne 14. února 1881 se žení Anton Hemza, domkář v Žubří, s Marií Komínkovou, služkou v Žubří. Nevěsta je dcerou Františka Komínka, domkáře v Jiříkovicích, a Kateřiny zapsané „roz. Kubasta“. Tato dvojice rodičů se shoduje s údaji o Marii Hemzové, rozené Komínkové, při jejím dalším sňatku s Josefem Julisem roku 1893. Ztotožnění obou oddacích zápisů je silný AI závěr ze shody obou jmen, prvního manžela a rodičů nevěsty. Ženichův sloupec uvádí otce Jana Hemzu a matku Františku. V samostatných oddacích rubrikách je Marie označena jako svobodná a její věk je 26 let. U sňatku je ženich zapsán s čp. 15 a nevěsta s čp. 51; tato čísla se nepřenášejí na rodiče, rodné domy ani jiné události. Věk ženicha se kvůli rozpornému čtení nepřebírá. Sňatek sám neurčuje Mariino datum narození ani datum Antonínova úmrtí."},{"key":"zubri_snatek_josef_julis_marie_kominkova_1893","label":"Sňatek Josefa Julise a Marie Hemzové, rozené Komínkové, v Žubří","url":"https://matrik u z roku 1833 odpovídají rodiče ženicha záznamu o křtu v Samechově č. 9. Další stejnojmenné dítě je z domu č. 17. Prameny: Matriční zápis: Matriční zápis a křest Františka Procházky ze Samechova čp. 9; Matriční zápis: Sňatek Františka Procházky a Anny Kolmanové; Matriční zápis: Křest Marie Procházkové ze Samechova čp. 9; Matriční zápis: Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18; Matriční zápis: Křest Josefa Procházky","sources":[{"key":"samechov_krest_frantisek_prochazka_1815","label":"Matriční zápis a křest Františka Procházky ze Samechova čp. 9","url":"https://ebadatelna.soapraha.cz/d/11551/230","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 4. 1815","summary":"František, syn Josefa Procházky a Barbory z Kališť, byl v Samechově č. 9 pokřtěn 20. dubna 1815. Přesný den narození se dál ověřuje."},{"key":"samechov_snatek_frantisek_prochazka_anna_kolmanova_1833","label":"Sňatek Františka Procházky a Anny Kolmanové","url":"https://ebadatelna.soapraha.cz/d/11560/133","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 11. 1833","summary":"Primární sňatek 12. listopadu 1833, fol. 10. František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Anna je dcera Josefa Kolmana z Fišbilu čp. 6 a Rozálie. Nejasná rodná příjmení žen a Rozáliin původ se nepřijímají."},{"key":"samechov_krest_marie_prochazkova_1835","label":"Křest Marie Procházkové ze Samechova čp. 9","url":"https://ebadatelna.soapraha.cz/d/11552/268","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"5.–6. 10. 1835","summary":"Primární křest: Marie se narodila 5. a byla pokřtěna 6. října 1835 v Samechově čp. 9. Otec František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Matka Anna je dcera Josefa Kolmana, šafáře z Fišbilu čp. 6, a Rozálie. Nejasná rodná příjmení Barbory a Rozálie ani Rozáliin původ se nepřijímají."},{"key":"samechov_krest_josef_prochazka_1854","label":"Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18","url":"https://ebadatelna.soapraha.cz/d/11553/392","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 3. 1854","summary":"Josef, narozený a pokřtěný 9. března 1854 v Samechově čp.18, dítě nemanželské, otec v zápisu chybí. Matka Marie Procházková, dcera Františka Procházky, půlsedláka ze Samechova čp.18, a Anny roz. Kollmannové z Pyskočel. Shodný den 9.3.1854 čte i oddací zápis1885; oba sňatky1885 a1893 jmenují tentýž sázavský křestní list č.143 vydaný 5.5.1881. Sňatek1893 doslovně uvádí narození 5.5.1854; rozpor zůstává citován podle pramenů, profilové datum se opírá o vlastní křest."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."}],"provenance":"Matriční zápis"},"p131":{"id":"p131","pid":131,"name":"Anna Kolmanová","display_name":"Anna Kolmanová","maiden_line":"","years":"","status":"doc","private":false,"facts":["Sňatek s Františkem Procházkou 12. listopadu 1833.","Otec byl šafářem ve Fišbilu č. 6."],"note":"Svatba Anny a křest její dcery Marie uvádějí jejího otce Josefa Kolmana a matku Rozálii. Prameny: Matriční zápis: Sňatek Františka Procházky a Anny Kolmanové; Matriční zápis: Křest Marie Procházkové ze Samechova čp. 9; Matriční zápis: Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18; Matriční zápis: Křest Josefa Procházky","sources":[{"key":"samechov_snatek_frantisek_prochazka_anna_kolmanova_1833","label":"Sňatek Františka Procházky a Anny Kolmanové","url":"https://ebadatelna.soapraha.cz/d/11560/133","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 11. 1833","summary":"Primární sňatek 12. listopadu 1833, fol. 10. František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Anna je dcera Josefa Kolmana z Fišbilu čp. 6 a Rozálie. Nejasná rodná příjmení žen a Rozáliin původ se nepřijímají."},{"key":"samechov_krest_marie_prochazkova_1835","label":"Křest Marie Procházkové ze Samechova čp. 9","url":"https://ebadatelna.soapraha.cz/d/11552/268","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"5.–6. 10. 1835","summary":"Primární křest: Marie se narodila 5. a byla pokřtěna 6. října 1835 v Samechově čp. 9. Otec František je syn Josefa Procházky, půlsedláka ze Samechova čp. 9, a Barbory z Kališť čp. 3. Matka Anna je dcera Josefa Kolmana, šafáře z Fišbilu čp. 6, a Rozálie. Nejasná rodná příjmení Barbory a Rozálie ani Rozáliin původ se nepřijímají."},{"key":"samechov_krest_josef_prochazka_1854","label":"Křest Josefa, nemanželského syna Marie Procházkové ze Samechova čp. 18","url":"https://ebadatelna.soapraha.cz/d/11553/392","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 3. 1854","summary":"Josef, narozený a pokřtěný 9. března 1854 v Samechově čp.18, dítě nemanželské, otec v zápisu chybí. Matka Marie Procházková, dcera Františka Procházky, půlsedláka ze Samechova čp.18, a Anny roz. Kollmannové z Pyskočel. Shodný den 9.3.1854 čte i oddací zápis1885; oba sňatky1885 a1893 jmenují tentýž sázavský křestní list č.143 vydaný 5.5.1881. Sňatek1893 doslovně uvádí narození 5.5.1854; rozpor zůstává citován podle pramenů, profilové datum se opírá o vlastní křest."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."}],"provenance":"Matriční zápis"},"p134":{"id":"p134","pid":134,"name":"Matěj Turek","display_name":"Matěj Turek","maiden_line":"","years":"","status":"doc","private":false,"facts":["Otec Rosalie Turkové a děd Barbory Turkové.","V matrice z roku 1862 uveden jako zemřelý nádeník z Kounic.","V křestním zápisu dcery Rosalie z roku 1835 jsou jako jeho rodiče uvedeni Václav Turek a Alžběta.","× 9. 11. 1830 Kounice, Anna","Při sňatku v roce 1830 uveden jako nádeník, vdovec ve věku 46 let; u ženicha č. 83."],"note":"Matěj je jako otec Rosalie uveden v křestním zápisu vnučky Barbory z května 1862. Zápis jej už tehdy označuje jako zemřelého. Jmenuje ho také křestní zápis pravnuka Josefa z roku 1896. Prameny: Matriční zápis: Barbora Turková, narození 6. a křest 7. května 1862 v Kounicích; Matriční zápis: Křest Josefa Procházky; Matriční zápis: Rosalie Turková, křestní zápis z Kounic, 28. února 1835; Matriční zápis: Sňatek Matěje Turka a Anny 9. listopadu 1830 v Kounicích","sources":[{"key":"kounice_krest_barbora_turkova_1862","label":"Barbora Turková, narození 6. a křest 7. května 1862 v Kounicích","url":"https://ebadatelna.soapraha.cz/d/7070/185","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 5. 1862","summary":"V posledním řádku strany 183 je zapsána Barbora, narozená 6. května a pokřtěná 7. května 1862. Její matkou byla Rosalie Turková. Matrika jmenuje také Rosaliiny rodiče, zemřelého nádeníka Matěje Turka z Kounic a zemřelou Annu. Rodné příjmení Anny zůstává otevřené."},{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 11. 1896","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"kounice_krest_rosalie_turkova_1835","label":"Rosalie Turková, křestní zápis z Kounic, 28. února 1835","url":"https://ebadatelna.soapraha.cz/d/7068/132","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 2. 1835","summary":"Ve společné kolonce pro den narození a křtu je uveden 28. únor 1835. Otcem byl Matěj Turek, nádeník z Kounic, syn Václava Turka a Alžběty. Matkou byla Anna, dcera Jana a Ludmily. Jména obou rodičů, místo a otcovo povolání odpovídají také zápisu o narození Rosaliiny dcery Barbory z roku 1862. V rubrice původu Alžběty je její otec uveden pouze křestním jménem Matěj. V rubrice původu Ludmily je její otec uveden pouze křestním jménem Tomáš."},{"key":"kounice_snatek_matej_turek_anna_1830","label":"Sňatek Matěje Turka a Anny 9. listopadu 1830 v Kounicích","url":"https://ebadatelna.soapraha.cz/d/7072/52","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 11. 1830","summary":"Dne 9. listopadu 1830 se v Kounicích oženil Matěj Turek, nádeník a vdovec ve věku 46 let, s třicetiletou svobodnou Annou. U ženicha je uvedeno č. 83 a u nevěsty č. 49. Matěj byl synem Václava Turka a Alžběty, Anna dcerou Jana a Ludmily. Stejné rodičovské dvojice uvádí také křestní zápis jejich dcery Rosalie z roku 1835. U Alžběty je jako její otec uveden Matěj; příjmení ani další totožnost se nepřebírají. U Ludmily je jako její otec uveden Tomáš; příjmení ani další totožnost se nepřebírají."}],"provenance":"Matriční zápis"},"p135":{"id":"p135","pid":135,"name":"Anna","display_name":"Anna","maiden_line":"","years":"","status":"doc","private":false,"facts":["Matka Rosalie Turkové, v roce 1835 uvedena jako dcera Jana a Ludmily.","× 9. 11. 1830 Kounice, Matěj Turek","Při sňatku v roce 1830 uvedena jako svobodná ve věku 30 let; u nevěsty č. 49."],"note":"Křestní zápis vnučky Barbory označuje Annu v květnu 1862 jako zemřelou. Její rodné příjmení zůstává otevřené. Prameny: Matriční zápis: Rosalie Turková, křestní zápis z Kounic, 28. února 1835; Matriční zápis: Barbora Turkov veden Matěj; příjmení ani další totožnost se nepřebírají. U Ludmily je jako její otec uveden Tomáš; příjmení ani další totožnost se nepřebírají."}],"provenance":"Matriční zápis"},"p160":{"id":"p160","pid":160,"name":"Josef Mejstřík","display_name":"Josef Mejstřík","maiden_line":"","years":"asi 1783 – 1863","status":"doc","private":false,"facts":["půlsedlák, Janovická Lhota čp. 29","děti v rejstříku 1811–1824","† 4. 5. 1863 Lhota čp. 29, výminkář, vdovec, 80 let"],"note":"Otec Josefa * 1815 podle jeho křtu. V rejstříku narozených šest dětí s manželkou Magdalenou, Lhota čp. 29, 1811–1824. Pravděpodobný sňatek 6. 11. 1810 v Sudějově: Josef, syn Jana Mejstříka(?), chalupníka z Lhoty Janovské; nevěsta tam ale čtena Marjana(?), ne Magdalena (AI závěr, neověřeno). Pravděpodobný křest: Josef * 16./17. 4. 1791, Lhota čp. 4, syn Jana Mejstříka a Kateřiny; otec sedí se sňatkem, věk ne (1810 zapsáno 21(?) let, 1863 zapsáno 80 let, z křtu by vycházelo 19 a 72). Prameny: Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29; Matriční zápis: Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29; Matriční zápis: Úmrtí Josefa Mejstříka, výminkáře z Janovické Lhoty čp. 29","sources":[{"key":"lhota_krest_josef_mejstrik_1815","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13234/12","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 8. 1815","summary":"Josef se narodil 14. a byl pokřtěn 15. srpna 1815 ve Lhotě čp. 29 jako syn půlsedláka Josefa Mejstříka a Magdaleny Doudové ze Žandova. Rok potvrzuje rejstřík Uhlířské Janovice 24, sn. 101 (Lhotta 29, Tom VI, fol. 18)."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1815_1818","label":"Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/101","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1811–1818","summary":"Rejstřík narozených Uhlířské Janovice, pravá strana. Ve Lhotě čp. 29, otec Josef, matka Magdalena: Josef 14. 8. 1815 (tom VI, fol. 18) a Anna 7. 5. 1818 (tom VI, fol. 21). Podle stejné strany patří do řady i Jan 9. 12. 1811 (fol. 15) a Marie 20. 6. 1813 (fol. 16). Rejstřík je pozdější pomůcka, samotné křty nejsou v tomto zápisu."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1821_1824","label":"Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/102","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1821–1824","summary":"Rejstřík narozených Uhlířské Janovice, levá strana. Ve Lhotě čp. 29, rodiče Josef a Magdalena: František 13. 2. 1821 (tom VI, fol. 27) a Václav 19. 8. 1824 (tom VI, fol. 31). Řádky se v rejstříku svažují, data jsou čtena po sklonu řádku."},{"key":"lhota_umrti_josef_mejstrik_1863","label":"Úmrtí Josefa Mejstříka, výminkáře z Janovické Lhoty čp. 29","url":"https://ebadatelna.soapraha.cz/d/13248/65","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"4. 5. 1863","summary":"Josef Mejstřík, soused výminkář ze Lhoty čp. 29, zemřel 4. května 1863 a byl pochován 6. května v Uhlířských Janovicích. Vdovec, 80 let, příčina stáří podle lístku č. 32. Rodiče zápis neuvádí. Narození vychází asi na rok 1783, věk může být zaokrouhlený."}],"provenance":"Matriční zápis"},"p161":{"id":"p161","pid":161,"name":"Magdalena Doudová","display_name":"Magdalena Doudová","maiden_line":"","years":"","status":"doc","private":false,"facts":["Dcera Jana Daudy ze Žandova a Barbory.","Matka Anny, Františka a Václava, pokřtěných v letech 1818, 1821 a 1824."],"note":"Při křtu tří jejích dětí ve Lhotě č. 29 jsou zaznamenáni i její rodiče. Datum a místo jejího narození se dál ověřují. Prameny: Matriční zápis: Křest Josefa Mejstříka; Matriční zápis: Křest Jana, syna Josefa Mejstříka z Lhoty čp. 29; Matriční zápis: Křest Anny Mejstříkové a filiace její matky Magdaleny; _kind":"parish_register","provenance":"Matriční zápis","date":"13. 2. 1821","summary":"František se narodil 13. a byl pokřtěn 14. února 1821 ve Lhotě čp. 29. Otec Josef Mejstřík, podsedník; matka Magdalena, dcera Jana Daudy ze Žandova a Barbory. Rodné příjmení Barbory zde uvedeno není."},{"key":"lhota_krest_vaclav_mejstrik_1824","label":"Křest Václava Mejstříka a filiace jeho matky Magdaleny","url":"https://ebadatelna.soapraha.cz/d/13234/18","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 8. 1824","summary":"Václav se narodil 19. a byl pokřtěn 20. srpna 1824 ve Lhotě čp. 29. Matka Magdalena je uvedena jako dcera Jana Daudy, sedláka ze Žandova, a Barbory. Rodné příjmení Barbory není bezpečně rozlišeno."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1815_1818","label":"Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/101","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1811–1818","summary":"Rejstřík narozených Uhlířské Janovice, pravá strana. Ve Lhotě čp. 29, otec Josef, matka Magdalena: Josef 14. 8. 1815 (tom VI, fol. 18) a Anna 7. 5. 1818 (tom VI, fol. 21). Podle stejné strany patří do řady i Jan 9. 12. 1811 (fol. 15) a Marie 20. 6. 1813 (fol. 16). Rejstřík je pozdější pomůcka, samotné křty nejsou v tomto zápisu."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1821_1824","label":"Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/102","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1821–1824","summary":"Rejstřík narozených Uhlířské Janovice, levá strana. Ve Lhotě čp. 29, rodiče Josef a Magdalena: František 13. 2. 1821 (tom VI, fol. 27) a Václav 19. 8. 1824 (tom VI, fol. 31). Řádky se v rejstříku svažují, data jsou čtena po sklonu řádku."}],"provenance":"Matriční zápis"},"p162":{"id":"p162","pid":162,"name":"František Brožek","display_name":"František Brožek","maiden_line":"","years":"","status":"doc","private":false,"facts":["Chalupník z Kochánova.","Otec Kateřiny Brožkové.","Kochánov: u Kateřiny roku 1822 je č. 9. U Barbory roku 1824 je pravděpodobně č. 4, horní tah je slitý."],"note":"Jako otec je uveden při sňatku své dcery Kateřiny s Josefem Mejstříkem roku 1840. Křest jejího syna Antonína roku 1862 ho znovu jmenuje v rubrice matky. Prameny: Matriční zápis: Sňatek Josefa Mejstříka a Kateřiny Brožkové; Matriční zápis: Křest Antonína Mejstříka; Matriční zápis: Křest Kateřiny Brožkové v Kochánově roku 1822; Matriční zápis: Křest Barbory Brožkové v Kochánově roku 1824","sources":[{"key":"lhota_snatek_josef_mejstrik_katerina_brozkova_1840","label":"Sňatek Josefa Mejstříka a Kateřiny Brožkové","url":"https://ebadatelna.soapraha.cz/d/13240/20","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 2. 1840","summary":"Josef Mejstřík, zahradník, 25 let, syn zahradníka Josefa Mejstříka ze Lhoty čp. 29 a Magdaleny rozené Doudové ze Žandova, se 25. února 1840 oženil s osmnáctiletou Kateřinou, dcerou chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z obce čtené jako Vranice(?) čp. 21. Otec nevěsty dal souhlas k sňatku nezletilé (AI čtení)."},{"key":"lhota_krest_antonin_mejstrik_1862","label":"Křest Antonína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13237/111","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 10. 1862","summary":"Antonín se narodil 16. a byl pokřtěn 17. října 1862 ve Lhotě čp. 29 u Uhlířských Janovic. Otec Josef Mejstřík, rolník, syn Josefa Mejstříka a Magdaleny Doudové ze Žandova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."},{"key":"kochanov_krest_katerina_brozkova_1822","label":"Křest Kateřiny Brožkové v Kochánově roku 1822","url":"https://ebadatelna.soapraha.cz/d/13045/131","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1822","summary":"Kateřina se narodila roku 1822 v Kochánově č. 9. V rubrice je u narození 21. den a u křtu 22. den, čtení měsíce zůstává otevřené. Otec František Brožek, chalupník. Matka Anna byla dcerou Jana Pokorného, sedláka z Vranic, a Kateřiny."},{"key":"kochanov_krest_barbora_brozkova_1824","label":"Křest Barbory Brožkové v Kochánově roku 1824","url":"https://ebadatelna.soapraha.cz/d/13045/132","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1824","summary":"Barbora, dcera chalupníka Františka Brožka a Anny, je zapsána roku 1824 v Kochánově. V domovním sloupci je pravděpodobně č. 4, horní tah je slitý. U matky jsou uvedeni Jan Pokorný, sedlák z Vranic, a Kateřina."}],"provenance":"Matriční zápis"},"p163":{"id":"p163","pid":163,"name":"Anna Pokorná","display_name":"Anna Pokorná","maiden_line":"","years":"","status":"doc","private":false,"facts":["Matka Kateřiny Brožkové.","Rodné příjmení Pokorná. Původ v křtu vnuka roku 1862 uveden slovy „z Vranic“.","Kochánov: u Kateřiny roku 1822 je č. 9. U Barbory roku 1824 je pravděpodobně č. 4, horní tah je slitý."],"note":"Sňatek dcery Kateřiny roku 1840 i křest jejího syna Antonína roku 1862 uvádějí Annu jako rozenou Pokornou. Ve sňatku dcery je u původu Anny uvedeno čp. 21; jméno obce je v tomto zápisu hůře čitelné. Křty obou dcer uvádějí jejího otce Jana Pokorného, sedláka z Vranic, a matku Kateřinu. Prameny: Matriční zápis: Sňatek Josefa Mejstříka a Kateřiny Brožkové; Matriční zápis: Křest Antonína Mejstříka; Matriční zápis: Křest Kateřiny Brožkové v Kochánově roku 1822; Matriční zápis: Křest Barbory Brožkové v Kochánově roku 1824","sources":[{"key":"lhota_snatek_josef_mejstrik_katerina_brozkova_1840","label":"Sňatek Josefa Mejstříka a Kateřiny Brožkové","url":"https://ebadatelna.soapraha.cz/d/13240/20","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"25. 2. 1840","summary":"Josef Mejstřík, zahradník, 25 let, syn zahradníka Josefa Mejstříka ze Lhoty čp. 29 a Magdaleny rozené Doudové ze Žandova, se 25. února 1840 oženil s osmnáctiletou Kateřinou, dcerou chalupníka Františka Brožka z Kochánova a Anny rozené Pokorné z obce čtené jako Vranice(?) čp. 21. Otec nevěsty dal souhlas k sňatku nezletilé (AI čtení)."},{"key":"lhota_krest_antonin_mejstrik_1862","label":"Křest Antonína Mejstříka","url":"https://ebadatelna.soapraha.cz/d/13237/111","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"16. 10. 1862","summary":"Antonín se narodil 16. a byl pokřtěn 17. října 1862 ve Lhotě čp. 29 u Uhlířských Janovic. Otec Josef Mejstřík, rolník, syn Josefa Mejstříka a Magdaleny Doudové ze Žandova; matka Kateřina, dcera Františka Brožka z Kochánova a Anny Pokorné z Vranic."},{"key":"kochanov_krest_katerina_brozkova_1822","label":"Křest Kateřiny Brožkové v Kochánově roku 1822","url":"https://ebadatelna.soapraha.cz/d/13045/131","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1822","summary":"Kateřina se narodila roku 1822 v Kochánově č. 9. V rubrice je u narození 21. den a u křtu 22. den, čtení měsíce zůstává otevřené. Otec František Brožek, chalupník. Matka Anna byla dcerou Jana Pokorného, sedláka z Vranic, a Kateřiny."},{"key":"kochanov_krest_barbora_brozkova_1824","label":"Křest Barbory Brožkové v Kochánově roku 1824","url":"https://ebadatelna.soapraha.cz/d/13045/132","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"1824","summary":"Barbora, dcera chalupníka Františka Brožka a Anny, je zapsána roku 1824 v Kochánově. V domovním sloupci je pravděpodobně č. 4, horní tah je slitý. U matky jsou uvedeni Jan Pokorný, sedlák z Vranic, a Kateřina."}],"provenance":"Matriční zápis"},"p164":{"id":"p164","pid":164,"name":"František Drož","display_name":"František Drož","maiden_line":"","years":"","status":"doc","private":false,"facts":["rolník, Břežany čp. 56 (sňatek syna 1857)","gruntovník, Břežany čp. 56 (křest vnučky 1863)"],"note":"Otec Františka Drože z Hradišťka, výslovně ie Majerová","maiden_line":"","years":"","status":"doc","private":false,"facts":["podruhyně, Horní Lukavice čp. 43"],"note":"Matka Tomáše Majera; otec Tomáše v zápisu neuveden. Prameny: Matriční zápis: Křest Josefa Vavřince Majera","sources":[{"key":"lukavice_krest_josef_majer_1874","label":"Křest Josefa Vavřince Majera","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0720-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."}],"provenance":"Matriční zápis"},"p171":{"id":"p171","pid":171,"name":"Kateřina Vyskočová","display_name":"Kateřina Vyskočová","maiden_line":"","years":"","status":"doc","private":false,"facts":["provdaná Brožová, Dolní Lukavice"],"note":"Matka Marie Vyskočové. Prameny: Matriční zápis: Křest Josefa Vavřince Majera","sources":[{"key":"lukavice_krest_josef_majer_1874","label":"Křest Josefa Vavřince Majera","url":"https://www.portafontium.eu/iipimage/30071698/dolni-lukavice-23_0720-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"10. 8. 1874","summary":"Josef Vavřinec se narodil 10. srpna a byl pokřtěn 11. srpna 1874 v Horní Lukavici čp. 1. Otec Tomáš Majer, pasák ve dvoře, syn Marie Majerové, podruhyně z čp. 43; otec Tomáše není uveden. Matka Marie, dcera Kateřiny Vyskočové, provdané Brožové, a vnučka Václava Vyskoče, domkáře z Kbelnice čp. 21. Jméno Josefa Haizmana je v zápisu matky škrtnuto. Přípis: oddán v Přešticích 15. 3. 1932 s Anastazií Vaňkovou."}],"provenance":"Matriční zápis"},"p172":{"id":"p172","pid":172,"name":"Josef Krieger","display_name":"Josef Krieger","maiden_line":"","years":"","status":"doc","private":false,"facts":["domkář, Dlouhá Louka čp. 9 (křest syna 1837)","nádenník podle sňatku syna 1867, domkář podle křtu vnučky 1878"],"note":"V křtu syna Jana 1837 výslovně syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny. Vlastní kandidátní sňatek 1829 není připojen; rozdíl domu nevěsty a nejisté příjmení její matky zůstávají otevřené. Prameny: Matriční zápis: Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9; Matriční zápis: Sňatek Jana Kriegera a Marie Lautnerové; Matriční zápis: Křest dvojčat Josefiny a Markéty Kriegerových","sources":[{"key":"dlouha_louka_krest_jan_krieger_1837","label":"Křest Jana Nepomuka Kriegera, Dlouhá Louka čp. 9","url":"https://www.portafontium.eu/iipimage/30067683/prestice-33_0160-n","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1837","summary":"Jan Nepomuk (dobový pravopis Krygr, normalizováno Krieger) se narodil a téhož dne byl pokřtěn 22. září 1837 v Dlouhé Louce čp. 9. Otec Josef Krieger, domkář, syn Jana Kriegera, domkáře z Dlouhé Louky čp. 2, a Anny; matka Kateřina, dcera Antonína Sedláčka, domkáře z Dlouhé Louky čp. 5, a Kateřiny. Rodná příjmení obou babiček a jejich místa původu nejsou bezpečně určena. Silná AI hypotéza (neověřeno): jde o Jana Kriegera ze sňatku 22. října 1867 a otce Markéty z roku 1878, podle shody obou rodičů, domů 9 a 5 a věku 30 let ve sňatku. Přímý spojovací přípis není uveden. Kandidátní sňatek rodičů z roku 1829 zůstává samostatnou hypotézou kvůli nevysvětlenému rozdílu čp. 13 a 5."},{"key":"dlouha_louka_snatek_jan_krieger_marie_lautnerova_1867","label":"Sňatek Jana Kriegera a Marie Lautnerové","url":"https://www.portafontium.eu/iipimage/30067681/prestice-31_1670-o","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 10. 1867","summary":"Přeštice 31, str. 175, čtvrtý sňatek: Jan Krieger, domkář z Dlouhé Louky č. 9, 30 let, syn Josefa Kriegera,
