,"display_name":"Jan Barták","maiden_line":"","years":"","status":"doc","private":false,"facts":["Barbora se narodila v listopadu 1779, Veronika v lednu 1782 a dvojčata v únoru 1784.","V Kalištích č. 5 ve stejných letech žili rodiče stejných jmen. Obě rodiny lze v matrice odlišit podle čísla domu."],"note":"Jan Barták je v Kalištích č. 3 s Kateřinou zapsán jako otec Barbory, Veroniky a dvojčat Doroty a Alžběty. Oddací zápis dcery Barbory uvádí, že byl chalupníkem. Prameny: Matriční zápis: Narození a křest Barbory Bartákové; Matriční zápis: Narození a křest Veroniky, dcery Jana Bartáka a Kateřiny; Matriční zápis: Narození a křest dvojčat Doroty a Alžběty Bartákových; Matriční zápis: Sňatek Josefa Procházky ze Samechova a Barbory z Kališť","sources":[{"key":"kaliste_narozeni_barbora_bartakova_1779","label":"Narození a křest Barbory Bartákové","url":"https://ebadatelna.soapraha.cz/d/10526/8","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1779","summary":"Barbora se narodila 6. listopadu 1779 v Kalištích č. 3 a byla pokřtěna 7. listopadu. V rubrice rodičů jsou Jan Barták a Kateřina. Stejné číslo domu se při popisu Barbořina původu objevuje o generaci později. Oddací zápis z roku 1801 jí připisuje věk 20 let, podle křtu jí bylo 22."},{"key":"kaliste_krest_veronika_bartakova_1782","label":"Narození a křest Veroniky, dcery Jana Bartáka a Kateřiny","url":"https://ebadatelna.soapraha.cz/d/10526/11","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 1. 1782","summary":"Veronika, dcera Jana Bartáka a Kateřiny z Kališť č. 3, se narodila 20. ledna 1782 a byla pokřtěna 21. ledna."},{"key":"kaliste_krest_dorota_alzbeta_bartakovy_1784","label":"Narození a křest dvojčat Doroty a Alžběty Bartákových","url":"https://ebadatelna.soapraha.cz/d/10526/13","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 2. 1784","summary":"Dvojčata Dorota a Alžběta se narodila a byla pokřtěna 7. února 1784. V obou řádcích jsou jako rodiče uvedeni Jan Barták a Kateřina z Kališť č. 3."},{"key":"samechov_snatek_josef_prochazka_barbora_bartakova_1801","label":"Sňatek Josefa Procházky ze Samechova a Barbory z Kališť","url":"https://ebadatelna.soapraha.cz/d/10532/65","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"15. 11. 1801","summary":"V Kalištích se 15. listopadu 1801 oženil Josef, syn sedláka Josefa Procházky ze Samechova č. 9, s Barborou, dcerou chalupníka Jana z Kališť. V zápisu je věk 26 a 20 let."}],"provenance":"Matriční zápis"},"p523":{"id":"p523","pid":523,"name":"Kateřina","display_name":"Kateřina","maiden_line":"","years":"","status":"doc","private":false,"facts":["Barboru nechali pokřtít 7. listopadu 1779.","Kateřinino rodné příjmení se dosud nepodařilo doložit."],"note":"Kateřina a Jan Barták jsou v Kalištích č. 3 zapsáni jako rodiče Barbory, Veroniky a dvojčat Doroty a Alžběty. Prameny: Matriční zápis: Narození a křest Barbory Bartákové; Matriční zápis: Narození a křest Veroniky, dcery Jana Bartáka a Kateřiny; Matriční zápis: Narození a křest dvojčat Doroty a Alžběty Bartákových","sources":[{"key":"kaliste_narozeni_barbora_bartakova_1779","label":"Narození a křest Barbory Bartákové","url":"https://ebadatelna.soapraha.cz/d/10526/8","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"6. 11. 1779","summary":"Barbora se narodila 6. listopadu 1779 v Kalištích č. 3 a byla pokřtěna 7. listopadu. V rubrice rodičů jsou Jan Barták a Kateřina. Stejné číslo domu se při popisu Barbořina původu objevuje o generaci později. Oddací zápis z roku 1801 jí připisuje věk 20 let, podle křtu jí bylo 22."},{"key":"kaliste_krest_veronika_bartakova_1782","label":"Narození a křest Veroniky, dcery Jana Bartáka a Kateřiny","url":"https://ebadatelna.soapraha.cz/d/10526/11","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"20. 1. 1782","summary":"Veronika, dcera Jana Bartáka a Kateřiny z Kališť č. 3, se narodila 20. ledna 1782 a byla pokřtěna 21. ledna."},{"key":"kaliste_krest_dorota_alzbeta_bartakovy_1784","label":"Narození a křest dvojčat Doroty a Alžběty Bartákových","url":"https://ebadatelna.soapraha.cz/d/10526/13","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 2. 1784","summary":"Dvojčata Dorota a Alžběta se narodila a byla pokřtěna 7. února 1784. V obou řádcích jsou jako rodiče uvedeni Jan Barták a Kateřina z Kališť č. 3."}],"provenance":"Matriční zápis"},"p538":{"id":"p538","pid":538,"name":"Matěj","display_name":"Matěj","maiden_line":"","years":"","status":"doc","private":false,"facts":["Otec Alžběty a děd Matěje Turka."],"note":"Křestní jméno Matěj je doloženo ve dvou připojených kounických zápisech jako jméno otce Alžběty. Příjmení, životní data ani totožnost s osobou stejného jména nejsou přijaty. Prameny: Matriční zápis: Rosalie Turková, křestní zápis z Kounic, 28. února 1835; Matriční zápis: Sňatek Matěje Turka a Anny 9. listopadu 1830 v Kounicích","sources":[{"key":"kounice_krest_rosalie_turkova_1835","label":"Rosalie Turková, křestní zápis z Kounic, 28. února 1835","url":"https://ebadatelna.soapraha.cz/d/7068/132","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 2. 1835","summary":"Ve společné kolonce pro den narození a křtu je uveden 28. únor 1835. Otcem byl Matěj Turek, nádeník z Kounic, syn Václava Turka a Alžběty. Matkou byla Anna, dcera Jana a Ludmily. Jména obou rodičů, místo a otcovo povolání odpovídají také zápisu o narození Rosaliiny dcery Barbory z roku 1862. V rubrice původu Alžběty je její otec uveden pouze křestním jménem Matěj. V rubrice původu Ludmily je její otec uveden pouze křestním jménem Tomáš."},{"key":"kounice_snatek_matej_turek_anna_1830","label":"Sňatek Matěje Turka a Anny 9. listopadu 1830 v Kounicích","url":"https://ebadatelna.soapraha.cz/d/7072/52","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 11. 1830","summary":"Dne 9. listopadu 1830 se v Kounicích oženil Matěj Turek, nádeník a vdovec ve věku 46 let, s třicetiletou svobodnou Annou. U ženicha je uvedeno č. 83 a u nevěsty č. 49. Matěj byl synem Václava Turka a Alžběty, Anna dcerou Jana a Ludmily. Stejné rodičovské dvojice uvádí také křestní zápis jejich dcery Rosalie z roku 1835. U Alžběty je jako její otec uveden Matěj; příjmení ani další totožnost se nepřebírají. U Ludmily je jako její otec uveden Tomáš; příjmení ani další totožnost se nepřebírají."}],"provenance":"Matriční zápis"},"p542":{"id":"p542","pid":542,"name":"Tomáš","display_name":"Tomáš","maiden_line":"","years":"","status":"doc","private":false,"facts":["Otec Ludmily a děd Anny."],"note":"Křestní jméno Tomáš je doloženo ve dvou připojených kounických zápisech jako jméno otce Ludmily. Příjmení, životní data ani totožnost s osobou stejného jména nebo se zápisem z roku 1780 nejsou přijaty. Prameny: Matriční zápis: Rosalie Turková, křestní zápis z Kounic, 28. února 1835; Matriční zápis: Sňatek Matěje Turka a Anny 9. listopadu 1830 v Kounicích","sources":[{"key":"kounice_krest_rosalie_turkova_1835","label":"Rosalie Turková, křestní zápis z Kounic, 28. února 1835","url":"https://ebadatelna.soapraha.cz/d/7068/132","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 2. 1835","summary":"Ve společné kolonce pro den narození a křtu je uveden 28. únor 1835. Otcem byl Matěj Turek, nádeník z Kounic, syn Václava Turka a Alžběty. Matkou byla Anna, dcera Jana a Ludmily. Jména obou rodičů, místo a otcovo povolání odpovídají také zápisu o narození Rosaliiny dcery Barbory z roku 1862. V rubrice původu Alžběty je její otec uveden pouze křestním jménem Matěj. V rubrice původu Ludmily je její otec uveden pouze křestním jménem Tomáš."},{"key":"kounice_snatek_matej_turek_anna_1830","label":"Sňatek Matěje Turka a Anny 9. listopadu 1830 v Kounicích","url":"https://ebadatelna.soapraha.cz/d/7072/52","kind":"O","source_kind":"parish_register" vice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."},{"key":"janovice_krest_jan_mejstrik_1741","label":"Křest Jana, syna Matěje Mejstříka z Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/146","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 5. 1741","summary":"Lhota, str. 294. Jan, narozený a pokřtěný 11. května, otec Matěj Mejstřík, matka Anna, poddaní panství Šternberk. Kmotři Václav Červinka(?) a Václav Čech z Janovic, Barbara Malinová z Lhoty. Rok 1741 potvrzuje rejstřík 13249 sn. 98 (tom II, fol. 294). Že je to pozdější otec dětí v Lhotě čp. 4, není doloženo přímo."}],"provenance":"Matriční zápis"},"p641":{"id":"p641","pid":641,"name":"Anna Dobíhalová","display_name":"Anna Dobíhalová","maiden_line":"","years":"","status":"prob","private":false,"facts":["dcera Františka Dobíhala z Janovic","× 12. 7. 1735 Matěj Mejstřík"],"note":"Prameny: Matriční zápis: Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","sources":[{"key":"janovice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."}],"provenance":"Matriční zápis"},"p708":{"id":"p708","pid":708,"name":"Niklas Womačka (Vomáčka)","display_name":"Niklas Womačka (Vomáčka)","maiden_line":"","years":"asi 1695–1785","status":"doc","private":false,"facts":["* asi 1695","× 9. 1. 1734 Petrovice, Catharina Hadenka (?)","× 22. 11. 1739 Petrovice, vdovec, Marina Slámová (?)","sedlák, Petrovice čp. 12","† 5. 10. 1785 Petrovice čp. 12, 90 let"],"note":"Otec Václava podle sňatku 1772. Ztotožnění se zemřelým 1785 z čp. 12 je AI závěr opřený o jméno, stav a dům. Ztotožnění se ženichem 1734 a 1739 je AI závěr opřený o jméno a ves; roku 1734 by mu bylo asi 39 let. Prameny: Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Úmrtí Niklase Vomáčky, sedláka v Petrovicích čp. 12; Matriční zápis: První sňatek Niklase Vomáčky; Matriční zápis: Druhý sňatek Niklase Vomáčky; Matriční zápis: Křest Thomase, syna Niklase Vomáčky","sources":[{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"petrovice_umrti_niklas_womacka_1785","label":"Úmrtí Niklase Vomáčky, sedláka v Petrovicích čp. 12","url":"https://www.mza.cz/actapublica/matrika/detail/6802?image=216000010-000253-003380-000000-015940-000000-00-B07660-00560.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"5. 10. 1785","summary":"5. 10. 1785 zemřel Niklas Vomáčka, sedlák, Petrovice čp. 12, 90 let, tedy narozen asi 1695. Ztotožnění s otcem Václava je AI závěr opřený o jméno, stav a dům."},{"key":"petrovice_snatek_niklas_womacka_catharina_hadenka_1734","label":"První sňatek Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 1. 1734","summary":"9. 1. 1734 se v Petrovicích oženil mládenec Nicolaus Womaczka s Catharinou, dcerou Jakuba Hadenky (?). Příjmení nevěsty je čteno nejistě. Ztotožnění se sedlákem Niklasem z čp. 12 je AI závěr opřený o jméno, ves a následující sňatek téhož jména."},{"key":"petrovice_snatek_niklas_womacka_marina_slama_1739","label":"Druhý sňatek Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1739 (rok z pořadí zápisů)","summary":"22. 11. 1739 se v Petrovicích oženil vdovec Nicolaus Womaczka s pannou Marinou Slámovou (?). Svědci Joa. Womaczka a Joannes Raubal. Příjmení nevěsty je čteno nejistě; dlouhé s ve tvaru Flama odpovídá Sláma (AI čtení)."},{"key":"petrovice_krest_thomas_vomacka_1745","label":"Křest Thomase, syna Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02210.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 12. 1745 (měsíc z pořadí zápisů)","summary":"17. 12. 1745 v Petrovicích pokřtěn Thomas, syn Nicolause Vomáčky a Marianny. Kmotři Christian Humlíček z Petrovic a Marianna Cínová (?) z Nového Města."}],"provenance":"Matriční zápis"},"p709":{"id":"p709","pid":709,"name":"Marina Slámová (?)","display_name":"Marina Slámová (?)","maiden_line":"","years":"† 1787","status":"prob","private":false,"facts":["× 22. 11. 1739 Petrovice, vdovec Niklas Vomáčka","† 14. 12. 1787 Petrovice čp. 12"],"note":"Druhá žena Niklase Vomáčky; příjmení z oddacího zápisu 1739 je čteno nejistě. Při křtu syna Thomase 1745 je matka zapsána Marianna. Že byla matkou Václava * asi 1750, žádný přečtený zápis neuvádí, jeho křest zatím chybí (AI hypotéza). Prameny: Matriční zápis: Úmrtí Mariny, vdovy po Niklasovi Vomáčkovi; Matriční zápis: Druhý sňatek Niklase Vomáčky; Matriční zápis: Křest Thomase, syna Niklase Vomáčky","sources":[{"key":"petrovice_umrti_marina_womackova_1787","label":"Úmrtí Mariny, vdovy po Niklasovi Vomáčkovi","url":"https://www.mza.cz/actapublica/matrika/detail/6802?image=216000010-000253-003380-000000-015940-000000-00-B07660-00570.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 12. 1787","summary":"14. 12. 1787 zemřela Marina, žena po Niklasovi Vomáčkovi, sedlákovi, Petrovice čp. 12. Sloupec věku je bez přiblížení nejistý. Rok plyne z nadpisu Anno 1788 přímo pod zápisem. Že byla matkou Václava, žádný přečtený zápis neuvádí."},{"key":"petrovice_snatek_niklas_womacka_marina_slama_1739","label":"Druhý sňatek Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1739 (rok z pořadí zápisů)","summary":"22. 11. 1739 se v Petrovicích oženil vdovec Nicolaus Womaczka s pannou Marinou Slámovou (?). Svědci Joa. Womaczka a Joannes Raubal. Příjmení nevěsty je čteno nejistě; dlouhé s ve tvaru Flama odpovídá Sláma (AI čtení)."},{"key":"petrovice_krest_thomas_vomacka_1745","label":"Křest Thomase, syna Niklase Vomáčky","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02210.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"17. 12. 1745 (měsíc z pořadí zápisů)","summary":"17. 12. 1745 v Petrovicích pokřtěn Thomas, syn Nicolause Vomáčky a Marianny. Kmotři Christian Humlíček z Petrovic a Marianna Cínová (?) z Nového Města."}],"provenance":"Matriční zápis"},"p710":{"id":"p710","pid":710,"name":"Václav Vávra","display_name":"Václav Vávra","maiden_line":"","years":"† před 1772","status":"doc","private":false,"facts":["sedlák, Pohledec","† před 22. 11. 1772"],"note":"Otec Kateřiny, při jejím sňatku 1772 uveden jako zemřelý. V Pohledci křtí s manželkou Annou 1742 a 1743 (MZA 15918). Že jde o téhož muže, je AI závěr opřený o jméno a ves; Kateřinin vlastní křest asi 1753 ještě není přečten. Prameny: Matriční zápis: Sňatek Václava Vomáčky a Kateřiny Vávrové; Matriční zápis: Křest Václava, syna Václava Vávry z Pohledce; Matriční zápis: Křest Marianny, dcery Václava Vávry z Pohledce","sources":[{"key":"petrovice_snatek_wenzl_womacka_katharina_vavrova_1772","label":"Sňatek Václava Vomáčky a Kateřiny Vávrové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00170.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 11. 1772","summary":"22. 11. 1772 se oženil Václav, syn Mikuláše (Niklase) Vomáčky, sedláka z Petrovic, s Kateřinou, dcerou zemřelého Václava Vávry, sedláka z Pohledce. Svědci Matěj Vávra, rychtář z Pohledce, a Josef, syn zemřelého Jana Zeleného, sedláka z Petrovic. Čp. v Petrovicích čteno 9, později rodina žije na čp. 12. Rok plyne z rejstříku a z nadpisu 1773, který následuje na téže straně."},{"key":"pohledec_krest_wenzl_vavra_1743","label":"Křest Václava, syna Václava Vávry z Pohledce","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-01890.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 9. 1743","summary":"V Pohledci pokřtěn Wenceslaus, rodiče Wenceslaus Vavra a Anna; kmotři Joannes Fiala a Mariana Cotoviciana z Nového Města. Doklad manželky Václava Vávry."},{"key":"pohledec_krest_marianna_vavrova_1742","label":"Křest Marianny, dcery Václava Vávry z Pohledce","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-01800.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"7. 12. 1742","summary":"V Pohledci pokřtěna Marianna, u jména křížek; rodiče Wenceslaus Vavrous a Anna; kmotři Joannes Fiala a Mariana Cotovicz z Nového Města. Stejní kmotři jako v roce 1743, proto jde o týž pár (AI závěr)."}],"provenance":"Matriční zápis"},"p720":{"id":"p720","pid":720,"name":"Thomas Starý","display_name":"Thomas Starý","maiden_line":"","years":"asi 1704–1772","status":"doc","private":false,"facts":["* asi 1704","× 19. 1. 1740 Petrovice, Marina Mrázová (ztotožnění nejisté)","sedlák, Petrovice čp. 17","† 27. 7. 1772 Petrovice čp. 17, 68 let"],"note":"Nejstarší zatím doložený Starý této větve. Oddací zápisy 1774 a 1777 uvádějí syny Joannese a Georga a dceru Juditu jako děti zemřelého Thomase Starého, sedláka. Ztotožnění se zemřelým 1772 z čp. 17 je AI závěr opřený o jméno, stav a dům; příjmení je v zápisu úmrtí psáno Staržik (?). Prameny: Matriční zápis: Úmrtí Thomase Starého, sedláka v Petrovicích čp. 17; Matriční zápis: Sňatek Thomase Starého (?) a Mariny Mrázové; Matriční zápis: Sňatek Georga Starého a Mariny Lukešové; Matriční zápis: Sňatek Joannese Starého a Anny Penias; Matriční zápis: Sňatek Jakoba Lukeše a Judity Staré","sources":[{"key":"petrovice_umrti_thomas_stary_1772","label":"Úmrtí Thomase Starého, sedláka v Petrovicích čp. 17","url":"https://www.mza.cz/actapublica/matrika/detail/6801?image=216000010-000253-003380-000000-015939-000000-00-B07659-00320.jp2","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"27. 7. 1772","summary":"27. 7. 1772 zemřel Thomas Staržik (Starý), sedlák, Petrovice čp. 17, 68 let, tedy narozen asi 1704. Rok plyne z nadpisu následujícího snímku. Ztotožnění s otcem Joannese, Georga a Judity Starých je AI závěr opřený o jméno, sedláctví, dům 17 a jejich oddací zápisy z let 1774 a 1777, které ho uvádějí jako zemřelého."},{"key":"petrovice_snatek_thomas_stary_marina_mrazova_1740","label":"Sňatek Thomase Starého (?) a Mariny Mrázové","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 1. 1740 (měsíc a rok z pořadí zápisů)","summary":"19. 1. 1740 se v Petrovicích oženil mládenec Thomas St?ri?ý s pannou Marinou Mrázovou (Mrazin). Svědci Georgius Ušilík (?), Georgius Jedlík. Příjmení ženicha je v zápisu čteno nejistě, shoda se Starým ze zápisu o úmrtí 1772 je AI hypotéza."},{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."},{"key":"petrovice_snatek_joannes_stary_anna_penias_1774","label":"Sňatek Joannese Starého a Anny Penias","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00200.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1774","summary":"V únoru 1774 (den čten 6 nebo 9) se v Petrovicích čp. 17 oženil Joannes, syn zemřelého Thomase Starého, sedláka, s Annou, dcerou zemřelého Christiana Peniase, sedláka ze Žďáru (Zubří), s konzistorním dispenzem."},{"key":"petrovice_snatek_jakob_lukes_juditha_stara_1774","label":"Sňatek Jakoba Lukeše a Judity Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00200.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1774","summary":"V únoru 1774 (den čten 6 nebo 9) se oženil Jakob, syn Georga Lukeše, sedláka, s Juditou, dcerou zemřelého Thomase Starého, sedláka, oba z Petrovic, čp. 28, s konzistorním dispenzem."}],"provenance":"Matriční zápis"},"p721":{"id":"p721","pid":721,"name":"Marina Mrázová","display_name":"Marina Mrázová","maiden_line":"","years":"","status":"prob","private":false,"facts":["× 19. 1. 1740 Petrovice, Thomas St?ri?ý (Starý?)"],"note":"Pravděpodobná žena Thomase Starého a matka Georga. Příjmení ženicha je v oddacím zápisu 1740 čteno nejistě a křest Georga zatím není přečten, takže ztotožnění je AI hypotéza. Prameny: Matriční zápis: Sňatek Thomase Starého (?) a Mariny Mrázové","sources":[{"key":"petrovice_snatek_thomas_stary_marina_mrazova_1740","label":"Sňatek Thomase Starého (?) a Mariny Mrázové","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01430.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"19. 1. 1740 (měsíc a rok z pořadí zápisů)","summary":"19. 1. 1740 se v Petrovicích oženil mládenec Thomas St?ri?ý s pannou Marinou Mrázovou (Mrazin). Svědci Georgius Ušilík (?), Georgius Jedlík. Příjmení ženicha je v zápisu čteno nejistě, shoda se Starým ze zápisu o úmrtí 1772 je AI hypotéza."}],"provenance":"Matriční zápis"},"p730":{"id":"p730","pid":730,"name":"Georg Lukeš","display_name":"Georg Lukeš","maiden_line":"","years":"","status":"prob","private":false,"facts":["sedlák, Petrovice","× 14. 10. 1742 Petrovice, Mariana Stará"],"note":"Otec Mariny Lukešové podle sňatku 1777. Sedlák Georg Lukeš je otec Jakoba podle sňatku 1774; tatáž osoba je AI závěr. Sňatek 1742 a křest Jakuba 1746 (rodiče Georgius Lucas a Marianna) patří témuž páru podle jmen a vsi (AI závěr). Vlastní křest Mariny Lukešové zatím není přečten. Prameny: Matriční zápis: Sňatek Georga Starého a Mariny Lukešové; Matriční zápis: Sňatek Jakoba Lukeše a Judity Staré; Matriční zápis: Sňatek Georga Lukeše a Mariany Staré; Matriční zápis: Křest Jakuba, syna Georga Lukeše","sources":[{"key":"petrovice_snatek_georg_stary_marina_lukes_1777","label":"Sňatek Georga Starého a Mariny Lukešové","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00290.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 11. 1777","summary":"11. 11. 1777 se v Petrovicích čp. 17 oženil Georg, syn zemřelého Thomase Starého, sedláka, s Marinou, dcerou Georga Lukeše, oba z Petrovic, s konzistorním dispenzem pro příbuzenství ve 3. stupni. Svědci Sebastian Jančí (?), čtvrtláník, a Karel Peter, sedlák, oba z Petrovic. Měsíc plyne z nadpisu na téže straně."},{"key":"petrovice_snatek_jakob_lukes_juditha_stara_1774","label":"Sňatek Jakoba Lukeše a Judity Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6795?image=216000010-000253-003380-000000-015931-000000-00-B07657-00200.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"únor 1774","summary":"V únoru 1774 (den čten 6 nebo 9) se oženil Jakob, syn Georga Lukeše, sedláka, s Juditou, dcerou zemřelého Thomase Starého, sedláka, oba z Petrovic, čp. 28, s konzistorním dispenzem."},{"key":"petrovice_snatek_georg_lukes_mariana_stara_1742","label":"Sňatek Georga Lukeše a Mariany Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01500.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 10. 1742 (rok z pořadí zápisů)","summary":"14. 10. 1742 se v Petrovicích oženil mládenec Georgius Lucas s pannou Marianou, dcerou zemřelého Jakuba Starého. Svědci Martinus Srnský z Vlachovic a Josephus Janíček. Nadpis roku 1743 je až na následujícím snímku."},{"key":"petrovice_krest_jacobus_lukes_1746","label":"Křest Jakuba, syna Georga Lukeše","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02270.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"duben 1746","summary":"V dubnu 1746 v Petrovicích pokřtěn Jacobus, syn Georga Lucase a Marianny. Kmotři Wenceslaus Clapač a Marianna Jelínková, oba z Nového Města. Tentýž Jakub je pravděpodobně ženich sňatku 1774 (AI hypotéza)."}],"provenance":"Matriční zápis"},"p731":{"id":"p731","pid":731,"name":"Mariana Stará","display_name":"Mariana Stará","maiden_line":"","years":"","status":"prob","private":false,"facts":["dcera † Jakuba Starého, Petrovice","× 14. 10. 1742 Petrovice, Georg Lukeš"],"note":"Pravděpodobná matka Mariny Lukešové. Rodina Starých vysvětluje dispens pro pokrevenství ve 3. stupni při sňatku 1777 (AI hypotéza, neověřeno). Prameny: Matriční zápis: Sňatek Georga Lukeše a Mariany Staré; Matriční zápis: Křest Jakuba, syna Georga Lukeše","sources":[{"key":"petrovice_snatek_georg_lukes_mariana_stara_1742","label":"Sňatek Georga Lukeše a Mariany Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01500.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 10. 1742 (rok z pořadí zápisů)","summary":"14. 10. 1742 se v Petrovicích oženil mládenec Georgius Lucas s pannou Marianou, dcerou zemřelého Jakuba Starého. Svědci Martinus Srnský z Vlachovic a Josephus Janíček. Nadpis roku 1743 je až na následujícím snímku."},{"key":"petrovice_krest_jacobus_lukes_1746","label":"Křest Jakuba, syna Georga Lukeše","url":"https://www.mza.cz/actapublica/matrika/detail/6786?image=216000010-000253-003380-000000-015918-000000-00-B07849-02270.jp2","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"duben 1746","summary":"V dubnu 1746 v Petrovicích pokřtěn Jacobus, syn Georga Lucase a Marianny. Kmotři Wenceslaus Clapač a Marianna Jelínková, oba z Nového Města. Tentýž Jakub je pravděpodobně ženich sňatku 1774 (AI hypotéza)."}],"provenance":"Matriční zápis"},"p1040":{"id":"p1040","pid":1040,"name":"Josef Procházka","display_name":"Josef Procházka","maiden_line":"","years":"","status":"doc","private":false,"facts":["Otec Josefa Procházky, ženicha ze Samechova.","Jméno otce je zapsáno v oddací matrice 18. října 1767."],"note":"Farář při svatbě označil ženicha jako manželského syna Josefa Procházky. Přesná data života otce i jméno jeho manželky jsou dosud otevřená. Prameny: Matriční zápis: Sňatek Josefa Procházky ze Samechova a Veroniky z Levína","sources":[{"key":"samechov_snatek_josef_prochazka_veronika_1767","label":"Sňatek Josefa Procházky ze Samechova a Veroniky z Levína","url":"https://ebadatelna.soapraha.cz/d/5915/80","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"18. 10. 1767","summary":"Folio 152, nahoře vlevo. Josef, manželský syn Josefa Procházky ze Samechova, a Veronika, dcera po zemřelém Janu, se vzali 18. října 1767. U nevěsty je uveden Levín. Janovo příjmení má počátek Schneibe…. Přesná koncovka zůstává otevřená. Rejstřík Chocerady 12, sn. 17, odkazuje na stejné folio a rok. Totožnost manželů s rodiči v Samechově čp. 9 podporuje křest Kateřiny Barbory v roce 1781."}],"provenance":"Matriční zápis"},"p1042":{"id":"p1042","pid":1042,"name":"Jan z Levína","display_name":"Jan z Levína","maiden_line":"","years":"† před 18. 10. 1767","status":"doc","private":false,"facts":["Otec Veroniky, která se 18. října 1767 provdala za Josefa Procházku.","Při svatbě své dcery už byl po smrti."],"note":"V oddavkách se u Veroniky píše o zemřelém Janu a o Levíně. Při křtu vnučky Kateřiny Barbory je Veronika opět dcerou zemřelého Jana. Příjmení začíná v matrikách podobou Schneibe… nebo Sneibe…. Přesný tvar zůstává otevřený. Prameny: Matriční zápis: Sňatek Josefa Procházky ze Samechova a Veroniky z Levína; Matriční zápis: Křest Kateřiny Barbory Procházkové ze Samechova","sources":[{"key":"samechov_snatek_josef_prochazka_veronika_1767","label":"Sňatek Josefa Procházky ze Samechova a Veroniky z Levína","url":"https://ebadatelna.soapraha.cz/d/5915/80","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"18. 10. 1767","summary":"Folio 152, nahoře vlevo. Josef, manželský syn Josefa Procházky ze Samechova, a Veronika, dcera po zemřelém Janu, se vzali 18. října 1767. U nevěsty je uveden Levín. Janovo příjmení má počátek Schneibe…. Přesná koncovka zůstává otevřená. Rejstřík Chocerady 12, sn. 17, odkazuje na stejné folio a rok. Totožnost manželů s rodiči v Samechově čp. 9 podporuje křest Kateřiny Barbory v roce 1781."},{"key":"samechov_krest_katerina_prochazkova_1781","label":"Křest Kateřiny Barbory Procházkové ze Samechova","url":"https://ebadatelna.soapraha.cz/d/11550/122","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"8. 3. 1781","summary":"Folio 235, dole vpravo. Kateřina dostala dvě jména, Catharina Barbara. Otcem byl Josef Procházka. Matka Veronika je výslovně označena za dceru zemřelého Jana. Za Janovým jménem následuje příjmení s čitelným začátkem Snei…. V témže řádku stojí Samechov č. 9. Ve sloupci narození je 8, ve sloupci křtu Dito, tedy téhož dne. Měsíc březen vyplývá z pořadí dnů po 26. únoru."}],"provenance":"Matriční zápis"},"p1280":{"id":"p1280","pid":1280,"name":"Matěj Mejstřík","display_name":"Matěj Mejstřík","maiden_line":"","years":"asi 1681","status":"prob","private":false,"facts":["* asi 1681 (výpočet z věku)","× Anna, děti v rejstříku 1705–1724","† 3. 5. 1735 Lhota, věk 54(?)","Jmenný rejstřík uvádí 14. dubna 1705 ve Lhotě u Jiřího Mejstříka rodiče Matěje a Annu. Stejná jména rodičů a obec jsou ve křtu Matěje roku 1713."],"note":"Sňatek syna ho uvádí jako zemřelého: „filius post defunctum Mathiam Meystrzik ex pago Lhota“. Úmrtí dva měsíce před touto svatbou a křest syna 1713 tomu odpovídají. Jeho rodiče nejsou doloženi; rejstřík oddaných 1697–1703 má mezeru a kniha začíná rokem 1682. Prameny: Matriční zápis: Úmrtí Matěje Mejstříka z Lhoty; Matriční zápis: Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty; Matriční zápis: Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové; Matriční zápis: Křest – Jiří Mejstřík, 1705; Matriční zápis: Křest – Anna Mejstříková, 1707; Matriční zápis: Křest – Marie Mejstříková, 1709; Matriční zápis: Křest – Kateřina Mejstříková, 1715; Matriční zápis: Křest – Tomáš Mejstřík, 1718; Matriční zápis: Křest – Jan Mejstřík, 1724","sources":[{"key":"janovice_umrti_matej_mejstrik_1735","label":"Úmrtí Matěje Mejstříka z Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/269","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","date":"3. 5. 1735","summary":"Str. 543. Zemřel Matěj Mejstřík, věku 54(?) let, zaopatřen všemi svátostmi. Dům neuveden. Rok potvrzuje rejstřík 13254 sn. 46. Dva měsíce nato se 12. 7. 1735 ženil syn Matěj jako syn po zemřelém Matějovi."},{"key":"janovice_krest_matej_mejstrik_1713","label":"Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/48","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 2. 1713","summary":"Str. 103. Dítě jménem Matěj, otec Matěj Mejstřík, matka Anna. Kmotr Jan Dobíhal, svědek Josef Kula, kmotra Kateřina Šulgová, všichni z Janovic. Rok je z nadpisu na levé straně, den a měsíc z okraje a rejstříku 13249 sn. 97. V rejstříku 1683–1730 je to jediný Matěj Mejstřík z Lhoty zapsaný jako dítě, proto se ztotožňuje se ženichem z roku 1735."},{"key":"janovice_snatek_matej_mejstrik_1735","label":"Sňatek Matěje Mejstříka z Lhoty a Anny Dobíhalové","url":"https://ebadatelna.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."},{"key":"lhota_jiri_mejstrik_1705_rodice_rejstrik","label":"Jiří Mejstřík ze Lhoty v rejstříku narozených","url":"https://ebadatelna.soapraha.cz/d/13249/97","kind":"N","source_kind":"parish_index","provenance":"Kanonický záznam","date":"14. 4. 1705 (podle rejstříku narozených)","summary":"Rejstřík narozených uvádí ve Lhotě dne 14. dubna 1705 Jiřího Mejstříka. Jako otec je uveden Matěj a jako matka Anna. Rejstřík odkazuje do druhého svazku na psanou stranu 32. Křest dalšího syna Matěje roku 1713 známe i z matriční knihy."},{"key":"janovicka_lhota_krest_jiri_mejstrik_1705","label":"Křest – Jiří Mejstřík, 1705","url":"https://ebadatelna.soapraha.cz/d/13042/13","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 4. 1705 (křest)","summary":"V křestním zápisu je dítě Jiří, otec Matěj Mejstřík a matka Anna. Datum 14. dubna je čitelné v původním zápisu a odpovídá rejstříku. Obec Lhota je čitelná v rejstříku. Místo v původním řádku je přepisované."},{"key":"janovicka_lhota_krest_anna_mejstrik_1707","label":"Křest – Anna Mejstříková, 1707","url":"https://ebadatelna.soapraha.cz/d/13042/22","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"11. 2. 1707 (datum podle rejstříku narozených)","summary":"V křestním zápisu je dítě Anna, otec Matěj Mejstřík a matka Anna. Původní řádek začíná slovem „Dito“, tedy téhož dne. Přesné datum 11. února 1707 je z jmenného rejstříku. V původním zápisu stojí „ze Lhoty Janowské“. Stejnou obec uvádí rejstřík."},{"key":"janovicka_lhota_krest_marie_mejstrik_1709","label":"Křest – Marie Mejstříková, 1709","url":"https://ebadatelna.soapraha.cz/d/13042/34","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"22. 9. 1709 (datum podle rejstříku narozených)","summary":"V křestním zápisu je dítě Marie, otec Matěj Mejstřík a matka Anna. Původní řádek začíná slovem „Dito“, tedy téhož dne. Přesné datum 22. září 1709 je z jmenného rejstříku. V původním zápisu je „z Janowské Lhoty“. Stejnou obec uvádí rejstřík."},{"key":"janovicka_lhota_krest_katerina_mejstrik_1715","label":"Křest – Kateřina Mejstříková, 1715","url":"https://ebadatelna.soapraha.cz/d/13042/59","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"9. 10. 1715 (křest)","summary":"V křestním zápisu je dítě Kateřina, otec Matěj Mejstřík a matka Anna. Den a měsíc 9. října jsou čitelné v původním řádku. Rok 1715 je doložen jmenným rejstříkem. Obec Lhota je údaj jmenného rejstříku. V původním řádku zůstává místní údaj neuzavřený. Rejstřík odkazuje na stranu 121, skutečný řádek je na psané straně 122."},{"key":"janovicka_lhota_krest_tomas_mejstrik_1718","label":"Křest – Tomáš Mejstřík, 1718","url":"https://ebadatelna.soapraha.cz/d/13042/66","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"28. 11. 1718 (křest)","summary":"V křestním zápisu je dítě Tomáš, otec Matěj Mejstřík a matka Anna. Den a měsíc 28. listopadu jsou čitelné v původním řádku. Rok 1718 je doložen jmenným rejstříkem. V původním řádku stojí „e Lhota“. Stejnou obec uvádí rejstřík."},{"key":"janovicka_lhota_krest_jan_mejstrik_1724","label":"Křest – Jan Mejstřík, 1724","url":"https://ebadatelna.soapraha.cz/d/13042/78","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 1. 1724 (křest)","summary":"V křestním zápisu je dítě Jan, otec Matěj Mejstřík a matka Anna. Nad původním řádkem stojí „Anno 1724“ a v okraji „Die 14 Januarii“. Datum označuje křest. V původním řádku stojí „e Lhota“. Stejnou obec uvádí rejstřík. Jan pokřtěný roku 1724 je veden samostatně od Jana z roku 1741."}],"provenance":"Matriční zápis"},"p1281":{"id":"p1281","pid":1281,"name":"Anna","display_name":"Anna","maiden_line":"","years":"","status":"prob","private":false,"facts":["× Matěj Mejstřík","matka dětí 1705–1724, Lhota","Jmenný rejstřík uvádí 14. dubna 1705 ve Lhotě u Jiřího Mejstříka rodiče Matěje a Annu. Stejná jména rodičů a obec jsou ve křtu Matěje roku 1713."],"note":"Rodné příjmení zatím neznámé. Kmotr Jan Dobíhal z roku 1713 sdílí příjmení s pozdější snachou Annou, příbuzenství nedoloženo. Prameny: Matriční zápis: Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty; Matriční zápis: Křest – Jiří Mejstřík, 1705; Matriční zápis: Křest – Anna Mejstříková, 1707; Matriční zápis: Křest – Marie Mejstříková, 1709; Matriční zápis: Křest – Kateřina Mejstříková, 1715; Matriční zápis: Křest – Tomáš Mejstřík, 1718; Matriční zápis: Křest – Jan Mejstřík, 1724","sources":[{"key":"janovice_krest_matej_mejstrik_1713","label":"Křest Matěje, syna Matěje Mejstříka z Janovské Lhoty","url":"https://ebadatelna.soapraha.cz/d/13042/48","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","date":"23. 2. 1713","summary":"Str. 103. Dítě jménem Matěj, otec Matěj Mejstřík, matka Anna. Kmotr Jan Dobíhal, svědek Josef Kula, kmotra Kateřina Šulgová, všichni z Janovic. Rok je z nadpisu na levé straně, den a měsíc z okraje a rejstříku 13249 sn. 97. V rejstříku 1683–1730 je to jediný Matěj Mejstřík z Lhoty zapsaný jako dítě, proto se ztotožňuje se ženichem z roku 1735."},{"key":"lhota_jiri_mejstrik_1705_rodice_rejstrik","label":"Jiří Mejstřík ze Lhoty v rejstříku narozených","url":"https://ebadatelna.soapraha.cz/d/13249/97","kind":"N","source_kind":"parish_index","provenance":"Kanonický záznam","date":"14. 4. 1705 (podle rejstříku narozených)","summary":"Rejstřík narozených uvádí ve Lhotě dne 14. dubna 1705 Jiřího Mejstříka. Jako otec je uveden Matěj a jako matka Anna. Rejstřík odkazuje do druhého na.soapraha.cz/d/13042/216","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"12. 7. 1735","summary":"Uhlířské Janovice, str. 432. Po třech ohláškách oddán Matěj, pozůstalý syn po zemřelém Matěji Mejstříkovi ze vsi Lhoty, s pannou Annou, vlastní dcerou Františka Dobíhala z městečka Janovic. Svědci Václav Mládek z Janovic a Anna Amabilia, dcera Jiřího Lubinského. Zápis dokládá dvě generace Matějů."}],"provenance":"Matriční zápis"},"p1462":{"id":"p1462","pid":1462,"name":"Jakub Starý","display_name":"Jakub Starý","maiden_line":"","years":"† před 1742","status":"prob","private":false,"facts":["Petrovice","† před 14. 10. 1742"],"note":"Otec Mariany, při jejím sňatku 1742 uveden jako zemřelý. V místní větvi Starých je to zatím nejstarší jmenovaný předek. V oddacích zápisech 1743 je zemřelý Jakub Starý také otcem Josepha, Anny a Jakuba (AI čtení, přehled). Prameny: Matriční zápis: Sňatek Georga Lukeše a Mariany Staré","sources":[{"key":"petrovice_snatek_georg_lukes_mariana_stara_1742","label":"Sňatek Georga Lukeše a Mariany Staré","url":"https://www.mza.cz/actapublica/matrika/detail/6794?image=216000010-000253-003380-000000-015930-000000-00-B07656-01500.jp2","kind":"O","source_kind":"parish_register","provenance":"Matriční zápis","date":"14. 10. 1742 (rok z pořadí zápisů)","summary":"14. 10. 1742 se v Petrovicích oženil mládenec Georgius Lucas s pannou Marianou, dcerou zemřelého Jakuba Starého. Svědci Martinus Srnský z Vlachovic a Josephus Janíček. Nadpis roku 1743 je až na následujícím snímku."}],"provenance":"Matriční zápis"},"anna_prochazkova_2024":{"id":"anna_prochazkova_2024","pid":null,"name":"Anna Procházková","display_name":"Anna Procházková (* 2024)","maiden_line":"","years":"* 1. 6. 2024","status":"fam","private":false,"facts":["* 1. 6. 2024"],"note":"Sestra výchozí osoby Aleše2022; dcera Aleše Procházky1985 a Pavlíny Procházkové rozené Švancarové1989. Přímá oprava Aleše Procházky 5. 11. 2026; starší2025 nahrazeno. Úplné datum jen v udaje_od_rodiny.md.","sources":[],"provenance":"Údaj od rodiny"},"side-01-sourozenci-josefa-mejstrika-1815":{"id":"side-01-sourozenci-josefa-mejstrika-1815","source_id":"","anchor":80,"name":"Sourozenci Josefa Mejstříka (* 1815)","year":"","status":"doc","private":false,"facts":[],"note":"Podle rejstříku narozených Uhlířských Janovic, Lhota čp. 29: Jan 9. 12. 1811, Marie 20. 6. 1813, Anna 7. 5. 1818, František 13. 2. 1821, Václav 19. 8. 1824.","sources":[{"key":"lhota_rejstrik_deti_josef_mejstrik_1815_1818","label":"Rejstřík narozených: děti Josefa Mejstříka a Magdaleny, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/101","kind":"N","date":"1811–1818","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Rejstřík narozených Uhlířské Janovice, pravá strana. Ve Lhotě čp. 29, otec Josef, matka Magdalena: Josef 14. 8. 1815 (tom VI, fol. 18) a Anna 7. 5. 1818 (tom VI, fol. 21). Podle stejné strany patří do řady i Jan 9. 12. 1811 (fol. 15) a Marie 20. 6. 1813 (fol. 16). Rejstřík je pozdější pomůcka, samotné křty nejsou v tomto zápisu."},{"key":"lhota_rejstrik_deti_josef_mejstrik_1821_1824","label":"Rejstřík narozených: František a Václav Mejstříkovi, Lhota čp. 29","url":"https://ebadatelna.soapraha.cz/d/13249/102","kind":"N","date":"1821–1824","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Rejstřík narozených Uhlířské Janovice, levá strana. Ve Lhotě čp. 29, rodiče Josef a Magdalena: František 13. 2. 1821 (tom VI, fol. 27) a Václav 19. 8. 1824 (tom VI, fol. 31). Řádky se v rejstříku svažují, data jsou čtena po sklonu řádku."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":"","role":"","name_flags":[]},"side-03-bozena-milada-mrkvickova-19-12-1922-14-1-1":{"id":"side-03-bozena-milada-mrkvickova-19-12-1922-14-1-1","source_id":"","anchor":11,"name":"Božena Milada Mrkvičková (19. 12. 1922 – 14. 1. 1923)","year":"","status":"doc","private":false,"facts":[],"note":"Dítě z domu Petrovice čp. 28, dcera Františka Mrkvičky * 1873 a Matyldy (Matildy) Julisové * 1894 ze Žubří, oddaných 23. 9. 1919 v Olešné. Zemřela necelý měsíc stará, není to tedy pozdější paní Mejstříková. Podle rodného listu dcery babičky Boženy z roku 1955 jde pravděpodobně o její starší sestru; rodné příjmení matky má v listu odlišný zápis Tulisová.","sources":[{"key":"petrovice_krest_bozena_milada_mrkvickova_1922","label":"Křest Boženy Milady Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01910.jp2","kind":"N","date":"19. 12. 1922","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Božena Milada, dcera Františka Mrkvičky, rolníka v Petrovicích čp. 28, a Matyldy, dcery Josefa Julise, domkaře v Žubří. Dítě zemřelo 14. 1. 1923. Rodiče oddáni v Olešné 23. 9. 1919."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":"","role":"","name_flags":[]},"side-marie_luksova_prvni_zena_frantiska":{"id":"side-marie_luksova_prvni_zena_frantiska","source_id":"marie_luksova_prvni_zena_frantiska","anchor":11,"name":"Marie Lukšová (5. 8. 1876 – 7. 1. 1919)","year":"","status":"doc","private":false,"facts":[],"note":"První žena Františka Mrkvičky, z Petrovic č. 28. Dcera Františka Lukeše a Josefy. Děti: Josef 1899, Marie 1902 († 1903), Josefa 1904, Stanislav 1906 († 1907). Zemřela v lednu 1919; František se znovu oženil v září téhož roku.","sources":[{"key":"petrovice_krest_marie_luksova_1876","label":"Narození a křest Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/6792?image=216000010-000253-003380-000000-015924-000000-00-B07654-01710.jp2","kind":"N","date":"5. 8. 1876","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Marie, pozdější první manželka Františka Mrkvičky, se narodila 5. a pokřtěna byla 6. srpna 1876 v Petrovicích čp. 28. Rodiče: František Lukeš, celoláník, a Josefa roz. Šoškova."},{"key":"petrovice_snatek_mrkvicka_luksova_1897","label":"Sňatek Františka Mrkvičky a Marie Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00840.jp2","kind":"O","date":"23. 11. 1897","source_kind":"parish_register","provenance":"Matriční zápis","summary":"František Mrkvička * 2. 11. 1873, čtvrtník v Petrovicích č. 29, syn Františka Mrkvičky, tesaře, a Josefy roz. Starých, si vzal Marii Lukšovou * 5. 8. 1876 z Petrovic č. 28, dceru zemřelého Františka Lukše, rolníka, a Josefy roz. Šoškové. Při sňatku bydlela u své matky v Petrovicích. Výnos okresního soudu v Novém Městě o její zletilosti je datován 4. listopadu 1897; přesné číslo výnosu zůstává nejisté."},{"key":"petrovice_krest_josef_mrkvicka_1899","label":"Křest Josefa Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/6793?image=216000010-000253-003380-000000-015925-000000-00-B07655-01700.jp2","kind":"N","date":"22. 6. 1899","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josef, Petrovice č. 29, syn Františka Mrkvičky, krejčího, a Marie Lukšové, oddaných 23. 11. 1897."},{"key":"petrovice_krest_marie_mrkvickova_1902","label":"Křest Marie Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01620.jp2","kind":"N","date":"13. 8. 1902","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Marie, Petrovice č. 29, dcera Františka Mrkvičky, krejčího, a Marie Lukšové. Dítě zemřelo 23. 8. 1903."},{"key":"petrovice_krest_josefa_mrkvickova_1904","label":"Křest Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01640.jp2","kind":"N","date":"27. 5. 1904","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josefa, Petrovice č. 29, dcera Františka Mrkvičky * 2. 11. 1873, krejčího, a Marie Lukšové * 5. 8. 1876. U babičky z otcovy strany je zde rozená Břežek, jinde Starý nebo Starých. Přípis o sňatku 5. 2. 1929 s Františkem Lukšem."},{"key":"petrovice_krest_stanislav_mrkvicka_1906","label":"Křest Stanislava Mrkvičky","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01670.jp2","kind":"N","date":"30. 10. 1906","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Stanislav, Petrovice č. 29 (?), syn Františka Mrkvičky, krejčího, a Marie Lukšové. Dítě zemřelo 9. 8. 1907."},{"key":"petrovice_umrti_marie_mrkvickova_1919","label":"Úmrtí Marie Mrkvičkové roz. Lukšové","url":"https://www.mza.cz/actapublica/matrika/detail/11617?image=216000010-000253-003380-000000-015943-000000-00-B11572-01440.jp2","kind":"Z","date":"7. 1. 1919","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Marie Mrkvičková z Lukšů, manželka rolníka Františka Mrkvičky, zemřela 7. ledna 1919 v Petrovicích čp. 28 na tuberkulózu plic a byla pohřbena 9. ledna. Věk a přípis o narození v zápise neodpovídají křtu z 5. 8. 1876; rozpor je ponechán."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":[22],"role":"","name_flags":[],"years":"","provenance":""},"side-05-josefa-mrkvickova-provdana-lukesova-27-5-1":{"id":"side-05-josefa-mrkvickova-provdana-lukesova-27-5-1","source_id":"","anchor":11,"name":"Josefa Mrkvičková, provdaná Lukešová (* 27. 5. 1904)","year":"","status":"doc","private":false,"facts":[],"note":"Dcera Františka a Marie. Provdala se 5. 2. 1929 za Františka Lukše, dělníka z Petrovic č. 24; tehdy bydlela u rodičů na č. 28.","sources":[{"key":"petrovice_krest_josefa_mrkvickova_1904","label":"Křest Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/12652?image=216000010-000253-003380-000000-015926-000000-00-01640.jp2","kind":"N","date":"27. 5. 1904","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josefa, Petrovice č. 29, dcera Františka Mrkvičky * 2. 11. 1873, krejčího, a Marie Lukšové * 5. 8. 1876. U babičky z otcovy strany je zde rozená Břežek, jinde Starý nebo Starých. Přípis o sňatku 5. 2. 1929 s Františkem Lukšem."},{"key":"petrovice_snatek_lukes_mrkvickova_1929","label":"Sňatek Františka Lukše a Josefy Mrkvičkové","url":"https://www.mza.cz/actapublica/matrika/detail/995?image=216000010-000253-003380-000000-015936-000000-00-B02775-00980.jp2","kind":"O","date":"5. 2. 1929","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josefa Mrkvičková * 27. 5. 1904, z Petrovic č. 28, dcera Františka Mrkvičky, rolníka, a Marie roz. Lukšové, se provdala za Františka Lukše * 9. 3. 1904, dělníka z Petrovic č. 24. Podle zápisu otec nevěsty žije a matka zemřela."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":"","role":"","name_flags":[]},"side-06-josef-mejstrik-3-2-18-11-1896":{"id":"side-06-josef-mejstrik-3-2-18-11-1896","source_id":"","anchor":20,"name":"Josef Mejstřík (3. 2. – 18. 11. 1896)","year":"","status":"doc","private":false,"facts":[],"note":"Starší bratr, syn Antonína a Anny, zemřel jako malé dítě.","sources":[{"key":"brod_krest_josef_mejstrik_1896","label":"Křest Josefa Mejstříka","url":"https://ebadatelna.soapraha.cz/d/4810/6","kind":"N","date":"3. 2. 1896","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josef se narodil 3. a byl pokřtěn 9. února 1896 v Českém Brodě čp. 145/146 kolářskému dělníkovi Antonínu Mejstříkovi * 16. 10. 1862 a Anně Drožové * 22. 8. 1863 z Hradiška, oddaným v Kounicích 24. 7. 1893. U jména je přípis o úmrtí 18. 11. 1896, Tom XXIV, fol. 110 (AI čtení)."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":"","role":"","name_flags":[]},"side-07-frantisek-serafin-mejstrik-4-9-1897":{"id":"side-07-frantisek-serafin-mejstrik-4-9-1897","source_id":"","anchor":20,"name":"František Serafín Mejstřík (* 4. 9. 1897)","year":"","status":"doc","private":false,"facts":[],"note":"Bratr, sklepník; 1941 × Aloisie Křížková.","sources":[{"key":"brod_krest_frantisek_mejstrik_1897","label":"Křest Františka Serafína Mejstříka","url stra Kateřiny Brožkové. Křest uvádí také její prarodiče z matčiny strany, Jana Pokorného a Kateřinu.","sources":[{"key":"kochanov_krest_barbora_brozkova_1824","label":"Křest Barbory Brožkové v Kochánově roku 1824","url":"https://ebadatelna.soapraha.cz/d/13045/132","kind":"N","date":"1824","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Barbora, dcera chalupníka Františka Brožka a Anny, je zapsána roku 1824 v Kochánově. V domovním sloupci je pravděpodobně č. 4, horní tah je slitý. U matky jsou uvedeni Jan Pokorný, sedlák z Vranic, a Kateřina."}],"father":162,"mother":163,"sibling_of":81,"spouse_ids":"","role":"","name_flags":[],"years":"* 1824","provenance":""},"side-frantisek_blaha_pred1892":{"id":"side-frantisek_blaha_pred1892","source_id":"frantisek_blaha_pred1892","anchor":32,"name":"František Bláhovec (varianta Bláha)","year":"1885","status":"doc","private":false,"facts":["krejčí v Českém Brodě čp. 100 — vlastní úmrtní zápis","rodem ze Stříbrné Skalice","† 19. 8. 1885; pohřben 21. 8. 1885; věk 31 let","oddací zápis1885 a křest1892: František Bláhovec; úmrtí Marie1892: František Bláha"],"note":"Dřívější manžel Marie Slavíkové. Její oddací zápis 16.11.1885 ji uvádí jako vdovu po Františku Bláhovcovi a odkazuje na jeho úmrtní folio150; tím je spojení s úmrtním zápisem doloženo. Vlastní úmrtní řádek jej uvádí jako ženatého krejčího, rodem ze Stříbrné Skalice, ale manželku jménem neuvádí. Povolání dělník nese oddací zápis1885, krejčí vlastní úmrtní zápis. Grafie Bláha z úmrtí Marie1892 zůstává variantou podle konkrétního pramene.","sources":[{"key":"cbrod_umrti_frantisek_blahovec_1885","label":"Úmrtí Františka Bláhovce","url":"https://ebadatelna.soapraha.cz/d/4812/151","kind":"Z","date":"19. 8. 1885","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis83 na foliu150 dokládá, že ženatý František Bláhovec, krejčí v Českém Brodě čp.100, rodem ze Stříbrné Skalice, zemřel 19.8. a byl pohřben 21.8.1885 ve věku31 let. Vlastní úmrtní řádek manželku nejmenuje; Marie je s ním spojena svým oddacím zápisem1885 a jeho odkazem na folio150."},{"key":"cbrod_umrti_marie_prochazkova_slavikova_1892","label":"Úmrtí Marie Procházkové, rozené Slavíkové","url":"https://ebadatelna.soapraha.cz/d/4813/34","kind":"Z","date":"18. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis 62 dokládá, že Marie Procházková, rozená Slavíková z Lojovic, manželka dělníka Josefa Procházky, zemřela 18. 7. 1892 v Českém Brodě čp. 115 ve věku 31 let a byla pohřbena 20. 7. v Českém Brodě. Příčinou bylo vysílení následkem vykrvácení po porodu. Zápis ji uvádí také jako vdovu po zemřelém Františku Bláhovi, dělníku v Českém Brodě, a obsahuje údaj „vdaná 6 let“; z tohoto údaje se bez oddacího originálu nedopočítává datum sňatku."},{"key":"cbrod_krest_marie_prochazkova_1892","label":"Narození a křest Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4809/263","kind":"N","date":"15. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Vlastní zápis dokládá narození Marie Procházkové 15. 7. a křest 18. 7. 1892, katolické vyznání, ženské pohlaví, manželský původ a Český Brod čp. 115; přípis uvádí úmrtí 25. 7. 1892. Rodiči jsou Josef Procházka a Marie, narozená v Lojovicích, dcera Jana Slavíka a Doroty rozené Brabcové z Řepčic. Matčina rubrika používá pro jejího dřívějšího manžela tvary Bláhovcová / po Františku Bláhovci, zatímco úmrtní zápis 1892 čte Bláha; varianty zůstávají spojeny s jedním doloženým dřívějším manželem do nalezení jejich sňatku. Otcovská rubrika označuje Josefa za syna Františka a Anny, ale jeho vlastní oddací zápis 1893 jej označuje za syna Marie a vnuka Františka a Anny. Obě pramenná znění jsou zachována; tento zápis nemění Josefovu filiaci."},{"key":"cbrod_snatek_josef_prochazka_marie_blahovcova_1885","label":"Sňatek Josefa Procházky a Marie Bláhovcové","url":"https://ebadatelna.soapraha.cz/d/4811/116","kind":"O","date":"16. 11. 1885","source_kind":"parish_register","provenance":"Matriční zápis","summary":"První zápis na foliu116 přímo dokládá sňatek vdovce Josefa Procházky a vdovy Marie Bláhovcové 16.11.1885. Josef byl dělník v Českém Brodě čp.173, syn Marie, dcery Františka Procházky a Anny Kolmanové, narozený 9.3.1854. Předložil sázavský křestní list č.143 vydaný 5.5.1881; datum vydání není datem křtu. Odkaz na úmrtní folio135 vede ke Kateřině, Josefově předchozí manželce. Marie byla vdova po Františku Bláhovcovi, bydlela v Českém Brodě čp.110 a byla dcerou Jana Slavíka a Doroty Brabcové; odkaz na folio150 vede k Františkovu úmrtí. Datum 29.10.1885 je datum vydání Mariina křestního listu, nikoli datum křtu."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":["marie_slavikova_z_lojovic"],"role":"","name_flags":[],"years":"† 19. 8. 1885","death_date":"1885-08-19","provenance":""},"side-katerina_prochazkova_manzelka_josefa_1884":{"id":"side-katerina_prochazkova_manzelka_josefa_1884","source_id":"katerina_prochazkova_manzelka_josefa_1884","anchor":32,"name":"Kateřina Procházková","year":"1884","status":"doc","private":false,"facts":["manželka Josefa Procházky v Českém Brodě čp. 90","† 13. 9. 1884; pohřbena 15. 9. 1884; věk 27 let"],"note":"Dřívější manželka Josefa Procházky. Vlastní úmrtní zápis ji výslovně označuje za manželku Josefa a oddací zápis Josefa z roku1885 odkazuje na její úmrtní folio135. Rodné příjmení ani místo původu nejsou přijaty, protože v rozhodném výřezu nebyly bezpečně přečteny.","sources":[{"key":"cbrod_umrti_katerina_prochazkova_1884","label":"Úmrtí Kateřiny Procházkové, manželky Josefa","url":"https://ebadatelna.soapraha.cz/d/4812/136","kind":"Z","date":"13. 9. 1884","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis81 na foliu135 dokládá, že Kateřina Procházková, manželka Josefa Procházky v Českém Brodě čp.90, zemřela 13.9. a byla pohřbena 15.9.1884 ve věku27 let. Rodné příjmení a místo původu nejsou přijaty. Josefův oddací zápis1885 odkazuje právě na toto folio a označuje jej za vdovce."},{"key":"cbrod_snatek_josef_prochazka_marie_blahovcova_1885","label":"Sňatek Josefa Procházky a Marie Bláhovcové","url":"https://ebadatelna.soapraha.cz/d/4811/116","kind":"O","date":"16. 11. 1885","source_kind":"parish_register","provenance":"Matriční zápis","summary":"První zápis na foliu116 přímo dokládá sňatek vdovce Josefa Procházky a vdovy Marie Bláhovcové 16.11.1885. Josef byl dělník v Českém Brodě čp.173, syn Marie, dcery Františka Procházky a Anny Kolmanové, narozený 9.3.1854. Předložil sázavský křestní list č.143 vydaný 5.5.1881; datum vydání není datem křtu. Odkaz na úmrtní folio135 vede ke Kateřině, Josefově předchozí manželce. Marie byla vdova po Františku Bláhovcovi, bydlela v Českém Brodě čp.110 a byla dcerou Jana Slavíka a Doroty Brabcové; odkaz na folio150 vede k Františkovu úmrtí. Datum 29.10.1885 je datum vydání Mariina křestního listu, nikoli datum křtu."}],"father":null,"mother":null,"sibling_of":null,"spouse_ids":[32],"role":"","name_flags":[],"years":"† 13. 9. 1884","death_date":"1884-09-13","provenance":""},"side-marie_prochazkova_dcera_1892":{"id":"side-marie_prochazkova_dcera_1892","source_id":"marie_prochazkova_dcera_1892","anchor":32,"name":"Marie Procházková","year":"1892","status":"doc","private":false,"facts":["* 15. 7. 1892 Český Brod čp. 115","křest 18. 7. 1892, katolická, manželská","† 25. 7. 1892 Český Brod čp. 115, věk 10 dnů","pohřbena 27. 7. 1892 v Českém Brodě"],"note":"Dcera dělníka Josefa Procházky a Marie rozené Slavíkové z Lojovic. Vlastní křestní zápis dokládá narození 15. 7., křest 18. 7., manželský původ, Český Brod čp.115 a přípis úmrtí 25. 7. 1892; vlastní úmrtní zápis potvrzuje rodiče, dům, den úmrtí a věk 10 dnů.","sources":[{"key":"cbrod_umrti_marie_prochazkova_dcera_1892","label":"Úmrtí desetidenní Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4813/34","kind":"Z","date":"25. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis 64 dokládá, že Marie Procházková zemřela 25. 7. 1892 v Českém Brodě čp. 115 ve věku 10 dnů a byla pohřbena 27. 7. v Českém Brodě. Byla dcerou dělníka Josefa Procházky a zemřelé Marie rozené Slavíkové z Lojovic. Přesný den narození se z věku nedopočítává bez vlastního křestního nebo rodného zápisu."},{"key":"cbrod_krest_marie_prochazkova_1892","label":"Narození a křest Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4809/263","kind":"N","date":"15. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Vlastní zápis dokládá narození Marie Procházkové 15. 7. a křest 18. 7. 1892, katolické vyznání, ženské pohlaví, manželský původ a Český Brod čp. 115; přípis uvádí úmrtí 25. 7. 1892. Rodiči jsou Josef Procházka a Marie, narozená v Lojovicích, dcera Jana Slavíka a Doroty rozené Brabcové z Řepčic. Matčina rubrika používá pro jejího dřívějšího manžela tvary Bláhovcová / po Františku Bláhovci, zatímco úmrtní zápis 1892 čte Bláha; varianty zůstávají spojeny s jedním doloženým dřívějším manželem do nalezení jejich sňatku. Otcovská rubrika označuje Josefa za syna Františka a Anny, ale jeho vlastní oddací zápis 1893 jej označuje za syna Marie a vnuka Františka a Anny. Obě pramenná znění jsou zachována; tento zápis nemění Josefovu filiaci."}],"father":32,"mother":"marie_slavikova_z_lojovic","sibling_of":null,"spouse_ids":"","role":"","name_flags":[],"years":"* 15. 7. 1892 – † 25. 7. 1892","birth_date":"1892-07-15","death_date":"1892-07-25","provenance":""},"side-marie_slavikova_z_lojovic":{"id":"side-marie_slavikova_z_lojovic","source_id":"marie_slavikova_z_lojovic","anchor":32,"name":"Marie Slavíková (vdova Bláhovcová)","year":"1859","status":"doc","private":false,"facts":["* 10. 8. 1859 Řepčice čp. 2; křest 11. 8. 1859","oddíl matriky: Řepčice, bývalý statek Lojovice","× 16. 11. 1885 Josef Procházka, Český Brod čp. 173/110","dcera Jana Slavíčka, zedníka z Řepčic čp.2, a Doroty Brabcové","křestní list vydal farní úřad Velké Popovice 29. 10. 1885 č.261 — datum vydání, nikoli křtu","† 18. 7. 1892 Český Brod čp.115, věk31 let"],"note":"Manželka Josefa Procházky od 16. 11. 1885. Vlastní křest dokládá narození 10. 8. a křest 11. 8. 1859 v Řepčicích čp.2; oddíl matriky nese záhlaví Řepčice, bývalý statek Lojovice. Otcovo příjmení je v křtu Slavíček, v rejstříku a pozdějších zápisech Slavík. Křest dcery1892 zjednodušuje Mariino místo na Lojovice. Zemřela 18. 7. 1892 v Českém Brodě čp.115.","sources":[{"key":"cbrod_krest_josef_prochazka_1896","label":"Křest Josefa Procházky","url":"https://ebadatelna.soapraha.cz/d/4810/50","kind":"N","date":"27. 11. 1896","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josef Procházka se narodil 27. 11. 1896 v Českém Brodě čp. 30 dělníkovi Josefu Procházkovi ze Samechova a Barboře Turkové z Kounic. Přípis o sňatku 16. 6. 1919 s Karolinou Ulrichovou ho spojuje se ženichem z tohoto roku. Josefův otec je uveden jako syn Marie Procházkové, dcery Františka Procházky a Anny Kollmannové; Barbora jako dcera Rosalie Turkové, dcery Matěje Turka. Jan Hrdlička je pozdější manžel Marie, nikoli zde uvedený biologický otec Josefova otce. Pravopis Annina příjmení a místa původu zůstává nejistý. Tento zápis uvádí pro Josefova otce datum 5. 5. 1854. Jeho vlastní křest v Samechově č. 18 a sňatek z roku 1885 dokládají 9. 3. 1854. Porodní bába Marie Novotná je označena slovem „zkoumaná“. Otec dítěte Josef Procházka je v otcovské rubrice uveden jako vdovec po zemřelé Marii Slavíkové z Lojovic."},{"key":"tuklaty_snatek_josef_prochazka_barbora_turkova_1893","label":"Sňatek Josefa Procházky a Barbory Turkové","url":"https://ebadatelna.soapraha.cz/d/11314/45","kind":"O","date":"9. 1. 1893","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis v matrice tuklatské farnosti pro Břežany dokládá sňatek Josefa Procházky a Barbory Turkové dne 9. 1. 1893. Josef je uveden jako vdovec po Marii Slavíkové z Lojovic a jako bydlící v Českém Brodě čp. 250; Barbora jako svobodná služebná v Břežanech čp. 1. Josef je synem Marie Procházkové, provdané za Jana Hrdličku; zápis Jana neoznačuje za Josefova biologického otce. Barbora je dcerou Rosalie Turkové, dcery zemřelého Matěje Turka, dělníka z Kounic. Poznámka podle předloženého úmrtního listu uvádí, že Josef byl vdovcem od 18. 7. 1892; místo úmrtí Marie ani její vlastní úmrtní originál tento pramen nedokládá. Svědci jsou Josef Pávek z Břežan a František Ehrenwirth z Tuklat; rozporně čtená povolání a přesný konec druhého příjmení nejsou přijaty jako jistota."},{"key":"cbrod_umrti_marie_prochazkova_slavikova_1892","label":"Úmrtí Marie Procházkové, rozené Slavíkové","url":"https://ebadatelna.soapraha.cz/d/4813/34","kind":"Z","date":"18. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis 62 dokládá, že Marie Procházková, rozená Slavíková z Lojovic, manželka dělníka Josefa Procházky, zemřela 18. 7. 1892 v Českém Brodě čp. 115 ve věku 31 let a byla pohřbena 20. 7. v Českém Brodě. Příčinou bylo vysílení následkem vykrvácení po porodu. Zápis ji uvádí také jako vdovu po zemřelém Františku Bláhovi, dělníku v Českém Brodě, a obsahuje údaj „vdaná 6 let“; z tohoto údaje se bez oddacího originálu nedopočítává datum sňatku."},{"key":"cbrod_umrti_marie_prochazkova_dcera_1892","label":"Úmrtí desetidenní Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4813/34","kind":"Z","date":"25. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Zápis 64 dokládá, že Marie Procházková zemřela 25. 7. 1892 v Českém Brodě čp. 115 ve věku 10 dnů a byla pohřbena 27. 7. v Českém Brodě. Byla dcerou dělníka Josefa Procházky a zemřelé Marie rozené Slavíkové z Lojovic. Přesný den narození se z věku nedopočítává bez vlastního křestního nebo rodného zápisu."},{"key":"cbrod_krest_marie_prochazkova_1892","label":"Narození a křest Marie Procházkové","url":"https://ebadatelna.soapraha.cz/d/4809/263","kind":"N","date":"15. 7. 1892","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Vlastní zápis dokládá narození Marie Procházkové 15. 7. a křest 18. 7. 1892, katolické vyznání, ženské pohlaví, manželský původ a Český Brod čp. 115; přípis uvádí úmrtí 25. 7. 1892. Rodiči jsou Josef Procházka a Marie, narozená v Lojovicích, dcera Jana Slavíka a Doroty rozené Brabcové z Řepčic. Matčina rubrika používá pro jejího dřívějšího manžela tvary Bláhovcová / po Františku Bláhovci, zatímco úmrtní zápis 1892 čte Bláha; varianty zůstávají spojeny s jedním doloženým dřívějším manželem do nalezení jejich sňatku. Otcovská rubrika označuje Josefa za syna Františka a Anny, ale jeho vlastní oddací zápis 1893 jej označuje za syna Marie a vnuka Františka a Anny. Obě pramenná znění jsou zachována; tento zápis nemění Josefovu filiaci."},{"key":"cbrod_snatek_josef_prochazka_marie_blahovcova_1885","label":"Sňatek Josefa Procházky a Marie Bláhovcové","url":"https://ebadatelna.soapraha.cz/d/4811/116","kind":"O","date":"16. 11. 1885","source_kind":"parish_register","provenance":"Matriční zápis","summary":"První zápis na foliu116 přímo dokládá sňatek vdovce Josefa Procházky a vdovy Marie Bláhovcové 16.11.1885. Josef byl dělník v Českém Brodě čp.173, syn Marie, dcery Františka Procházky a Anny Kolmanové, narozený 9.3.1854. Předložil sázavský křestní list č.143 vydaný 5.5.1881; datum vydání není datem křtu. Odkaz na úmrtní folio135 vede ke Kateřině, Josefově předchozí manželce. Marie byla vdova po Františku Bláhovcovi, bydlela v Českém Brodě čp.110 a byla dcerou Jana Slavíka a Doroty Brabcové; odkaz na folio150 vede k Františkovu úmrtí. Datum 29.10.1885 je datum vydání Mariina křestního listu, nikoli datum křtu."},{"key":"velke_popovice_krest_marie_slavickova_1859","label":"Narození a křest Marie Slavíčkové","url":"https://ebadatelna.soapraha.cz/d/13461/77","kind":"N","date":"10. 8. 1859","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Vlastní křest dokládá narození Marie 10. 8. a křest 1 a 2015","url":"https://noviny.nmnm.cz/pdf/2015/nm11_15.pdf#page=6","date":"2015","kind":"J","source_kind":"published_family_memorial","provenance":"Kanonický záznam","summary":"Rodina připomíná desáté výročí úmrtí, nedožitých 70 let dne 26. listopadu a uvádí mezi pozůstalými bratra ze Zubří."},{"key":"novomestsko_2020_vzpominka_josef_dostal","label":"Josef Dostál z Nového Města na Moravě — rodinná vzpomínka 2020","url":"https://noviny.nmnm.cz/pdf/2020/nm11_20.pdf#page=11","date":"2020","kind":"J","source_kind":"published_family_memorial","provenance":"Kanonický záznam","summary":"Rodina připomíná patnáct let od úmrtí a nedožitých 75 let dne 26. listopadu. Zmíněni jsou manželka, dcera a syn s rodinou."},{"key":"novomestsko_2025_11_josef_dostal_20_let_vzpominka","label":"Dvacetiletá vzpomínka na Josefa Dostála","url":"https://noviny.nmnm.cz/pdf/2025/nm11_25.pdf#page=9","date":"listopad 2025","kind":"J","source_kind":"published_family_memorial","provenance":"Kanonický záznam","summary":"Rodinná vzpomínka uvádí, že 12. listopadu uplynulo dvacet let od úmrtí Josefa Dostála a 26. listopadu by se dožil osmdesáti let. Vzpomíná celá rodina. Zápis uvádí výročí. Rok narození 1945 a rok úmrtí 2005 z nich vycházejí aritmetickým výpočtem."}]},"research-bratr-josefa-dostala-zubri":{"id":"research-bratr-josefa-dostala-zubri","name":"Bratr Josefa Dostála","sex":"M","years":"Zmíněn v rodinné vzpomínce roku 2015","status":"doc","status_label":"Rodinná vzpomínka otištěná v Novoměstsku","private":false,"card_years":"Zmíněn roku 2015","card_status_label":"Novinová vzpomínka","facts":["Rodinné oznámení z roku 2015 uvádí bratra Josefa Dostála a jeho rodinu ze Zubří.","Příbuzenský vztah pochází z otištěné rodinné vzpomínky.","Datum narození a úmrtí, rodiče a jméno partnerky se dále dohledávají.","Vztah k Petrovi Dostálovi a jeho otci Josefu Dostálovi (*1960) se ověřuje společným pramenem."],"note":"Vztah k Petrovi Dostálovi a jeho otci Josefu Dostálovi (*1960) se ověřuje společným pramenem.","provenance":"Rodinná vzpomínka otištěná v Novoměstsku","sources":[{"key":"novomestsko_2015_vzpominka_josef_dostal","label":"Josef Dostál z Nového Města na Moravě — rodinná vzpomínka 2015","url":"https://noviny.nmnm.cz/pdf/2015/nm11_15.pdf#page=6","date":"2015","kind":"J","source_kind":"published_family_memorial","provenance":"Kanonický záznam","summary":"Rodina připomíná desáté výročí úmrtí, nedožitých 70 let dne 26. listopadu a uvádí mezi pozůstalými bratra ze Zubří."}]},"research-ludolf-sebek-dlouhe-1965":{"id":"research-ludolf-sebek-dlouhe-1965","name":"Ludolf Šebek","sex":"M","years":"Zmíněn v kronice k roku 1965","status":"doc","status_label":"Obecní kronika","private":false,"card_years":"Dlouhé · zmínka 1965","card_status_label":"Obecní kronika","facts":["Kronikář uvádí, že Buřian prodal dům č. 34 Ludolfu Šebkovi, který bydlel v domě č. 31.","Zařazení do roku 1965 vychází ze souvislého oddílu na předchozích stranách kroniky.","Datum narození, rodiče a manželka se dále dohledávají."],"note":"Příbuzenství s rodinou Jaromíra Šebka se dále ověřuje.","provenance":"Obecní kronika","sources":[{"key":"dlouhe_kronika_1965_ludolf_sebek_cp34_cp31","label":"Ludolf Šebek bydlel v čp. 31 a koupil čp. 34, Dlouhé 1965 (neztotožněná osoba)","url":"https://www.obecdlouhe.cz/documents/Pametni_kniha_obce_Dlouheho.pdf#page=178","date":"1965","kind":"J","source_kind":"chronicle","provenance":"Obecní kronika","summary":"Původní pamětní kniha obce Dlouhého, fyzická PDF strana 178 / nulový index 177 / interní pagina 184. Výběrový řádek uvádí, že Buřian prodal č. 34 Ludolfu Šebkovi, který bydlel v č. 31. Rok 1965 plyne z kontextu souvislého oddílu na fyzických stranách 176–177, nikoli výslovně z tohoto řádku na straně 178. Totožnost s Josefem či Růženou Šebkovými z čp. 47 ani s Martou Šebkovou není doložena. Osoba zůstává UNLINKED; žádná rodová vazba ani nový předek."}]},"research-josef-sebek-dlouhe-1971":{"id":"research-josef-sebek-dlouhe-1971","name":"Josef Šebek","sex":"M","years":"Zmíněn v kronice k roku 1971","status":"doc","status_label":"Obecní kronika","private":false,"card_years":"Dlouhé čp. 47 · zmínka 1971","card_status_label":"Obecní kronika","facts":["Kronika z roku 1971 jmenuje Josefa Šebka z č. 47 se třemi dětmi.","Zápis zmiňuje Sokolči v okrese Nymburk a stěhování do Radešínské Svratky.","Sloveso „Přistěhoval“ je zachováno v původní podobě. Podrobná trasa stěhování zůstává otevřená.","Datum narození a jméno manželky se dále dohledávají.","Totožnost s Josefem Šebkem narozeným roku 1898 se ověřuje dalším pramenem."],"note":"Příbuzenství s rodinou Jaromíra Šebka se dále ověřuje.","provenance":"Obecní kronika","sources":[{"key":"dlouhe_kronika_1971_josef_sebek_cp47_stehovani_unlinked","label":"Josef Šebek čp.47 a stěhování v roce1971, Dlouhé (neztotožněná osoba)","url":"https://www.obecdlouhe.cz/documents/Pametni_kniha_obce_Dlouheho.pdf#page=202","date":"1971","kind":"J","source_kind":"chronicle","provenance":"Obecní kronika","summary":"Původní obecní kronika, fyzická PDF202 / zero201 / interní208, oddíl končící součtem obyvatel roku1971. Výňatek uvádí Josefa Šebka (č.47), tři děti, Sokolči/okres Nymburk a Radešínskou Svratku. Sloveso „Přistěhoval“ zachováno bez opravy; přesný směr stěhování a normalizace názvu Sokolči nejsou z něj domýšleny. Root čte Radešínské, nikoli Radostínské jako pomocná předávka. Bez data narození či manželky. Totožnost s Josefem/Růženou z rodinného sdělení nebo s Josefem zemřelým1972 je AI hypotéza (neověřeno). UNLINKED, žádná rodová vazba."}]},"research-jaroslav-prochazka-1894":{"status":"doc","status_label":"Matriční zápis","private":false,"card_status_label":"Matriční zápis","provenance":"Matriční zápis","id":"research-jaroslav-prochazka-1894","name":"Jaroslav František Xaver Procházka","sex":"M","years":"* 27. 1. 1894","card_years":"* 27. 1. 1894 · Český Brod","facts":["Narodil se 27. ledna 1894 v Českém Brodě č. 241. Pokřtěn byl 4. února 1894.","Otec Josef Procházka byl zedník v Českém Brodě, rodem z Poříčan. Jeho rodiči byli Václav Procházka, obuvník v Poříčanech, a Rosalie rozená Šmídová.","Matka Žofie Brabcová byla dcerou Václava Brabce, hostinského, a Kateřiny rozené Moravcové.","Pravděpodobné ztotožnění Josefa z křtu roku 1858 s otcem Jaroslava roku 1894 vychází z Poříčan a shodných rodičů Václava Procházky a Rozálie rozené Šmídové.","Totožnost s Jaroslavem, manželem Růženy a obuvníkem v Bylanech, se ověřuje oddacím zápisem z roku 1919."],"note":"Vazba na Jaroslava Procházku narozeného roku 1919 se dále ověřuje.","sources":[{"key":"cbrod_krest_jaroslav_prochazka_1894","label":"Křest Jaroslava Františka Xavera Procházky","url":"https://ebadatelna.soapraha.cz/d/4809/313","date":"27. 1. 1894","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Jaroslav František Xaver se narodil 27. 1. 1894 v Českém Brodě č. 241 a byl pokřtěn 4. 2. 1894. Rodiči byli Josef Procházka, zedník rodem z Poříčan, a Žofie Brabcová. Pravděpodobné ztotožnění Josefa z křtu roku 1858 s otcem Jaroslava roku 1894 vychází z Poříčan a shodných rodičů Václava Procházky a Rozálie rozené Šmídové. Vazba na Jaroslava Procházku narozeného roku 1919 se dále ověřuje."}]},"research-josef-prochazka-1858":{"status":"doc","status_label":"Matriční zápis","private":false,"card_status_label":"Matriční zápis","provenance":"Matriční zápis","id":"research-josef-prochazka-1858","name":"Josef Procházka","sex":"M","years":"* 25. 6. 1858","card_years":"* 25. 6. 1858 · Poříčany","facts":["Narodil se 25. června 1858 v Poříčanech č. 7. Pokřtěn byl 27. června 1858.","Otec Václav Procházka byl mistr ševcovský v Poříčanech. Jeho rodiči byli Václav Procházka, nádeník z Přistoupimi č. 13, a Barbora rozená Plachová.","Matka Rozálie byla dcerou Jana Šmída, domkáře z Poříčan č. 1, a Anny rozené Šmídové.","Pravděpodobné ztotožnění Josefa z křtu roku 1858 s otcem Jaroslava roku 1894 vychází z Poříčan a shodných rodičů Václava Procházky a Rozálie rozené Šmídové."],"note":"Vazba na Jaroslava Procházku narozeného roku 1919 se dále ověřuje.","sources":[{"key":"poricany_krest_josef_prochazka_1858","label":"Křest Josefa Procházky, syna obuvníka z Poříčan čp. 7","url":"https://ebadatelna.soapraha.cz/d/10155/135","date":"25. 6. 1858","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Josef, narozený 25. června a pokřtěný 27. června v Poříčanech čp. 7. Otec Václav Procházka, mistr ševcovský v Poříčanech, syn Václava Procházky, nádeníka z Přistoupimi čp. 13, a Barbory roz. Plachové. Matka Rosalie, dcera Jana Šmída, domkáře z Poříčan čp. 1, a Anny roz. Šmídové. Pravděpodobné ztotožnění Josefa z křtu roku 1858 s otcem Jaroslava roku 1894 vychází z Poříčan a shodných rodičů Václava Procházky a Rozálie rozené Šmídové. Vazba na Jaroslava * 1919 tímto zápisem doložena není."},{"key":"cbrod_krest_jaroslav_prochazka_1894","association_note":"Pravděpodobné ztotožnění Josefa z křtu roku 1858 s otcem Jaroslava roku 1894 vychází z Poříčan a shodných rodičů Václava Procházky a Rozálie rozené Šmídové.","label":"Křest Jaroslava Františka Xavera Procházky","url":"https://ebadatelna.soapraha.cz/d/4809/313","date":"27. 1. 1894","kind":"N","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Jaroslav František Xaver se narodil 27. 1. 1894 v Českém Brodě č. 241 a byl pokřtěn 4. 2. 1894. Rodiči byli Josef Procházka, zedník rodem z Poříčan, a Žofie Brabcová. Pravděpodobné ztotožnění Josefa z křtu roku 1858 s otcem Jaroslava roku 1894 vychází z Poříčan a shodných rodičů Václava Procházky a Rozálie rozené Šmídové. Vazba na Jaroslava Procházku narozeného roku 1919 se dále ověřuje."}]},"research-ruzena-prochazkova-novotna-1920":{"status":"doc","status_label":"Matriční zápis","private":false,"card_status_label":"Matriční zápis","provenance":"Matriční zápis","id":"research-ruzena-prochazkova-novotna-1920","name":"Růžena Procházková, rozená Novotná","sex":"F","years":"* 2. 7. 1899 · † 13. 1. 1920","card_years":"* 1899 · † 1920","facts":["Zemřela 13. ledna 1920 v Českém Brodě č. 282. Pohřbena byla 15. ledna v Bylanech.","Úmrtní matrika ji uvádí jako rozenou Novotnou ze Lstiboře a manželku Jaroslava Procházky, obuvníka v Bylanech.","Úmrtní zápis zpětně uvádí narození 2. července 1899 a sňatek 29. července 1919. Přímý oddací zápis se dále dohledává.","Zapsaný věk je 20 let, 6 měsíců a 11 dní. Příčinou úmrtí byla sepsis post partum, sepse po porodu.","Totožnost manžela s Jaroslavem narozeným roku 1894 a jméno dítěte z porodní události zůstávají otevřené."],"note":"Vazba na Jaroslava Procházku narozeného roku 1919 se dále ověřuje.","sources":[{"key":"cbrod_umrti_ruzena_prochazkova_1920","label":"Úmrtí Růženy Procházkové, rozené Novotné","url":"https://ebadatelna.soapraha.cz/d/4816/81","date":"13. 1. 1920","kind":"Z","source_kind":"parish_register","provenance":"Matriční zápis","summary":"Růžena Procházková, manželka Jaroslava Procházky, obuvníka v Bylanech, rodem Novotná ze Lstiboře, narozená 2. 7. 1899, oddaná 29. 7. 1919, zemřela 13. 1. 1920 v Českém Brodě č. 282 na sepsi po porodu, pohřbena v Bylanech. Že porodila Jaroslava * 19. 12. 1919, je jen hypotéza: zápis dítě neuvádí."}]}},"branches":{"prochazka":{"title":"Procházkovi","ids":["anna_prochazkova_2024","p1","p1040","p1042","p130","p131","p16","p17","p2","p260","p261","p262","p263","p3","p32","p33","p4","p5","p520","p521","p522","p523","p65","p8","p9","side-frantisek_prochazka_samechov_1783","side-iva_prochazkova_1982","side-jan_nepomuk_prochazka_samechov_1779","side-katerina_barbora_prochazkova_samechov_1781","side-katerina_prochazkova_manzelka_josefa_1884","side-marie_magdalena_prochazkova_samechov_1778","side-marie_prochazkova_dcera_1892","side-marie_slavikova_z_lojovic","side-martin_antonin_prochazka_samechov_1773","side-matej_prochazka_samechov_1771","side-vaclav_prochazka_samechov_1769","side-vojtech_prochazka_samechov_1782"],"edges":[{"id":"edge-p2-p1","parent":"p2","child":"p1","role":"father","certainty":"family_confirmed","label":"Údaj od ro
